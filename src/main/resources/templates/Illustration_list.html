<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <style>
        /* 1. 카테고리 아이콘 */
        .category-item { 
            transition: all 0.3s ease; 
            text-decoration: none !important;
        }
        
        .icon-box {
            width: 80px; 
            height: 80px; 
            background-color: #F8F9FA;
            border-radius: 22px;
            margin: 0 auto 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            border: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .category-icon-img {
            width: 100%;       
            height: 100%;      
            object-fit: contain; 
            padding: 18px;
            transition: transform 0.3s ease;
        }

        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }
        .category-item .fw-bold {
            color: #3B4371;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        /* 2. 일러스트 카드 */
        .illust-card { transition: transform 0.2s; border: none; background: none; }
        .illust-card:hover { transform: translateY(-5px); }

        .thumbnail-wrapper {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background-color: #eee;
            position: relative;
        }

        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.2s ease;
        }

        .thumbnail-wrapper.paid .thumbnail-img {
            filter: blur(10px) brightness(0.75);
            transform: scale(1.05);
        }

        .paid-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.18);
            color: #fff;
            text-align: center;
            padding: 12px;
        }

        .paid-overlay .lock-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.72);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .paid-overlay .lock-desc {
            font-size: 0.78rem;
            opacity: 0.95;
            line-height: 1.45;
        }

        .paid-title-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #8a6d3b;
            background: #fff3cd;
            border: 1px solid #ffe69c;
            border-radius: 999px;
            padding: 3px 8px;
            margin-bottom: 6px;
        }

        /* 3. 밑줄 페이지네이션 */
        .custom-pagination .page-link {
            border: none; color: #333; font-weight: 700;
            background: none; padding: 2px 10px; font-size: 1.1rem;
        }
        .custom-pagination .page-item.active .page-link {
            background: none; color: #333;
            border-bottom: 3px solid #f05a28;
            border-radius: 0;
        }
        .custom-pagination .page-link:hover { color: #f05a28; }

        /* 리딤 코드 입력 */
        #productKeyInput {
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 justify-content-center">
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/comic/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box shadow-sm">
                            <img th:src="@{/images/comic.png}" class="category-icon-img" alt="만화">
                        </div>
                        <div class="fw-bold">만화</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/music/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box shadow-sm">
                            <img th:src="@{/images/sing.png}" class="category-icon-img" alt="음악">
                        </div>
                        <div class="fw-bold">음악</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/video/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box shadow-sm">
                            <img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오">
                        </div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box shadow-sm">
                            <img th:src="@{/images/git.png}" class="category-icon-img" alt="소설">
                        </div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/file/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box shadow-sm">
                            <img th:src="@{/images/folder.png}" class="category-icon-img" alt="파일">
                        </div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="container mb-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            
            <div style="flex: 1;">
                <a href="/" class="btn btn-link text-decoration-none text-dark p-0 d-flex align-items-center">
                    <i class="bi bi-house-door-fill me-2"></i>
                    <span class="fw-bold">홈으로 가기</span>
                </a>
            </div>

            <div class="text-center" style="flex: 2;">
                <h2 class="fw-bold mb-0">추천 일러스트</h2>
                <p class="text-muted mb-0 mt-1 small">다양한 크리에이터의 일러스트를 만나보세요.</p>
            </div>

            <div class="d-flex gap-2 align-items-center justify-content-end" style="flex: 1;">
                <button type="button"
                        class="btn btn-outline-dark d-flex align-items-center px-3 shadow-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#keyRegisterModal">
                    <i class="bi bi-key-fill me-2"></i>
                    <span class="fw-bold">코드 등록</span>
                </button>

                <a onclick="return requireLoginAction(() => location.href='/content/art/create')" class="btn btn-primary d-flex align-items-center px-3 shadow-sm" style="cursor:pointer;">
                    <i class="bi bi-plus-lg me-2"></i>
                    <span class="fw-bold">일러스트 등록</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
            <div class="col" th:each="art : ${paging}">
                <div class="card illust-card h-100">
                    <a th:href="@{|/content/art/detail/${art.id}|}" class="text-decoration-none text-dark">
                        <div class="thumbnail-wrapper mb-2 shadow-sm"
                             th:classappend="${art.paid} ? ' paid' : ''">
                            <img th:src="${art.thumbnailUrl ?: '/images/pic.png'}"
                                 class="thumbnail-img">

                            <div class="paid-overlay" th:if="${art.paid}">
                                <div class="lock-badge">
                                    <i class="bi bi-lock-fill"></i>
                                    유료 작품
                                </div>
                                <div class="lock-desc">
                                    상세 페이지에서 구매 또는<br>리딤 코드 사용 후 감상할 수 있습니다.
                                </div>
                            </div>
                        </div>

                        <div class="px-1 text-start">
                            <div th:if="${art.paid}" class="paid-title-badge">
                                <i class="bi bi-lock-fill"></i>
                                유료
                            </div>
                            <h6 class="fw-bold mb-1 text-truncate" th:text="${art.title}">작품 제목</h6>
                            <p class="text-muted small mb-0" th:text="${art.displayname}">작가이름</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <nav class="mt-5" th:if="${paging != null and !paging.isEmpty()}">
            <ul class="pagination justify-content-center custom-pagination">
                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a>
                </li>
                <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                    th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                    th:classappend="${page == paging.number} ? 'active'" class="page-item">
                    <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
                </li>
                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="modal fade" id="keyRegisterModal" tabindex="-1" aria-labelledby="keyRegisterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold" id="keyRegisterModalLabel" style="color: #3B4371;">리딤 코드 사용</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- 여기 action만 네가 이미 만들어둔 기존 리딤 코드 컨트롤러 경로로 맞춰 -->
                <form th:action="@{/redeem/use}" method="post">
                    <div class="modal-body p-4 text-center">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <i class="bi bi-controller text-muted" style="font-size: 3rem;"></i>
                        <p class="mt-3 mb-4 text-muted small">
                            보유하고 계신 리딤 코드를 입력해 주세요.<br>
                            (예: ABCD-EFGH-IJKL-MNOP)
                        </p>
                        <input type="text"
                               id="productKeyInput"
                               name="code"
                               class="form-control form-control-lg text-center font-monospace" 
                               placeholder="XXXX-XXXX-XXXX-XXXX"
                               maxlength="19"
                               required>
                    </div>
                    <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn text-white px-4" style="background-color: #f05a28;">코드 사용</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const keyInput = document.getElementById('productKeyInput');
            if (keyInput) {
                keyInput.addEventListener('input', function (e) {
                    let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    let result = '';
                    for (let i = 0; i < val.length; i++) {
                        if (i > 0 && i % 4 === 0) result += '-';
                        result += val[i];
                    }
                    e.target.value = result;
                });
            }
        });
    </script>
</th:block>
</html>
