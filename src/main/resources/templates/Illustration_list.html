<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="content">
    <style>
        .illust-card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
            background-color: #f8f9fa;
        }
        .illust-hover {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            text-decoration: none !important;
        }
        .illust-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .artist-profile-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #dee2e6;
        }
    </style>

    <div class="container px-5">
        <div class="mt-5 mb-4 d-flex justify-content-between align-items-end">
            <div>
                <h2 class="fw-bold">갤러리</h2>
                <p class="text-muted mb-0">멋진 일러스트와 원화를 감상해보세요.</p>
            </div>
            
            <div class="d-flex gap-2">
                <a th:href="@{/content/art/create}" class="btn btn-dark px-4 shadow-sm">
                    <i class="bi bi-plus-lg me-1"></i> 작품 등록
                </a>
                <div class="btn-group shadow-sm" role="group">
                    <button type="button" class="btn btn-outline-dark active">인기순</button>
                    <button type="button" class="btn btn-outline-dark">최신순</button>
                </div>
            </div>
        </div>

        <div class="pb-5">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${paging != null and !paging.isEmpty()}">
                
                <div class="col" th:each="art : ${paging.content}">
                    <div class="card h-100 shadow-sm border-0 illust-hover position-relative">
                        <button class="btn btn-sm position-absolute top-0 end-0 m-2 text-white" style="background: rgba(0,0,0,0.3); border-radius: 50%; z-index: 2;">
                            <i class="bi bi-heart"></i>
                        </button>
                        
                        <a th:href="@{|/content/art/detail/${art.id}|}" class="text-decoration-none text-dark">
                            <img th:src="${art.thumbnailUrl != null ? art.thumbnailUrl : 'https://dummyimage.com/600x600/dee2e6/6c757d.png&text=No+Image'}" 
                                 class="illust-card-img" th:alt="${art.title}">
                            
                            <div class="card-body p-3">
                                <h6 class="card-title fw-bold text-truncate mb-2" th:text="${art.title}">작품 제목</h6>
                                
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center text-truncate">
                                        <div class="artist-profile-sm me-2 d-flex align-items-center justify-content-center bg-secondary text-white small">
                                            <i class="bi bi-person-fill"></i>
                                        </div>
                                        <span class="small text-muted text-truncate" th:text="${art.displayname ?: art.username}">작가명</span>
                                    </div>
                                </div>
                                
                                <div class="mt-2 pt-2 border-top d-flex gap-3 stat-icon text-muted" style="font-size: 0.8rem;">
                                    <span><i class="bi bi-eye"></i> <span th:text="${art.viewCount}">0</span></span>
                                    <span><i class="bi bi-heart-fill text-danger"></i> 0</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
                
            </div>

            <div th:if="${paging == null or paging.isEmpty()}" class="py-5 text-center">
                <i class="bi bi-image text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-3">아직 등록된 작품이 없습니다.</p>
            </div>
        </div>

        <nav aria-label="Page navigation" class="mb-5" th:if="${paging != null and !paging.isEmpty()}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${paging.number - 1}|}"><i class="bi bi-chevron-left"></i></a>
                </li>
                
                <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                    th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                    th:classappend="${page == paging.number} ? 'active'"
                    class="page-item">
                    <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
                </li>
                
                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${paging.number + 1}|}"><i class="bi bi-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>
</th:block>
</html>
