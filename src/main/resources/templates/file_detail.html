<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">
    <main class="py-5">
        <div class="container mt-5" style="max-width: 900px;">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-secondary mb-2">이미지</span>
                            <h3 class="fw-bold mb-0">팀 프로젝트 참고용 UI 디자인 시안</h3>
                        </div>
                    </div>
                    <div class="mt-3 text-muted small d-flex justify-content-between">
                        <div>
                            <span>작성자: <strong class="text-dark">홍길동</strong></span>
                            <span class="mx-2">|</span>
                            <span>등록일: 2026.02.26</span>
                        </div>
                        <div>조회수: 124</div>
                    </div>
                </div>
                <div class="card-body p-4">
                    <div class="p-3 bg-light rounded d-flex justify-content-between align-items-center mb-4">
                        <div class="d-flex align-items-center">
                            <img src="images/folder.png" alt="file" style="width: 30px;" class="me-2">
                            <div>
                                <div class="fw-bold">UI_Design_v1.png</div>
                                <div class="small text-muted">2.4 MB</div>
                            </div>
                        </div>
                        <a href="#" class="btn btn-outline-dark btn-sm">다운로드</a>
                    </div>

                    <div class="file-content py-3" style="min-height: 200px;">
                        <p>이번 팀 프로젝트의 메인 디자인 시안입니다. <br>전체적인 톤앤매너는 화이트와 그레이를 기본으로 잡았습니다.</p>
                        <img src="images/pic.png" class="img-fluid rounded mt-3" alt="preview">
                    </div>
                </div>

                <div class="card-footer bg-white py-3 d-flex justify-content-between">
                    <a th:href="@{/file_list}" class="btn btn-outline-secondary">목록보기</a>
                    <div>
                        <a href="#" class="btn btn-light">팔로우</a>
                        <a href="#" class="btn btn-light">수정</a>
                        <a href="#" class="btn btn-light text-danger">삭제</a>
                    </div>
                </div>
            </div>
            <div class="mt-5" id="comments"> 
                <h5 class="fw-bold mb-4">댓글 124개</h5>
                
                <div class="d-flex align-items-start mb-4">
                    <img src="https://dummyimage.com/40x40/adb5bd/fff" class="rounded-circle me-3 mt-1" alt="내 프로필" style="width: 40px; height: 40px;">
                    <div class="w-100">
                        <textarea class="form-control border-0 border-bottom rounded-0 px-0 shadow-none focus-ring-none bg-transparent" placeholder="댓글 추가..." rows="1" style="resize: none;"></textarea>
                        <div class="d-flex justify-content-end mt-2 gap-2">
                            <button class="btn btn-sm btn-light rounded-pill px-3">취소</button>
                            <button class="btn btn-sm btn-primary rounded-pill px-3">댓글</button>
                        </div>
                    </div>
                </div>

                <div class="d-flex align-items-start mb-4">
                    <img src="https://dummyimage.com/40x40/6c757d/fff" class="rounded-circle me-3 mt-1" alt="유저 프로필" style="width: 40px; height: 40px;">
                    <div>
                        <div class="d-flex align-items-center mb-1">
                            <span class="fw-bold me-2 small">@MusicLover</span>
                            <span class="text-muted small">2일 전</span>
                        </div>
                        <p class="mb-1 text-break">노래가 정말 좋네요! 산책할 때 듣기 딱이에요.</p>
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-link text-dark p-0 text-decoration-none small"><i class="bi bi-hand-thumbs-up me-1"></i>15</button>
                            <button class="btn btn-link text-dark p-0 text-decoration-none small"><i class="bi bi-hand-thumbs-down"></i></button>
                            <button class="btn btn-link text-dark p-0 text-decoration-none small fw-bold">답글</button>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </main>
</div>
</html>
