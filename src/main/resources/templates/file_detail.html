<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div class="container" layout:fragment="content">
    <style>
        /* ===== 후원하기 버튼 스타일 ===== */
        .btn-boost {
            background-color: #f05a28 !important;
            border-color: #f05a28 !important;
            color: #ffffff !important;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 45px;
            transition: all 0.2s;
        }
        .btn-boost:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: #ffffff !important;
        }

        /* [1. 전체 레이아웃 및 본문 스타일] */
        .detail-container { max-width: 800px; margin: 0 auto; position: relative; }
        .back-btn { position: absolute; left: -60px; top: 5px; font-size: 1.5rem; color: #333; text-decoration: none; }
        .detail-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; color: #111; }
        .user-info { color: #888; font-size: 0.95rem; }
        .user-id { color: #333; font-weight: 600; text-decoration: none; }
        .section-divider { border: none; border-top: 1px solid #eee; margin: 40px 0; }
        .content-area { font-size: 1.1rem; line-height: 1.8; color: #444; min-height: 150px; }

        /* [2. 액션 버튼 그룹 (button 태그 호환용 커서 추가)] */
        .action-buttons-group { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; align-items: center; }
        .btn-action { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 85px; height: 90px; background-color: #fff; border: 1px solid #dee2e6; border-radius: 15px; text-decoration: none !important; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); color: #333; cursor: pointer; }
		
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-action i { font-size: 1.8rem; margin-bottom: 5px; transition: color 0.2s; }
        .btn-action span { font-size: 0.85rem; font-weight: 600; }

		/* 댓글 수정,답글,삭제 버튼
		.btn-dat { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 50; height: 50px; background-color: #fff; border: 1px solid #dee2e6; border-radius: 15px; text-decoration: none !important; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); color: #333; cursor: pointer; }
		
        /* 동적 좋아요/북마크 색상 */
        .btn-like i { color: #ff4757; }
        .btn-like.active i { color: #ff4757; }
        .btn-bookmark i { color: #adb5bd; }
        .btn-bookmark i.bi-bookmark-check-fill { color: #333; }
        
        .btn-follow i { color: #323b6d; }
        .btn-share i { color: #2D3278; }

        /* [3. 첨부파일 및 태그] */
        .file-box-wrapper { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .file-preview-box { background-color: #f8f9fa; width: 160px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; color: #666; transition: all 0.2s; border: 1px solid #eee; }
        .file-preview-box:hover { background-color: #fff; border-color: #323b6d; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); color: #323b6d; }
        .btn-download-sm { font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; margin-top: 8px; }
        
        .tag-badge { padding: 6px 14px; margin: 4px; font-weight: 500; border: none; display: inline-flex; align-items: center; }

        /* [4. 네이비 버튼 및 계보 디자인] */
        .btn-navy { background-color: #323b6d; color: white; height: 45px; display: inline-flex; align-items: center; padding: 0 30px; border-radius: 6px; font-weight: 600; text-decoration: none; }
        .lineage-box { background: #f8f9fa; padding: 1.2rem; border-radius: 1rem; border: 1px solid #eee; }
        .lineage-card { display: flex; align-items: center; gap: 12px; padding: 10px; background: white; border-radius: 12px; text-decoration: none; border: 1px solid transparent; transition: all 0.2s; }
        .lineage-card:hover { border-color: #323b6d; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .lineage-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .art-grid-item { position: relative; display: block; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #eee; }
        .art-grid-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .art-grid-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px 10px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); display: flex; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
        .art-grid-item:hover .art-grid-overlay { opacity: 1; }
        .art-grid-item:hover .art-grid-img { transform: scale(1.05); }
        
        .full-footer {
            background-color: #0b152d !important;
            color: white !important;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-top: 150px;
        }

        .full-footer span,
        .full-footer h6,
        .full-footer li {
            color: #ffffff !important;
        }

        .footer-line {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 30px 0;
        }
    </style>

    <main class="py-5">
        <div class="detail-container" th:if="${fileDetail != null}">
            
            <a th:href="@{/content/file/list}" class="back-btn"><i class="bi bi-arrow-left"></i></a>
            <div class="text-center">
                <h1 class="detail-title" th:text="${fileDetail.title}">제목</h1>
                <div class="user-info">
                    <a href="#" class="user-id" th:text="${fileDetail.displayname}">작가명</a> · 
                    <span th:text="${#temporals.format(fileDetail.createdAt, 'yyyy.MM.dd')}">날짜</span>
                </div>
				<form th:if="${fileDetail.username == #authentication.name}" th:action="@{/redeem/create/content/{id}(id=${fileDetail.id})}" method="post" class="d-flex justify-content-end mb-3">
				    <button type="submit" class="btn btn-outline-dark rounded-pill fw-bold px-3"><i class="bi bi-key-fill me-1"></i> 리딤 코드 발급</button>
				</form>
                <div th:if="${fileDetail.paid}">
                    <div th:if="${hasAccess}">
                        <span class="badge bg-success">구매 완료</span>
                    </div>

                    <div th:if="${!hasAccess}">
                        <p class="fw-bold"
                           th:text="${#numbers.formatInteger(fileDetail.price, 3, 'COMMA') + '원'}">10,000원</p>

                        <form th:action="@{/content/{id}/purchase(id=${fileDetail.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary">구매하기</button>
                        </form>
                    </div>
                </div>

                <div th:if="${!fileDetail.paid}">
                    <span class="badge bg-secondary">무료 콘텐츠</span>
                </div>
                <hr class="section-divider">
            </div>

            <div class="content-area text-center">
                <p th:text="${fileDetail.description}">설명</p>
                <div class="mt-4" th:if="${fileDetail.preview != null}">
                    <img th:src="${fileDetail.preview.fileUrl}" class="img-fluid rounded-4 shadow-sm" style="max-height: 500px;">
                </div>
            </div>

            <div class="action-buttons-group action-buttons">
                <button id="likeBtn" class="btn-action btn-like" th:onclick="|toggleLikeHeart(${fileDetail.id},'CONTENT')|" th:classappend="${like != null and like.liked ? ' active' : ''}">
                    <i id="likeIcon" class="bi" th:classappend="${like != null and like.liked ? ' bi-heart-fill' : ' bi-heart'}"></i><span>좋아요</span>
                </button>
                
                <button id="bookmarkBtn" class="btn-action btn-bookmark" th:onclick="|toggleBookmark(${fileDetail.id}, 'CONTENT')|">
                    <i id="bookmarkIcon" class="bi" th:classappend="${bookmark != null and bookmark.bookmarked ? ' bi-bookmark-check-fill' : ' bi-bookmark-check'}"></i><span>북마크</span>
                </button>
                
                <button class="btn-action btn-share"><i class="bi bi-share-fill"></i><span>공유</span></button>
                
                <button class="btn-action" th:onclick="|location.href='@{/content/file/edit/{id}(id=${fileDetail.id})}'|" sec:authorize="isAuthenticated()" th:if="${fileDetail.username == #authentication.name}">
                    <i class="bi bi-pencil-square"></i><span>수정</span>
                </button>
                
                <button class="btn-action" th:onclick="|confirmDelete(${fileDetail.id})|" sec:authorize="isAuthenticated()" th:if="${fileDetail.username == #authentication.name}">
                    <i class="bi bi-trash3 text-danger"></i><span>삭제</span>
                </button>
            </div>

            <hr class="section-divider">

            <div class="text-center">
                <p class="small fw-bold mb-3 text-muted">ATTACHMENTS</p>
				
                <div class="file-box-wrapper">
                    <div class="file-item text-center" th:if="${fileDetail.file != null}">
                        <a th:href="${fileDetail.file.fileUrl}" class="file-preview-box shadow-sm" target="_blank">
                            <i class="bi bi-file-earmark-zip fs-2 mb-1"></i>
                            <span class="small fw-bold text-truncate px-2 w-100" th:text="${fileDetail.file.originalFileName}">파일.zip</span>
                        </a>
                        <a th:href="${fileDetail.file.fileUrl}" class="btn btn-outline-dark btn-download-sm" download>다운로드</a>
						
                    </div>
					
                </div>
				
                <div class="tag-area mt-4 mb-4">
                    <div class="mb-2 d-flex justify-content-center align-items-center flex-wrap">
                        <div th:each="tag : ${tagList}" class="badge rounded-pill bg-secondary me-1 fw-normal tag-badge">
                            <span th:text="'#' + ${tag.tagText}"></span>
                            <a sec:authorize="isAuthenticated()"
                               th:if="${fileDetail.username == #authentication.name}"
                               th:href="@{/tag/file/deleteContentTag(tagId=${tag.id},contentId=${fileDetail.id})}"
                               class="text-white ms-2"
                               onclick="return confirm('삭제하시겠습니까?');">
                                <i class="bi bi-x-circle-fill" style="font-size: 0.8rem;"></i>
                            </a>
                        </div>
						
                        <button type="button"
                                sec:authorize="isAuthenticated()"
                                th:if="${fileDetail.username == #authentication.name}"
                                class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-1 d-flex align-items-center justify-content-center"
                                style="width:28px; height:28px;"
                                data-bs-toggle="modal"
                                data-bs-target="#tagAddModal">
                            <i class="bi bi-plus fs-5"></i>
                        </button>
                    </div>
                </div>
            </div>
	
            <div class="d-flex justify-content-end align-items-center mb-5 mt-4">
                <div class="ms-auto d-flex gap-2">
                    <a th:onclick="|location.href='@{/user/{id}/boost(id=${fileDetail.userId})}'|" class="btn btn-boost shadow-sm px-4 rounded-pill">후원하기</a>
                    <a th:href="@{/content/file/list}" class="btn btn-navy px-5">목록보기</a>
                </div>
				
            </div>
	
            <hr class="section-divider">
            
            <div th:if="${fileDetail.allowComment}" class="comment-section mb-5">
                <h5 class="text-center fw-bold mb-4">댓글</h5>
                <form th:action="@{/comment/content/write/{id}(id=${fileDetail.id})}" method="post" class="d-flex align-items-center justify-content-center mb-5">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="text" name="text" class="form-control me-3" placeholder="댓글을 입력하세요" style="max-width:500px;">
                    <button type="submit" class="btn btn-sm btn-primary rounded-pill px-4">작성</button>
                </form>
                <div class="comment-list ms-md-5">
                    <th:block th:each="comment : ${comments}">
                        <div th:replace="~{comment-line :: commentItem(comment=${comment}, depth=0, category='content', targetId=${fileDetail.id})}"></div>
                    </th:block>
                </div>
            </div>

            <hr class="section-divider">

            <h5 class="fw-bold mb-4">작품 계보</h5>
            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <div class="lineage-box h-100">
                        <h6 class="text-muted fw-bold mb-3 small">원본 작품</h6>

                        <a th:if="${parentContent != null}"
                           th:href="@{/content/{type}/detail/{id}(type=${#strings.toLowerCase(parentContent.type)},id=${parentContent.id})}"
                           class="lineage-card">
                            <img th:src="${parentContent.thumbnailUrl != null ? parentContent.thumbnailUrl : 'https://dummyimage.com/60x60/ced4da/6c757d'}" class="lineage-img">
                            <div class="overflow-hidden">
                                <div class="fw-bold text-dark text-truncate mb-1" th:text="${parentContent.title}">원본 콘텐츠 제목</div>
                                <div class="small text-muted text-truncate" th:text="${parentContent.username}">@OriginalArtist</div>
                            </div>
                        </a>

                        <p class="text-muted text-center py-4 mb-0" th:if="${parentContent == null}">
                            원본 작품이 없습니다.
                        </p>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="lineage-box h-100">
                        <h6 class="text-muted fw-bold mb-3 small">연관 작품</h6>
                        <div class="d-flex flex-column gap-2">
                            <a th:each="childContent : ${childContents}"
                               th:href="@{/content/{type}/detail/{id}(type=${#strings.toLowerCase(childContent.type)},id=${childContent.id})}"
                               class="lineage-card">
							   <img th:src="${childContent.thumbnailUrl != null and !#strings.isEmpty(childContent.thumbnailUrl) ? childContent.thumbnailUrl : 'https://dummyimage.com/60x60/adb5bd/495057'}"
							        class="lineage-img">
                                <div class="overflow-hidden">
                                    <div class="fw-bold text-dark text-truncate mb-1" th:text="${childContent.title}">파생 작품</div>
                                    <div class="small text-muted text-truncate" th:text="${childContent.username}">@Creator</div>
                                </div>
                            </a>

                            <p class="text-muted text-center py-4 mb-0" th:if="${#lists.isEmpty(childContents)}">
                                연관 작품이 없습니다.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="tagAddModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/createContentFileTag/{id}(id=${fileDetail.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <footer class="full-footer">
        <div class="container py-5">
            <div class="row mb-4">
                <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
                    <h6 class="fw-bold mb-3">회사 정보</h6>
                    <ul class="list-unstyled small opacity-75">
                        <li>이용 안내</li>
                        <li>공지사항</li>
                        <li>고객센터</li>
                        <li>도움말</li>
                        <li>광고문의</li>
                    </ul>
                </div>
            </div>
            <hr class="footer-line">
            <div class="row align-items-center">
                <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
                    <span>이용 약관</span>
                    <span>개인 정보 보호 정책</span>
                </div>
                <div class="col-md-4 text-center small opacity-50 mb-3 mb-md-0">
                    © 2026 creatival All rights reserved.
                </div>
                <div class="col-md-4 text-end">
                    <img th:src="@{/images/creatival_logo(White).png}" alt="logo" width="140">
                </div>
            </div>
        </div>
    </footer>
</div>
</html>
