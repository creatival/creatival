<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<div class="container my-5" layout:fragment="content">
    
    <div class="row g-5" th:if="${music != null}">
        <div class="col-12 col-md-5 col-lg-4 text-center">
            <div class="shadow rounded-4 overflow-hidden mb-4 mx-auto" style="max-width: 350px;">
                <div class="ratio ratio-1x1 bg-light">
                    <img th:src="${music.thumbnailUrl}" 
                         class="object-fit-cover" 
                         th:alt="${music.title}"
                         onerror="this.src='https://dummyimage.com/400x400/ced4da/6c757d&text=Cover'">
                </div>
            </div>
            
            <h4 class="fw-bold mb-1" th:text="${music.title}">곡 제목</h4>
            <p class="text-muted mb-4" th:text="${music.displayname}">아티스트명</p>

            <audio controls class="w-100 shadow-sm rounded-pill mb-3" style="height: 50px;">
                <source th:src="${music.music.fileUrl}" type="audio/mpeg">
                브라우저가 오디오 태그를 지원하지 않습니다.
            </audio>

            <div class="d-flex justify-content-center gap-3 mb-4">
                <button class="btn btn-outline-danger rounded-pill px-3">
                    <i class="bi bi-heart me-1"></i> <span th:text="${music.viewCount}">0</span>
                </button>
                <button class="btn btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-share me-1"></i> 공유
                </button>
                
                <a th:href="@{|/content/music/edit/${music.id}|}" 
                   class="btn btn-outline-secondary rounded-pill px-3">수정</a>

                <!-- ✅ 삭제 버튼 수정 -->
                <button type="button"
                        class="btn btn-outline-danger rounded-pill px-3"
                        th:onclick="|confirmDelete(${music.id})|">
                    삭제
                </button>
            </div>
        </div>

        <div class="col-12 col-md-7 col-lg-8">
            <ul class="nav nav-tabs mb-4" id="musicTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active text-dark fw-bold" id="info-tab" data-bs-toggle="tab" data-bs-target="#info" type="button" role="tab">곡 정보</button>
                </li>
                <li class="nav-item" role="presentation" th:if="${music.allowComment}">
                    <button class="nav-link text-dark fw-bold" id="comments-tab" data-bs-toggle="tab" data-bs-target="#comments" type="button" role="tab">댓글</button>
                </li>
            </ul>

            <div class="tab-content" id="musicTabContent">
                <div class="tab-pane fade show active" id="info" role="tabpanel" tabindex="0">
                    <div class="bg-light p-4 rounded-3 mb-4">
                        <div class="row text-muted small mb-3 border-bottom pb-2">
                            <div class="col-6">
                                <strong>등록일:</strong> 
                                <span th:text="${#temporals.format(music.createdAt, 'yyyy.MM.dd')}"></span>
                            </div>
                            <div class="col-6">
                                <strong>구분:</strong> 
                                <span th:text="${music.fanWork ? '2차 창작' : '오리지널'}"></span>
                            </div>
                        </div>
                        
                        <p class="mb-4 text-break" th:text="${music.description}"></p>
                        
                        <h6 class="fw-bold mb-3"><i class="bi bi-info-circle-fill me-2"></i>상세 정보</h6>
                        <div class="text-muted p-3 border rounded bg-white small">
                            <ul class="list-unstyled mb-0">
                                <li><strong>조회수:</strong> <span th:text="${music.viewCount}"></span>회</li>
                                <li><strong>공개 범위:</strong> <span th:text="${music.visibility}"></span></li>
                                <li><strong>소유 형태:</strong> <span th:text="${music.ownerType}"></span></li>
                            </ul>	
							<hr />
							<div class="tag-area">
								<div class="mb-4">
					                <div th:each="tag : ${tagList}" class="badge rounded-pill tag-badge">
					                    <span th:text="'#' + ${tag.tagText}"></span>

					                    <a sec:authorize="isAuthenticated()"
					                       th:if="${music.username == #authentication.name}"
					                       th:href="@{/tag/music/deleteContentTag(tagId=${tag.id},contentId=${music.id})}"
					                       onclick="return confirm('삭제하시겠습니까?');">
					                        <i class="bi bi-x-circle-fill ms-1"></i>
					                    </a>
					                </div>

					                <button type="button"
					                        sec:authorize="isAuthenticated()"
					                        th:if="${music.username == #authentication.name}"
					                        class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-2"
					                        style="width:24px;height:24px;"
					                        data-bs-toggle="modal"
					                        data-bs-target="#tagAddModal">
					                    <i class="bi bi-plus"></i>
					                </button>
					            </div>
					           </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="comments" role="tabpanel" tabindex="0" th:if="${music.allowComment}">
	                <h5 class="fw-bold mb-4" th:text="${'댓글 ' + commentCount + '개'}"></h5>
	                
	                <div class="d-flex align-items-start mb-4">
	                    <img src="https://dummyimage.com/40x40/adb5bd/fff" class="rounded-circle me-3 mt-1" alt="내 프로필" style="width: 40px; height: 40px;">
						<form th:action="@{/comment/content/write/{id}(id=${music.id})}" method="post" class="d-flex align-items-center justify-content-center mb-5 w-100">

							<input type="text" name="text" class="form-control comment-input me-3" placeholder="댓글 쓰기" style="max-width:500px;">
							<div class="d-flex justify-content-end mt-2 gap-2">
	                            <button class="btn btn-sm btn-light rounded-pill px-3">취소</button>
	                            <button type="submit" class="btn btn-sm btn-primary rounded-pill px-3">작성</button>
							</div>
	                	</form>
						</div>

					<div class="comment-list">
					    <th:block th:each="comment : ${comments}">
					        <div th:replace="~{comment-line :: commentItem(comment=${comment}, depth=0, category='content', targetId=${music.id})}"></div>
					    </th:block>
					</div>
                </div> 
            </div> 
        </div> 
    </div>

    <!-- ✅ 삭제 form 추가 -->
    <form id="deleteForm" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>

    <!-- 태그 모달 -->
    <div sec:authorize="isAuthenticated()" class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/createContentMusicTag/{id}(id=${music.id})}" method="post">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:unless="${music != null}" class="text-center py-5">
        <h3>존재하지 않는 콘텐츠입니다.</h3>
        <a th:href="@{/content/music/list}" class="btn btn-primary mt-3">목록으로 돌아가기</a>
    </div>

    <!-- ✅ 삭제 JS -->
    <script>
        function confirmDelete(musicId) {
            Swal.fire({
                title: '정말로 삭제하시겠습니까?',
                text: "삭제된 음악은 다시 복구할 수 없습니다!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '삭제',
                cancelButtonText: '취소',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.getElementById('deleteForm');
                    form.action = '/content/music/delete/' + musicId;
                    form.submit();
                }
            })
        }
    </script>

</div>
</html>
