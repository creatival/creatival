<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div class="container-fluid p-0" layout:fragment="content">
    
    <style>
        /* 1. 작품 계보 스타일 */
		/* 5. ⭐ 대댓글 계층 구조 및 버튼 디자인 커스텀 ⭐ */

		.comment-list { margin-top: 30px; }

		/* 댓글 전체 아이템 레이아웃 */
		.comment-item { 
		    padding: 15px 0; 
		    position: relative; 
		    border-bottom: 1px solid #f1f3f5;
		    display: flex;
		    flex-direction: column;
		}

		/* 마지막 댓글은 구분선 제거 */
		.comment-list > .comment-item:last-child { border-bottom: none; }

		/* [핵심] 대댓글 들여쓰기 및 가이드 라인 */
		.comment-item .comment-item {
		    margin-left: 2.8rem; /* 왼쪽으로 밀기 */
		    padding-left: 5.2rem;
		    border-bottom: none;
		    border-left: 2px solid #edeff2; /* 세로 연결선 */
		    margin-top: 10px;
		}

		/* 대댓글 'ㄴ' 아이콘 대신 세련된 연결 꺽쇠 */
		.comment-item .comment-item::before {
		    content: "";
		    position: absolute;
		    left: 0;
		    top: 25px;
		    width: 12px;
		    height: 2px;
		    background-color: #edeff2;
		}

		/* 작성자 정보 영역 */
		.comment-item .fw-bold, 
		.comment-item span[th\:text*="Displayname"] {
		    font-size: 0.95rem;
		    color: #333;
		    margin-bottom: 4px;
		}

		/* 댓글 본문 */
		.comment-item p, 
		.comment-item div[th\:text*="text"] {
		    font-size: 0.95rem;
		    color: #444;
		    margin-bottom: 8px !important;
		    line-height: 1.5;
		}

		/* ⭐ 버튼 스타일 전면 수정 (박스 -> 텍스트 링크) ⭐ */
		.comment-item button, 
		.comment-item .btn-outline-secondary, 
		.comment-item .btn {
		    background: none !important; /* 배경 제거 */
		    border: none !important;     /* 테두리 제거 */
		    box-shadow: none !important; /* 그림자 제거 */
		    padding: 0 10px 0 0 !important; /* 간격 조정 */
		    font-size: 0.82rem !important;
		    font-weight: 600 !important;
		    color: #868e96 !important;   /* 기본 회색 */
		    transition: color 0.2s;
		    min-width: auto !important;
		}

		/* 버튼에 마우스 올렸을 때 */
		.comment-item button:hover {
		    color: #2D3278 !important;   /* 메인 네이비 색상으로 변경 */
		    text-decoration: underline;  /* 밑줄 효과 */
		}

		/* 삭제 버튼은 강조를 위해 빨간색 계열 */
		.comment-item button[onclick*="delete"]:hover,
		.comment-item button:contains("삭제"):hover {
		    color: #fa5252 !important;
		}

		
		.comment-item .btn-delete-link:hover {
		    color: #fa5252 !important;
		}
		/* 좋아요/답글/수정/삭제 버튼들이 가로로 배치되도록 설정 */
		.comment-item > div:last-child, 
		.comment-actions-container {
		    display: flex;
		    align-items: center;
		    gap: 5px;
		}

		/* 날짜 스타일 */
		.comment-item .text-muted {
		    font-size: 0.8rem;
		    margin-left: 8px;
		}
		
		
    </style>

    <div class="container my-5">
        <div class="row g-5" th:if="${music != null}">
            <div class="col-12 col-md-5 col-lg-4 text-center">
                <div class="shadow rounded-4 overflow-hidden mb-4 mx-auto" style="max-width: 350px;">
                    <div class="ratio ratio-1x1 bg-light">
                        <img th:src="${music.thumbnailUrl}" class="object-fit-cover" th:alt="${music.title}"
                             onerror="this.src='https://dummyimage.com/400x400/ced4da/6c757d&text=Cover'">
                    </div>
                </div>
                
                <h4 class="fw-bold mb-1" th:text="${music.title}">곡 제목</h4>
                <a class="text-muted d-block mb-4 text-decoration-none" th:href="@{/user/myPage/{id}(id=${music.userId})}" th:text="${music.displayname}">아티스트명</a>

                <audio controls class="w-100 shadow-sm rounded-pill mb-3" style="height: 50px;">
                    <source th:src="${music.music.fileUrl}" type="audio/mpeg">
                </audio>

                <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
                    <button id="likeBtn" class="btn btn-outline-danger rounded-pill px-3" th:onclick="|toggleLikeHeart(${music.id},'CONTENT')|" th:classappend="${like.liked ? ' active' : ''}">
                        <i class="bi me-1" id="likeIcon" th:classappend="${like.liked ? ' bi-heart-fill' : ' bi-heart'}"></i> 
                        <span th:text="${like.count}" id="likeCount">0</span>
                    </button>

                    <button id="followBtn" class="btn btn-primary rounded-pill px-3" 
                            th:if="${music.username != #authentication.name}"
                            th:onclick="|toggleFollow(${music.userId},'USER')|"
                            th:text="${follow.followed ? '팔로우 중' : '팔로우'}">팔로우</button>

                    <button class="btn btn-outline-secondary rounded-pill px-2">
                        <i class="bi bi-share"></i>
                    </button>

                    <button th:onclick="|toggleBookmark(${music.id}, 'CONTENT')|" id="bookmarkBtn" class="btn btn-outline-secondary rounded-pill px-2">
                        <i id="bookmarkIcon" class="bi" th:classappend="${bookmark.bookmarked ? 'bi-bookmark-check-fill' : ' bi-bookmark-check'}"></i>
                    </button>

                    <div class="w-100 mt-2 d-flex justify-content-center gap-2" th:if="${music.username == #authentication.name}">
                        <a th:href="@{|/content/music/edit/${music.id}|}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">수정</a>
                        <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3" th:onclick="|confirmDelete(${music.id})|">삭제</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-7 col-lg-8">
                <ul class="nav nav-tabs mb-4" id="musicTab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active text-dark fw-bold" id="info-tab" data-bs-toggle="tab" data-bs-target="#info" type="button">곡 정보</button>
                    </li>
                    <li class="nav-item" th:if="${music.allowComment}">
                        <button class="nav-link text-dark fw-bold" id="comments-tab" data-bs-toggle="tab" data-bs-target="#comments" type="button">댓글</button>
                    </li>
                    <li class="nav-item ms-auto">
                        <button class="btn btn-boost shadow-sm px-4 rounded-pill" th:onclick="|location.href='@{/user/{id}/boost(id=${music.userId})}'|">후원하기</button>
                    </li>
                </ul>

                <div class="tab-content" id="musicTabContent">
                    <div class="tab-pane fade show active" id="info" role="tabpanel">
                        <div class="bg-light p-4 rounded-3 mb-5">
                            <p class="mb-4 text-break" th:text="${music.description}"></p>

                            <div class="text-muted p-3 border rounded bg-white small">
                                <ul class="list-unstyled mb-0 row">
                                    <li class="col-6 mb-2"><strong>등록일:</strong> <span th:text="${#temporals.format(music.createdAt, 'yyyy.MM.dd')}"></span></li>
                                    <li class="col-6 mb-2"><strong>구분:</strong> <span th:text="${music.fanWork ? '2차 창작' : '오리지널'}"></span></li>
                                    <li class="col-6"><strong>조회수:</strong> <span th:text="${music.viewCount}"></span>회</li>
                                    <li class="col-6"><strong>공개 범위:</strong> <span th:text="${music.visibility}"></span></li>
                                </ul>

                                <div th:if="${music.paid}" class="mt-3 pt-3 border-top">
                                    <div th:if="${hasAccess}">
                                        <span class="badge bg-success">구매 완료</span>
                                    </div>
                                    <div th:if="${!hasAccess}" class="d-flex align-items-center gap-3">
                                        <span class="fw-bold text-primary" th:text="${#numbers.formatInteger(music.price, 3, 'COMMA') + '원'}"></span>
                                        <form th:action="@{/content/{id}/purchase(id=${music.id})}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-sm btn-primary rounded-pill">구매하기</button>
                                        </form>
                                    </div>
                                </div>

                                <div th:if="${!music.paid}" class="mt-3">
                                    <span class="badge bg-secondary">무료 콘텐츠</span>
                                </div>

                                <form th:if="${music.username == #authentication.name and music.paid}"
                                      th:action="@{/redeem/create/content/{id}(id=${music.id})}"
                                      method="post"
                                      class="d-flex justify-content-end mb-3 mt-3">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-dark rounded-pill fw-bold px-3">
                                        <i class="bi bi-key-fill me-1"></i> 리딤 코드 발급
                                    </button>
                                </form>

                                <div class="tag-area mt-3">
                                    <div class="mb-2">
                                        <div th:each="tag : ${tagList}" class="badge rounded-pill bg-secondary me-1 fw-normal">
                                            <span th:text="'#' + ${tag.tagText}"></span>
                                            <a sec:authorize="isAuthenticated()"
                                               th:if="${music.username == #authentication.name}"
                                               th:href="@{/tag/music/deleteContentTag(tagId=${tag.id},contentId=${music.id})}"
                                               class="text-white ms-1"
                                               onclick="return confirm('삭제하시겠습니까?');">
                                                <i class="bi bi-x-circle-fill" style="font-size: 0.7rem;"></i>
                                            </a>
                                        </div>

                                        <button type="button"
                                                sec:authorize="isAuthenticated()"
                                                th:if="${music.username == #authentication.name}"
                                                class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-1"
                                                style="width:24px;height:24px; vertical-align: middle;"
                                                data-bs-toggle="modal"
                                                data-bs-target="#tagAddModal">
                                            <i class="bi bi-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-4">작품 계보</h5>
						<div class="row g-4 mb-5">

						    <div class="col-md-6">
						        <div class="lineage-box h-100">
						            <h6 class="text-muted fw-bold mb-3">
						                <i class="bi bi-arrow-up-circle-fill text-secondary me-1"></i> 원본 작품
						            </h6>

						            <a class="lineage-card"
						               th:if="${parentContent != null}"
						               th:href="@{/content/{type}/detail/{id}(
						                    type=${#strings.toLowerCase(parentContent.type)},
						                    id=${parentContent.id}
						               )}">

						                <img th:src="${parentContent.thumbnailUrl}" class="lineage-img">

						                <div class="overflow-hidden">
						                    <div class="fw-bold text-dark text-truncate mb-1"
						                         th:text="${parentContent.title}"></div>

						                    <div class="small text-muted text-truncate"
						                         th:text="${parentContent.username}"></div>
						                </div>
						            </a>

						            <p class="text-muted text-center py-4 mb-0"
						               th:if="${parentContent == null}">
						                원본 컨텐츠입니다.
						            </p>
						        </div>
						    </div>

						    <div class="col-md-6">
						        <div class="lineage-box h-100">
						            <h6 class="text-muted fw-bold mb-3">
						                <i class="bi bi-arrow-down-circle-fill text-primary me-1"></i> 연관 작품
						            </h6>

						            <div class="d-flex flex-column gap-2"
						                 style="max-height: 165px; overflow-y: auto;">

						                <a th:each="childContent : ${childContents}"
						                   class="lineage-card"
						                   th:href="@{/content/{type}/detail/{id}(
						                        type=${#strings.toLowerCase(childContent.type)},
						                        id=${childContent.id}
						                   )}">

						                    <img th:src="${childContent.thumbnailUrl}" class="lineage-img">

						                    <div class="overflow-hidden">
						                        <div class="fw-bold text-dark text-truncate mb-1"
						                             th:text="${childContent.title}"></div>

						                        <div class="small text-muted text-truncate"
						                             th:text="${childContent.username}"></div>
						                    </div>
						                </a>

						            </div>
						        </div>
						    </div>

						</div>
                    </div>

                    <div class="tab-pane fade" id="comments" role="tabpanel" th:if="${music.allowComment}">
                        <div class="comment-section py-4">
                            <h5 class="text-center fw-bold mb-5" th:text="${'댓글 ' + commentCount + '개'}"></h5>
                            
                            <form th:action="@{/comment/content/write/{id}(id=${music.id})}" method="post" class="d-flex justify-content-center mb-5">
                                <input type="text" name="text" class="form-control comment-input me-3" placeholder="댓글을 남겨보세요." style="max-width:500px;">
                                <button type="submit" class="btn btn-navy-custom px-4">작성</button>
                            </form>

                            <div class="comment-list">
                                <th:block th:each="comment : ${comments}">
                                    <div th:replace="~{comment-line :: commentItem(comment=${comment}, depth=0, category='content', targetId=${music.id})}"></div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div> 
            </div> 
        </div>
    </div>

    <form id="deleteForm" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>

    <div class="modal fade" id="tagAddModal" tabindex="-1" aria-hidden="true" sec:authorize="isAuthenticated()">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/tag/createContentMusicTag/{id}(id=${music.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold mb-0">새 태그 추가</h6>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">#</span>
                            <input type="text" name="tagName" class="form-control border-start-0 ps-0" placeholder="태그 입력" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-3 pt-0">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">추가하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
</div>
</html>
