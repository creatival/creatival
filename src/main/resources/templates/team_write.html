<html layout:decorate="~{layout}">
	
<head>
			<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
			<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
	</head>
<div class="container" layout:fragment="content">

    <style>
        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 0 auto;
        }

        /* 점선 미리보기 박스 */
        .preview-box {
            width: 15.625vw;
            height: 10.4vw;
            border: 2px dashed #a3c4ff;
            border-radius: 10px;
            background-color: #f5f8ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }
        
        /* 프로필용 정사각형 박스 */
        .preview-box.profile-box {
            width: 10.4vw;
            height: 10.4vw;
            border-radius: 10px;
        }

        .preview-box:hover {
            background-color: #ebf1ff;
        }

        .preview-placeholder {
            text-align: center;
            color: #a3c4ff;
        }

        .preview-placeholder i {
            font-size: 45px;
            line-height: 1;
        }

        .preview-placeholder p {
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 14px;
            font-weight: 500;
        }

        /* 실제 이미지 미리보기 */
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* 프로필 이미지 원형 처리 (선택사항) */
        .preview-image.rounded-circle {
            border-radius: 50%;
        }

        /* 하단 파일 입력창 둥근 테두리 */
        .file-input-container {
            width: 100%;
            max-width: 350px;
            border: 1px solid #a3c4ff;
            border-radius: 8px;
            padding: 5px;
            background-color: #fff;
        }

        /* 기본 파일 인풋 디자인 */
        .custom-file-input {
            width: 100%;
            color: #888;
            font-size: 14px;
            cursor: pointer;
        }

        .custom-file-input::file-selector-button {
            padding: 6px 14px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #333;
            cursor: pointer;
            margin-right: 12px;
            transition: background-color 0.2s;
        }

        .custom-file-input::file-selector-button:hover {
            background-color: #f8f9fa;
        }
    </style>

    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">

                    <div class="mb-4 text-center">
                        <h3 class="fw-bold">팀 생성</h3>
                    </div>

                    <form th:action="@{/team/create}"
                          th:object="${createTeamDTO}"
                          method="post"
                          enctype="multipart/form-data">
                          
                          <div class="alert alert-danger shadow-sm rounded-3" role="alert" th:if="${#fields.hasAnyErrors()}">
                              <ul class="mb-0 list-unstyled text-center">
                                  <li th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 메시지</li>
                              </ul>
                          </div>

						  <div class="row mb-5">
						      <div class="col-md-6">
						          <div class="upload-container">
						              <h5 class="fw-bold mb-3">배너 이미지</h5>
						              
						              <label for="bannerFile" class="preview-box">
						                  <div class="preview-placeholder" id="bannerPlaceholder">
						                      <i class="bi bi-image"></i>
						                      <p>미리보기</p>
						                  </div>
						                  <img src="" id="bannerPreview" class="preview-image d-none" alt="배너 미리보기">
						              </label>

						              <div class="file-input-container">
						                  <input type="file"
						                         th:field="*{bannerImage}"
						                         class="custom-file-input"
						                         id="bannerFile"
						                         accept="image/*">
						              </div>
						              <p class="text-muted small mt-2 text-center">가로형 이미지 권장 (PNG, JPG)</p>
						          </div>
						      </div>

						      <div class="col-md-6">
						          <div class="upload-container">
						              <h5 class="fw-bold mb-3">팀 프로필</h5>

						              <label for="profileFile" class="preview-box profile-box">
						                  <div class="preview-placeholder" id="profilePlaceholder">
						                      <i class="bi bi-person-bounding-box"></i>
						                      <p>미리보기</p>
						                  </div>
						                  <img src="" id="profilePreview" class="preview-image rounded-circle d-none" alt="프로필 미리보기">
						              </label>

						              <div class="file-input-container">
						                  <input type="file"
						                         th:field="*{profileImage}"
						                         class="custom-file-input"
						                         id="profileFile"
						                         accept="image/*">
						              </div>
						              <p class="text-muted small mt-2 text-center">정사각형 이미지 권장 (PNG, JPG)</p>
						          </div>
						      </div>
						  </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">팀 이름</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="팀의 이름을 지어주세요.">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">팀 설명</label>
                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{description}"
                                      placeholder="팀에 대한 설명을 적어주세요."></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">팀 태그</label>

                            <div class="border rounded p-3" id="tagContainer">
                                <div class="d-flex flex-wrap gap-2 mb-2" id="tagList"></div>

                                <input type="text"
                                       class="form-control"
                                       id="tagInput"
                                       placeholder="태그를 입력하고 Enter를 누르세요">
                            </div>

                            <div id="hiddenTagInputs"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">공개 범위</label>
                            <select class="form-select" th:field="*{visibility}">
                                <option th:value="PUBLIC">공개</option>
                                <option th:value="PRIVATE">비공개</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mt-5">
                            <a href="#" class="btn btn-outline-secondary px-4" style="background:#ff7a2f; color:white;">취소</a>
                            <button type="submit"
                                    class="btn btn-primary px-5 text-white fw-bold"
                                    style="background:#030F2F; color:white;">
                                제작하기
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script>
        // 공통 미리보기 적용 함수
        function setupPreview(inputId, previewImgId, placeholderId) {
            const inputElement = document.getElementById(inputId);
            const previewImage = document.getElementById(previewImgId);
            const placeholder = document.getElementById(placeholderId);

            inputElement.addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewImage.src = e.target.result;
                        previewImage.classList.remove("d-none");
                        placeholder.classList.add("d-none");
                    };
                    reader.readAsDataURL(file);
                } else {
                    // 파일 선택 취소 시 원래대로
                    previewImage.src = "";
                    previewImage.classList.add("d-none");
                    placeholder.classList.remove("d-none");
                }
            });
        }

        // 배너 & 프로필 함수 실행
        setupPreview("bannerFile", "bannerPreview", "bannerPlaceholder");
        setupPreview("profileFile", "profilePreview", "profilePlaceholder");
    </script>

    <script>
        const tagInput = document.getElementById("tagInput");
        const tagList = document.getElementById("tagList");
        const hiddenTagInputs = document.getElementById("hiddenTagInputs");

        tagInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();

                const tagValue = tagInput.value.trim();
                if (!tagValue) return;

                // 중복 방지
                const existingTags = document.querySelectorAll("input[name='tags']");
                for (let tag of existingTags) {
                    if (tag.value === tagValue) {
                        tagInput.value = "";
                        return;
                    }
                }

                // 화면 태그 생성
                const badge = document.createElement("span");
                badge.className = "badge bg-primary";
                badge.textContent = tagValue + " ×";
                badge.style.cursor = "pointer";

                // 클릭 시 제거
                badge.addEventListener("click", function () {
                    badge.remove();
                    hiddenInput.remove();
                });

                tagList.appendChild(badge);

                // 실제 전송용 hidden input 생성
                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = "tags";
                hiddenInput.value = tagValue;
                hiddenTagInputs.appendChild(hiddenInput);

                tagInput.value = "";
            }
        });
    </script>
</div>
</html>
