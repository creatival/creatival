<html layout:decorate="~{layout}">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
    <link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
</head>

<div layout:fragment="content">
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container d-flex justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">

                        <div class="mb-4 text-center">
                            <h3 class="fw-bold text-dark">회차 수정</h3>
                            <p class="text-muted mb-0">
                                <span th:text="${novel.title}" class="fw-bold text-primary">소설 제목</span>의
                                <span th:text="${episode.episodeNum}" class="fw-bold text-primary"></span>화 이야기를 수정하세요
                            </p>
                        </div>

                        <form th:action="@{/content/novel/episode/update/{episodeId}(episodeId=${episode.id})}"
                              th:object="${episode}"
                              method="post">

                            <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
                                <div th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 문구</div>
                            </div>

                            <div class="mb-4">
                                <label for="episodeTitle" class="form-label fw-bold">회차 제목</label>
                                <input type="text"
                                       id="episodeTitle"
                                       th:field="*{title}"
                                       class="form-control form-control-lg border-2"
                                       placeholder="이번 회차의 소제목을 입력하세요">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">유료 여부</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio"
                                           class="btn-check"
                                           id="is_free_true"
                                           th:field="*{free}"
                                           value="true">
                                    <label class="btn btn-outline-success py-2" for="is_free_true">
                                        <i class="bi bi-gift me-1"></i> 무료 연재
                                    </label>

                                    <input type="radio"
                                           class="btn-check"
                                           id="is_free_false"
                                           th:field="*{free}"
                                           value="false">
                                    <label class="btn btn-outline-danger py-2" for="is_free_false">
                                        <i class="bi bi-coin me-1"></i> 유료 연재
                                    </label>
                                </div>
                                <small class="text-muted mt-2 d-block">
                                    유료 연재 시 플랫폼 정책에 따른 정산 절차가 필요합니다.
                                </small>
                            </div>

                            <div class="mb-4" id="priceSection" style="display:none;">
                                <label for="episodePrice" class="form-label fw-bold">회차 가격</label>
                                <input type="number"
                                       id="episodePrice"
                                       th:field="*{price}"
                                       class="form-control border-2"
                                       min="100"
                                       step="100"
                                       placeholder="가격을 입력하세요. 예: 1000">
                                <small class="text-muted mt-2 d-block">
                                    유료 연재 선택 시에만 가격이 적용됩니다.
                                </small>
                            </div>

                            <input type="file" id="txtFileInput" accept=".txt" style="display: none;">

                            <div class="mb-3">
                                <button type="button" class="btn btn-outline-primary btn-sm"
                                        onclick="document.getElementById('txtFileInput').click()">
                                    <i class="bi bi-file-earmark-text"></i> 내 컴퓨터에서 원고 불러오기 (.txt)
                                </button>
                                <small class="text-muted ms-2">* 작성 중인 내용이 모두 파일 내용으로 대체됩니다.</small>
                            </div>

                            <div class="mb-4">
                                <label for="content" class="form-label fw-bold">내용</label>
                                <textarea id="content"
                                          th:field="*{novelContent}"
                                          class="form-control border-2"
                                          rows="20"
                                          style="font-family: 'Pretendard', sans-serif; line-height: 1.8;"
                                          placeholder="직접 입력하거나 위 버튼을 통해 원고를 불러오세요."></textarea>
                                <div class="text-end mt-2">
                                    <small class="text-muted">글자 수: <span id="charCount">0</span>자</small>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="note" class="form-label fw-bold">작가의 말</label>
                                <textarea id="note"
                                          th:field="*{note}"
                                          class="form-control border-2"
                                          rows="5"
                                          style="font-family: 'Pretendard', sans-serif; line-height: 1.8;"
                                          placeholder="내용을 입력하세요."></textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                                <a th:href="@{/novel/{id}(id=${novel.id})}" class="btn btn-link text-decoration-none text-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> 목록으로
                                </a>
                                <div>
                                    <button type="submit" class="btn btn-dark px-5 py-2 fw-bold shadow-sm">
                                        수정하기
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('content');
        const charCount = document.getElementById('charCount');
        const freeRadio = document.getElementById('is_free_true');
        const paidRadio = document.getElementById('is_free_false');
        const priceSection = document.getElementById('priceSection');
        const priceInput = document.getElementById('episodePrice');

        function updateCharCount() {
            charCount.innerText = textarea.value.length;
        }

        function togglePriceSection() {
            const isPaid = paidRadio.checked;
            priceSection.style.display = isPaid ? 'block' : 'none';

            if (!isPaid && priceInput) {
                priceInput.value = '';
            }
        }

        textarea.addEventListener('input', updateCharCount);

        freeRadio.addEventListener('change', togglePriceSection);
        paidRadio.addEventListener('change', togglePriceSection);

        document.querySelector("form").addEventListener("submit", function(e) {
            const title = document.getElementById("episodeTitle").value.trim();

            if (!title) {
                alert("회차 제목을 입력해주세요.");
                e.preventDefault();
                return;
            }

            if (paidRadio.checked) {
                const priceValue = priceInput.value.trim();

                if (!priceValue) {
                    alert("유료 연재는 가격을 입력해주세요.");
                    e.preventDefault();
                    return;
                }

                if (Number(priceValue) <= 0) {
                    alert("가격은 0보다 커야 합니다.");
                    e.preventDefault();
                    return;
                }
            }
        });

        document.getElementById('txtFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== 'text/plain' && !file.name.endsWith('.txt')) {
                alert('텍스트(.txt) 파일만 불러올 수 있습니다.');
                this.value = '';
                return;
            }

            const confirmMsg = "파일을 불러오면 현재 작성 중인 내용이 모두 사라집니다.\n정말 불러오시겠습니까?";
            if (!confirm(confirmMsg)) {
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;

                const contentArea = document.getElementById('content');
                contentArea.value = contents;

                updateCharCount();

                alert('원고를 성공적으로 불러왔습니다.');
                document.getElementById('txtFileInput').value = '';
            };

            reader.readAsText(file, 'UTF-8');
        });

        updateCharCount();
        togglePriceSection();
    </script>
</div>
</html>
