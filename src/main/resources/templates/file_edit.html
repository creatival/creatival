<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">
    <style>
        .detail-container { max-width: 800px; margin: 0 auto; position: relative; }
        .back-btn { position: absolute; left: -50px; top: 10px; font-size: 1.5rem; color: #333; text-decoration: none; }
        .input-title { font-size: 2rem; font-weight: bold; border: none; outline: none; width: 100%; text-align: center; background: transparent; }
        .input-content { border: none; outline: none; width: 100%; min-height: 200px; text-align: center; font-size: 1.1rem; font-weight: 500; background: transparent; resize: none; }
        .user-info { color: #999; font-size: 0.95rem; margin-bottom: 20px; }
        .section-divider { border: none; border-top: 1px solid #dee2e6; margin: 40px 0; }
        .file-preview-box { background-color: #e0e0e0; width: 150px; height: 100px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; margin: 5px; cursor: pointer; overflow: hidden; transition: background 0.2s; vertical-align: top; border: 2px dashed #ccc; }
        .file-preview-box:hover { background-color: #d0d0d0; }
        .file-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .btn-action { background-color: #323b6d; color: white; padding: 10px 40px; border: none; border-radius: 4px; }
        .btn-action:hover { background-color: #242a50; color: white; }
        .file-label { font-size: 0.8rem; color: #666; margin-top: 5px; }
        @media (max-width: 992px) { .back-btn { position: static; display: block; margin-bottom: 20px; } }
    </style>

    <main class="py-5">
        <form th:action="@{/content/file/edit/{id}(id=${updateFileDTO.id})}" method="post" enctype="multipart/form-data" class="detail-container" th:object="${updateFileDTO}">
            <a href="javascript:history.back()" class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="text-center">
                <input type="text" th:field="*{title}" class="input-title" placeholder="제목을 입력하세요" required>
                <div class="user-info mt-2">
                    <span class="user-id" th:text="${#authentication.name}">사용자 ID</span> 
                </div>
                <hr class="section-divider">
            </div>

            <div class="row justify-content-center">
                <input type="file" id="extraImg" name="extraImg" class="d-none" accept="image/*" onchange="previewFile(this, 'extra-preview')">
                <div id="extra-preview" class="file-preview-box rounded" onclick="document.getElementById('extraImg').click()">
                    <i class="bi bi-image fs-2 text-white"></i>
                    <span class="file-label">추가 이미지</span>
                </div>
                <p class="small mt-1 text-muted text-center">대표 이미지/썸네일</p>
            </div>

            <div class="content-area text-center">
                <textarea th:field="*{description}" class="input-content" placeholder="내용을 상세히 입력하세요" required></textarea>
            </div>

            <hr class="section-divider">

            <div class="text-center mb-5">
                <p class="small fw-bold mb-3">파일 첨부</p>
                <div class="d-flex justify-content-center gap-4 flex-wrap">
                    <div>
                        <input type="file" id="mainFile" name="file" class="d-none" onchange="previewFile(this, 'main-preview')">
                        <div id="main-preview" class="file-preview-box rounded" onclick="document.getElementById('mainFile').click()">
                            <i class="bi bi-file-earmark-plus fs-2 text-white"></i>
                            <span class="file-label">주 파일 선택</span>
                        </div>
                        <p class="small mt-1 text-muted">메인 콘텐츠 파일</p>
                    </div>
                </div>
            </div>

            <hr class="section-divider">
			<div class="mb-3">
				    <label class="form-label fw-bold">유료 콘텐츠 설정</label>

				    <div class="form-check mb-2">
				        <input class="form-check-input" type="checkbox" id="paidCheck" th:field="*{paid}" >
				        <label class="form-check-label" for="paidCheck">
				            유료 콘텐츠로 등록
				        </label>
				    </div>

				    <input type="number"
				           class="form-control"
				           id="priceInput"
				           min="100"
				           step="100"
				           placeholder="가격 입력 (예: 5000)"
						   th:field="*{price}"
				           disabled>
				</div>
            <div class="row g-3 mb-4 text-start">
                <div class="col-md-6">
                    <label class="form-label fw-semibold d-block">공개 범위</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" th:field="*{visibility}" value="PUBLIC" id="vis-public">
                        <label class="btn btn-outline-primary" for="vis-public">전체 공개</label>

                        <input type="radio" class="btn-check" th:field="*{visibility}" value="PRIVATE" id="vis-private">
                        <label class="btn btn-outline-primary" for="vis-private">비공개</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold d-block">댓글 설정</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" th:field="*{allowComment}" th:value="true" id="comment-on">
                        <label class="btn btn-outline-secondary" for="comment-on">허용</label>

                        <input type="radio" class="btn-check" th:field="*{allowComment}" th:value="false" id="comment-off">
                        <label class="btn btn-outline-secondary" for="comment-off">차단</label>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-action">수정 완료</button>
            </div>
        </form>
    </main>

    <script th:inline="javascript">
        const initialExtraImgUrl = /*[[${updateFileDTO.extraImgUrl}]]*/ null;
        const initialExtraImgName = /*[[${updateFileDTO.extraImgName}]]*/ null;
        const initialFileUrl = /*[[${updateFileDTO.fileUrl}]]*/ null;

        document.addEventListener("DOMContentLoaded", function() {
            if (initialExtraImgUrl) {
                renderExistingPreview('extra-preview', initialExtraImgUrl, true, initialExtraImgName);
            }
            if (initialFileUrl) {
                const isImg = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(initialFileUrl);
                renderExistingPreview('main-preview', initialFileUrl, isImg);
            }
        });

        function renderExistingPreview(containerId, url, isImage, displayName = null) {
            const container = document.getElementById(containerId);

            if (isImage) {
                container.innerHTML = `<img src="${url}" alt="preview">`;
            } else {
                const fileName = displayName || url.split('/').pop();

                container.innerHTML = `
                    <i class="bi bi-file-earmark-check fs-2 text-success"></i>
                    <span class="file-label" title="${fileName}" style="font-size: 0.7rem; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;">
                        ${fileName}
                    </span>
                `;
            }
        }

        function previewFile(input, previewId) {
            const previewBox = document.getElementById(previewId);
            const file = input.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewBox.innerHTML = '';

                    if (file.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        previewBox.appendChild(img);
                    } else {
                        previewBox.innerHTML = `
                            <i class="bi bi-file-earmark-check fs-2 text-success"></i>
                            <span class="file-label" style="font-size: 0.7rem; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;">
                                ${file.name}
                            </span>
                        `;
                    }
                };
                reader.readAsDataURL(file);
            }
        }
		document.addEventListener("DOMContentLoaded", function () {
					        const paidCheck = document.getElementById("paidCheck");
					        const priceInput = document.getElementById("priceInput");

					        function togglePriceInput() {
					            if (paidCheck.checked) {
					                priceInput.disabled = false;
					            } else {
					                priceInput.disabled = true;
					                priceInput.value = "";
					            }
					        }

					        if (paidCheck && priceInput) {
					            paidCheck.addEventListener("change", togglePriceInput);
					            togglePriceInput();
					        }
					    });
			function validateForm() {
					    const paidCheck = document.getElementById("paidCheck").checked;
					    const priceValue = document.getElementById("priceInput").value;
					    const submitBtn = document.querySelector("button[type='submit']");
					    
					    if (paidCheck && (!priceValue || priceValue < 100)) {
					        submitBtn.disabled = true; // 조건 안 맞으면 버튼 클릭 불가
					    } else {
					        submitBtn.disabled = false;
					    }
					}
					
					document.getElementById("paidCheck").addEventListener("change", validateForm);
					document.getElementById("priceInput").addEventListener("input", validateForm);
    </script>
</div>
</html>
