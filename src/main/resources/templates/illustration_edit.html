<html layout:decorate="~{layout}">
<div layout:fragment="content">

<div class="container py-5" style="max-width: 900px;">
    <h3 class="fw-bold mb-4">작품 수정</h3>

    <form th:action="@{/content/art/update/{id}(id=${id})}"
          method="post"
          enctype="multipart/form-data"
          th:object="${updateArtDTO}"
          id="artForm">

        <!-- 에러 표시 -->
        <div class="alert alert-danger shadow-sm"
             role="alert"
             th:if="${#fields.hasAnyErrors()}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.allErrors()}"
                    th:text="${err}">
                </li>
            </ul>
        </div>

        <!-- 제목 -->
        <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text"
                   th:field="*{title}"
                   class="form-control"
                   required>
        </div>

        <!-- 설명 -->
        <div class="mb-3">
            <label class="form-label">설명</label>
            <textarea th:field="*{description}"
                      class="form-control"
                      rows="4"></textarea>
        </div>
		<div class="mb-3">
            <label class="form-label">공개 설정</label>
            <select th:field="*{visibility}" class="form-select">
                <option value="PUBLIC">전체 공개</option>
                <option value="PRIVATE">비공개</option>
            </select>
        </div>

        <!-- 댓글 허용 -->
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" th:field="*{allowComment}">
            <label class="form-check-label">댓글 허용</label>
        </div>
		<div class="mb-3">
		    <label class="form-label fw-bold">유료 콘텐츠 설정</label>

		    <div class="form-check mb-2">
		        <input class="form-check-input" type="checkbox" id="paidCheck" th:field="*{paid}" >
		        <label class="form-check-label" for="paidCheck">
		            유료 콘텐츠로 등록
		        </label>
		    </div>

		    <input type="number"
		           class="form-control"
		           id="priceInput"
		           min="100"
		           step="100"
		           placeholder="가격 입력 (예: 5000)"
				   th:field="*{price}"
		           disabled>
		</div>
        <!-- 기존 이미지 -->
        <div class="mb-4">
            <label class="form-label">기존 이미지</label>

            <div class="row g-3" id="existingPreviewContainer">

                <div class="col-6 col-md-3 position-relative"
                     th:each="file : ${art.fileList}"
                     th:data-id="${file.id}">

                    <div class="border rounded overflow-hidden position-relative">
                        <img th:src="${file.fileUrl}"
                             class="img-fluid"
                             style="aspect-ratio:1/1; object-fit:cover;">

                        <button type="button"
                                class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
                                onclick="markExistingImageDelete(this)">
                            ✕
                        </button>
                    </div>

                    <!-- 삭제 전송용 -->
                    <input type="hidden"
                           name="deleteFileIds"
                           disabled>
                </div>

            </div>
        </div>

        <!-- 새 이미지 업로드 -->
        <div class="mb-4">
            <label class="form-label">이미지 추가 (최대 4장)</label>

            <input type="file"
                   id="imageInput"
                   name="newFiles"
                   accept="image/*"
                   multiple
                   hidden>

            <button type="button"
                    class="btn btn-outline-dark mb-3"
                    onclick="triggerImageInput()">
                이미지 추가
            </button>

            <div id="previewContainer" class="row g-3"></div>
        </div>

        <!-- 제출 -->
        <div class="text-end">
            <button type="submit"
                    class="btn btn-dark px-4">
                수정하기
            </button>
        </div>

    </form>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('previewContainer');
    const existingContainer = document.getElementById('existingPreviewContainer');
    const artForm = document.getElementById('artForm');

    // 파일 객체와 미리보기를 매칭하기 위한 배열
    let selectedFiles = [];

    function triggerImageInput() {
        if (getTotalImageCount() >= 4) {
            alert("이미지는 최대 4장까지 가능합니다.");
            return;
        }
        imageInput.click();
    }

    imageInput.addEventListener('change', function () {
        const files = Array.from(this.files);

        files.forEach(file => {
            if (getTotalImageCount() >= 4) return;
            
            // 고유 식별자 추가
            const fileId = Date.now() + Math.random();
            file.fileId = fileId; 
            
            selectedFiles.push(file);
            renderPreview(file);
        });

        this.value = ""; // 초기화하여 동일 파일 재선택 가능하게 함
        updateInputFiles();
    });

    function renderPreview(file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            const col = document.createElement('div');
            col.className = "col-6 col-md-3 position-relative";
            // 고유 ID를 data 속성에 저장
            col.setAttribute('data-file-id', file.fileId);
            col.innerHTML = `
                <div class="border rounded overflow-hidden position-relative">
                    <img src="${e.target.result}" class="img-fluid" style="aspect-ratio:1/1; object-fit:cover;">
                    <button type="button"
                            class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
                            onclick="removeNewImage('${file.fileId}')">✕</button>
                </div>`;
            previewContainer.appendChild(col);
        };
        reader.readAsDataURL(file);
    }

    // 인덱스가 아닌 고유 ID로 삭제
    function removeNewImage(fileId) {
        selectedFiles = selectedFiles.filter(f => f.fileId != fileId);
        const targetElement = previewContainer.querySelector(`[data-file-id="${fileId}"]`);
        if (targetElement) targetElement.remove();
        updateInputFiles();
    }

    function markExistingImageDelete(button) {
        const col = button.closest('.col-6');
        const hiddenInput = col.querySelector("input[name='deleteFileIds']");
        
        // 토글 기능 추가 (사용자 실수 방지)
        if (hiddenInput.disabled) {
            hiddenInput.disabled = false;
            hiddenInput.value = col.dataset.id;
            col.style.opacity = "0.3";
            col.style.filter = "grayscale(100%)";
            button.innerText = "복구";
            button.classList.replace('btn-danger', 'btn-secondary');
        } else {
            hiddenInput.disabled = true;
            hiddenInput.value = "";
            col.style.opacity = "1";
            col.style.filter = "none";
            button.innerText = "✕";
            button.classList.replace('btn-secondary', 'btn-danger');
        }
    }

    function updateInputFiles() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => dataTransfer.items.add(file));
        imageInput.files = dataTransfer.files;
    }

    function getExistingRemainingCount() {
        return Array.from(existingContainer.children)
            .filter(col => {
                const input = col.querySelector("input[name='deleteFileIds']");
                return input && input.disabled;
            }).length;
    }

    function getTotalImageCount() {
        return getExistingRemainingCount() + selectedFiles.length;
    }

    artForm.addEventListener('submit', function (e) {
        if (getTotalImageCount() === 0) {
            e.preventDefault();
            alert("이미지를 최소 1장 이상 유지해야 합니다.");
            return;
        }
        updateInputFiles(); // 제출 직전 최종 동기화
    });
	document.addEventListener("DOMContentLoaded", function () {
			        const paidCheck = document.getElementById("paidCheck");
			        const priceInput = document.getElementById("priceInput");

			        function togglePriceInput() {
			            if (paidCheck.checked) {
			                priceInput.disabled = false;
			            } else {
			                priceInput.disabled = true;
			                priceInput.value = "";
			            }
			        }

			        if (paidCheck && priceInput) {
			            paidCheck.addEventListener("change", togglePriceInput);
			            togglePriceInput();
			        }
			    });
	function validateForm() {
			    const paidCheck = document.getElementById("paidCheck").checked;
			    const priceValue = document.getElementById("priceInput").value;
			    const submitBtn = document.querySelector("button[type='submit']");
			    
			    if (paidCheck && (!priceValue || priceValue < 100)) {
			        submitBtn.disabled = true; // 조건 안 맞으면 버튼 클릭 불가
			    } else {
			        submitBtn.disabled = false;
			    }
			}
			
			document.getElementById("paidCheck").addEventListener("change", validateForm);
			document.getElementById("priceInput").addEventListener("input", validateForm);
</script>

</div>
</html>
