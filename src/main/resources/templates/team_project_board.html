<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 게시판 | Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --bg-light: #F8F9FA;
            --border-color: #E9ECEF;
        }

        body { background-color: var(--bg-light); color: #333; font-family: 'Pretendard', sans-serif; }

        /* 헤더 탭 레이아웃 */
        .board-menu-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .nav-tabs-board {
            display: flex;
            gap: 40px;
            margin-bottom: -2px; 
        }

        .board-tab {
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: #aaa;
            padding: 0 10px 15px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .board-tab.active {
            color: var(--brand-navy);
            border-bottom: 3px solid var(--brand-navy);
        }

        .btn-write {
            background-color: var(--brand-navy);
            color: white;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-write:hover { background-color: #2c3359; color: white; transform: translateY(-2px); }

        /* 탭 컨텐츠 제어 */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 게시판 리스트 테이블 스타일 */
        .board-table {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }
        
        .table { margin-bottom: 0; width: 100%; }

        /* [핵심 수정] 테이블 헤더: 네이비 배경 & 흰색 글씨 */
        .table thead th {
            background-color: var(--brand-navy) !important;
            color: #ffffff !important;
            font-weight: 600;
            border: none;
            padding: 1.2rem 1rem;
            text-align: center;
        }
        
        .table tbody td {
            padding: 1.2rem 1rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .table tbody tr:hover {
            background-color: rgba(59, 67, 113, 0.03);
            cursor: pointer;
        }

        .post-title a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }
        
        .post-title a:hover {
            color: var(--brand-navy);
            text-decoration: underline;
        }

        .team-tag { background-color: var(--brand-navy); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .notice-tag { background-color: var(--brand-orange); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        /* 페이지네이션 */
        .pagination .page-link { color: var(--brand-navy); border: none; margin: 0 3px; border-radius: 6px; }
        .pagination .page-item.active .page-link { background-color: var(--brand-navy); color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold" style="color: var(--brand-navy);">프로젝트 건의사항</h1>
        <p class="text-muted small">프로젝트 건의를 시도해보세요.</p>
    </div>

    <div class="board-menu-wrapper">
        <div class="nav-tabs-board">
            <button class="board-tab active" data-tab="team-board">프로젝트 게시판</button>
            <button class="board-tab" data-tab="notice-board">공지사항</button>
        </div>
        <a th:href="@{/team_project_board_write}" class="btn btn-write">
            <i class="bi bi-pencil-square me-2"></i>글 작성
        </a>
    </div>

    <div id="team-board" class="tab-content active">
        <div class="board-table">
            <table class="table text-center text-nowrap">
                <thead>
                    <tr>
                        <th width="8%">번호</th>
                        <th width="12%">분류</th>
                        <th width="45%" class="text-start">제목</th>
                        <th width="15%">작성자</th>
                        <th width="12%">작성일</th>
                        <th width="8%">조회</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>12</td>
                        <td><span class="team-tag">Project</span></td>
                        <td class="text-start post-title">
                            <a href="#">이번 주 브랜드 로고 시안 공유 및 피드백 요청 건 <span class="text-danger small ms-1">[5]</span></a>
                        </td>
                        <td>Dongmin</td>
                        <td>2026.04.13</td>
                        <td>128</td>
                    </tr>
                    <tr>
                        <td>11</td>
                        <td><span class="team-tag">Idea</span></td>
                        <td class="text-start post-title">
                            <a href="#">메인 페이지 UI/UX 개선 아이디어 스케치 공유</a>
                        </td>
                        <td>Jiyeon</td>
                        <td>2026.04.11</td>
                        <td>85</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
            </ul>
        </nav>
    </div>

    <div id="notice-board" class="tab-content">
        <div class="board-table">
            <table class="table text-center text-nowrap">
                <thead>
                    <tr>
                        <th width="8%">번호</th>
                        <th width="12%">분류</th>
                        <th width="45%" class="text-start">제목</th>
                        <th width="15%">작성자</th>
                        <th width="12%">작성일</th>
                        <th width="8%">조회</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="table-light">
                        <td><i class="bi bi-megaphone-fill text-danger"></i></td>
                        <td><span class="notice-tag">Notice</span></td>
                        <td class="text-start post-title">
                            <a href="#">필독! 이번 주 회의 일정 변경 안내</a>
                        </td>
                        <td>Admin</td>
                        <td>2026.04.14</td>
                        <td>342</td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.board-tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // 1. 모든 탭 활성화 해제
                tabs.forEach(t => t.classList.remove('active'));
                // 2. 모든 컨텐츠 숨기기
                contents.forEach(content => content.classList.remove('active'));
                
                // 3. 현재 클릭한 탭 활성화
                this.classList.add('active');
                // 4. 연결된 컨텐츠 보여주기
                const targetId = this.getAttribute('data-tab');
                const targetContent = document.getElementById(targetId);
                if (targetContent) {
                    targetContent.classList.add('active');
                }
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
