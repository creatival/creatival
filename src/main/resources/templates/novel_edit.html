<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Creatival</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column">

<div class="container mt-5 mb-5 d-flex justify-content-center">
  <div class="col-lg-8">

    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-lg-5">

        <div class="mb-4 text-center">
          <h3 class="fw-bold">소설 수정</h3>
        </div>

        <!-- POST 방식 -->
        <form th:action="@{/content/novel_update/{id}(id=${novelId})}"
              th:object="${novel}"
              method="post">

          <!-- 제목 -->
          <div class="mb-4">
            <label class="form-label fw-semibold">소설 제목</label>
			<div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}" th:fragment="formErrorsFragment">
																			<div th:each="err : ${#fields.allErrors()}">[[${err}]]</div>
																	</div>
            <input type="text"
                   class="form-control form-control-lg"
                   th:field="*{title}"
                   placeholder="수정할 제목">
          </div>

          <!-- 소개 -->
          <div class="mb-4">
            <label class="form-label fw-semibold">작품 소개</label>
            <textarea class="form-control"
                      rows="5"
                      th:field="*{description}"
                      placeholder="수정할 소개를 작성해주세요."></textarea>
          </div>

          <!-- allowComment -->
          <div class="mb-4">
            <label class="form-label fw-semibold">댓글 허용</label>
            <div class="form-check">
              <input class="form-check-input"
                     type="checkbox"
                     th:field="*{allowComment}">
              <label class="form-check-label">댓글을 허용합니다</label>
            </div>
          </div>
		  <!-- 연재 범위 -->
		  <div class="mb-4">
		      <label class="form-label fw-semibold d-block">공개 범위</label>

		      <div class="form-check form-check-inline">
		          <input class="form-check-input"
		                 type="radio"
		                 th:field="*{visibility}"
		                 th:value="${T(com.creatival.content.Enum.Visibility).PUBLIC}">
		          <label class="form-check-label">공개</label>
		      </div>

		      <div class="form-check form-check-inline">
		          <input class="form-check-input"
		                 type="radio"
		                 th:field="*{visibility}"
		                 th:value="${T(com.creatival.content.Enum.Visibility).PRIVATE}">
		          <label class="form-check-label">비공개</label>
		      </div>
		  </div>
          <!-- 연재 상태 -->
          <div class="mb-4">
            <label class="form-label fw-semibold d-block">연재 상태</label>

            <div class="form-check form-check-inline">
              <input class="form-check-input"
                     type="radio"
                     th:field="*{end}"
                     value="false">
              <label class="form-check-label">연재 중</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input"
                     type="radio"
                     th:field="*{end}"
                     value="true">
              <label class="form-check-label">완결</label>
            </div>
          </div>

          <!-- 버튼 -->
          <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/novel/{id}(id=${novelId})}"
               class="btn btn-outline-secondary px-4">
              취소
            </a>

            <button type="submit"
                    class="btn btn-dark px-5">
              수정하기
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>

<!-- JS Validation -->
<script>
document.querySelector("form").addEventListener("submit", function(e) {

    const title = document.querySelector("input[name='title']").value.trim();

    if(title === "") {
        alert("제목은 필수입니다.");
        e.preventDefault();
    }
});
</script>

</body>
</div>
</html>
