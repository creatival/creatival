<html layout:decorate="~{layout}">
<div layout:fragment="content">
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container d-flex justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">
                        
                        <div class="mb-4 text-center">
                            <h3 class="fw-bold text-dark">소설 정보 수정</h3>
                            <p class="text-muted small">작품의 기본 정보를 변경할 수 있습니다.</p>
                        </div>

                        <form th:action="@{/content/novel_update/{id}(id=${novelId})}"
                              th:object="${novel}"
                              method="post">

                            <div class="alert alert-danger shadow-sm" role="alert" th:if="${#fields.hasAnyErrors()}">
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 메시지</li>
                                </ul>
                            </div>

                            <div class="mb-4">
                                <label for="title" class="form-label fw-bold">소설 제목</label>
                                <input type="text"
                                       id="title"
                                       class="form-control form-control-lg border-2"
                                       th:field="*{title}"
                                       placeholder="작품의 제목을 입력하세요"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold">작품 소개</label>
                                <textarea id="description"
                                          class="form-control border-2"
                                          rows="6"
                                          th:field="*{description}"
                                          placeholder="독자들에게 작품을 소개해주세요."></textarea>
                            </div>

                            <hr class="my-4 text-muted opacity-25">

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold d-block">소통 설정</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" id="allowComment" th:field="*{allowComment}">
                                        <label class="form-check-label ms-2" for="allowComment">댓글 작성을 허용합니다</label>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold d-block">공개 설정</label>
                                    <div class="mt-2">
                                        <div class="form-check form-check-inline me-4">
                                            <input class="form-check-input" type="radio" id="v_public"
                                                   th:field="*{visibility}" th:value="${T(com.creatival.content.Enum.Visibility).PUBLIC}">
                                            <label class="form-check-label" for="v_public">공개</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="v_private"
                                                   th:field="*{visibility}" th:value="${T(com.creatival.content.Enum.Visibility).PRIVATE}">
                                            <label class="form-check-label" for="v_private">비공개</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">연재 상태</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" id="status_ing" th:field="*{end}" value="false">
                                    <label class="btn btn-outline-primary py-2" for="status_ing">연재 중</label>

                                    <input type="radio" class="btn-check" id="status_end" th:field="*{end}" value="true">
                                    <label class="btn btn-outline-success py-2" for="status_end">완결</label>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                                <a th:href="@{/novel/{id}(id=${novelId})}" class="btn btn-link text-decoration-none text-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> 이전으로
                                </a>
                                <button type="submit" class="btn btn-dark px-5 py-2 fw-bold shadow-sm">
                                    정보 수정 완료
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.querySelector("form").addEventListener("submit", function(e) {
            const title = document.getElementById("title").value.trim();
            if(!title) {
                alert("소설 제목은 비워둘 수 없습니다.");
                e.preventDefault();
            }
        });
    </script>
</div>
</html>
