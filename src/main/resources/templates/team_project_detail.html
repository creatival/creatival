<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<div class="container my-5" layout:fragment="content">
    
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        /* ===== [공통] 카드형 액션 버튼 스타일 ===== */
        .action-buttons-group { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 15px; }
        .btn-action {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 70px; height: 75px; background-color: #ffffff; border: 1px solid #dee2e6;
            border-radius: 12px; text-decoration: none !important; transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 8px; color: #333;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.1); border-color: #adb5bd; color: #111; }
        .btn-action i { font-size: 1.5rem; margin-bottom: 3px; line-height: 1; }
        .btn-action span { font-size: 0.72rem; font-weight: 700; }
        .btn-like i { color: #ff4757; }
        .btn-follow i { color: #ffc107; }
        .btn-bookmark i { color: #2D3278; }
        .btn-share i { color: #333; }

        .progress { background-color: #e9ecef; border-radius: 10px; }
        .tag-badge { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 5px 10px; color: #333; }
    </style>

    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">
            <span class="badge bg-primary mb-2" th:text="${dto.status != null ? dto.status : '모집 중'}">모집 중</span>
            <h1 class="fw-bold display-5" th:text="${dto.title}">프로젝트 제목</h1>
            <p class="text-muted mb-0">
                <i class="bi bi-calendar-check me-1"></i> 시작일: <span th:text="${dto.createdAt != null ? #temporals.format(dto.createdAt,'yyyy.MM.dd') : '2026.02.12'}"></span> | 
                <i class="bi bi-calendar-event me-1"></i> 종료일: <span th:text="${dto.endDate != null ? #temporals.format(dto.endDate,'yyyy.MM.dd') : '미정'}"></span>
            </p>
        </div>
        
        <div class="col-md-5 mt-4 mt-md-0 text-md-end">
            <div class="action-buttons-group">
                <a href="#" class="btn-action btn-like"><i class="bi bi-heart-fill"></i><span>1.2k</span></a>
                <a href="#" class="btn-action btn-follow"><i class="bi bi-person-plus-fill"></i><span>팔로우</span></a>
                <a href="#" class="btn-action btn-bookmark"><i class="bi bi-bookmark-fill"></i><span>북마크</span></a>
                <a href="#" class="btn-action btn-share"><i class="bi bi-share-fill"></i><span>공유</span></a>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
                <button sec:authorize="isAuthenticated()" class="btn btn-outline-secondary btn-sm">대표 게시물로 고정</button>
                <a th:href="@{/team/{tid}/project/{id}/edit(tid=${dto.teamId},id=${dto.id})}"
                   sec:authorize="isAuthenticated()"
                   class="btn btn-outline-secondary btn-sm">수정하기</a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <img th:src="${dto.bannerImgUrl != null ? dto.bannerImgUrl : '/images/pic.png'}"
                 class="img-fluid rounded shadow-sm mb-5" alt="대표 이미지" style="width:100%; height:400px; object-fit:cover;">

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">프로젝트 소개</h4>
                <div class="lh-lg text-secondary" th:utext="${dto.description}">프로젝트 소개 내용</div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">프로젝트 콘텐츠</h4>
                    <a th:href="@{/Illustration_list}" class="text-decoration-none small text-muted">전체 보기 ></a>
                </div>
                
                <div class="row g-4">
                    <div class="col-6 col-md-4" th:each="content : ${contentList}">
                        <div class="card h-100 shadow-sm border-0 position-relative">
                            <a th:href="${content.contentUrl}">
                                <img th:src="${content.thumbnailUrl != null ? content.thumbnailUrl : '/images/pic.png'}" class="card-img-top" style="height: 180px; object-fit: cover;">
                            </a>
                            <div class="card-body p-3">
                                <h6 class="card-title fw-bold text-truncate" th:text="${content.title}">제목</h6>
                                <div class="d-flex align-items-center mb-2">
                                    <img th:src="${content.profileImgUrl != null ? content.profileImgUrl : 'https://dummyimage.com/20x20/ced4da/6c757d'}" class="rounded-circle me-2" style="width:20px;height:20px;">
                                    <span class="small text-muted" th:text="${content.username}">닉네임</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">프로젝트 정보</h5>
                    <div class="mb-3">
                        <h6 class="fw-bold small">소속 팀</h6>
                        <div class="d-flex align-items-center">
                            <img th:src="${dto.profileImgUrl}" class="rounded-circle me-3" style="width:40px;height:40px;">
                            <span th:text="${dto.teamName}">Team Name</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <h6 class="fw-bold small">태그</h6>
                        <span class="badge rounded-pill tag-badge" th:text="${dto.projectTag}">#태그</span>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <h6 class="fw-bold small">버전</h6>
                            <a th:href="@{/team/{tid}/project/{pid}/history(tid=${dto.teamId}, pid=${dto.id})}" class="small">역사 보기</a>
                        </div>
                        <span class="badge bg-primary" th:text="${log != null ? log.versionTag : 'v1.0.0'}">v1.0.0</span>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                        <h5 class="fw-bold mb-0">진행도</h5>
                        <button class="btn btn-sm btn-outline-primary" sec:authorize="isAuthenticated()" data-bs-toggle="modal" data-bs-target="#createCheckModal">계획 추가</button>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted">전체 공정률</small>
                            <small id="progressText" class="fw-bold text-primary" th:text="${(dto.totalProgress ?: 0) + '%'}"></small>
                        </div>
                        <div class="progress" style="height:8px">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" th:style="'width:' + ${(dto.totalProgress ?: 0)} + '%'"></div>
                        </div>
                    </div>

                    <div class="list-group" id="checkList">
                        <div class="list-group-item d-flex justify-content-between align-items-center border-0 px-0" th:each="check : ${checkList}">
                            <div>
                                <div class="fw-semibold small" th:text="${check.title}">제목</div>
                                <small class="text-muted" style="font-size: 0.7rem;" th:text="${check.deadline != null ? #temporals.format(check.deadline,'MM.dd HH:mm') : '마감미정'}"></small>
                            </div>
                            <div class="d-flex align-items-center">
                                <a th:if="${dto.leaderUsername == #authentication.name}" th:href="@{/team/check/delete/{cid}(cid=${check.id})}" class="text-danger me-2" onclick="return confirm('삭제하시겠습니까?');"><i class="bi bi-x-circle-fill"></i></a>
                                <input type="checkbox" class="form-check-input progress-check" th:data-id="${check.id}" th:checked="${check.checked}" th:disabled="${dto.leaderUsername != #authentication.name}" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid"><button class="btn btn-light border py-3 shadow-sm"><i class="bi bi-megaphone me-2"></i> 홍보 및 공유하기</button></div>
        </div>
    </div>

    <div class="modal fade" id="createCheckModal" tabindex="-1" sec:authorize="isAuthenticated()">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/team/createCheck/{id}(id=${dto.id})}" method="post">
                    <div class="modal-header"><h5 class="modal-title fw-bold">새 계획 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3"><label class="form-label fw-semibold">제목</label><input type="text" name="title" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">마감 기한</label><input type="datetime-local" name="deadline" class="form-control"></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-primary">추가하기</button></div>
                </form>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const token = document.querySelector('meta[name="_csrf"]')?.content;
        const header = document.querySelector('meta[name="_csrf_header"]')?.content;
        const checkboxes = document.querySelectorAll(".progress-check");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");

        function updateProgress() {
            const total = checkboxes.length;
            const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
            const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
            progressBar.style.width = percent + "%";
            progressText.innerText = percent + "%";
        }

        checkboxes.forEach(cb => {
            cb.addEventListener("change", function () {
                updateProgress();
                fetch("/team/check/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", [header]: token },
                    body: JSON.stringify({ id: this.dataset.id, checked: this.checked })
                }).catch(err => console.error(err));
            });
        });
        updateProgress();
    });
    </script>
</div>
</html>
