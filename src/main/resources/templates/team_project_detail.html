<html layout:decorate="~{layout}">
<div class="container my-5" layout:fragment="content">

    <!-- 프로젝트 헤더 -->
    <div class="row mb-5 pb-4 border-bottom align-items-end">

        <div class="col-md-8">

            <span class="badge bg-primary mb-2"
                  th:text="${dto.status != null ? dto.status : '모집 중'}">
            </span>

            <h1 class="fw-bold display-5"
                th:text="${dto.title != null ? dto.title : 'Platformer Game 개발 프로젝트'}">
            </h1>

            <p class="text-muted mb-0">

                <i class="bi bi-calendar-check"></i>
                시작일:
                <span th:text="${dto.createdAt != null ? #temporals.format(dto.createdAt,'yyyy.MM.dd') : '2026.02.12'}"></span>

                |

                <i class="bi bi-calendar-event"></i>
                종료일:
                <span th:text="${dto.endDate != null ? #temporals.format(dto.endDate,'yyyy.MM.dd') : '미정'}"></span>

            </p>

        </div>


        <!-- 버튼 -->
        <div class="col-md-4 text-md-end mt-3 mt-md-0">

            <button class="btn btn-outline-secondary me-2">
                <i class="bi bi-heart"></i> 1.2k
            </button>

            <a th:href="@{/team/{tid}/project/{id}/edit(tid=${dto.teamId},id=${dto.id})}"
               sec:authorize="isAuthenticated()"
               class="btn btn-outline-secondary me-2">
                수정하기
            </a>

        </div>
    </div>


    <div class="row">

        <!-- 왼쪽 -->
        <div class="col-lg-8">

            <!-- 대표 이미지 -->
            <img th:src="${dto.bannerImgUrl != null ? dto.bannerImgUrl : '/images/pic.png'}"
                 class="img-fluid rounded shadow-sm mb-5"
                 alt="프로젝트 대표 이미지"
                 style="width:100%; height:400px; object-fit:cover;">


            <!-- 프로젝트 소개 -->
            <section class="mb-5">

                <h4 class="fw-bold mb-4 border-bottom pb-2">
                    프로젝트 소개
                </h4>

                <div class="lh-lg text-secondary"
                     th:text="${dto.description != null ? dto.description : '프로젝트 설명이 없습니다.'}">
                </div>

            </section>


            <!-- 일러스트 (현재 더미 유지) -->
            <section class="mb-5">

                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">

                    <h4 class="fw-bold mb-0">
                        프로젝트 일러스트 업데이트
                    </h4>

                    <a th:href="@{/Illustration_list}"
                       class="btn btn-sm btn-outline-secondary">
                        전체 보기
                    </a>

                </div>

                <div class="row g-4">

                    <div class="col-6 col-md-4 col-lg-4">

                        <div class="card h-100 shadow-sm border-0 position-relative overflow-hidden">

                            <button class="btn btn-sm position-absolute top-0 end-0 m-2 text-white"
                                    style="background: rgba(0,0,0,0.4); border-radius:50%; width:32px; height:32px;">
                                <i class="bi bi-heart"></i>
                            </button>

                            <a th:href="@{/team_project_illust_detail}">
                                <img src="/images/pic.png"
                                     class="card-img-top"
                                     style="height:200px; object-fit:cover;">
                            </a>

                            <div class="card-body p-3">

                                <h6 class="card-title fw-bold text-truncate mb-2">
                                    여름날의 추억
                                </h6>

                                <div class="d-flex align-items-center">

                                    <img src="https://dummyimage.com/20x20/ced4da/6c757d"
                                         class="rounded-circle me-2">

                                    <span class="small text-muted">
                                        SummerRain
                                    </span>

                                </div>

                                <div class="mt-2 pt-2 border-top d-flex gap-3 text-muted"
                                     style="font-size:0.85rem">

                                    <span><i class="bi bi-eye"></i> 850</span>
                                    <span><i class="bi bi-heart-fill text-danger"></i> 120</span>

                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </section>

        </div>



        <!-- 오른쪽 -->
        <div class="col-lg-4">

            <!-- 팀 정보 -->
            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body">

                    <h5 class="fw-bold mb-4 border-bottom pb-2">
                        팀 정보
                    </h5>

                    <div class="d-flex align-items-center mb-3">

                        <img th:src="${dto.profileImgUrl != null ? dto.profileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}"
                             class="rounded-circle me-3"
                             style="width:40px;height:40px;object-fit:cover;">

                        <div>

                            <h6 class="mb-0 fw-bold"
                                th:text="${dto.teamName != null ? dto.teamName : 'Team Creatival'}">
                            </h6>

                            <small class="text-muted">
                                설립일:
                                <span th:text="${dto.teamCreatedAt != null ? #temporals.format(dto.teamCreatedAt,'yyyy.MM.dd') : '2025.10.01'}"></span>
                            </small>

                        </div>

                    </div>

                </div>
            </div>



            <!-- 진행도 -->
            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">

                        <h5 class="fw-bold mb-0">
                            프로젝트 진행도
                        </h5>

                        <a th:href="@{/team_project_file_upload}"
                           class="btn btn-sm btn-outline-primary">
                            파일 업로드
                        </a>

                    </div>


                    <div class="mb-4">

                        <div class="d-flex justify-content-between mb-1">

                            <small class="text-muted small">
                                전체 공정률
                            </small>

                            <small class="fw-bold text-primary"
                                   th:text="${dto.totalProgress + '%'}">
                            </small>

                        </div>

                        <div class="progress" style="height:8px">

                            <div class="progress-bar progress-bar-striped progress-bar-animated"
                                 role="progressbar"
                                 th:style="'width:' + ${dto.totalProgress} + '%'">
                            </div>

                        </div>

                    </div>

                </div>
            </div>


            <!-- 공유 -->
            <div class="d-grid gap-2">

                <button class="btn btn-light border py-3 text-start px-3">

                    <i class="bi bi-share me-2"></i>
                    프로젝트 공유하기

                </button>

            </div>

        </div>
    </div>
</div>
</html>
