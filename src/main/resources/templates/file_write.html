<html layout:decorate="~{layout}">
<div class="container-fluid" layout:fragment="content"> <style>
        .detail-container {
            /* max-width: 800px; 제거 -> col 클래스로 제어 */
            margin: 0 auto;
            position: relative;
        }
        
        /* 폭이 넓어졌을 때 뒤로가기 버튼이 너무 멀리 나가지 않게 조정 */
        .back-btn {
            position: absolute;
            left: 0; /* 폭이 넓으므로 안쪽 왼쪽 끝에 배치 */
            top: 0;
            font-size: 1.8rem;
            color: #333;
            text-decoration: none;
            z-index: 10;
        }

        .input-title {
            font-size: 2.2rem; /* 조금 더 시원하게 크기 키움 */
            font-weight: bold;
            border: none;
            outline: none;
            width: 100%;
            text-align: center;
            background: transparent;
            padding: 0 50px; /* 뒤로가기 버튼과 겹치지 않게 여백 */
        }
        
        .input-content {
            border: none;
            outline: none;
            width: 100%;
            min-height: 300px; /* 입력창 높이 확보 */
            text-align: center;
            font-size: 1.15rem;
            font-weight: 500;
            background: transparent;
            resize: none;
        }

        /* 파일 프리뷰 박스 - 화면이 넓으니 조금 더 키워도 좋아 */
        .file-preview-box {
            background-color: #eaebf3; /* 카테고리 아이콘 배경과 통일감 */
            width: 160px;
            height: 120px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 8px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
            vertical-align: top;
            border: 2px dashed #6a76ab; /* 점선으로 '추가' 느낌 강조 */
        }
        .file-preview-box:hover {
            background-color: #daddf0;
            transform: scale(1.02);
        }
        
        .section-divider {
            border: none;
            border-top: 2px solid #ffcec5; /* 리스트 페이지와 통일된 살구색 선 */
            margin: 40px 0;
        }

        .btn-action {
            background-color: #323b6d;
            color: white;
            padding: 12px 60px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        @media (max-width: 992px) {
            .back-btn { position: static; display: inline-block; margin-bottom: 20px; }
            .input-title { padding: 0; }
        }
    </style>

    <main class="py-5">
        <form th:action="@{/upload}" method="post" enctype="multipart/form-data" 
              class="detail-container col-11 col-lg-10">
            
            <a href="javascript:history.back()" class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="text-center pt-2">
                <input type="text" name="title" class="input-title" placeholder="제목을 입력하세요" required>
                <div class="user-info mt-3">
                    <span class="user-id fw-medium text-secondary">나네참새(현재 사용자 아이디)</span> 
                </div>
                <hr class="section-divider">
            </div>

            <div class="content-area text-center">
                <textarea name="content" class="input-content" placeholder="내용을 입력하세요" required></textarea>
            </div>

            <hr class="section-divider">

            <div class="text-center mb-5">
                <p class="small fw-bold mb-3" style="color: #6a76ab;">첨부파일 추가 (클릭하여 파일 선택)</p>
                
                <input type="file" id="fileInput" name="files" multiple class="d-none" onchange="handleFileSelect(this)">
                
                <div id="preview-list" class="d-flex justify-content-center gap-2 flex-wrap">
                    <div class="file-preview-box rounded-3" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-plus-lg fs-1 text-primary" style="color: #6a76ab !important;"></i>
                    </div>
                </div>

                <div class="mt-5 mx-auto" style="max-width: 500px;">
                    <input type="text" name="tags" class="form-control border-0 text-center text-primary" 
                           placeholder="#태그 #입력 (쉼표나 공백으로 구분)" 
                           style="background: #f8f9fa; border-radius: 20px;">
                </div>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-action">등록 완료</button>
            </div>
        </form>
    </main>

    <script>
        function handleFileSelect(input) {
            const previewList = document.getElementById('preview-list');
            // 기본 '플러스' 박스 유지하면서 앞에 추가
            const plusBox = `
                <div class="file-preview-box rounded-3" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-plus-lg fs-1 text-primary" style="color: #6a76ab !important;"></i>
                </div>`;
            
            previewList.innerHTML = plusBox;

            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const box = document.createElement('div');
                        box.className = 'file-preview-box rounded-3';
                        if (file.type.startsWith('image/')) {	
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            box.appendChild(img);
                        } else {
                            box.innerHTML = `<i class="bi bi-file-earmark-arrow-up fs-1 text-muted"></i>`;
                        }
                        previewList.prepend(box);
                    };
                    reader.readAsDataURL(file);
                });
            }
        }
    </script>
</div>
</html>
