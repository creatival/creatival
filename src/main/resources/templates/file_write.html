<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">
    <style>
        .detail-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: -50px;
            top: 10px;
            font-size: 1.5rem;
            color: #333;
            text-decoration: none;
        }
        /* 입력창 디자인 커스텀 (디자인 유지) */
        .input-title {
            font-size: 2rem;
            font-weight: bold;
            border: none;
            outline: none;
            width: 100%;
            text-align: center;
            background: transparent;
        }
        .input-content {
            border: none;
            outline: none;
            width: 100%;
            min-height: 200px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            background: transparent;
            resize: none;
        }
        .user-info {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .section-divider {
            border: none;
            border-top: 1px solid #dee2e6;
            margin: 40px 0;
        }
        /* 파일 선택 박스 스타일 */
        .file-preview-box {
            background-color: #e0e0e0;
            width: 150px;
            height: 100px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            cursor: pointer;
            overflow: hidden;
            transition: background 0.2s;
            vertical-align: top;
        }
        .file-preview-box:hover {
            background-color: #d0d0d0;
        }
        .file-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-action {
            background-color: #323b6d;
            color: white;
            padding: 10px 40px;
            border: none;
            border-radius: 4px;
        }
        .btn-action:hover {
            background-color: #242a50;
            color: white;
        }
        
        @media (max-width: 992px) {
            .back-btn { position: static; display: block; margin-bottom: 20px; }
        }
    </style>

    <main class="py-5">
        <form th:action="@{/upload}" method="post" enctype="multipart/form-data" class="detail-container">
            <a href="javascript:history.back()" class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="text-center">
                <input type="text" name="title" class="input-title" placeholder="제목을 입력하세요" required>
                <div class="user-info mt-2">
                    <span class="user-id">현재 사용자 아이디</span> 
                </div>
                <hr class="section-divider">
            </div>

            <div class="content-area text-center">
                <textarea name="content" class="input-content" placeholder="내용을 입력하세요 (그거거)" required></textarea>
            </div>

            <hr class="section-divider">

            <div class="text-center mb-5">
                <p class="small fw-bold mb-3">첨부파일 추가 (클릭하여 파일 선택)</p>
                
                <input type="file" id="fileInput" name="files" multiple class="d-none" onchange="handleFileSelect(this)">
                
                <div id="preview-list" class="d-flex justify-content-center gap-2 flex-wrap">
                    <div class="file-preview-box rounded" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-plus-lg fs-2 text-white"></i>
                    </div>
                </div>

                <div class="mt-4">
                    <input type="text" name="tags" class="form-control border-0 text-center text-primary" placeholder="#태그 #입력 (쉼표나 공백으로 구분)">
                </div>
            </div>

            <hr class="section-divider">

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-action">등록 완료</button>
            </div>
        </form>
    </main>

    <script>
        function handleFileSelect(input) {
            const previewList = document.getElementById('preview-list');
            // 기존 미리보기 초기화 (필요에 따라 유지하고 싶으면 append 방식으로 변경 가능)
            previewList.innerHTML = `
                <div class="file-preview-box rounded" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-plus-lg fs-2 text-white"></i>
                </div>
            `;

            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const box = document.createElement('div');
                        box.className = 'file-preview-box rounded';
                        
                        // 이미지 파일이면 썸네일 표시, 아니면 아이콘 표시
                        if (file.type.startsWith('image/')) {
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            box.appendChild(img);
                        } else {
                            box.innerHTML = `<i class="bi bi-file-earmark-arrow-up fs-2 text-white"></i>`;
                        }
                        
                        previewList.prepend(box); // 새 파일을 리스트 앞에 추가
                    };
                    
                    reader.readAsDataURL(file);
                });
            }
        }
    </script>
</div>
</html>
