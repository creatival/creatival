<th:block th:fragment="commentItem(comment, depth, category, targetId)">
    <div th:if="${comment != null}" class="comment-item" th:classappend="${depth > 0} ? 'is-child' : ''">
        <div class="comment-main">
            <div class="comment-header d-flex align-items-center gap-2 mb-1">
                <span class="fw-bold" style="font-size: 0.95rem;" th:text="${comment.displayname}">작성자</span>
                <span class="text-muted small" th:text="${#temporals.format(comment.createdAt,'yyyy.MM.dd HH:mm')}">시간</span>
            </div>

            <div class="comment-content mb-2" style="white-space: pre-wrap; font-size: 0.9rem;" th:text="${comment.text}">
                댓글 내용
            </div>

            <div class="comment-footer d-flex align-items-center gap-3 mb-2">
                <span class="text-muted small">좋아요 <span th:text="${comment.likeCount ?: 0}">0</span></span>
                <div class="action-buttons d-flex gap-2">
                    <button type="button" class="btn-action" onclick="toggleReplyForm(this)">답글</button>
                    
                    <th:block th:if="${comment.username == #authentication.name}">
                        <button type="button" class="btn-action" onclick="toggleEditForm(this)">수정</button>
						<button type="button"
						        class="btn-action btn-delete"
						        th:data-id="${comment.id}"
						        th:data-category="${category}"
						        onclick="confirmDelete(this)">
						    삭제
						</button>
                    </th:block>
                </div>
            </div>
			<!--업데이트-->
			<div th:if="${comment.username == #authentication.name}" class="edit-form-container" style="display: none; margin-bottom: 1rem;">
			    <form th:action="@{/comment/{cat}/update/{id}(cat=${category}, id=${comment.id})}" method="post" class="p-2 border rounded bg-light">
			        <input type="hidden" name="targetId" th:value="${targetId}">
			        <textarea name="text" class="form-control form-control-sm mb-2" rows="2" th:text="${comment.text}"></textarea>
			        <div class="d-flex justify-content-end gap-2">
			            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleEditForm(this)">취소</button>
			            <button type="submit" class="btn btn-primary btn-sm">저장</button>
			        </div>
			    </form>
			</div>
			<!--답글-->
			<div class="reply-form-container" style="display: none; margin-bottom: 1rem;">
			    <form th:action="@{/comment/{cat}/reply/write/{id}(cat=${category}, id=${comment.id})}" method="post" class="p-2 border rounded bg-light">
			        <input type="hidden" name="parentId" th:value="${comment.id}">
			        <textarea name="text" class="form-control form-control-sm mb-2" rows="2" placeholder="답글을 남겨보세요..." required></textarea>
			        <div class="d-flex justify-content-end gap-2">
			            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleReplyForm(this)">취소</button>
			            <button type="submit" class="btn btn-primary btn-sm">등록</button>
			        </div>
			    </form>
			</div>
        </div>

        <div th:if="${comment.children != null and !comment.children.isEmpty()}" class="reply-wrapper">
            <th:block th:each="child : ${comment.children}">
                <div th:replace="~{ :: commentItem(comment=${child}, depth=${depth + 1}, category=${category}, targetId=${targetId})}"></div>
            </th:block>
        </div>
    </div>
	<script>
			// 1. 답글 폼 토글
			/**
			 * 모든 열려있는 폼(답글/수정)을 닫고 UI를 원상복구합니다.
			 */
			function closeAllForms() {
			    // 1. 모든 답글 폼 숨기기
			    document.querySelectorAll('.reply-form-container').forEach(el => {
			        el.style.display = 'none';
			    });
			    
			    // 2. 모든 수정 폼 숨기기
			    document.querySelectorAll('.edit-form-container').forEach(el => {
			        el.style.display = 'none';
			    });
			    
			    // 3. 숨겨졌던 댓글 본문(content)과 버튼 영역(footer) 다시 보이게 하기
			    document.querySelectorAll('.comment-content').forEach(el => {
			        el.style.display = 'block';
			    });
			    document.querySelectorAll('.comment-footer').forEach(el => {
			        el.style.display = 'flex';
			    });
			}

			/**
			 * 답글 작성 폼 토글
			 */
			function toggleReplyForm(button) {
			    const commentItem = button.closest('.comment-item');
			    const formContainer = commentItem.querySelector('.reply-form-container');
			    
			    // 현재 이 폼이 열려있는지 확인
			    const isCurrentlyVisible = formContainer.style.display === 'block';

			    // 일단 페이지 내 모든 폼을 닫음
			    closeAllForms();

			    // 이전에 닫혀있었다면, 현재 누른 댓글의 답글 폼만 열기
			    if (!isCurrentlyVisible) {
			        formContainer.style.display = 'block';
			        const textarea = formContainer.querySelector('textarea');
			        if (textarea) textarea.focus();
			    }
			}

			/**
			 * 수정 폼 토글
			 */
			function toggleEditForm(button) {
			    const commentItem = button.closest('.comment-item');
			    const contentDiv = commentItem.querySelector('.comment-content');
			    const footerDiv = commentItem.querySelector('.comment-footer');
			    const editForm = commentItem.querySelector('.edit-form-container');
			    
			    // 현재 이 수정 폼이 열려있는지 확인
			    const isCurrentlyVisible = editForm.style.display === 'block';

			    // 일단 페이지 내 모든 폼을 닫음 (다른 댓글 수정 중이었거나 답글 폼 열려있던 것 포함)
			    closeAllForms();

			    // 이전에 닫혀있었다면, 현재 댓글의 수정 모드 활성화
			    if (!isCurrentlyVisible) {
			        if (contentDiv) contentDiv.style.display = 'none';
			        if (footerDiv) footerDiv.style.display = 'none';
			        editForm.style.display = 'block';
			        const textarea = editForm.querySelector('textarea');
			        if (textarea) textarea.focus();
			    }
			}

			/**
			 * 댓글 삭제 확인 및 요청
			 * Thymeleaf Exception 방지를 위해 data-attribute를 사용합니다.
			 */
			 function confirmDelete(button) {
			     const id = button.dataset.id;
			     const category = button.dataset.category;

			     if (!id || !category) {
			         console.error("삭제에 필요한 데이터가 없습니다.");
			         return;
			     }

			     if (confirm("정말 삭제하시겠습니까?")) {
			         location.href = `/comment/${category}/delete/${id}`;
			     }
			 }
		</script>
</th:block>
