<html layout:decorate="~{layout}">
<div class="container my-5" layout:fragment="content">
    
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <h2 class="fw-bold mb-0">비디오</h2>
            <p class="text-muted mb-0 mt-2">다양한 크리에이터의 영상을 만나보세요.</p>
        </div>
        
        <div class="d-flex gap-3 align-items-center">
            <a onclick="return requireLoginAction(() => location.href='/content/video/create')" class="btn btn-primary d-flex align-items-center px-3 shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>
                <span class="fw-bold">동영상 등록</span>
            </a>

            <div class="d-none d-sm-block">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio1">최신순</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio2">인기순</label>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="video : ${list}">
            <a th:href="@{/content/video/detail/{id}(id=${video.id})}" class="text-decoration-none text-dark">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="ratio ratio-16x9 position-relative bg-dark rounded-top overflow-hidden">
                        <img th:src="${video.thumbnailUrl}" class="object-fit-cover" alt="비디오 썸네일">
                        
                        </div>
                    
                    <div class="card-body p-3">
                        <div class="d-flex align-items-start">
                            <img th:src="${video.profileImgUrl!=null ? video.profileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}" class="rounded-circle me-3 mt-1" alt="채널 로고" style="width: 36px; height: 36px;">
                            
                            <div class="overflow-hidden">
                                <h6 class="card-title fw-bold text-truncate mb-1" th:text="${video.title}">유니티로 2D 플랫포머 게임 만들기 1편</h6>
                                <p class="text-muted small mb-0 text-truncate" th:text="${video.displayname}">Creatival_Official</p>
                                <p class="text-muted small mb-0">
                                    조회수 <span th:text="${video.viewCount}">0</span>회 • <span th:text="${video.formattedDate}"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <nav aria-label="Page navigation" th:if="${!list.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1" aria-disabled="true">이전</a>
            </li>
            <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
                <a class="page-link" href="#">다음</a>
            </li>
        </ul>
    </nav>

</div>
</html>
