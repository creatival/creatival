<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
	
<head>
    <title>게시글 작성 | Creatival</title>
	<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
	<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
</head>

<div layout:fragment="content">
    <style>
        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --bg-light: #F8F9FA;
            --border-color: #E9ECEF;
        }

        .write-container {
            max-width: 960px;
            margin: 3rem auto 5rem;
            padding: 0 20px;
        }

        /* 상단 헤더 */
        .write-header {
            margin-bottom: 2.5rem;
            border-left: 5px solid var(--brand-navy);
            padding-left: 20px;
        }
        .write-header h2 {
            font-weight: 800;
            color: var(--brand-navy);
            margin-bottom: 5px;
        }
        .write-header p { color: #777; margin-bottom: 0; }

        /* 카드 스타일 */
        .write-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--brand-navy);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--brand-orange); font-size: 1.2rem; }

        /* 폼 요소 디자인 */
        .form-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 10px;
        }
        .form-control, .form-select {
            border: 1.5px solid #E5E5E5;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-navy);
            box-shadow: 0 0 0 4px rgba(59, 67, 113, 0.1);
            outline: none;
        }

        /* 작성자 정보 바 */
        .author-box {
            background-color: #F9FAFF;
            border: 1px solid #EEF0FF;
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .author-box img { width: 32px; height: 32px; object-fit: cover; }

        /* 연관 리소스 영역 (ID 입력) */
        .resource-group {
            background: #fdfdfd;
            border: 1px dashed #ddd;
            border-radius: 12px;
            padding: 20px;
        }
        .preview-box {
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 20px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 파일 리스트 스타일 */
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #eee;
        }
        .btn-remove-file {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
        }

        /* 버튼 그룹 */
        .btn-group-custom {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 2.5rem;
        }
        .btn-creativ {
            padding: 15px 40px;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .btn-cancel { background: #eee; color: #555; border: none; text-decoration: none; text-align: center; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-submit { background: var(--brand-navy); color: #fff; border: none; }
        .btn-submit:hover { background: #2c3359; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(59,67,113,0.25); }

        .divider { height: 1px; background: #f0f0f0; margin: 2.5rem 0; }
    </style>

    <div class="write-container">
        <div class="write-header">
            <h2>팀 게시글 작성</h2>
            <p>팀원들과 공유하고 싶은 새로운 프로젝트 소식이나 공지사항을 작성해주세요.</p>
        </div>

        <form th:action="@{/board/write}" method="post" enctype="multipart/form-data">
            <div class="write-card">
                
                <div class="row g-4 mb-2">
                    <div class="col-md-6">
                        <label class="form-label">카테고리 선택</label>
                        <select class="form-select" name="boardType">
                            <option value="NORMAL" selected>팀 게시판 (일반 프로젝트 소식)</option>
                            <option value="CREATOR">공지사항 (전체 팀원 필독)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">작성자</label>
                        <div class="author-box">
                            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="rounded-circle">
                            <span class="fw-bold text-dark" th:text="${#authentication.name}">사용자명</span>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="section-title"><i class="bi bi-box-seam-fill"></i> 연관 리소스 연결 <small class="text-muted fw-normal">(선택)</small></div>
                <div class="resource-group">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">컨텐츠 ID</label>
                            <input type="number" class="form-control" name="contentId" id="contentId" placeholder="ID 입력" oninput="debouncedFetchInfo('content', this.value)">
                            <div id="contentPreview" class="preview-box"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">프로젝트 ID</label>
                            <input type="number" class="form-control" name="projectId" id="projectId" placeholder="ID 입력" oninput="debouncedFetchInfo('project', this.value)">
                            <div id="projectPreview" class="preview-box"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">팀 ID</label>
                            <input type="number" class="form-control" name="teamId" id="teamId" placeholder="ID 입력" oninput="debouncedFetchInfo('team', this.value)">
                            <div id="teamPreview" class="preview-box"></div>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="section-title"><i class="bi bi-pencil-square"></i> 게시글 내용 작성</div>
                <div class="mb-4">
                    <label class="form-label">제목</label>
                    <input type="text" class="form-control form-control-lg" name="title" placeholder="제목을 입력해 주세요" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">상세 내용</label>
                    <textarea class="form-control" id="contentArea" name="boardText" style="min-height: 300px; resize: none;" 
                              placeholder="내용을 입력해 주세요. HTML이나 마크다운 형식은 지원되지 않습니다."></textarea>
                </div>

                <div class="mb-0">
                    <label class="form-label"><i class="bi bi-paperclip me-1"></i> 파일 첨부 <small class="text-muted">(이미지, 영상 최대 3개)</small></label>
                    <div id="fileInputs">
                        <input class="form-control" type="file" name="images" accept="image/*,video/*" multiple id="file_input" onchange="handleFileSelect(this)">
                    </div>
                    <div id="fileList" class="mt-2"></div>
                </div>
            </div>

            <div class="btn-group-custom">
                <a th:href="@{/board}" class="btn btn-creativ btn-cancel">돌아가기</a>
                <button type="submit" class="btn btn-creativ btn-submit">게시글 등록하기</button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        let debounceTimer;

        // 리소스 정보 가져오기 (Debounce 적용)
        function debouncedFetchInfo(type, id) {
            const preview = document.getElementById(type + 'Preview');
            clearTimeout(debounceTimer);
            
            if(!id) { preview.innerHTML = ""; return; }
            
            preview.innerHTML = '<small class="text-muted"><span class="spinner-border spinner-border-sm me-1"></span>조회 중...</small>';
            
            debounceTimer = setTimeout(() => {
                fetch(`/board/info/${type}?id=${id}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.name) {
                            preview.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> <strong class="text-dark">${data.name}</strong>`;
                        } else {
                            preview.innerHTML = `<i class="bi bi-exclamation-circle-fill text-danger"></i> 존재하지 않는 ID`;
                        }
                    })
                    .catch(() => { 
                        preview.innerHTML = `<i class="bi bi-x-circle-fill text-danger"></i> 조회 실패`;
                    });
            }, 500);
        }

        // 파일 선택 처리
        function handleFileSelect(input) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            if (input.files.length > 3) {
                alert("파일은 최대 3개까지만 첨부할 수 있습니다.");
                input.value = "";
                return;
            }

            Array.from(input.files).forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span><i class="bi bi-file-earmark-check me-2"></i>${file.name} <small class="text-muted">(${Math.round(file.size/1024)}KB)</small></span>
                    <i class="bi bi-check2 text-success"></i>
                `;
                fileList.appendChild(item);
            });
        }
    </script>
</th:block>
</html>
