<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<div class="container my-5" layout:fragment="content">
    <style>
        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
        .icon-box {
            width: 80px; height: 80px; background-color: #F8F9FA;
            border-radius: 22px; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #eee; transition: all 0.3s ease;
        }
        .category-icon-img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 18px; transition: transform 0.3s ease;
        }
        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }
        .category-item .fw-bold { color: #3B4371; font-size: 0.95rem; transition: color 0.3s ease; }
        
        /* 음악 카드 호버 효과 */
        .card:hover .hover-overlay { opacity: 1 !important; }
        .object-fit-cover { object-fit: cover; }
    </style>
    
    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 justify-content-center">
                <div class="col-4 col-md-2">
                    <a th:href="@{/Illustration_list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img" alt="일러스트"></div>
                        <div class="fw-bold">일러스트</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/comic_list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/comic.png}" class="category-icon-img" alt="만화"></div>
                        <div class="fw-bold">만화</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/video_list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오"></div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel_list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img" alt="소설"></div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/file_list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/folder.png}" class="category-icon-img" alt="파일"></div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>
            </div>
        </div>
    </section>
    
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <h2 class="fw-bold mb-0">음악</h2>
            <p class="text-muted mb-0 mt-2">다양한 장르의 음악을 감상해 보세요.</p>
        </div>
        
        <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-outline-dark d-flex align-items-center px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#keyRegisterModal">
                <i class="bi bi-key-fill me-2"></i>
                <span class="fw-bold">코드 등록</span>
            </button>

            <a onclick="return requireLoginAction(() => location.href='/content/music/write')" class="btn btn-primary d-flex align-items-center px-3 shadow-sm">
                <i class="bi bi-music-note-list me-2"></i>
                <span class="fw-bold">음악 등록</span>
            </a>

            <div class="d-none d-sm-block ms-1">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio1">최신순</label>
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio2">인기순</label>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div th:if="${#lists.isEmpty(musicList)}" class="col-12 text-center py-5">
            <p class="text-muted">등록된 음악이 없습니다.</p>
        </div>

        <div class="col-6 col-md-4 col-lg-3" th:each="music : ${musicList}">
            <a th:href="@{|/content/music/detail/${music.id}|}" class="text-decoration-none text-dark">
                <div class="card border-0 shadow-sm h-100">
                    <div class="ratio ratio-1x1 position-relative bg-light rounded-top overflow-hidden">
                        <img th:src="${music.thumbnailUrl != null ? music.thumbnailUrl : 'https://dummyimage.com/400x400/ced4da/6c757d&text=No+Image'}" 
                             class="object-fit-cover" th:alt="${music.title}">
                        
                        <div class="position-absolute w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-25 opacity-0 hover-overlay" style="transition: opacity 0.2s;">
                            <i class="bi bi-play-circle-fill text-white" style="font-size: 3rem;"></i>
                        </div>
                        
                        <span th:if="${music.projectName != null}" class="badge bg-primary position-absolute top-0 start-0 m-2 z-1" th:text="${music.projectName}">프로젝트명</span>
                    </div>
                    
                    <div class="card-body p-3 text-center">
                        <h6 class="card-title fw-bold text-truncate mb-1" th:text="${music.title}">곡 제목</h6>
                        <p class="text-muted small mb-0 text-truncate" th:text="${music.displayname}">작성자</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="modal fade" id="keyRegisterModal" tabindex="-1" aria-labelledby="keyRegisterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold" id="keyRegisterModalLabel" style="color: #3B4371;">제품 코드 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <i class="bi bi-controller text-muted" style="font-size: 3rem;"></i>
                    <p class="mt-3 mb-4 text-muted small">
                        보유하고 계신 제품 코드(16자리)를 입력해 주세요.<br>
                        (예: ABCD-EFGH-IJKL-MNOP)
                    </p>
                    <input type="text" id="productKeyInput" class="form-control form-control-lg text-center font-monospace" 
                           placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19">
                </div>
                <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn text-white px-4" style="background-color: #f05a28;" onclick="submitProductKey()">코드 활성화</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const keyInput = document.getElementById('productKeyInput');
            if (keyInput) {
                keyInput.addEventListener('input', function (e) {
                    let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    let result = '';
                    for (let i = 0; i < val.length; i++) {
                        if (i > 0 && i % 4 === 0) result += '-';
                        result += val[i];
                    }
                    e.target.value = result;
                });
            }
        });

        function submitProductKey() {
            const keyInput = document.getElementById('productKeyInput');
            const val = keyInput.value;
            if(val.length < 19) {
                alert('코드를 정확히 입력해 주세요 (16자리).');
                return;
            }
            alert('코드 [' + val + '] 등록이 요청되었습니다.');
            
            const modalElement = document.getElementById('keyRegisterModal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) {
                modalInstance.hide();
            }
            keyInput.value = '';
        }
    </script>
</div>
</html>
