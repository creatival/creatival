<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<div class="container my-5" layout:fragment="content">
	<style>
			.category-item { 
					        transition: all 0.3s ease; 
					        text-decoration: none !important;
					    }
					    
					    .icon-box {
					        width: 80px; 
					        height: 80px; 
					        background-color: #F8F9FA; /* 기본 연회색 배경 */
					        border-radius: 22px;
					        margin: 0 auto 12px; 
					        display: flex; 
					        align-items: center; 
					        justify-content: center;
					        overflow: hidden;
					        border: 1px solid #eee;
					        transition: all 0.3s ease;
					    }

					    .category-icon-img {
					        width: 100%;       
					        height: 100%;      
					        object-fit: contain; 
					        padding: 18px; /* 아이콘 크기 통일 */
					        transition: transform 0.3s ease;
					    }

					    /* 호버 시 디자인 변경: Creatival 오렌지색 적용 */
					    .category-item:hover { 
					        transform: translateY(-8px); 
					    }
					    
					    .category-item:hover .category-icon-img {
					        transform: scale(1.1); /* 아이콘 살짝 확대 */
					    }

					    .category-item .fw-bold {
					        color: #3B4371; /* 브랜드 네이비 */
					        font-size: 0.95rem;
					        transition: color 0.3s ease;
					    }
		</style>
		
		<section class="py-5 bg-white">
		    <div class="container">
		        <div class="row text-center g-4 justify-content-center">
		            
		            <div class="col-4 col-md-2">
		                <a th:href="@{/Illustration_list}" class="category-item d-block">
		                    <div class="icon-box">
		                        <img th:src="@{/images/paint.png}" class="category-icon-img" alt="일러스트">
		                    </div>
		                    <div class="fw-bold">일러스트</div>
		                </a>
		            </div>

		            <div class="col-4 col-md-2">
		                <a th:href="@{/comic_list}" class="category-item d-block">
		                    <div class="icon-box">
		                        <img th:src="@{/images/comic.png}" class="category-icon-img" alt="만화">
		                    </div>
		                    <div class="fw-bold">만화</div>
		                </a>
		            </div>


		            <div class="col-4 col-md-2">
		                <a th:href="@{/video_list}" class="category-item d-block">
		                    <div class="icon-box">
		                        <img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오">
		                    </div>
		                    <div class="fw-bold">비디오</div>
		                </a>
		            </div>

		            <div class="col-4 col-md-2">
		                <a th:href="@{/content/novel_list}" class="category-item d-block">
		                    <div class="icon-box">
		                        <img th:src="@{/images/git.png}" class="category-icon-img" alt="소설">
		                    </div>
		                    <div class="fw-bold">소설</div>
		                </a>
		            </div>

		            <div class="col-4 col-md-2">
		                <a th:href="@{/file_list}" class="category-item d-block">
		                    <div class="icon-box">
		                        <img th:src="@{/images/folder.png}" class="category-icon-img" alt="파일">
		                    </div>
		                    <div class="fw-bold">파일</div>
		                </a>
		            </div>

		        </div>
		    </div>
		</section>
    
    <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
        <div>
            <h2 class="fw-bold mb-0">음악</h2>
            <p class="text-muted mb-0 mt-2">다양한 장르의 음악을 감상해 보세요.</p>
        </div>
        
        <div class="d-flex gap-3 align-items-center">
            <a th:href="@{/music_write}" class="btn btn-primary d-flex align-items-center px-3 shadow-sm">
                <i class="bi bi-music-note-list me-2"></i>
                <span class="fw-bold">음악 등록</span>
            </a>

            <div class="d-none d-sm-block">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio1">최신순</label>
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-secondary btn-sm" for="btnradio2">인기순</label>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/music_detail}" class="text-decoration-none text-dark">
                <div class="card border-0 shadow-sm h-100">
                    <div class="ratio ratio-1x1 position-relative bg-light rounded-top overflow-hidden">
                        <img src="images/album1.png" class="object-fit-cover" alt="앨범 커버" onerror="this.src='https://dummyimage.com/400x400/ced4da/6c757d&text=Album'">
                        <div class="position-absolute w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-25 opacity-0 hover-overlay" style="transition: opacity 0.2s;">
                            <i class="bi bi-play-circle-fill text-white" style="font-size: 3rem;"></i>
                        </div>
                        <span class="badge bg-dark position-absolute bottom-0 end-0 m-2 z-1">03:45</span>
                    </div>
                    
                    <div class="card-body p-3 text-center">
                        <h6 class="card-title fw-bold text-truncate mb-1">여름 밤의 산책</h6>
                        <p class="text-muted small mb-0 text-truncate">인디 밴드 A</p>
                    </div>
                </div>
            </a>
        </div>
        
        <div class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/music_detail}" class="text-decoration-none text-dark">
                <div class="card border-0 shadow-sm h-100">
                    <div class="ratio ratio-1x1 position-relative bg-light rounded-top overflow-hidden">
                        <img src="images/album2.png" class="object-fit-cover" alt="앨범 커버" onerror="this.src='https://dummyimage.com/400x400/adb5bd/495057&text=Album'">
                    </div>
                    <div class="card-body p-3 text-center">
                        <h6 class="card-title fw-bold text-truncate mb-1">Lo-Fi Study Beats</h6>
                        <p class="text-muted small mb-0 text-truncate">Chill Creator</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <nav aria-label="Page navigation">
        </nav>
</div>
<style>
    .card:hover .hover-overlay { opacity: 1 !important; }
</style>
</html>
