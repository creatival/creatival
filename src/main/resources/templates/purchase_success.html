<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>구매 완료</title>
    <meta charset="UTF-8">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .success-container {
            max-width: 500px;
            margin: 120px auto;
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 60px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .desc {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-primary {
            background: #3B4371;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2a3152;
        }

        .btn-secondary {
            margin-top: 10px;
            background: #eee;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        .countdown {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>

<body>

<div class="success-container">
    <div class="icon">✔</div>

    <div class="title">구매가 완료되었습니다!</div>

    <div class="desc">
        이제 해당 콘텐츠를 자유롭게 열람할 수 있습니다.
    </div>

    <a th:href="${redirectUrl}" class="btn btn-primary">
        콘텐츠 바로 보기
    </a>

    <div>
        <a href="/" class="btn btn-secondary">
            홈으로 이동
        </a>
    </div>

    <div class="countdown">
        5초 후 자동으로 이동합니다...
    </div>
</div>

<script th:inline="javascript">
    const redirectUrl = [[${redirectUrl}]];
    setTimeout(function () {
        window.location.href = redirectUrl;
    }, 5000);
</script>

</body>
</html>
