<html layout:decorate="~{layout}">
	<head>
			<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
			<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
	</head>
<div class="container" layout:fragment="content">
<body>
    <div class="container mt-5" style="max-width: 700px;">
        <h2 class="mb-4 text-center">팀 해체</h2>

        <form method="post" th:action="@{/team/{id}/delete(id=${team.id})}" id="deleteForm">
            <div class="text-center">
                <h2 class="text-danger"><b>정말 팀을 해체하시겠습니까?</b></h2>
                <p>영구 삭제된 이후에는 <b>절대로 복구할 수 없습니다.</b></p>
                <br /><br />
                <p>위 위험 요소를 모두 확인하셨으며, 정말 팀을 해체하시겠습니까?</p>
            </div>

            <div class="form-check mb-4 mt-5 d-flex justify-content-center">
                <div>
                    <input class="form-check-input" type="checkbox" id="confirmDelete" name="confirmDelete">
                    <label class="form-check-label" for="confirmDelete">
                        위 내용을 모두 확인하였으며, 팀 해체에 동의합니다.
                    </label>
                </div>
            </div>

            <div class="text-center">
                <button type="button" id="deleteBtn" class="btn btn-danger btn-lg w-100" disabled>팀 해체하기</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const checkbox = document.getElementById('confirmDelete');
            const deleteBtn = document.getElementById('deleteBtn');
            const deleteForm = document.getElementById('deleteForm');

            // 1. 체크박스 상태에 따라 버튼 활성화/비활성화
            checkbox.addEventListener('change', function() {
                deleteBtn.disabled = !this.checked;
            });

            // 2. 버튼 클릭 시 최종 확인 후 폼 전송
            deleteBtn.addEventListener('click', function() {
                const finalCheck = confirm("정말 팀을 해체하시겠습니까?\n이 작업은 되돌릴 수 없습니다.");
                
                if (finalCheck) {
                    deleteForm.submit();
                }
            });
        });
    </script>
</body>
</div>
</html>
