<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<div layout:fragment="content">

    <style>
		/* 댓글 전체 아이템 */
				.comment-item {
				    margin-bottom: 1rem;
				    position: relative;
				}

				/* 대댓글을 감싸는 컨테이너: 왼쪽 실선 */
				.reply-wrapper {
				    margin-left: 12px; /* 들여쓰기 */
				    border-left: 2px solid #edeff1; /* 레딧 특유의 연회색 선 */
				    padding-left: 20px; /* 선과 내용 사이 간격 */
				    margin-top: 5px;
				}

		/* 액션 버튼 스타일 (텍스트 형태) */
		.btn-action {
		    background: none;
		    border: none;
		    padding: 0;
		    font-size: 0.8rem;
		    font-weight: 700;
		    color: #878a8c;
		    cursor: pointer;
		}

		.btn-action:hover {
		    text-decoration: underline;
		    color: #1a1a1b;
		}

		.btn-delete {
		    color: #ff585b;
		}

		/* 입력 폼 스타일 */
		.reply-form-container textarea {
		    resize: none;
		    border-radius: 4px;
		}
        .art-viewer {
            background-color: #f8f9fa;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .art-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 4px;
			display: block;
			margin: 0 auto;
        }

        .artist-avatar {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
        }

        .art-tag {
            background-color: #e9ecef;
            color: #495057;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-right: 6px;
            display: inline-block;
        }

        .btn-navy-custom {
            background-color: #2D3278;
            color: white;
            border-radius: 30px;
        }

        .comment-section {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 40px 20px;
        }

        .comment-input {
            border: none !important;
            border-bottom: 1px solid #dee2e6 !important;
            background-color: transparent !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .comment-input:focus {
            border-bottom: 2px solid #2D3278 !important;
        }
    </style>

    <!-- 제목 -->
    <div class="container text-center mt-5 mb-4">
        <h3 class="fw-bold" th:text="${art.title}">작품 제목</h3>
    </div>

    <!-- 이미지 캐러셀 -->
    <div class="art-viewer w-100 mb-4">
        <div class="container" style="max-width: 800px;">
            <div id="artSlider" class="carousel slide">
                <div class="carousel-inner">
					
					<th:block th:if="${art.fileList != null and art.fileList.size() > 1}">
					    
					    <button class="carousel-control-prev"
					            type="button"
					            data-bs-target="#artSlider"
					            data-bs-slide="prev">
					        <span class="carousel-control-prev-icon"></span>
					    </button>

					    <button class="carousel-control-next"
					            type="button"
					            data-bs-target="#artSlider"
					            data-bs-slide="next">
					        <span class="carousel-control-next-icon"></span>
					    </button>

					</th:block>
                    <div th:each="file, iter : ${art.fileList}"
                         class="carousel-item"
                         th:classappend="${iter.first} ? 'active'">
                        <img th:src="${file.fileUrl}"
                             class="art-image"
                             th:alt="${art.title}">
                    </div>

                    <div th:if="${art.fileList == null or art.fileList.isEmpty()}"
                         class="carousel-item active">
                        <img src="https://dummyimage.com/800x500/dee2e6/6c757d.png&text=No+Image"
                             class="art-image">
                    </div>
                </div>
				<div class="carousel-indicators" style="position: relative; margin-top: 20px;">
                    <button th:each="file, iter : ${art.fileList}" type="button" data-bs-target="#artSlider" 
                            th:data-bs-slide-to="${iter.index}" th:classappend="${iter.first} ? 'active'" style="background-color: #333;"></button>
                </div>	
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">

        <!-- 설명 + 정보 -->
        <div class="mb-3">
            <div class="text-muted small mb-2">
                <span th:text="${#temporals.format(art.createdAt,'yyyy.MM.dd')}"></span>
                · 조회수 <span th:text="${art.viewCount}"></span>
            </div>

            <div class="mb-3"
                 style="white-space: pre-wrap;"
                 th:text="${art.description}">
            </div>

            <!-- 태그 -->
            <div class="mb-4">
                <div th:each="tag : ${tagList}" class="art-tag">
                    <span th:text="'#' + ${tag.tagText}"></span>

                    <a sec:authorize="isAuthenticated()"
                       th:if="${art.username == #authentication.name}"
                       th:href="@{/tag/art/deleteContentTag(tagId=${tag.id},contentId=${art.id})}"
                       onclick="return confirm('삭제하시겠습니까?');">
                        <i class="bi bi-x-circle-fill ms-1"></i>
                    </a>
                </div>

                <!-- 태그 추가 버튼 -->
                <button type="button"
                        sec:authorize="isAuthenticated()"
                        th:if="${art.username == #authentication.name}"
                        class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-2"
                        style="width:24px;height:24px;"
                        data-bs-toggle="modal"
                        data-bs-target="#tagAddModal">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
        </div>

        <!-- 수정/삭제 -->
        <div class="mb-4"
             sec:authorize="isAuthenticated()"
             th:if="${art.username == #authentication.name}">
            <a th:href="@{/content/art/update/{id}(id=${art.id})}"
               class="btn btn-outline-primary btn-sm me-2">수정</a>

            <a th:href="@{/content/art/delete/{id}(id=${art.id})}"
               onclick="return confirm('삭제하시겠습니까?');"
               class="btn btn-outline-danger btn-sm">삭제</a>
        </div>

        <!-- 작가 -->
        <div class="d-flex align-items-center py-3 border-top border-bottom mb-5">
            <img th:src="${art.profileImgUrl ?: 'https://dummyimage.com/50x50/ced4da/6c757d'}"
                 class="artist-avatar me-3">
            <h6 class="fw-bold mb-0"
                th:text="${art.displayname ?: art.username}">
            </h6>
        </div>
		<!-- 댓글 섹션 -->
		<div th:if="${art.isAllowComment}" class="comment-section">

		    <h5 class="text-center fw-bold mb-4">댓글</h5>

		    <!-- 댓글 작성 -->
		    <form th:action="@{/comment/content/write/{id}(id=${art.id})}"
		          method="post"
		          class="d-flex align-items-center justify-content-center mb-5">
		        
		        <div class="bg-secondary rounded-circle me-3"
		             style="width:40px;height:40px;"></div>

		        <input type="text"
		               name="text"
		               class="form-control comment-input me-3"
		               placeholder="댓글 쓰기"
		               style="max-width:500px;">

		        <button type="submit" class="btn btn-navy-custom px-4">작성</button>
		    </form>
			

		    <!-- 댓글 목록 -->
			<div class="comment-list">
			    <th:block th:each="comment : ${comments}">
			        <div th:replace="~{comment-line :: commentItem(comment=${comment}, depth=0, category='content', targetId=${art.id})}"></div>
			    </th:block>
			</div>

			
		</div>


    <!-- 태그 추가 모달 -->
    <div sec:authorize="isAuthenticated()"
         class="modal fade"
         id="tagAddModal"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/createContentArtTag/{id}(id=${art.id})}"
                      method="post">

                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text"
                                   name="tagName"
                                   class="form-control"
                                   required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit"
                                class="btn btn-primary btn-sm w-100">
                            추가
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
	<!-- JS -->
	
</div>
</html>
