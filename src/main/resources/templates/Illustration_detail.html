<html layout:decorate="~{layout}">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* [기존 디자인 유지] */
        .art-viewer {
            background-color: #f8f9fa;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        
        .art-image {
            max-width: 100%;
            max-height: 80vh; 
            object-fit: contain; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(1) grayscale(100); 
        }

        .artist-avatar {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .art-tag {
            color: #0d6efd; 
            font-size: 0.9rem;
            text-decoration: none;
            margin-right: 8px;
            display: inline-block;
        }
        
        .comment-section {
            background-color: #f1f3f5;
            border-radius: 12px;
            padding: 50px 20px;
        }
        .btn-navy {
            background-color: #2D3278;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<div layout:fragment="content">

    <div class="container text-center mt-5 mb-4">
        <h3 class="fw-bold" th:text="${art.title}">작품 제목</h3>
    </div>

    <div class="art-viewer w-100 mb-4">
        <div class="container" style="max-width: 800px;">
            <div id="artSlider" class="carousel slide" data-bs-ride="false">
                <div class="carousel-inner">
                    <div th:each="file, iter : ${art.fileList}" class="carousel-item" th:classappend="${iter.first} ? 'active'">
                        <img th:src="${file.fileUrl}" class="art-image">
                    </div>
                    <div th:if="${art.fileList == null or art.fileList.isEmpty()}" class="carousel-item active">
                        <img src="https://dummyimage.com/800x500/dee2e6/6c757d.png&text=No+Image" class="art-image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <a href="#" class="art-tag">#일러스트</a>
                <a th:if="${art.isFanWork}" class="art-tag">#2차창작</a>
                <div class="text-muted small mt-1" th:text="${art.description}">작품 설명</div>
            </div>
            <div class="d-flex gap-3 text-center">
                <div style="cursor:pointer;"><i class="bi bi-bookmark fs-4"></i><div class="small text-muted">북마크</div></div>
                <div style="cursor:pointer;"><i class="bi bi-star fs-4"></i><div class="small text-muted">추천하기</div></div>
            </div>
        </div>

        <div class="mb-4 small fw-bold">
            <span class="me-3">조회수 <span th:text="${art.viewCount}">0</span></span>
            <span>추천 0</span>
        </div>

        <div class="d-flex align-items-center py-3 border-bottom mb-5">
            <img th:src="${art.profileImgUrl ?: 'https://dummyimage.com/50x50/ced4da/6c757d'}" class="artist-avatar me-3">
            <h6 class="fw-bold mb-0" th:text="${art.displayname ?: art.username}">작가이름</h6>
        </div>

		<div class="comment-box-container mt-5">
		    <div class="comment-section p-4 p-md-5">
		        <h5 class="text-center fw-bold mb-4">댓글</h5>

		        <div class="comment-input-area d-flex align-items-center justify-content-center mb-5">
		            <div class="bg-secondary rounded-circle me-3" style="width: 40px; height: 40px; min-width: 40px;"></div>
		            
		            <div class="flex-grow-1 position-relative me-3" style="max-width: 500px;">
		                <input type="text" class="form-control comment-input" placeholder="댓글 쓰기">
		            </div>

		            <button class="btn btn-navy-custom px-4 py-2">댓글 작성</button>
		        </div>

		        <hr class="mb-5 opacity-10" style="max-width: 650px; margin: 0 auto;">

		        <div class="comment-list mx-auto" style="max-width: 550px;">
		            
		            <div class="d-flex mb-4">
		                <div class="bg-secondary rounded-circle me-3" style="width: 35px; height: 35px; min-width: 35px;"></div>
		                <div class="comment-content">
		                    <div class="d-flex align-items-center mb-1">
		                        <span class="fw-bold small me-2">닉네임</span>
		                        <span class="text-muted" style="font-size: 0.7rem;">03/14 15:30</span>
		                    </div>
		                    <p class="small mb-0 text-dark">디테일 대단하네요!</p>
		                </div>
		            </div>

		            <div class="d-flex mb-4">
		                <div class="bg-secondary rounded-circle me-3" style="width: 35px; height: 35px; min-width: 35px;"></div>
		                <div class="comment-content">
		                    <div class="d-flex align-items-center mb-1">
		                        <span class="fw-bold small me-2">닉네임</span>
		                        <span class="text-muted" style="font-size: 0.7rem;">03/14 15:35</span>
		                    </div>
		                    <p class="small mb-0 text-dark">#일러스트 #최고 #추천</p>
		                </div>
		            </div>
		            
		            <div class="text-center mt-5">
		                <button class="btn btn-navy-custom w-100 py-3 fw-bold" style="border-radius: 12px; max-width: 400px;">더 보기</button>
		            </div>
		        </div>
		    </div>
		</div>

		<style>
		    /* 이미지 디자인 재현을 위한 전용 스타일 */
		    .comment-section {
		        background-color: #f8f9fa; /* 연한 회색 배경 */
		        border-radius: 15px;
		    }

		    /* 하단 라인만 있는 입력창 */
		    .comment-input {
		        border: none !important;
		        border-bottom: 1px solid #dee2e6 !important;
		        background-color: transparent !important;
		        border-radius: 0 !important;
		        padding-left: 0 !important;
		        box-shadow: none !important;
		    }
		    
		    .comment-input:focus {
		        border-bottom: 2px solid #2D3278 !important;
		    }

		    /* 이미지 속 남색 버튼 스타일 */
		    .btn-navy-custom {
		        background-color: #2D3278 !important;
		        color: white !important;
		        border-radius: 30px; /* 둥근 버튼 */
		        font-size: 0.9rem;
		        transition: opacity 0.2s;
		    }
		    
		    .btn-navy-custom:hover {
		        opacity: 0.9;
		    }
		</style>

        <div class="mt-5 text-center">
            <h6 class="fw-bold mb-4 text-muted small">연관 작품</h6>
            <div class="row row-cols-3 g-2 mb-5">
                <div class="col" th:each="i : ${#numbers.sequence(1, 12)}">
                    <div class="bg-light border rounded" style="aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center;">
                        <i class="bi bi-image text-muted opacity-25 fs-3"></i>
                    </div>
                </div>
            </div>
        </div>

    </div>
	<footer class="full-footer text-light">
	    <div class="container py-5">
	        <div class="row mb-4">
	            <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
	                <h6 class="fw-bold mb-3">회사 정보</h6>
	                <ul class="list-unstyled small opacity-75">
	                    <li>이용 안내</li>
	                    <li>공지사항</li>
	                    <li>고객센터</li>
	                    <li>도움말</li>
	                    <li>광고문의</li>
	                </ul>
	            </div>
	        </div>
	        <hr class="footer-line">
	        <div class="row align-items-center">
	            <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
	                <span>이용 약관</span>
	                <span>개인 정보 보호 정책</span>
	            </div>
	            <div class="col-md-4 text-center small opacity-50 mb-3 mb-md-0">
	                © 2026 creatival All rights reserved.
	            </div>
	            <div class="col-md-4 text-end">
	                <img th:src="@{/images/creatival-Photoroom.png}" alt="logo" width="140">
	            </div>
	        </div>
	    </div>
	</footer>
</div>
</html>
