<html layout:decorate="~{layout}">
<div layout:fragment="content">

	<div class="container py-5" style="max-width: 900px;">
		<h3 class="fw-bold mb-4">작품 등록</h3>

		<form id="artForm" th:action="@{/content/art/create}" method="post" enctype="multipart/form-data"
			th:object="${createArtDTO}">

			<div class="alert alert-danger shadow-sm" role="alert" th:if="${#fields.hasAnyErrors()}">
				<ul class="mb-0">
					<li th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 메시지</li>
				</ul>
			</div>

			<!-- 제목 -->
			<div class="mb-3">
				<label class="form-label">제목</label>
				<input type="text" th:field="*{title}" class="form-control" required>
			</div>

			<!-- 설명 -->
			<div class="mb-3">
				<label class="form-label">설명</label>
				<textarea th:field="*{description}" class="form-control" rows="4"></textarea>
			</div>

			<!-- 프로젝트 태그 -->
			<div class="mb-3">
				<label class="form-label">프로젝트 태그 (선택)</label>
				<input type="text" th:field="*{projectTag}" class="form-control" id="projectTagInput"
					placeholder="projectTag 입력">
			</div>

			<!-- 소유자 유형 -->
			<div class="mb-3">
				<label class="form-label">소유자 유형</label>
				<select th:field="*{ownerType}" class="form-select" required>
					<option value="">선택하세요</option>
					<option value="USER">본인</option>
					<option value="TEAM">팀</option>
				</select>
			</div>

			<!-- 공개 범위 -->
			<div class="mb-3">
				<label class="form-label">공개 설정</label>
				<select th:field="*{visibility}" class="form-select">
					<option value="PUBLIC">전체 공개</option>
					<option value="PRIVATE">비공개</option>
				</select>
			</div>

			<!-- 댓글 허용 -->
			<div class="form-check mb-2">
				<input class="form-check-input" type="checkbox" th:field="*{allowComment}">
				<label class="form-check-label">댓글 허용</label>
			</div>

			<!-- 2차 창작 -->
			<div class="form-check mb-2">
				<input class="form-check-input" type="checkbox" th:field="*{fanWork}" id="fanWorkCheck"
					onchange="toggleOriginalInput()">
				<label class="form-check-label">2차 창작</label>
			</div>

			<!-- 원본 ID -->
			<div class="mb-4 d-none" id="originalContentWrapper">
				<label class="form-label">원본 콘텐츠 ID</label>
				<input type="number" th:field="*{originalContentId}" id="originalContentIdInput" class="form-control"
					placeholder="원본 작품 ID를 입력하세요">
			</div>

			<!-- 이미지 업로드 -->
			<div class="mb-3">
				<label class="form-label">이미지 (최대 4장)</label>

				<input type="file" id="imageInput" name="images" accept="image/*" multiple hidden>

				<button type="button" class="btn btn-outline-dark mb-3" onclick="triggerImageInput()">
					이미지 추가
				</button>

				<div id="previewContainer" class="row g-3"></div>
			</div>

			<!-- 제출 -->
			<div class="text-end">
				<button type="submit" class="btn btn-dark px-4">
					등록하기
				</button>
			</div>

		</form>
	</div>

	<script>

		const imageInput = document.getElementById('imageInput');
		const previewContainer = document.getElementById('previewContainer');
		const artForm = document.getElementById('artForm');

		const projectTagInput = document.getElementById('projectTagInput');
		const originalContentIdInput = document.getElementById('originalContentIdInput');

		let selectedFiles = [];


		function triggerImageInput() {

			if (selectedFiles.length >= 4) {
				alert("이미지는 최대 4장까지 가능합니다.");
				return;
			}

			imageInput.click();
		}


		imageInput.addEventListener('change', function () {

			const files = Array.from(this.files);

			files.forEach(file => {

				if (selectedFiles.length >= 4) return;

				selectedFiles.push(file);
				renderPreview(file);
			});

			this.value = "";
			updateInputFiles();
		});


		function renderPreview(file) {

			const reader = new FileReader();

			reader.onload = function (e) {

				const col = document.createElement('div');
				col.className = "col-6 col-md-3 position-relative";

				col.innerHTML = `
            <div class="border rounded overflow-hidden position-relative">
                <img src="${e.target.result}" class="img-fluid" style="aspect-ratio:1/1; object-fit:cover;">
                <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1" onclick="removeImage(this)">✕</button>
            </div>`;

				previewContainer.appendChild(col);
			};

			reader.readAsDataURL(file);
		}


		function removeImage(button) {

			const col = button.closest('.col-6');
			const index = Array.from(previewContainer.children).indexOf(col);

			selectedFiles.splice(index, 1);
			col.remove();

			updateInputFiles();
		}


		function updateInputFiles() {

			const dataTransfer = new DataTransfer();

			selectedFiles.forEach(file => dataTransfer.items.add(file));

			imageInput.files = dataTransfer.files;
		}


		artForm.addEventListener('submit', function (e) {

			const projectTag = projectTagInput.value.trim();
			const originalId = originalContentIdInput.value.trim();
			const ownerType = document.querySelector("[name='ownerType']").value;
			// 이미지 최소 1장
			if (selectedFiles.length === 0) {
				e.preventDefault();
				alert("이미지를 최소 1장 이상 추가해주세요.");
				return;
			}

			// projectTag + originalContentId 동시 입력 방지
			if (projectTag !== "" && originalId !== "") {
				e.preventDefault();
				alert("프로젝트 태그와 원본 콘텐츠 ID는 동시에 입력할 수 없습니다.");
				return;
			}

		    if (projectTag !== "" && ownerType !== "TEAM") {
		        e.preventDefault();
		        alert("프로젝트 태그가 있는 콘텐츠는 소유자 유형을 '팀'으로 선택해야 합니다.");
		    }

			updateInputFiles();
		});


		function toggleOriginalInput() {

			const check = document.getElementById("fanWorkCheck");
			const wrapper = document.getElementById("originalContentWrapper");

			if (check.checked) {
				wrapper.classList.remove("d-none");
			} else {
				originalContentIdInput.value=null; 
				wrapper.classList.add("d-none");
				
			}
		}


		document.addEventListener("DOMContentLoaded", function () {
			toggleOriginalInput();
		});

	</script>

</div>

</html>
