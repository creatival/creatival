<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div layout:fragment="content">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- ===================== -->
                <!-- 제목 -->
                <!-- ===================== -->
                <h2 class="fw-bold"
                    th:text="|${episode.episodeNum}화. ${episode.title}|">
                </h2>

                <!-- ===================== -->
                <!-- 작성일 + 무료/유료 -->
                <!-- ===================== -->
                <p class="text-muted">
                    <span th:text="${#temporals.format(episode.createdAt, 'yyyy.MM.dd')}"></span>

                    <span class="badge bg-success ms-2"
                          th:if="${episode.free}">
                        무료
                    </span>

                    <span class="badge bg-danger ms-2"
                          th:if="${!episode.free}">
                        유료
                    </span>
                </p>

                <hr>

                <!-- ===================== -->
                <!-- 로그인 사용자만 열람 -->
                <!-- ===================== -->

                <div sec:authorize="isAuthenticated()">

                    <!-- 기본 전체 출력 -->
                    <div class="fs-5 lh-lg text-break mt-4"
                         style="white-space: pre-line;"
                         th:text="${episode.novelContent}">
                    </div>

                    <!-- ===================================================== -->
                    <!-- 🔒 유료 가리기 + 구매 여부 체크 (나중에 활성화) -->
                    <!-- ===================================================== -->

                    <!--
                    <div th:if="${episode.free}">
                        <div class="fs-5 lh-lg text-break mt-4"
                             style="white-space: pre-line;"
                             th:text="${episode.novelContent}">
                        </div>
                    </div>

                    <div th:if="${!episode.free}">
                        <div th:if="${purchased}">
                            <div class="fs-5 lh-lg text-break mt-4"
                                 style="white-space: pre-line;"
                                 th:text="${episode.novelContent}">
                            </div>
                        </div>

                        <div th:unless="${purchased}">
                            <div class="alert alert-warning mt-4">
                                🔒 이 화는 유료입니다. 구매 후 열람 가능합니다.
                            </div>
                        </div>
                    </div>
                    -->

                </div>

                <!-- ===================== -->
                <!-- 비로그인 -->
                <!-- ===================== -->
                <div sec:authorize="isAnonymous()">
                    <div class="alert alert-secondary mt-4">
                        로그인 후 열람 가능합니다.
                    </div>
                </div>

                <!-- ===================== -->
                <!-- 작가의 말 -->
                <!-- ===================== -->
                <div class="mt-5"
                     th:if="${episode.note != null and !#strings.isEmpty(episode.note)}">

                    <h5>작가의 말</h5>

                    <div class="border rounded p-3 bg-light"
                         style="white-space: pre-line;"
                         th:text="${episode.note}">
                    </div>
                </div>

                <hr class="mt-5">

                <!-- ===================== -->
                <!-- 이전화 / 목록 / 다음화 -->
                <!-- ===================== -->
				<div class="d-flex justify-content-between mb-5">

				    <a th:if="${prevEpisode != null}"
				       th:href="@{/content/novel/episode/{id}(id=${prevEpisode.id})}"
				       class="btn btn-outline-secondary">
				        이전화
				    </a>
				    <a th:if="${prevEpisode == null}" class="btn btn-outline-secondary disabled">
				        이전화 없음
				    </a>

				    <a th:href="@{/content/novel_detail/{id}(id=${contentId})}" class="btn btn-outline-dark">
				        목록
				    </a>

				    <a th:if="${nextEpisode != null}"
				       th:href="@{/content/novel/episode/{id}(id=${nextEpisode.id})}"
				       class="btn btn-outline-secondary">
				        다음화
				    </a>
				    <a th:if="${nextEpisode == null}" class="btn btn-outline-secondary disabled">
				        다음화 없음
				    </a>

				</div>

            </div>
        </div>
    </div>

</div>
</html>
