<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<div class="container" layout:fragment="content">
    <style>
        /* =========================================
           [1. 프로필 섹션]
           ========================================= */
        .profile-section { text-align: center; padding: 50px 0 0 0; background-color: #fff; }
        .profile-img-container { 
            position: relative; width: 130px; height: 130px; margin: 0 auto 20px; 
            cursor: pointer; display: block; 
        }
        .profile-img { 
            width: 100%; height: 100%; background-color: #dbdbdb; 
            border-radius: 50%; object-fit: cover; border: 1px solid #eee; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .camera-icon { 
            position: absolute; bottom: 0; right: 0; background-color: #fff; 
            border-radius: 50%; border: 1px solid #ddd; width: 34px; height: 34px; 
            display: flex; align-items: center; justify-content: center; 
            color: #3B4371; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }

        .profile-nickname { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; color: #222; }
        .profile-intro { color: #777; font-size: 0.95rem; margin: 20px auto; max-width: 500px; }
        
        /* 버튼 그룹 */
        .profile-btn-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        
        .btn-edit-profile, .btn-deactivate { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 160px; height: 42px; border-radius: 10px; font-size: 0.9rem; 
            font-weight: 600; cursor: pointer; transition: 0.2s; 
        }
        .btn-edit-profile { background-color: #e9e9e9; border: none; color: #444; }
        .btn-edit-profile:hover { background-color: #ddd; }
        .btn-deactivate { background-color: #fff; border: 1px solid #ff5a2d; color: #ff5a2d; }
        .btn-deactivate:hover { background-color: rgba(255, 90, 45, 0.05); }

        /* 팔로우 버튼 */
        .btn-follow {
            display: inline-flex; align-items: center; justify-content: center;
            width: 340px; height: 46px; background-color: #3B4371; color: #fff;
            border: none; border-radius: 30px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; margin-bottom: 40px;
        }
        .btn-follow:hover { background-color: #2a3152; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-follow.following { background-color: #f8f9fa; color: #333; border: 1px solid #ddd; }

        /* 태그 */
        .custom-tag-badge { background-color: #A3C9F1 !important; color: #333 !important; padding: 6px 12px; font-weight: 600; font-size: 0.85rem; }
        .tag-delete-btn { color: #555; cursor: pointer; margin-left: 5px; transition: 0.2s; }
        .tag-delete-btn:hover { color: #ff5a5a; }

        /* =========================================
           [2. 탭 메뉴 & 인디케이터]
           ========================================= */
        .tab-menu-wrapper { display: flex; justify-content: center; gap: 40px; border-bottom: 1px solid #ddd; height: 50px; align-items: center; position: relative; }
        .tab-menu-item { cursor: pointer; color: #777; font-size: 1.05rem; font-weight: 600; height: 100%; display: flex; align-items: center; padding: 0 5px; transition: color 0.2s; }
        .tab-menu-item.active { font-weight: 800; color: #000; }
        .tab-indicator { position: absolute; bottom: -1px; height: 4px; background-color: #ff5a2d; border-radius: 2px 2px 0 0; transition: all 0.3s ease; }

        .tab-content { display: none; padding-top: 40px; }
        .tab-content.active { display: block; }

        /* 애니메이션 */
        .slide-in-right { animation: slideInRight 0.4s ease forwards; }
        .slide-in-left { animation: slideInLeft 0.4s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        /* 공통 섹션 스타일 */
        .content-box-gray { padding: 50px 0; background: #F4F4F4; border-radius: 12px; margin-bottom: 30px; }
        .section-header { text-align: center; margin-bottom: 25px; }
        .section-title { font-size: 1.4rem; font-weight: 800; }
        .content-card { background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .content-card:hover { transform: translateY(-3px); }
        .card-img-placeholder { background: #E9E9E9; display: flex; align-items: center; justify-content: center; color: #ccc; width: 100%; aspect-ratio: 1/1; }
        .card-label { padding: 10px; font-size: 0.85rem; font-weight: 700; text-align: center; }

        /* 정보 테이블 */
        .info-card { max-width: 800px; margin: 0 auto; border: 1px solid #eee; border-radius: 15px; overflow: hidden; }
        .info-card-header { background-color: #3B4371; color: #fff; padding: 15px 25px; font-weight: 700; }
        .table-info-custom { width: 100%; }
        .table-info-custom th { background-color: #F9F9F9; width: 30%; padding: 15px 25px; border-bottom: 1px solid #eee; text-align: left; }
        .table-info-custom td { padding: 15px 25px; border-bottom: 1px solid #eee; }
    </style>

    <main style="background: #fff; padding-bottom: 100px;">
        <section class="profile-section">
            <div class="profile-img-container" data-bs-toggle="modal" data-bs-target="#imageUpdateModal">
                <img th:src="${user.profileImgUrl != null ? user.profileImgUrl : 'https://dummyimage.com/130x130/ced4da/6c757d'}" class="profile-img">
                <div class="camera-icon"><i class="bi bi-camera-fill"></i></div>
            </div>

            <h2 class="profile-nickname" th:text="|${user.displayName} (${user.username})|">닉네임</h2>
            
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">              
                <div th:each="tag : ${tagList}" class="badge rounded-pill custom-tag-badge d-flex align-items-center">
                    <span th:text="'#' + ${tag.tagText}">#태그명</span>
                    <span th:if="${user.username == #authentication.name}" th:onclick="|if(confirm('삭제하시겠습니까?')) location.href='@{/tag/deleteUserTag(tagId=${tag.id})}'|" class="tag-delete-btn">
                        <i class="bi bi-x-circle-fill"></i>
                    </span>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm rounded-circle p-0" th:if="${user.username == #authentication.name}" 
                        style="width: 24px; height: 24px;" data-bs-toggle="modal" data-bs-target="#tagAddModal">
                    <i class="bi bi-plus"></i>
                </button>
            </div>

            <p class="profile-intro" th:text="${user.description != null ? user.description : '나를 표현하는 한 줄 소개를 적어보세요.'}"></p>

            <div class="profile-btn-group" th:if="${user.username == #authentication.name}">
                <div th:onclick="|location.href='@{/user/edit}'|" class="btn-edit-profile">프로필 편집</div>
                <div th:onclick="|location.href='@{/user/delete}'|" class="btn-deactivate">프로필 비활성화</div>
            </div>
            
            <button th:if="${user.username != #authentication.name}" id="followBtn" class="btn-follow" 
                    th:classappend="${follow != null && follow.followed} ? ' following'" 
                    th:onclick="|toggleFollow(${user.id}, 'USER')|" 
                    th:text="${follow != null && follow.followed} ? '팔로우 중' : '팔로우'">
            </button>

            <div class="tab-menu-wrapper">
                <div id="tab-home" class="tab-menu-item active" onclick="switchTab('home', 0)">홈</div>
                <div id="tab-posts" class="tab-menu-item" onclick="switchTab('posts', 1)">게시물</div>
                <div id="tab-team" class="tab-menu-item" onclick="switchTab('team', 2)">팀</div>
                <div id="tab-project" class="tab-menu-item" onclick="switchTab('project', 3)">프로젝트</div>
                <div id="tab-interests" class="tab-menu-item" onclick="switchTab('interests', 4)">관심 콘텐츠</div>
                <div class="tab-indicator" id="tabIndicator"></div>
            </div>
        </section>
        
        <section id="content-home" class="tab-content active">
            <div class="container">
                <div class="info-card">
                    <div class="info-card-header">정보 확인</div>
                    <table class="table-info-custom">
                        <tbody>
                            <tr><th>이메일</th><td th:text="${user.email}"></td></tr>
                            <tr><th>가입일</th><td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td></tr>
                            <tr><th>창작자 여부</th><td th:text="${user.isCreator ? '예' : '아니요'}"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="content-posts" class="tab-content">
            <div class="section-header"><h3 class="section-title">내 창작물</h3></div>
            <div class="container">
                <div class="row row-cols-2 row-cols-md-4 g-3">
                    <div class="col" th:each="i : ${#numbers.sequence(1, 4)}">
                        <div class="content-card">
                            <div class="card-img-placeholder"><i class="bi bi-image fs-4"></i></div>
                            <div class="card-label">작품 제목</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="content-team" class="tab-content">
            <div class="section-header"><h3 class="section-title">소속 팀</h3></div>
            <div class="container text-center">준비 중입니다.</div>
        </section>

        <section id="content-project" class="tab-content">
            <div class="section-header"><h3 class="section-title">참여 프로젝트</h3></div>
            <div class="container text-center">준비 중입니다.</div>
        </section>

        <section id="content-interests" class="tab-content">
            <div class="section-header"><h3 class="section-title">관심 콘텐츠</h3></div>
            <div class="container text-center">좋아요 및 북마크한 작품이 표시됩니다.</div>
        </section>

    </main>

    <div class="modal fade" id="imageUpdateModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <form th:action="@{/user/updateProfileImg}" method="post" enctype="multipart/form-data">
                    <div class="modal-body text-center p-4">
                        <h5 class="fw-bold mb-3">프로필 이미지 변경</h5>
                        <img id="imagePreview" src="https://dummyimage.com/150x150/ced4da/6c757d" class="rounded-circle mb-3 border" width="150" height="150">
                        <input class="form-control" type="file" id="profileImageInput" name="profileImg" accept="image/*" required>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary" style="background-color: #3B4371;">변경하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/createUserTag}" method="post">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" placeholder="태그명" required>
                        </div>
                    </div>
                    <div class="modal-footer p-2">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentIndex = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const activeTab = document.querySelector('.tab-menu-item.active');
            if (activeTab) updateIndicator(activeTab);
        });

        function switchTab(tabId, index) {
            if (currentIndex === index) return;
            const direction = index > currentIndex ? 1 : -1; 
            currentIndex = index;

            document.querySelectorAll('.tab-menu-item').forEach(tab => tab.classList.remove('active'));
            const clickedTab = document.getElementById('tab-' + tabId);
            clickedTab.classList.add('active');
            updateIndicator(clickedTab);

            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active', 'slide-in-right', 'slide-in-left');
            });

            const activeContent = document.getElementById('content-' + tabId);
            activeContent.classList.add('active');
            activeContent.classList.add(direction === 1 ? 'slide-in-right' : 'slide-in-left');
        }

        function updateIndicator(tabElement) {
            const indicator = document.getElementById('tabIndicator');
            indicator.style.width = tabElement.offsetWidth + 'px';
            indicator.style.left = tabElement.offsetLeft + 'px';
        }

        // 이미지 미리보기
        document.getElementById('profileImageInput').onchange = (e) => {
            const [file] = e.target.files;
            if (file) document.getElementById('imagePreview').src = URL.createObjectURL(file);
        }

        // 팔로우 토글 함수 (실제 API 연결 필요)
        function toggleFollow(id, type) {
            // 여기에 fetch API 등을 이용한 팔로우 로직을 구현하세요.
            console.log(id, type, "팔로우 토글");
            location.reload(); // 임시 새로고침
        }
    </script>
</div>
</html>
