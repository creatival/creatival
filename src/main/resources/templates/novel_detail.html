<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org">

<div class="container" layout:fragment="content">

    <div class="container pt-5">

        <div class="row">
            <!-- 썸네일 영역 (현재 DTO에 없으므로 기본 이미지 사용) -->
			<div class="col-md-4">

			    <div class="position-relative"
			         style="width:300px; height:400px; cursor:pointer;"
			         data-bs-toggle="modal"
			         data-bs-target="#thumbnailUpdateModal"
			         title="클릭하여 표지 변경">

			        <img th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}"
			             class="border shadow-sm"
			             style="width:100%; height:100%; object-fit:cover;" />

			        <!-- 카메라 아이콘 -->
			        <div class="position-absolute bottom-0 end-0 bg-white rounded-circle border p-2"
			             style="width:40px; height:40px;" th:if="${novel.username == loginUsername}">
			            <i class="bi bi-camera-fill text-dark"></i>
			        </div>

			    </div>

			</div>

            <!-- 소설 정보 -->
            <div class="col-md-8">
				<div th:if="${novel.username == loginUsername}">
					<a th:href="@{'/content/novel_delete/' + ${novel.id}}" class="btn btn-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제하기</a>
					<a th:href="@{'/content/novel_update/' + ${novel.id}}" class="btn btn-info">수정하기</a>
				</div>
                <!-- 제목 -->
                <h1 th:text="${novel.title}">소설 제목</h1>

                <!-- 작가 -->
                <h5>
                    작가 :
                    <span th:text="${novel.displayname}">작가닉네임</span>
                    (<span th:text="${novel.username}">아이디</span>)
                </h5>

                <!-- 조회수 -->
                <h6>
                    조회수 :
                    <span th:text="${novel.viewCount}">0</span>
                </h6>

                <!-- 공개 여부 -->
                <h6>
                    공개 범위 :
                    <span th:text="${novel.visibility}">PUBLIC</span>
                </h6>

                <!-- 댓글 허용 여부 -->
                <h6>
                    댓글 허용 :
                    <span th:text="${novel.allowComment} ? '허용' : '비허용'">허용</span>
                </h6>

                <!-- 설명 -->
                <div class="mt-4">
                    <p th:text="${novel.description}">
                        소설 설명이 여기에 들어갑니다.
                    </p>
                </div>

            </div>
        </div>
    </div>


    <!-- 에피소드 목록 (추후 List 추가 가능) -->
    <div class="container">
		<div class="row">
			<div th:if="${novel.username == loginUsername}" class="d-flex justify-content-end" >
				<a th:href="@{'/content/novel/episode/write/' + ${novel.id}}" class="btn btn-info">추가하기</a>
			</div>
		</div>
        <div class="pb-5 row">
            <div class="pb-5 col-md-8 ms-auto">

                <ul class="list-group">

                    <!-- 에피소드 반복문 예시 (나중에 추가용) -->
                    <!--
                    <li class="list-group-item"
                        th:each="episode : ${episodeList}">
                        <a th:href="@{/novel/{id}/episode/{epId}
                            (id=${novel.id}, epId=${episode.id})}"
                           th:text="${episode.title}">
                            에피소드 제목
                        </a>
                    </li>
                    -->

                    <li class="list-group-item text-center text-muted">
                        에피소드가 아직 없습니다.
                    </li>

                </ul>

            </div>
        </div>
    </div>
	
	<!--소설 표지 수정 모달-->
	<div class="modal fade" id="thumbnailUpdateModal" tabindex="-1" aria-hidden="true">
	    <div class="modal-dialog modal-dialog-centered">
	        <div class="modal-content">

	            <div class="modal-header">
	                <h5 class="modal-title">소설 표지 변경</h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
	            </div>

	            <form th:action="@{/content/updateNovelThumbnail/{id}(id=${novel.id})}"
	                  method="post"
	                  enctype="multipart/form-data">

	                <div class="modal-body text-center">

	                    <!-- 미리보기 -->
	                    <img id="thumbnailPreview"
	                         th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}"
	                         class="mb-3 border shadow-sm"
	                         width="200"
	                         height="270"
	                         style="object-fit:cover;">

	                    <input class="form-control"
	                           type="file"
	                           id="thumbnailInput"
	                           name="thumbnailFile"
	                           accept="image/*"
	                           required>

	                </div>

	                <div class="modal-footer">
	                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
	                    <button type="submit" class="btn btn-dark">변경하기</button>
	                </div>

	            </form>

	        </div>
	    </div>
	</div>
	
	<script>
	    const thumbnailInput = document.getElementById('thumbnailInput');
	    const thumbnailPreview = document.getElementById('thumbnailPreview');

	    if (thumbnailInput) {
	        thumbnailInput.onchange = () => {
	            const [file] = thumbnailInput.files;
	            if (file) {
	                thumbnailPreview.src = URL.createObjectURL(file);
	            }
	        }
	    }

	    const thumbnailForm = document.querySelector('#thumbnailUpdateModal form');

	    if (thumbnailForm) {
	        thumbnailForm.onsubmit = function () {
	            const submitBtn = this.querySelector('button[type="submit"]');

	            submitBtn.disabled = true;
	            submitBtn.innerHTML = `
	                <span class="spinner-border spinner-border-sm" role="status"></span>
	                업로드 중...
	            `;
	        };
	    }
	</script>

</div>
</html>
