<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org">

<div class="container" layout:fragment="content">

    <div class="container pt-5">

        <div class="row">
            <!-- 썸네일 영역 (현재 DTO에 없으므로 기본 이미지 사용) -->
            <div class="col-md-4">
                <img th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}"
                     alt="썸네일"
                     style="width: 300px; height: 400px;" />
            </div>

            <!-- 소설 정보 -->
            <div class="col-md-8">
				<div th:if="${novel.username == loginUsername}">
					<a th:href="@{'/contnent/novel_delete/' + ${novel.id}}" class="btn btn-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제하기</a>
					<a th:href="@{/content/novel_update}" class="btn btn-info">수정하기</a>
				</div>
                <!-- 제목 -->
                <h1 th:text="${novel.title}">소설 제목</h1>

                <!-- 작가 -->
                <h5>
                    작가 :
                    <span th:text="${novel.displayname}">작가닉네임</span>
                    (<span th:text="${novel.username}">아이디</span>)
                </h5>

                <!-- 조회수 -->
                <h6>
                    조회수 :
                    <span th:text="${novel.viewCount}">0</span>
                </h6>

                <!-- 공개 여부 -->
                <h6>
                    공개 범위 :
                    <span th:text="${novel.visibility}">PUBLIC</span>
                </h6>

                <!-- 댓글 허용 여부 -->
                <h6>
                    댓글 허용 :
                    <span th:text="${novel.allowComment} ? '허용' : '비허용'">허용</span>
                </h6>

                <!-- 설명 -->
                <div class="mt-4">
                    <p th:text="${novel.description}">
                        소설 설명이 여기에 들어갑니다.
                    </p>
                </div>

            </div>
        </div>
    </div>


    <!-- 에피소드 목록 (추후 List 추가 가능) -->
    <div class="container">
        <div class="pb-5 row">
            <div class="pb-5 col-md-8 ms-auto">

                <ul class="list-group">

                    <!-- 에피소드 반복문 예시 (나중에 추가용) -->
                    <!--
                    <li class="list-group-item"
                        th:each="episode : ${episodeList}">
                        <a th:href="@{/novel/{id}/episode/{epId}
                            (id=${novel.id}, epId=${episode.id})}"
                           th:text="${episode.title}">
                            에피소드 제목
                        </a>
                    </li>
                    -->

                    <li class="list-group-item text-center text-muted">
                        에피소드가 아직 없습니다.
                    </li>

                </ul>

            </div>
        </div>
    </div>

</div>
</html>
