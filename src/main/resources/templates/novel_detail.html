<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        /* 1. 상단 소설 정보 스타일 */
        .novel-detail-thumb {
            width: 100%; max-width: 280px; aspect-ratio: 3 / 4;
            object-fit: cover; border-radius: 12px;
        }
        /* 시안의 파란 테두리 설명 박스 */
        .description-box {
            border: 3px solid #4dabf7;
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            min-height: 180px;
            position: relative;
        }
        .btn-first-episode {
            background-color: #3b447a; color: white;
            border-radius: 8px; padding: 12px 0;
            font-weight: bold; width: 100%; max-width: 280px;
            display: block; text-align: center; text-decoration: none;
        }
        .btn-first-episode:hover { background-color: #2a325d; color: #fff; }

        /* 2. 회차 리스트 스타일 */
        .episode-header { border-bottom: 2px solid #3b447a; padding-bottom: 10px; font-weight: bold; }
        .episode-item {
            border-bottom: 2px solid #ffccbc; /* 시안의 연주황 구분선 */
            padding: 15px 10px;
            transition: background 0.2s;
        }
        .episode-item:hover { background-color: #fdfdfd; }
        .episode-title { font-weight: bold; color: #333; font-size: 1.1rem; }
        .episode-meta { font-size: 0.85rem; color: #888; }

        /* 3. 주황색 밑줄 페이징 */
        .custom-pagination .page-link { border: none; color: #333; font-weight: 700; background: none; }
        .custom-pagination .page-item.active .page-link {
            background: none; color: #333; border-bottom: 3px solid #f05a28; border-radius: 0;
        }

        /* 4. 풀 너비 푸터 */
        .full-footer { background-color: #0b152d; color: white; width: 100%; margin-top: 80px; }
        .footer-line { border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0; }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <div layout:fragment="content">

        <section class="py-4 border-bottom mb-5">
            <div class="container text-center">
                </div>
        </section>

        <div class="container pb-5">
            <div class="row g-5 mb-5 align-items-start">
                <div class="col-lg-4 text-center">
                    <div class="position-relative d-inline-block mb-3" 
                         style="cursor:pointer;" data-bs-toggle="modal" data-bs-target="#thumbnailUpdateModal">
                        <img th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}" 
                             class="novel-detail-thumb shadow">
                        <div class="position-absolute bottom-0 end-0 bg-white rounded-circle border p-2 m-2" 
                             th:if="${novel.username == loginUsername}">
                            <i class="bi bi-camera-fill text-dark"></i>
                        </div>
                    </div>
                    
                    <h4 class="fw-bold mb-1" th:text="${novel.title}">소설 제목</h4>
                    <p class="text-muted small mb-3" th:text="${novel.displayname}">작가이름</p>
                    
                    <div class="d-flex justify-content-center gap-3 mb-4 small text-muted">
                        <span>조회수 <strong th:text="${novel.viewCount}">0</strong></span>
                        <span>추천 <strong>2081</strong></span> </div>

                    <a href="#" class="btn-first-episode mb-2">첫 화 시청하기</a>
                    
                    <div th:if="${novel.username == loginUsername}" class="mt-3">
                        <a th:href="@{'/content/novel_update/' + ${novel.id}}" class="btn btn-sm btn-outline-secondary">수정</a>
                        <a th:href="@{'/content/novel_delete/' + ${novel.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제하시겠습니까?');">삭제</a>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="description-box shadow-sm mb-3">
                        <p class="mb-0 lh-lg text-secondary" th:text="${novel.description}">
                            오래 전, 태초의... 소설 설명이 여기에 표시됩니다.
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <span class="text-primary small">#태그</span>
                        <span class="text-primary small">#태그</span>
                        <span class="text-primary small">#태그</span>
                    </div>
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-lg-10 mx-auto">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="episode-header flex-grow-1">회차 리스트</h4>
                        <a th:if="${novel.username == loginUsername}" 
                           th:href="@{'/content/novel/episode/write/' + ${novel.id}}" 
                           class="btn btn-dark btn-sm ms-3">회차 추가</a>
                    </div>

                    <div class="list-unstyled">
                        <div class="episode-item d-flex justify-content-between align-items-center" 
                             th:each="episode : ${paging.content}">
                            <div class="flex-grow-1">
                                <a th:href="@{/content/novel/episode/{id}(id=${episode.id})}" class="text-decoration-none">
                                    <div class="episode-title mb-1" th:text="${episode.title}">에피소드 제목</div>
                                    <div class="episode-meta">
                                        <span th:text="${episode.episodeNum} + '회차'">1회</span> · 
                                        조회수 1,234 · 추천 56 · 
                                        <span th:text="${#temporals.format(episode.createdAt, 'yyyy.MM.dd')}">2026.02.28</span>
                                    </div>
                                </a>
                            </div>
                            <div th:if="${episode.username == #authentication.name}">
                                <a th:href="@{/content/novel/episode/update/{id}(id=${episode.id})}" class="btn btn-link text-muted btn-sm">수정</a>
                                <a th:href="@{/content/novel/episode/delete/{id}(id=${episode.id})}" class="btn btn-link text-danger btn-sm" onclick="return confirm('삭제하시겠습니까?');">삭제</a>
                            </div>
                        </div>

                        <div class="text-center py-5 text-muted" th:if="${paging.totalElements == 0}">
                            등록된 회차가 없습니다.
                        </div>
                    </div>

                    <nav class="mt-5" th:if="${!paging.isEmpty()}">
                        <ul class="pagination justify-content-center custom-pagination">
                            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a>
                            </li>
                            <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                                th:classappend="${page == paging.number} ? 'active'" class="page-item">
                                <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
                            </li>
                            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <footer class="full-footer">
            <div class="container py-5">
                <div class="row mb-4">
                    <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
                        <h6 class="fw-bold mb-3">footer 내용</h6>
                        <ul class="list-unstyled small opacity-75">
                            <li th:each="j : ${#numbers.sequence(1, 4)}">footer 내용</li>
                        </ul>
                    </div>
                </div>
                <hr class="footer-line">
                <div class="row align-items-center">
                    <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
                        <span>이용 약관</span><span>개인 정보 보호 정책</span>
                    </div>
                    <div class="col-md-4 text-center small opacity-50">
                        © 2026 creatival All rights reserved.
                    </div>
                    <div class="col-md-4 text-end">
                        <img th:src="@{/images/creatival-Photoroom.png}" alt="logo" width="130">
                    </div>
                </div>
            </div>
        </footer>

        <div class="modal fade" id="thumbnailUpdateModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">소설 표지 변경</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/content/updateNovelThumbnail/{id}(id=${novel.id})}" method="post" enctype="multipart/form-data">
                        <div class="modal-body text-center bg-light">
                            <img id="thumbnailPreview" th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}" 
                                 class="mb-3 border shadow-sm" width="200" height="270" style="object-fit:cover; border-radius: 8px;">
                            <input class="form-control" type="file" id="thumbnailInput" name="thumbnailFile" accept="image/*" required>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-dark px-4">변경하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            /* 썸네일 미리보기 스크립트 (제공해주신 기능 유지) */
            const thumbnailInput = document.getElementById('thumbnailInput');
            const thumbnailPreview = document.getElementById('thumbnailPreview');
            if (thumbnailInput) {
                thumbnailInput.onchange = () => {
                    const [file] = thumbnailInput.files;
                    if (file) thumbnailPreview.src = URL.createObjectURL(file);
                }
            }
            const thumbnailForm = document.querySelector('#thumbnailUpdateModal form');
            if (thumbnailForm) {
                thumbnailForm.onsubmit = function () {
                    const submitBtn = this.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> 업로드 중...`;
                };
            }
        </script>
    </div>
</body>
</html>
