<html layout:decorate="~{layout}">
<head>
    <title>팀 후원하기 | Creatival</title>
</head>
<div layout:fragment="content">
    <style>
        :root {
            --c-navy: #3B4371;
            --c-orange: #FF7F50;
            --c-purple: #432C8C;
            --c-bg: #f9faff;
        }

        body { background-color: var(--c-bg); }

        /* 상단 헤더 영역 - 그라데이션 및 프로필 배치 */
        .boost-header {
            background: linear-gradient(135deg, var(--c-navy) 0%, var(--c-purple) 100%);
            padding: 100px 0 60px;
            text-align: center;
            color: white;
            position: relative;
            margin-bottom: 80px;
        }

        .boost-profile-img {
            width: 150px;
            height: 150px;
            border-radius: 40px; /* Creatival 특유의 부드러운 사각형 */
            border: 6px solid white;
            object-fit: cover;
            position: absolute;
            bottom: -75px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* 컨테이너 및 폰트 설정 */
        .boost-container { max-width: 1000px; margin: 0 auto; padding: 0 20px 80px; }
        
        .team-title { font-size: 2.2rem; font-weight: 800; color: #212121; text-align: center; margin-top: 25px; }
        .team-sub-text { text-align: center; color: #666; margin-bottom: 50px; font-size: 1.1rem; }

        /* 공통 카드 스타일 */
        .c-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 40px rgba(59, 67, 113, 0.05);
            height: 100%;
        }

        /* 목표 달성률 박스 */
        .goal-box {
            background-color: #F8F9FF;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #EEF0FF;
            margin-top: 30px;
        }

        .progress-custom {
            height: 14px;
            border-radius: 20px;
            background-color: #E2E5F5;
            overflow: hidden;
            margin: 15px 0 10px;
        }

        .progress-bar-custom {
            background: linear-gradient(90deg, var(--c-orange), #FFAD8F);
            border-radius: 20px;
            height: 100%;
            transition: width 1s ease-in-out;
        }

        /* 금액 선택 버튼 그룹 */
        .amount-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .amount-btn {
            padding: 15px 0;
            border: 2px solid #F0F2F7;
            background: #fff;
            border-radius: 15px;
            color: #777;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .amount-btn:hover { border-color: var(--c-orange); color: var(--c-orange); }
        .amount-btn.active {
            background-color: var(--c-orange);
            border-color: var(--c-orange);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 127, 80, 0.3);
        }

        /* 입력 필드 */
        .input-amount-custom {
            width: 100%;
            padding: 18px 25px;
            border-radius: 15px;
            border: 2px solid #F0F2F7;
            font-size: 1.2rem;
            font-weight: 700;
            outline: none;
            transition: 0.3s;
            background-color: #FDFDFD;
            margin-bottom: 25px;
        }

        .input-amount-custom:focus {
            border-color: var(--c-navy);
            background-color: #fff;
        }

        /* 결제 버튼 */
        .btn-submit-boost {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background-color: var(--c-navy);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit-boost:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 10px 25px rgba(59, 67, 113, 0.2);
        }

        .card-label { font-size: 1.1rem; font-weight: 800; color: var(--c-navy); margin-bottom: 20px; display: block; }
    </style>

    <div class="boost-header">
        <img th:src="${team.profileImgUrl}" class="boost-profile-img" alt="Team Profile">
    </div>

    <div class="boost-container">
        <h2 class="team-title" th:text="${team.name}">팀 이름</h2>
        <p class="team-sub-text">한 번의 소중한 후원이 창작자에게 큰 힘이 됩니다.</p>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="c-card">
                    <span class="card-label">✨ 프로젝트 스토리</span>
                    <p class="text-muted" style="line-height: 1.8;" th:text="${team.description}">
                        팀의 구체적인 창작 계획과 후원금 사용처를 투명하게 공유하여 신뢰를 얻는 공간입니다.
                    </p>
                    
                    <div class="goal-box">
                        <div class="d-flex justify-content-between align-items-end">
                            <span class="fw-bold text-dark">목표 달성률</span>
                            <span style="color: var(--c-orange); font-weight: 800; font-size: 1.2rem;">65%</span>
                        </div>
                        <div class="progress-custom">
                            <div class="progress-bar-custom" style="width: 65%;"></div>
                        </div>
                        <p class="small text-muted mb-0 mt-2 text-center">목표 금액까지 얼마 남지 않았어요!</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="c-card" style="border-top: 6px solid var(--c-orange);">
                    <span class="card-label">💰 후원금액 선택</span>
                    <form th:action="@{/team/{id}/boost(id=${team.id})}" method="post">
                        <div class="amount-btn-group">
                            <button type="button" class="amount-btn" data-value="10000">1만 원</button>
                            <button type="button" class="amount-btn" data-value="30000">3만 원</button>
                            <button type="button" class="amount-btn" data-value="50000">5만 원</button>
                        </div>
                        <input type="number" id="supportAmount" name="amount" class="input-amount-custom" placeholder="금액 직접 입력 (₩)" required>
                        <button type="submit" class="btn-submit-boost">응원 결제하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".amount-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                document.getElementById("supportAmount").value = this.dataset.value;
            });
        });

        // 직접 입력 시 선택 해제
        document.getElementById("supportAmount").addEventListener("input", function() {
            document.querySelectorAll(".amount-btn").forEach(btn => btn.classList.remove("active"));
        });
    </script>
</div>
</html>
