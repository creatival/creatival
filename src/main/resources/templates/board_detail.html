<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<div class="container" layout:fragment="content">
<div class="container py-5" th:object="${board}">

    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">게시판</h1>
    </div>

    <div class="post-header-top">

        <!-- 게시글 헤더 -->
        <div class="p-4 bg-indigo-light">

            <div class="mb-2">
                <span class="badge bg-primary mb-2"
                      th:text="*{boardType}"
                      style="background-color:#3f51b5 !important;">
                    자유
                </span>
            </div>

            <h3 class="fw-bold mb-3" th:text="*{title}">
                게시판 구현 중입니다. 디자인 어떤가요?
            </h3>

            <div class="d-flex justify-content-between align-items-center text-muted small">

                <div class="d-flex align-items-center">
                    <span class="fw-bold text-dark me-3"
                          th:text="*{displayname}">
                          작성자
                    </span>

                    <span class="me-3"
                          th:text="${#temporals.format(board.createdAt,'yyyy.MM.dd HH:mm')}">
                          날짜
                    </span>

                    <span th:text="'조회수 ' + *{viewCount}">
                          조회수
                    </span>
                </div>

            </div>
        </div>


        <!-- 게시글 본문 -->
        <div class="py-5 px-4 min-vh-50 border-bottom">

            <p th:text="*{boardText}">
                게시글 본문 내용
            </p>


            <!-- 프로젝트 정보 -->
            <div class="my-4 p-3 border bg-light" th:if="*{project != null}">
                <h6 class="fw-bold mb-2">프로젝트</h6>

                <div>
                    <span th:text="*{project.name}">프로젝트 이름</span>
                </div>
            </div>


            <!-- 팀 정보 -->
            <div class="my-4 p-3 border bg-light" th:if="*{team != null}">
                <h6 class="fw-bold mb-2">팀</h6>

                <div>
                    <span th:text="*{team.name}">팀 이름</span>
                </div>
            </div>


            <!-- 콘텐츠 정보 -->
            <div class="my-4 text-center" th:if="*{content != null}">
                <div class="bg-light d-inline-block p-5 border text-muted">

                    <div>
                        <span th:text="*{content.contentInfo}">
                            콘텐츠 정보
                        </span>
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

</div>

</html>
