<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">

<head>
	<meta charset="UTF-8">
	<title>Creatival - 통합 게시판</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	

		<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
						<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">

	<style>
		:root {
			--board-blue: #3B4371;
			--board-orange: #FF7F50;
			--user-blue-line: #4a90e2;
			--bg-light: #F0F2F5;
		}

		body {
			font-family: 'Pretendard', sans-serif;
			margin: 0;
			padding: 0;
			background-color: #fff;
			color: #333;
		}

		.board-container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 0 15px;
			overflow: hidden;
		}
		.table-board tbody tr:hover {
		    background-color: #ccc; /* 마우스를 올리면 아주 연한 회색으로 변경 */
		    transition: background-color 0.2s ease; /* 부드러운 전환 효과 */
		}

		/* 제목 td 영역 호버 시 커서 변경 및 강조 */
		.table-board tbody td:nth-child(2):hover {
		    cursor: pointer;
		}

		/* 제목 링크 전체 영역 클릭 가능하게 만들기 위한 설정 */
		.table-board tbody td a {
		    display: block; /* a 태그를 블록으로 만들어 td 전체를 채움 */
		    width: 100%;
		    height: 100%;
		    text-decoration: none;
		    color: inherit;
		}

		/* 1. 상단 카테고리 아이콘 */
			.category-item { 
			        transition: all 0.3s ease; 
			        text-decoration: none !important;
			    }
			    
			    .icon-box {
			        width: 80px; 
			        height: 80px; 
			        background-color: #F8F9FA; /* 기본 연회색 배경 */
			        border-radius: 22px;
			        margin: 0 auto 12px; 
			        display: flex; 
			        align-items: center; 
			        justify-content: center;
			        overflow: hidden;
			        border: 1px solid #eee;
			        transition: all 0.3s ease;
			    }

			    .category-icon-img {
			        width: 100%;       
			        height: 100%;      
			        object-fit: contain; 
			        padding: 18px; /* 아이콘 크기 통일 */
			        transition: transform 0.3s ease;
			    }

			    /* 호버 시 디자인 변경: Creatival 오렌지색 적용 */
			    .category-item:hover { 
			        transform: translateY(-8px); 
			    }
			    
			    .category-item:hover .category-icon-img {
			        transform: scale(1.1); /* 아이콘 살짝 확대 */
			    }

			    .category-item .fw-bold {
			        color: #3B4371; /* 브랜드 네이비 */
			        font-size: 0.95rem;
			        transition: color 0.3s ease;
			    }
		
		
		
		
		.board-main-title {
			font-size: 2.2rem;
			font-weight: 800;
			margin: 30px 0;
			text-align: center;
		}

		.nav-tabs-board {
			display: flex;
			justify-content: center;
			gap: 40px;
			margin-bottom: 30px;
			border-bottom: 1px solid #eee;
			position: relative;
		}

		.board-tab {
			background: none;
			border: none;
			font-size: 1.1rem;
			font-weight: 700;
			color: #aaa;
			padding: 0 10px 15px 10px;
			cursor: pointer;
			transition: color 0.3s;
		}

		.board-tab.active {
			color: #000;
		}
		.board-tab.active.user {
			color: #000;
			border-bottom: 2px solid var(--board-blue);
		}
		.board-tab.active.creator {
			color: #000;
			border-bottom: 2px solid var(--board-orange);
		}

		.tab-indicator {
			position: absolute;
			bottom: -1px;
			height: 3px;
			background-color: var(--board-orange);
			border-radius: 3px 3px 0 0;
			transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
			left: 0;
			width: 0;
		}

		.board-search-container {
			max-width: 600px;
			margin: 0 auto 40px;
			position: relative;
		}

		.board-search-input {
			border: 2px solid #ddd;
			border-radius: 30px;
			padding: 12px 25px;
			width: 100%;
			outline: none;
			box-sizing: border-box;
			font-size: 0.95rem;
		}

		.board-search-icon {
			position: absolute;
			right: 20px;
			top: 50%;
			transform: translateY(-50%);
			color: #333;
			font-size: 1.2rem;
			background: none;
			border: none;
			cursor: pointer;
		}

		.board-content-wrapper {
			width: 100%;
			position: relative;
		}

		.tab-content {
			display: none;
			width: 100%;
		}

		.tab-content.active {
			display: block;
		}

		.slide-in-right {
			animation: slideInRight 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
		}

		.slide-in-left {
			animation: slideInLeft 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
		}

		@keyframes slideInRight {
			from {
				opacity: 0;
				transform: translateX(30px);
			}

			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		@keyframes slideInLeft {
			from {
				opacity: 0;
				transform: translateX(-30px);
			}

			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		.table-board {
			width: 100%;
			border-collapse: collapse;
			text-align: center;
			table-layout: fixed;
		}

		.table-board th,
		.table-board td {
			font-size: 1.1rem;
			padding: 15px 10px;
		}

		.user-board-table thead {
			background-color: var(--board-blue);
			color: #fff;
		}

		.user-board-table td {
			border-bottom: 2px solid var(--user-blue-line);
		}

		.creator-board-table {
			border: 1px solid var(--board-orange);
		}

		.creator-board-table thead {
			border-bottom: 2px solid var(--board-orange);
			color: var(--board-orange);
		}

		.board-top-actions {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}

		.btn-write {
			background-color: var(--board-blue);
			color: #fff;
			border: none;
			border-radius: 4px;
			padding: 8px 22px;
			font-weight: bold;
			cursor: pointer;
			text-decoration: none;
			font-size: 0.9rem;
		}

		/* 3. 시안과 동일한 빨간 밑줄 페이지네이션 */
		       .custom-pagination .page-link {
		           border: none; color: #333; font-weight: 700;
		           background: none; padding: 2px 10px;
		           font-size: 1.1rem;
		       }
		       .custom-pagination .page-item.active .page-link {
		           background: none; color: #333; /* 글자는 검정 */
		           border-bottom: 3px solid #f05a28; /* 주황-빨강 계열 밑줄 */
		           border-radius: 0;
		       }
		       .custom-pagination .page-item.disabled .page-link { color: #ccc; }
		       .custom-pagination .page-link:hover { color: #f05a28; }

		.pagination-custom .active a {
			color: var(--board-orange);
		}
	</style>
</head>

<body>

	<th:block layout:fragment="content">

		<div class="board-container">

			<section class="py-5 bg-white">
					    <div class="container">
					        <div class="row text-center g-4 justify-content-center">
					            
								<div class="col-4 col-md-2">
								                    <a th:href="@{/content/art/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img" alt="일러스트"></div>
								                        <div class="fw-bold">일러스트</div>
								                    </a>
								                </div>
								                <div class="col-4 col-md-2">
								                    <a th:href="@{/content/comic/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/comic.png}" class="category-icon-img" alt="만화"></div>
								                        <div class="fw-bold">만화</div>
								                    </a>
								                </div>
								                <div class="col-4 col-md-2">
								                    <a th:href="@{/content/music/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img" alt="음악"></div>
								                        <div class="fw-bold">음악</div>
								                    </a>
								                </div>
								                <div class="col-4 col-md-2">
								                    <a th:href="@{/content/video/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오"></div>
								                        <div class="fw-bold">비디오</div>
								                    </a>
								                </div>
								                <div class="col-4 col-md-2">
								                    <a th:href="@{/content/novel/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img" alt="소설"></div>
								                        <div class="fw-bold">소설</div>
								                    </a>
								                </div>
								                <div class="col-4 col-md-2">
								                    <a th:href="@{/content/file/list}" class="text-dark category-item d-block text-decoration-none">
								                        <div class="icon-box"><img th:src="@{/images/folder.png}" class="category-icon-img" alt="파일"></div>
								                        <div class="fw-bold">파일</div>
								                    </a>
								                </div>

					        </div>
					    </div>
					</section>

			<h1 class="board-main-title">게시판</h1>

			<div class="nav-tabs-board">
			    <a th:href="@{/board(type='NORMAL')}" 
			       class="board-tab" 
			       th:classappend="${type.name() == 'NORMAL'} ? 'active user' : ''">유저 게시판</a>
			    
			    <a th:href="@{/board(type='CREATOR')}" 
			       class="board-tab" 
			       th:classappend="${type.name() == 'CREATOR'} ? 'active creator' : ''">창작자 게시판</a>
			    
			    <div id="tabIndicator" class="tab-indicator"></div>
			</div>

			<div class="board-search-container">
				<form th:action="@{/board/search}" method="get">
					<input type="text" name="keyword" class="board-search-input" placeholder="검색어를 입력하세요">
					<button type="submit" class="board-search-icon">
						<i class="bi bi-search"></i>
					</button>
				</form>
			</div>

			<div class="board-content-wrapper">

				<div class="tab-content active" id="content-user">

					<div class="board-top-actions">
						<a onclick="return requireLoginAction(() => location.href='/board/write')" class="btn-write">글 작성</a>

						<nav th:if="${!boardList.isEmpty()}">
						    <ul class="pagination custom-pagination mb-0">
						        <li class="page-item" th:classappend="${!boardList.hasPrevious} ? 'disabled'">
						            <a class="page-link" th:href="@{|?page=${boardList.number - 1}|}">&lt;</a>
						        </li>
						        
						        <li class="page-item active"><a class="page-link" href="#" th:text="${boardList.number + 1}">1</a></li>
						        
						        <li class="page-item" th:classappend="${!boardList.hasNext} ? 'disabled'">
						            <a class="page-link" th:href="@{|?page=${boardList.number + 1}|}">&gt;</a>
						        </li>
						    </ul>
						</nav>
					</div>

					<table class="table-board" 
					       th:classappend="${type.name() == 'CREATOR'} ? 'creator-board-table' : 'user-board-table'">
					    <thead>
					        <tr>
					            <th style="width:10%;">번호</th>
					            <th style="width:50%;">제목</th>
					            <th style="width:15%;">작성자</th>
					            <th style="width:15%;">날짜</th>
					            <th style="width:10%;">조회수</th>
					        </tr>
					    </thead>
					    <tbody>
					        <tr th:each="board, boardStat : ${boardList}">
					            <td th:text="${boardStat.count}">1</td>
					            <td style="text-align:left;padding-left:20px;">
									<a th:href="@{/board/detail/{id}(id=${board.id})}" 
								       th:text="${board.title}" 
								       style="display: block; width: 100%; height: 100%; padding-left: 20px; text-decoration: none; color: inherit;">
								       제목
								    </a>
								</td>
					            <td th:text="${board.username}">닉네임</td>
					            <td th:text="${#temporals.format(board.updatedAt != null ? board.updatedAt : board.createdAt, 'yyyy.MM.dd')}">2026.03.15</td>
					            <td th:text="${board.viewCount}">1</td>
					        </tr>
					    </tbody>
					</table>

				</div>

				<nav th:if="${!boardList.isEmpty()}">
				    <ul class="pagination justify-content-center custom-pagination mt-4">
				        
				        <li class="page-item" th:classappend="${!boardList.hasPrevious} ? 'disabled'">
				            <a class="page-link" th:href="@{|?page=${boardList.number - 1}|}">&lt;</a>
				        </li>
				        
				        <li class="page-item" 
				            th:each="i : ${#numbers.sequence(
				                (boardList.number - 2 < 0 ? 0 : boardList.number - 2), 
				                (boardList.number + 2 >= boardList.totalPages ? boardList.totalPages - 1 : boardList.number + 2)
				            )}"
				            th:classappend="${i == boardList.number} ? 'active'">
				            <a class="page-link" th:href="@{|?page=${i}|}" th:text="${i + 1}">1</a>
				        </li>
				        
				        <li class="page-item" th:classappend="${!boardList.hasNext} ? 'disabled'">
				            <a class="page-link" th:href="@{|?page=${boardList.number + 1}|}">&gt;</a>
				        </li>
				        
				    </ul>
				</nav>
				<div class="tab-content" id="content-creator">

					<div class="board-top-actions">

						<a href="/write" class="btn-write" style="background-color:var(--board-orange);">창작물 등록</a>

						<ul class="pagination-custom">
							<li class="active"><a href="#">1</a></li>
						</ul>

					</div>

					<table class="table-board creator-board-table">

						<thead>
							<tr>
								<th style="width:10%;">번호</th>
								<th style="width:50%;">제목</th>
								<th style="width:15%;">작성자</th>
								<th style="width:15%;">날짜</th>
								<th style="width:10%;">조회수</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="i : ${#numbers.sequence(1,10)}">
								<td>[[${i}]]</td>
								<td style="text-align:left;padding-left:20px;">창작 결과물 제목</td>
								<td>닉네임</td>
								<td>2026.03.12</td>
								<td>1</td>
							</tr>

						</tbody>
					</table>

				</div>

			</div>

		</div>

	</th:block>

	

</body>

</html>
