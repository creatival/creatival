<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<div class="container-fluid p-0" layout:fragment="content">
    
    <style>
        /* 1. 카테고리 아이콘 및 레이아웃 최적화 */
        .category-item { 
            transition: transform 0.2s ease; 
        }
        .category-item:hover { 
            transform: translateY(-5px); 
        }
        
        .icon-box {
            width: 80px; 
            height: 80px; 
            background-color: #F8F9FA; 
            border-radius: 22px;
            margin: 0 auto 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; /* 이미지가 박스 밖으로 나가는 것 방지 */
            border: 1px solid #eee;
        }

        .category-icon-img {
            width: 100%;       /* 박스 너비에 맞춤 */
            height: 100%;      /* 박스 높이에 맞춤 */
            object-fit: contain; /* 이미지 비율 유지하며 박스 안에 맞춤 */
            padding: 15px;     /* 아이콘 주변 적절한 여백 */
        }

        /* 2. 게시판 바로가기 섹션 스타일 */
        .board-go-section {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08) !important;
        }
        .rounded-5 {
            border-radius: 2rem !important;
        }

        /* 3. 공통 호버 효과 */
        .hover-card {
            transition: all 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-8px);
        }
    </style>

    <header class="bg-light py-5">
        <div id="carouselExampleIndicators" class="carousel slide container" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
            </div>
            <div class="carousel-inner rounded shadow-sm">
                <div class="carousel-item active">
                    <div class="d-flex align-items-center justify-content-center bg-secondary-subtle" style="height: 400px;">
                        <img src="/images/placeholder.png" alt="슬라이드 1">
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex align-items-center justify-content-center bg-secondary-subtle" style="height: 400px;">
                        <img src="/images/placeholder.png" alt="슬라이드 2">
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon bg-dark rounded-circle p-3"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon bg-dark rounded-circle p-3"></span>
            </button>
        </div>
    </header>

    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 justify-content-center">
                
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/art/list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${artIconUrl != null ? artIconUrl : '/images/paint.png'}" 
                                 class="category-icon-img" alt="일러스트">
                        </div>
                        <div class="fw-bold">일러스트</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/comic_list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${comicIconUrl != null ? comicIconUrl : '/images/comic.png'}" 
                                 class="category-icon-img" alt="만화">
                        </div>
                        <div class="fw-bold">만화</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/music_list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${musicIconUrl != null ? musicIconUrl : '/images/sing.png'}" 
                                 class="category-icon-img" alt="음악">
                        </div>
                        <div class="fw-bold">음악</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/Illustration_list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${videoIconUrl != null ? videoIconUrl : '/images/yutu.png'}" 
                                 class="category-icon-img" alt="비디오">
                        </div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel_list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${novelIconUrl != null ? novelIconUrl : '/images/git.png'}" 
                                 class="category-icon-img" alt="소설">
                        </div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/Illustration_list}" class="text-decoration-none text-dark category-item d-block">
                        <div class="icon-box">
                            <img th:src="${fileIconUrl != null ? fileIconUrl : '/images/folder.png'}" 
                                 class="category-icon-img" alt="파일">
                        </div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>

            </div>
        </div>
    </section>

    <section class="py-5 bg-white border-top">
        <div class="container text-center">
            <div class="p-5 bg-light rounded-5 shadow-sm d-flex flex-column flex-md-row align-items-center justify-content-between px-md-5 hover-lift">
                <div class="text-md-start mb-3 mb-md-0">
                    <h3 class="fw-bold mb-1">커뮤니티 광장</h3>
                    <p class="text-muted mb-0">다양한 창작자들과 자유롭게 이야기를 나누어 보세요.</p>
                </div>
                <a th:href="@{/board}" class="btn btn-dark px-5 py-3 rounded-pill fw-bold shadow-sm">
                    게시판 바로가기 <i class="bi bi-arrow-right-short ms-2"></i>
                </a>
            </div>
        </div>
    </section>

    <section class="py-5 bg-white">
        <div class="container text-center">
            <h2 class="fw-bold mb-1"><a th:href="@{team/list}">팀 프로젝트</a></h2>
            <p class="text-muted mb-5">팀 프로젝트 가입하기</p>
            <div class="row g-4">
                <div class="col-md-4" th:each="i : ${#numbers.sequence(1,3)}">
                    <div class="card h-100 border-0 shadow-sm text-start hover-card">
                        <div class="bg-secondary-subtle d-flex align-items-center justify-content-center" style="height: 200px;">
                            <i class="bi bi-image text-white fs-1"></i>
                        </div>
                        <div class="card-body">
                            <p class="text-muted small mb-1">분류</p>
                            <h5 class="card-title fw-bold">팀 프로젝트 이름</h5>
                            <p class="card-text text-muted small">프로젝트 내용</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container text-center">
            <h2 class="fw-bold mb-1">추천 일러스트</h2>
            <a th:href="@{/content/art/list}" class="text-muted d-block mb-5">일러스트 페이지로 이동</a>
            <div class="row row-cols-2 row-cols-md-4 g-4">
                <div class="col" th:each="i : ${#numbers.sequence(1,12)}">
                    <div class="card border-0 shadow-sm h-100 hover-card">
                        <div class="bg-secondary-subtle d-flex align-items-center justify-content-center" style="aspect-ratio: 1/1;">
                            <i class="bi bi-image text-white fs-2"></i>
                        </div>
                        <div class="card-body p-3 text-start">
                            <h6 class="fw-bold mb-2">일러스트 명</h6>
                            <div class="d-flex align-items-center">
                                <div class="bg-secondary rounded-circle me-2" style="width: 24px; height: 24px;"></div>
                                <span class="small text-muted">작가이름</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5 bg-white">
        <div class="container text-center">
            <h2 class="fw-bold mb-1">추천 소설</h2>
            <a th:href="@{/content/novel_list}" class="text-muted d-block mb-5">소설 페이지로 이동</a>
            <div id="novelCarousel" class="carousel slide" data-bs-ride="false">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="row g-4 justify-content-center">
                            <div class="col-md-3" th:each="i : ${#numbers.sequence(1,3)}">
                                <div class="bg-secondary-subtle rounded shadow-sm mx-auto hover-card" style="width: 240px; height: 340px;">
                                    <div class="w-100 h-100 d-flex align-items-center justify-content-center text-white">
                                        <i class="bi bi-book fs-1"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
</html>
