<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>후원 기록</title>
    <style>
        /* 커스텀 스타일 */
        .stat-card {
            background: linear-gradient(135deg, #2D3278, #4b52ad);
            color: white;
            border-radius: 15px;
            border: none;
        }
        .history-item {
            border-radius: 10px;
        }
        .comic-thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container d-flex justify-content-center">
            <div class="col-lg-8">
                
                <div class="mb-4 text-center">
                    <h3 class="fw-bold text-dark">나의 후원 기록</h3>
                    <p class="text-muted mb-0">작가님들을 향한 따뜻한 응원 내역입니다.</p>
                </div>

				<div class="row mb-4 g-3">
				    <div class="col-12">
				        <div class="card stat-card shadow-sm p-3 text-center">
				            <h6 class="opacity-75 mb-1">총 후원 코인</h6>
				            <h2 class="fw-bold mb-0">12,500 <span class="fs-5 fw-normal"></span></h2>
				        </div>
				    </div>
				</div>

                <h5 class="fw-bold mb-3 mt-4">상세 내역</h5>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        
                        <div class="d-flex align-items-center p-4 border-bottom history-item">
                            <div class="flex-shrink-0 me-3">
                                <div class="bg-secondary bg-opacity-25 d-flex justify-content-center align-items-center comic-thumbnail">
                                    <i class="bi bi-image text-muted"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1">
                                <div class="mb-1">
                                    <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-2 py-1 me-2" style="font-size: 0.75rem;">후원 완료</span>
                                    <small class="text-muted">2026. 04. 12</small>
                                </div>
                                <h6 class="fw-bold mb-1">1화. 새로운 시작 <span class="text-muted fw-normal fs-6">| 우주 최강 만화</span></h6>
                                <p class="mb-0 text-muted" style="font-size: 0.85rem;">"작가님 항상 응원합니다! 다음 화도 기대할게요."</p>
                            </div>
                            <div class="ms-3 text-end flex-shrink-0">
                                <h5 class="fw-bold text-dark mb-0">- 500</h5>
                            </div>
                        </div>

                        <div class="d-flex align-items-center p-4 border-bottom history-item">
                            <div class="flex-shrink-0 me-3">
                                <div class="bg-secondary bg-opacity-25 d-flex justify-content-center align-items-center comic-thumbnail">
                                    <i class="bi bi-image text-muted"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1">
                                <div class="mb-1">
                                    <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-2 py-1 me-2" style="font-size: 0.75rem;">후원 완료</span>
                                    <small class="text-muted">2026. 04. 05</small>
                                </div>
                                <h6 class="fw-bold mb-1">외전. 주인공의 과거 <span class="text-muted fw-normal fs-6">| 로맨스 판타지</span></h6>
                                <p class="mb-0 text-muted" style="font-size: 0.85rem;">응원 메시지 없이 후원했습니다.</p>
                            </div>
                            <div class="ms-3 text-end flex-shrink-0">
                                <h5 class="fw-bold text-dark mb-0">- 1,000</h5>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
