<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<div class="container-fluid" layout:fragment="content">

    <style>
        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
        .icon-box {
            width: 80px; height: 80px;
            background-color: #F8F9FA;
            border-radius: 22px;
            margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #eee;
        }
        .category-icon-img { width: 100%; height: 100%; object-fit: contain; padding: 18px; }
        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }

        .list-row {
            border-bottom: 1px solid #eee;
            padding: 16px 10px;
            transition: background-color 0.2s;
        }
        .list-row:hover { background-color: #f8f9fa; }

        .pagination-container {
            display: flex; flex-direction: column; align-items: center;
            margin-top: 40px; margin-bottom: 40px;
        }
        .pagination-numbers {
            display: flex; gap: 20px; font-weight: bold;
            border-bottom: 2px solid #f05a28;
            padding-bottom: 5px;
        }
        .pagination-numbers a { text-decoration: none; color: #333; }
        .pagination-numbers a.active { color: #f05a28; }
        .pagination-numbers a.disabled { visibility: hidden; }

        #productKeyInput {
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>

    <!-- 카테고리 -->
    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 justify-content-center">

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/art/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img"></div>
                        <div class="fw-bold">일러스트</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/comic/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/comic.png}" class="category-icon-img"></div>
                        <div class="fw-bold">만화</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/music/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img"></div>
                        <div class="fw-bold">음악</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/video/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img"></div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img"></div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>

                <div class="col-4 col-md-2">
                    <a th:href="@{/content/file/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/folder.png}" class="category-icon-img"></div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>

            </div>
        </div>
    </section>

    <!-- 헤더 -->
    <div class="container mb-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">

            <div style="flex:1;">
                <a href="/" class="btn btn-link text-dark p-0 d-flex align-items-center">
                    <i class="bi bi-house-door-fill me-2"></i>
                    홈
                </a>
            </div>

            <div class="text-center" style="flex:2;">
                <h2 class="fw-bold mb-0">파일 자료실</h2>
            </div>

            <div class="d-flex gap-2 justify-content-end" style="flex:1;">
                <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#keyRegisterModal">
                    코드 등록
                </button>

                <a onclick="return requireLoginAction(() => location.href='/content/file/write')"
                   class="btn btn-primary">
                    파일 등록
                </a>
            </div>

        </div>
    </div>

    <!-- 리스트 -->
    <main class="container" style="max-width:900px;">

        <div class="d-flex text-muted small fw-bold px-2 mb-2 border-bottom pb-2">
            <div class="col-4">작성자</div>
            <div class="col-4 text-center">파일명</div>
            <div class="col-4 text-end">상태</div>
        </div>

        <div th:each="file : ${fileList}" class="list-row d-flex align-items-center">
            <div class="col-4 d-flex align-items-center">
                <i class="bi bi-person-circle me-2 text-muted"></i>
                <span th:text="${file.displayname + ' (' + file.username + ')'}"></span>
            </div>

            <div class="col-4 text-center">
                <a th:href="@{/content/file/detail/{id}(id=${file.id})}"
                   th:text="${file.title}"
                   class="fw-bold text-dark text-decoration-none"></a>
            </div>

            <div class="col-4 text-end"></div>
        </div>

        <div class="text-center py-5" th:if="${fileList.isEmpty()}">
            등록된 파일이 없습니다.
        </div>

        <!-- pagination 하나만 유지 -->
        <div class="pagination-container" th:if="${!fileList.isEmpty()}">
            <div class="pagination-numbers">
                <a th:href="@{|?page=${fileList.number - 1}|}"
                   th:classappend="${!fileList.hasPrevious} ? 'disabled' : ''">&lt;</a>

                <th:block th:each="p : ${#numbers.sequence(0, fileList.totalPages - 1)}">
                    <a th:if="${p >= fileList.number - 2 and p <= fileList.number + 2}"
                       th:href="@{|?page=${p}|}"
                       th:text="${p+1}"
                       th:classappend="${p == fileList.number} ? 'active' : ''"></a>
                </th:block>

                <a th:href="@{|?page=${fileList.number + 1}|}"
                   th:classappend="${!fileList.hasNext} ? 'disabled' : ''">&gt;</a>
            </div>
        </div>

    </main>

</div>
</html>
