<html layout:decorate="~{layout}">
<div class="container-fluid" layout:fragment="content">
    <style>
        /* 카테고리 아이콘 스타일: seungjae 디자인의 둥근 사각형 적용 */
        .category-icon {
            width: 65px;
            height: 65px;
            background-color: #eaebf3;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            transition: all 0.2s ease-in-out;
        }

        .category-icon img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .shortcut-link:hover .category-icon {
            background-color: #daddf0;
            transform: translateY(-5px);
        }

        /* 리스트 스타일: 깔끔한 라인과 간격 */
        .list-row {
            border-bottom: 2px solid #ffcec5; /* 시안의 살구색 라인 */
            padding: 12px 10px;
        }

        /* 하단 페이징 라인 디자인 */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .pagination-numbers {
            display: flex;
            gap: 20px;
            font-weight: bold;
            border-bottom: 2px solid #e05238;
            padding-bottom: 5px;
        }

        .pagination-numbers a {
            text-decoration: none;
            color: #333;
        }

        .pagination-numbers a.active {
            color: #e05238;
        }

        .pagination-numbers a.disabled {
            visibility: hidden;
        }

        /* 작성 버튼 스타일 */
        .btn-write {
            background-color: #3e467d;
            color: white;
            padding: 10px 50px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
        }
    </style>

    <main class="py-5 mx-auto col-11 col-lg-10">
        <div class="row text-center g-3 justify-content-center mb-5">
            <div class="col-4 col-md-2">
                <a th:href="@{/Illustration_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/paint.png}" alt="일러스트"></div>
                    <div class="small fw-bold">일러스트</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/comic_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/comic.png}" alt="만화"></div>
                    <div class="small fw-bold">만화</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/music_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/sing.png}" alt="음원"></div>
                    <div class="small fw-bold">음원</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/video_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/yutu.png}" alt="비디오"></div>
                    <div class="small fw-bold">비디오</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/novel_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/git.png}" alt="웹소설"></div>
                    <div class="small fw-bold">웹소설</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/file_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/folder.png}" alt="파일"></div>
                    <div class="small fw-bold">파일</div>
                </a>
            </div>
        </div>

        <div class="text-center mb-5">
            <p class="text-muted small mb-1">파일 목록</p>
            <h2 class="fw-bold">파일</h2>
        </div>

        <div class="mb-5">
            <div th:each="file : ${fileList}" class="list-row d-flex justify-content-between align-items-center w-75  mx-auto">
                <div class="d-flex align-items-center col-3">
                    <span class="small fw-medium" th:text="${file.displayname + '(' + file.username + ')'}">사용자(아이디)</span>
                </div>
                <div class="text-center" style="flex: 1;">
                    <a class="small fw-bold text-dark text-decoration-none" 
                       th:text="${file.title}" 
                       th:href="@{/content/file/detail/{id}(id=${file.id})}">
                       파일 제목이 여기에 표시됩니다
                    </a>
                </div>
            </div>
        </div>

        <div class="d-flex flex-column align-items-center">
            <div class="pagination-container" th:if="${!fileList.isEmpty()}">
                <div class="pagination-numbers">
                    <a th:href="@{|?page=${fileList.number - 1}|}" 
                       th:classappend="${!fileList.hasPrevious} ? 'disabled' : ''">&lt;</a>

                    <th:block th:each="page: ${#numbers.sequence(0, fileList.totalPages - 1)}">
                        <a th:if="${page >= fileList.number - 2 and page <= fileList.number + 2}"
                           th:href="@{|?page=${page}|}"
                           th:text="${page + 1}"
                           th:classappend="${page == fileList.number} ? 'active' : ''">
                        </a>
                    </th:block>

                    <a th:href="@{|?page=${fileList.number + 1}|}" 
                       th:classappend="${!fileList.hasNext} ? 'disabled' : ''">&gt;</a>
                </div>
            </div>
            
            <a th:href="@{/content/file/write}" class="btn-write">
               파일작성
            </a>
        </div>

    </main>
</div>
</html>
