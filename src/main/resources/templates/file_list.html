<html layout:decorate="~{layout}">
<div class="container" layout:fragment="content">
    
	<style>
	        /* 기존 스타일 유지 */
	        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
	        .icon-box {
	            width: 80px; height: 80px; 
	            background-color: #F8F9FA; border-radius: 22px;
	            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
	            overflow: hidden; border: 1px solid #eee; transition: all 0.3s ease;
	        }
	        .category-icon-img { width: 100%; height: 100%; object-fit: contain; padding: 18px; }
	        
	        .category-item:hover { transform: translateY(-8px); }

	        .category-item .fw-bold { color: #3B4371; font-size: 0.95rem; }


	        /* 리스트 전용 스타일 */
	        .list-row { border-bottom: 2px solid #ffcec5; }
	    </style>

		<section class="py-5 bg-white">
		        <div class="container">
		            <div class="row text-center g-4 g-md-5 justify-content-center">
		                
		                <div class="col-4 col-md-2">
		                    <a th:href="@{/Illustration_list}" class="category-item d-block">
		                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img" alt="일러스트"></div>
		                        <div class="fw-bold">일러스트</div>
		                    </a>
		                </div>

		                <div class="col-4 col-md-2">
		                    <a th:href="@{/comic_list}" class="category-item d-block">
		                        <div class="icon-box"><img th:src="@{/images/comic.png}" class="category-icon-img" alt="만화"></div>
		                        <div class="fw-bold">만화</div>
		                    </a>
		                </div>

		                <div class="col-4 col-md-2">
		                    <a th:href="@{/music_list}" class="category-item d-block">
		                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img" alt="음악"></div>
		                        <div class="fw-bold">음악</div>
		                    </a>
		                </div>

		                <div class="col-4 col-md-2">
		                    <a th:href="@{/video_list}" class="category-item d-block">
		                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오"></div>
		                        <div class="fw-bold">비디오</div>
		                    </a>
		                </div>

		                <div class="col-4 col-md-2">
		                    <a th:href="@{/content/novel_list}" class="category-item d-block">
		                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img" alt="소설"></div>
		                        <div class="fw-bold">소설</div>
		                    </a>
		                </div>


		            </div>
		        </div>
		    </section>

		    <main class="pb-5 mx-auto" style="max-width: 650px;">
		        <div class="text-center mb-4">
		            <a th:href="@{/}" class="text-muted text-decoration-none small mb-3 d-inline-block">파일 올리기</a>
		            <h3 class="fw-bold">파일</h3>
		        </div>

		        <div class="mt-4 mb-4">
		            <div th:each="num : ${#numbers.sequence(1, 14)}" class="list-row d-flex justify-content-between align-items-center py-2 px-1">
		                <div class="d-flex align-items-center gap-2">
		                    <span class="small fw-medium">나네참새(아이디)</span>
		                </div>
		                <div class="small fw-bold">제목</div>
		            </div>
		        </div>
		        
		        </main>
</div>
</html>
