<html layout:decorate="~{layout}">
<div class="container-fluid" layout:fragment="content"> <style>
        /* 카테고리 아이콘 스타일: 시안의 둥근 사각형 디자인 적용 */
        .category-icon {
            width: 65px;
            height: 65px;
            background-color: #eaebf3; /* 시안의 연한 배경색 */
            border-radius: 20px;       /* 둥근 사각형 곡률 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            transition: all 0.2s ease-in-out;
        }
        
        /* 이미지 크기 제어 */
        .category-icon img {
            width: 35px; 
            height: 35px;
            object-fit: contain;
        }

        .shortcut-link:hover .category-icon {
            background-color: #daddf0;
            transform: translateY(-5px);
        }

        /* 리스트 스타일 */
        .list-row {
            border-bottom: 2px solid #ffcec5; /* 시안의 살구색 라인 */
            padding: 12px 10px;
        }

        .list-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #999;
            border-radius: 3px;
            margin-right: 15px;
        }

        /* 하단 페이징 라인 */
        .pagination-numbers {
            display: flex;
            gap: 20px;
            font-weight: bold;
            border-bottom: 2px solid #e05238;
            padding-bottom: 5px;
            margin-bottom: 30px;
        }
    </style>

    <main class="py-5 mx-auto col-11 col-lg-10">
        
        <div class="row text-center g-3 justify-content-center mb-5">
            <div class="col-4 col-md-2">
                <a th:href="@{/Illustration_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/paint.png}" alt="일러스트"></div>
                    <div class="small fw-bold">일러스트</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/comic_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/comic.png}" alt="만화"></div>
                    <div class="small fw-bold">만화</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/music_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/sing.png}" alt="음원"></div>
                    <div class="small fw-bold">음원</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/video_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/yutu.png}" alt="비디오"></div>
                    <div class="small fw-bold">비디오</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/novel_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/git.png}" alt="웹소설"></div>
                    <div class="small fw-bold">웹소설</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/file_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/folder.png}" alt="파일"></div>
                    <div class="small fw-bold">파일</div>
                </a>
            </div>
        </div>

        <div class="text-center mb-5">
            <p class="text-muted small mb-1">홈 페이지로 돌아가기</p>
            <h2 class="fw-bold">파일</h2>
        </div>

        <div class="mb-5">
            <div th:each="num : ${#numbers.sequence(1, 15)}" class="list-row d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="list-checkbox"></div> <span class="small fw-medium">나네참새(아이디)</span>
                </div>
                <div class="small fw-bold text-center" style="flex: 1;">
                    제목
                </div>
            </div>
        </div>

        <div class="d-flex flex-column align-items-center">
            <div class="pagination-numbers">
                <a href="#" class="text-dark text-decoration-none">&lt;</a>
                <a href="#" class="text-decoration-none" style="color: #e05238;">1</a>
                <a href="#" class="text-dark text-decoration-none">2</a>
                <a href="#" class="text-dark text-decoration-none">3</a>
                <a href="#" class="text-dark text-decoration-none">4</a>
                <a href="#" class="text-dark text-decoration-none">5</a>
                <a href="#" class="text-dark text-decoration-none">&gt;</a>
            </div>
            
			<a th:href="@{/content/file_write}" 
			   class="btn px-5 py-2 fw-bold" 
			   style="background-color: #3e467d; color: white; text-decoration: none;">
			   파일작성
			</a>
        </div>

    </main>
</div>
</html>
