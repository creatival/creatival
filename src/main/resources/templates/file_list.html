<!-- 리스트 -->
<div th:each="file : ${fileList}" 
     class="list-row d-flex justify-content-between align-items-center">

    <!-- 작성자 -->
    <div class="d-flex align-items-center col-4">
        <i class="bi bi-person-circle me-2 text-muted"></i>
        <span class="small fw-medium"
              th:text="${file.displayname + ' (' + file.username + ')'}">
        </span>
    </div>

    <!-- 파일명 -->
    <div class="text-center col-4">
        <a class="small fw-bold text-dark text-decoration-none"
           th:text="${file.title}"
           th:href="@{/content/file/detail/{id}(id=${file.id})}">
        </a>
    </div>

    <!-- 상태 -->
    <div class="col-4 text-end">
        <!-- 나중에 확장용 (지금은 비워둠) -->
    </div>

</div>

<!-- 빈 상태 -->
<div class="text-center py-5" th:if="${fileList.isEmpty()}">
    <p class="text-muted">등록된 파일이 없습니다.</p>
</div>

<!-- 🔥 pagination (하나만 유지) -->
<div class="pagination-container" th:if="${!fileList.isEmpty()}">
    <div class="pagination-numbers">

        <a th:href="@{|?page=${fileList.number - 1}|}"
           th:classappend="${!fileList.hasPrevious} ? 'disabled' : ''">&lt;</a>

        <th:block th:each="page: ${#numbers.sequence(0, fileList.totalPages - 1)}">
            <a th:if="${page >= fileList.number - 2 and page <= fileList.number + 2}"
               th:href="@{|?page=${page}|}"
               th:text="${page + 1}"
               th:classappend="${page == fileList.number} ? 'active' : ''">
            </a>
        </th:block>

        <a th:href="@{|?page=${fileList.number + 1}|}"
           th:classappend="${!fileList.hasNext} ? 'disabled' : ''">&gt;</a>

    </div>
</div>
