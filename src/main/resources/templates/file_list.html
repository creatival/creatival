<html layout:decorate="~{layout}">
<div class="container-fluid" layout:fragment="content">
    <style>
        /* 카테고리 아이콘 스타일: 시안의 둥근 사각형 디자인 적용 */
        .category-icon {
            width: 65px;
            height: 65px;
            background-color: #eaebf3; /* 시안의 연한 배경색 */
            border-radius: 20px;       /* 둥근 사각형 곡률 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            transition: all 0.2s ease-in-out;
        }
        
        /* 이미지 크기 제어 */
        .category-icon img {
            width: 35px; 
            height: 35px;
            object-fit: contain;
        }

		.custom-pagination .page-item.active .page-link {
            background: none; color: #333; /* 글자는 검정 */
            border-bottom: 3px solid #f05a28; /* 주황-빨강 계열 밑줄 */
            border-radius: 0;
        }
        
        .custom-pagination .page-item.disabled .page-link { color: #ccc; }
        .custom-pagination .page-link:hover { color: #f05a28; }
        
        .category-text {
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
        }

        .shortcut-link:hover .category-icon {
            background-color: #daddf0;
            transform: translateY(-5px);
        }

        /* 리스트 스타일 */
        .list-row {
            border-bottom: 2px solid #ffcec5; /* 시안의 살구색 라인 */
            padding: 12px 10px;
        }

        .list-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #999;
            border-radius: 3px;
            margin-right: 15px;
        }

        /* 하단 페이징 라인 */
        .pagination-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pagination-numbers {
            display: flex;
            gap: 20px;
            font-weight: bold;
            border-bottom: 2px solid #e05238;
            padding-bottom: 5px;
            margin-bottom: 30px;
        }
        
        .pagination-numbers a {
            color: #333;
            text-decoration: none;
        }
        
        .pagination-numbers a.arrow {
            color: #333;
        }
    </style>

    <main class="py-5 mx-auto col-11 col-lg-10">
        
        <div class="row text-center g-3 justify-content-center mb-5">
            <div class="col-4 col-md-2">
                <a th:href="@{/Illustration_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/paint.png}" alt="일러스트"></div>
                    <div class="small fw-bold">일러스트</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/comic_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/comic.png}" alt="만화"></div>
                    <div class="small fw-bold">만화</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/music_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/sing.png}" alt="음원"></div>
                    <div class="small fw-bold">음원</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/video_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/yutu.png}" alt="비디오"></div>
                    <div class="small fw-bold">비디오</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/novel_list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/git.png}" alt="웹소설"></div>
                    <div class="small fw-bold">웹소설</div>
                </a>
            </div>
            <div class="col-4 col-md-2">
                <a th:href="@{/content/file/list}" class="shortcut-link text-decoration-none text-dark">
                    <div class="category-icon"><img th:src="@{/images/folder.png}" alt="파일"></div>
                    <div class="small fw-bold">파일</div>
                </a>
            </div>
        </div>

        <div class="text-center mb-4">
            <a th:href="@{/content/file/write}" class="text-muted text-decoration-none small mb-3 d-inline-block">파일 올리기</a>
            <h3 class="fw-bold">파일</h3>
        </div>

        <div class="mt-4 mb-5">
            <div th:each="file : ${fileList}" class="list-row d-flex justify-content-between align-items-center py-2 px-1">
                <div class="d-flex align-items-center gap-2 col-2">
                    <span class="small fw-medium" th:text="${file.displayname + '(' + file.username + ')'}">나네참새(아이디)</span>
                </div>
                <a class="small fw-bold col-10 text-center text-decoration-none text-dark" th:text="${file.title}" th:href="@{/content/file/detail/{id}(id=${file.id})}">
                    제목
                </a>
            </div>
        </div>

        <div class="pagination-container" th:if="${!fileList.isEmpty()}">
            <div class="pagination-numbers">
                <a class="arrow" th:href="@{|?page=${fileList.number - 1}|}" 
                   th:classappend="${!fileList.hasPrevious} ? 'disabled' : ''"
                   th:style="${!fileList.hasPrevious} ? 'visibility:hidden' : ''">&lt;</a>

                <th:block th:each="page: ${#numbers.sequence(0, fileList.totalPages - 1)}">
                    <a th:if="${page >= fileList.number - 2 and page <= fileList.number + 2}"
                       th:href="@{|?page=${page}|}"
                       th:text="${page + 1}"
                       th:style="${page == fileList.number} ? 'color: #e05238; border-bottom: 2px solid #e05238;' : ''">
                    </a>
                </th:block>

                <a class="arrow" th:href="@{|?page=${fileList.number + 1}|}" 
                   th:classappend="${!fileList.hasNext} ? 'disabled' : ''"
                   th:style="${!fileList.hasNext} ? 'visibility:hidden' : ''">&gt;</a>
            </div>
            
            <a th:href="@{/content/file/write}" 
               class="btn px-5 py-2 fw-bold mt-4" 
               style="background-color: #3e467d; color: white; text-decoration: none;">
               파일작성
            </a>
        </div>

    </main>
</div>
</html>
