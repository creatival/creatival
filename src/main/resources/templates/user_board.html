<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 - Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS 파일을 건드리지 않기 위해 꼭 필요한 최소한의 디자인만 여기에 담았습니다. */
        .search-pill { border-radius: 50px; padding: 10px 20px; }
        .table-header-indigo { background-color: #3f51b5 !important; color: white; }
        .active-tab { color: #000 !important; border-bottom: 3px solid #ff6b6b !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container py-5">
        
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">게시판</h1>
        </div>

        <div class="d-flex justify-content-center mb-4 border-bottom" style="gap: 40px;">
            <a href="#" class="nav-link pb-2 active-tab">유저 게시판</a>
            <a href="#" class="nav-link pb-2 text-muted fw-bold">창작자 게시판</a>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-md-7">
                <div class="input-group border rounded-pill overflow-hidden px-3 shadow-sm">
                    <span class="input-group-text bg-transparent border-0 text-muted">🔍</span>
                    <input type="text" class="form-control border-0 shadow-none py-2" placeholder="검색어를 입력하세요">
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-end mb-2">
            <button class="btn btn-dark rounded-0 px-4" style="background-color: #2c3e50;">글 작성</button>
            
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">&lt;</a></li>
                    <li class="page-item"><a class="page-link border-0 text-danger fw-bold text-decoration-underline" href="#">1</a></li>
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">2</a></li>
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">3</a></li>
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">4</a></li>
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">5</a></li>
                    <li class="page-item"><a class="page-link border-0 text-dark" href="#">&gt;</a></li>
                </ul>
            </nav>
        </div>

        <div class="table-responsive">
            <table class="table table-hover text-center border-top border-dark border-2">
                <thead>
                    <tr class="table-header-indigo">
                        <th class="py-3" style="width: 8%;">번호</th>
                        <th class="py-3" style="width: 52%;">제목</th>
                        <th class="py-3" style="width: 15%;">작성자</th>
                        <th class="py-3" style="width: 15%;">날짜</th>
                        <th class="py-3" style="width: 10%;">조회수</th>
                    </tr>
                </thead>
                <tbody class="align-middle">
                    <tr>
                        <td class="py-3 text-muted">10</td>
                        <td class="py-3 text-start ps-4 fw-bold">게시판 구현 중입니다. 디자인 어떤가요?</td>
                        <td>창작자A</td>
                        <td class="text-muted">2026.02.17</td>
                        <td>124</td>
                    </tr>
                    <tr>
                        <td class="py-3 text-muted">9</td>
                        <td class="py-3 text-start ps-4 fw-bold">새로운 일러스트 업데이트 소식</td>
                        <td>작가나루</td>
                        <td class="text-muted">2026.02.16</td>
                        <td>85</td>
                    </tr>
                    <tr>
                        <td class="py-3 text-muted">8</td>
                        <td class="py-3 text-start ps-4 fw-bold">공지사항 드립니다. 확인 부탁드려요.</td>
                        <td>관리자</td>
                        <td class="text-muted">2026.02.15</td>
                        <td>320</td>
                    </tr>
                    <tr th:each="i : ${#numbers.sequence(1, 4)}">
                        <td class="py-3 text-muted">-</td>
                        <td class="py-3 text-start ps-4 fw-bold">리스트 샘플 데이터입니다.</td>
                        <td>닉네임</td>
                        <td class="text-muted">2026.02.12</td>
                        <td>12</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-5">
            <ul class="pagination justify-content-center border-0">
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">&lt;</a></li>
                <li class="page-item"><a class="page-link border-0 text-danger fw-bold text-decoration-underline mx-1" href="#">1</a></li>
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">2</a></li>
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">3</a></li>
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">4</a></li>
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">5</a></li>
                <li class="page-item"><a class="page-link border-0 text-dark mx-1" href="#">&gt;</a></li>
            </ul>
        </nav>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.min.js"></script>
</body>
</html>
