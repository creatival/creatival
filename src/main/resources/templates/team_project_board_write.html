<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
	
<head>
    <title>프로젝트 공지 작성 | Creatival</title>
	<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
	<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
</head>

<div layout:fragment="content">
    <style>
        /* [핵심] 모든 요소의 너비 계산 방식 고정 (터짐 방지) */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --border-color: #E9ECEF;
            --bg-light: #F8F9FA;
        }

        .write-container {
            max-width: 900px;
            margin: 3rem auto 5rem;
            padding: 0 20px;
        }

        /* 상단 헤더 중앙 정렬 */
        .write-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .write-header h2 {
            font-weight: 800;
            color: var(--brand-navy);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .write-header p { color: #666; font-size: 1.1rem; }

        /* 카드 스타일 */
        .write-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
        }

        /* 섹션 타이틀 - 주황색 세로 바 포인트 */
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--brand-navy);
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--brand-orange);
            border-radius: 10px;
        }

        /* [수정] 입력 그룹 - 라벨과 입력창 수직 정렬 */
        .form-row-custom {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
            width: 100%;
        }
        .form-row-custom .form-label {
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95rem;
        }
        .form-row-custom .form-control, 
        .form-row-custom .form-select {
            width: 100% !important;
            max-width: 100%;
            border: 1.5px solid #E9ECEF;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-row-custom .form-control:focus {
            border-color: var(--brand-navy);
            box-shadow: 0 0 0 4px rgba(59, 67, 113, 0.05);
            outline: none;
        }

        /* 작성자 정보 박스 */
        .info-box-static {
            background-color: #F8F9FF;
            border: 1px solid #EEF0FF;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 52px;
        }

        /* 연관 리소스 영역 (점선 박스) */
        .resource-group {
            background: #fdfdfd;
            border: 1px dashed #DDE2E6;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 1rem;
        }
        .preview-box {
            font-size: 0.8rem;
            margin-top: 6px;
            min-height: 18px;
            color: #777;
        }

        /* 파일 업로드 영역 */
        .file-upload-zone {
            border: 2px dashed #E9ECEF;
            border-radius: 15px;
            padding: 20px;
            background: #FAFBFC;
        }

        /* [수정] 하단 버튼 그룹 - 주황 아웃라인 & 네이비 */
        .btn-action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 3.5rem;
        }
        .btn-creativ {
            padding: 15px 50px;
            font-weight: 700;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 취소 버튼 (주황 아웃라인) */
        .btn-cancel-outline {
            background: #fff;
            color: var(--brand-orange);
            border: 2px solid var(--brand-orange);
        }
        .btn-cancel-outline:hover {
            background: #FFF5F2;
            transform: translateY(-2px);
        }

        /* 등록 버튼 (네이비 솔리드) */
        .btn-submit-solid {
            background: var(--brand-navy);
            color: #fff;
            border: none;
        }
        .btn-submit-solid:hover {
            background: #2c3359;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 67, 113, 0.2);
        }

        .divider { height: 1px; background: #F0F2F5; margin: 2.5rem 0; }
    </style>

    <div class="write-container">
        <div class="write-header">
            <h2>프로젝트 공지사항 작성</h2>
            <p>팀 프로젝트의 새로운 소식이나 공지사항을 등록해 주세요.</p>
        </div>

        <form th:action="@{/board/write}" method="post" enctype="multipart/form-data">
            <div class="write-card">
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-row-custom">
                            <label class="form-label">카테고리 선택</label>
                            <select class="form-select" name="boardType">
                                <option value="NORMAL" selected>프로젝트 게시판 (일반)</option>
                                <option value="CREATOR">📢 공지사항 (필독)</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-row-custom">
                            <label class="form-label">작성자</label>
                            <div class="info-box-static">
                                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" width="26" class="rounded-circle">
                                <span class="fw-bold text-dark" th:text="${#authentication.name}">사용자명</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="section-title">연관 리소스 연결 <small class="text-muted fw-normal ms-2">(선택)</small></div>
                <div class="resource-group">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="form-row-custom mb-0">
                                <label class="form-label small">컨텐츠 ID</label>
                                <input type="number" class="form-control" name="contentId" id="contentId" placeholder="ID 입력" oninput="debouncedFetchInfo('content', this.value)">
                                <div id="contentPreview" class="preview-box"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-row-custom mb-0">
                                <label class="form-label small">프로젝트 ID</label>
                                <input type="number" class="form-control" name="projectId" id="projectId" placeholder="ID 입력" oninput="debouncedFetchInfo('project', this.value)">
                                <div id="projectPreview" class="preview-box"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-row-custom mb-0">
                                <label class="form-label small">팀 ID</label>
                                <input type="number" class="form-control" name="teamId" id="teamId" placeholder="ID 입력" oninput="debouncedFetchInfo('team', this.value)">
                                <div id="teamPreview" class="preview-box"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="section-title">게시글 내용 작성</div>
                
                <div class="form-row-custom">
                    <label class="form-label">제목</label>
                    <input type="text" class="form-control" name="title" placeholder="공지 제목을 입력해 주세요" required>
                </div>

                <div class="form-row-custom">
                    <label class="form-label">상세 내용</label>
                    <textarea class="form-control" id="contentArea" name="boardText" style="min-height: 320px; resize: none;" 
                              placeholder="팀원들과 공유할 내용을 상세히 작성해 주세요."></textarea>
                </div>

                <div class="form-row-custom mb-0">
                    <label class="form-label">파일 첨부 <small class="text-muted fw-normal">(최대 3개)</small></label>
                    <div class="file-upload-zone">
                        <input class="form-control mb-3" type="file" name="images" accept="image/*,video/*" multiple id="file_input" onchange="handleFileSelect(this)">
                        <div id="fileList"></div>
                        <div class="text-center text-muted small mt-2">
                            <i class="bi bi-info-circle me-1"></i> 이미지나 영상 파일을 선택해 주세요.
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn-action-group">
                <a th:href="@{/board}" class="btn btn-creativ btn-cancel-outline">돌아가기</a>
                <button type="submit" class="btn btn-creativ btn-submit-solid">게시글 등록하기</button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        let debounceTimer;

        // 리소스 정보 가져오기 (Debounce 적용)
        function debouncedFetchInfo(type, id) {
            const preview = document.getElementById(type + 'Preview');
            clearTimeout(debounceTimer);
            if(!id) { preview.innerHTML = ""; return; }
            preview.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>조회 중...';
            debounceTimer = setTimeout(() => {
                fetch(`/board/info/${type}?id=${id}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.name) {
                            preview.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> <strong class="text-dark">${data.name}</strong>`;
                        } else {
                            preview.innerHTML = `<i class="bi bi-exclamation-circle-fill text-danger"></i> 존재하지 않음`;
                        }
                    })
                    .catch(() => { 
                        preview.innerHTML = `<i class="bi bi-x-circle-fill text-danger"></i> 조회 실패`;
                    });
            }, 500);
        }

        // 파일 선택 처리
        function handleFileSelect(input) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            if (input.files.length > 3) {
                alert("파일은 최대 3개까지만 첨부할 수 있습니다.");
                input.value = "";
                return;
            }
            Array.from(input.files).forEach((file) => {
                const item = document.createElement('div');
                item.className = 'p-2 bg-white border rounded-3 mb-2 small d-flex justify-content-between align-items-center shadow-sm';
                item.innerHTML = `
                    <span><i class="bi bi-file-earmark-check me-2 text-primary"></i>${file.name}</span>
                    <span class="badge bg-light text-dark border">${Math.round(file.size/1024)} KB</span>
                `;
                fileList.appendChild(item);
            });
        }
    </script>
</th:block>
</html>
