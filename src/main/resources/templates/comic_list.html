<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <style>
        /* 1. 카테고리 아이콘 */
        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
        .icon-box {
            width: 80px; height: 80px; background-color: #F8F9FA;
            border-radius: 22px; margin: 0 auto 12px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid #eee; transition: all 0.3s ease;
        }
        .category-icon-img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 18px; transition: transform 0.3s ease;
        }
        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }
        .category-item .fw-bold { color: #3B4371; font-size: 0.95rem; transition: color 0.3s ease; }

        /* 2. 만화 카드 스타일 */
        .comic-card-img { height: 300px; object-fit: cover; border-radius: 8px 8px 0 0; }
        .hover-shadow:hover {
            transform: translateY(-5px); transition: all 0.3s ease;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        
        /* 제품 코드 전용 폰트 스타일 */
        #productKeyInput {
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>

<div class="container" layout:fragment="content">
    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 justify-content-center">
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/art/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img" alt="일러스트"></div>
                        <div class="fw-bold">일러스트</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/music/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img" alt="음악"></div>
                        <div class="fw-bold">음악</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/video/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img" alt="비디오"></div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img" alt="소설"></div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/file/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/folder.png}" class="category-icon-img" alt="파일"></div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            
            <div style="flex: 1;">
                <a href="/" class="btn btn-link text-decoration-none text-dark p-0 d-flex align-items-center">
                    <span class="fw-bold">홈으로 가기</span>
                </a>
            </div>

            <div class="text-center" style="flex: 2;">
                <h2 class="fw-bold mb-0">추천 만화</h2>
                <p class="text-muted mb-0 mt-1 small">이번 주 가장 인기 있는 작품들을 만나보세요.</p>
            </div>

            <div class="d-flex gap-2 align-items-center justify-content-end" style="flex: 1;">
                <button type="button" class="btn btn-outline-dark d-flex align-items-center px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#keyRegisterModal" style="height: 38px;">
                    <i class="bi bi-key-fill me-2"></i>
                    <span class="fw-bold">코드 등록</span>
                </button>
                
                <a onclick="return requireLoginAction(() => location.href='/comic_write')" class="btn btn-primary d-flex align-items-center px-3 shadow-sm" style="cursor:pointer; height: 38px;">
                    <i class="bi bi-plus-lg me-2"></i>
                    <span class="fw-bold">작품 등록</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container pb-5 px-0">
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
            <div class="col">
                <div class="card h-100 shadow-sm rounded border-0 hover-shadow position-relative">
                    <span class="position-absolute top-0 start-0 badge bg-danger m-2">UP</span>
                    <a th:href="@{/comic_detail}"><img src="images/pic.png" class="card-img-top comic-card-img" alt="썸네일"></a>
                    <div class="card-body p-2">
                        <h6 class="card-title fw-bold text-truncate mb-1">나 혼자 레벨업</h6>
                        <p class="card-text text-secondary small mb-0">#판타지 #액션</p>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <nav aria-label="Page navigation" class="mb-5">
        <ul class="pagination justify-content-center">
            <li class="page-item active"><a class="page-link border-0" href="#">1</a></li>
        </ul>
    </nav>

    <div class="modal fade" id="keyRegisterModal" tabindex="-1" aria-labelledby="keyRegisterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold" id="keyRegisterModalLabel" style="color: #3B4371;">제품 코드 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <i class="bi bi-controller text-muted" style="font-size: 3rem;"></i>
                    <p class="mt-3 mb-4 text-muted small">
                        보유하고 계신 제품 코드(16자리)를 입력해 주세요.<br>
                        (예: ABCD-EFGH-IJKL-MNOP)
                    </p>
                    <input type="text" id="productKeyInput" class="form-control form-control-lg text-center font-monospace" 
                           placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19">
                </div>
                <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn text-white px-4" style="background-color: #f05a28;" onclick="submitProductKey()">코드 활성화</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const keyInput = document.getElementById('productKeyInput');

            if (keyInput) {
                keyInput.addEventListener('input', function (e) {
                    let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    let result = '';
                    for (let i = 0; i < val.length; i++) {
                        if (i > 0 && i % 4 === 0) result += '-';
                        result += val[i];
                    }
                    e.target.value = result;
                });
            }
        });

        function submitProductKey() {
            const keyInput = document.getElementById('productKeyInput');
            const val = keyInput.value;
            if(val.length < 19) {
                alert('코드를 정확히 입력해 주세요 (16자리).');
                return;
            }
            
            alert('코드 [' + val + '] 등록이 요청되었습니다.');
            
            const modalElement = document.getElementById('keyRegisterModal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            modalInstance.hide();
            keyInput.value = '';
        }
    </script>
</div>
</html>
