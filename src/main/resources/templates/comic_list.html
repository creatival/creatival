<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <style>
        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
        .icon-box {
            width: 80px; height: 80px; background-color: #F8F9FA;
            border-radius: 22px; margin: 0 auto 12px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid #eee; transition: all 0.3s ease;
        }
        .category-icon-img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 18px; transition: transform 0.3s ease;
        }
        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }
        .category-item .fw-bold { color: #3B4371; font-size: 0.95rem; }

        .comic-card-img { height: 300px; object-fit: cover; border-radius: 8px 8px 0 0; }
        .hover-shadow:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }

        #productKeyInput {
            letter-spacing: 2px;
            font-weight: bold;
        }
		
        /* 🔥 푸터 스타일 수정: 화면 전체 너비 확장 */
        .full-footer { 
            background-color: #0b152d !important; 
            color: white !important; 
            margin-top: 150px;
            
            /* 컨테이너 밖으로 배경을 확장시키는 핵심 코드 */
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }
        .full-footer span, .full-footer h6, .full-footer li { color: #ffffff !important; }
        .footer-line { border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0; }
    </style>
</head>

<div class="container" layout:fragment="content">

    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 g-md-5 justify-content-center">
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/art/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/paint.png}" class="category-icon-img"></div>
                        <div class="fw-bold">일러스트</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/music/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img"></div>
                        <div class="fw-bold">음악</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/video/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/yutu.png}" class="category-icon-img"></div>
                        <div class="fw-bold">비디오</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/novel/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img"></div>
                        <div class="fw-bold">소설</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a th:href="@{/content/file/list}" class="category-item d-block">
                        <div class="icon-box"><img th:src="@{/images/folder.png}" class="category-icon-img"></div>
                        <div class="fw-bold">파일</div>
                    </a>
                </div>
            </div>
        </div>
    </section>

	<div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
	            
	            <div style="flex: 1;">
	                <a href="/" class="btn btn-link text-decoration-none text-dark p-0 d-flex align-items-center">
	                    <i class="bi bi-house-door-fill me-2"></i>
	                    <span class="fw-bold">홈으로 가기</span>
	                </a>
	            </div>
        <div class="text-center" style="flex: 2;">
            <h2 class="fw-bold">추천 만화</h2>
            <p class="text-muted mb-0">이번 주 가장 인기 있는 작품들을 만나보세요.</p>
        </div>
        <div class="d-flex gap-2">
			<button type="button"
			                        class="btn btn-outline-dark d-flex align-items-center px-3 shadow-sm"
			                        data-bs-toggle="modal"
			                        data-bs-target="#keyRegisterModal">
			                    <i class="bi bi-key-fill me-2"></i>
			                    <span class="fw-bold">코드 등록</span>
			                </button>
            <a th:href="@{/content/comic/write}" class="btn btn-dark px-4 shadow-sm">
                작품 등록
            </a>
        </div>
    </div>

    <div class="container pb-5 px-0">
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
            <div class="col" th:each="comic : ${paging}">
                <div class="card h-100 shadow-sm border-0 hover-shadow">
                    <a th:href="@{/content/comic/detail/{id}(id=${comic.id})}">
                        <img th:src="${comic.thumbnailUrl}" class="card-img-top comic-card-img">
                    </a>
                    <div class="card-body p-2">
                        <h6 class="fw-bold text-truncate" th:text="${comic.title}"></h6>
                        <div class="text-muted small text-truncate"
                             th:text="|${comic.username}(${comic.displayname})|"></div>
                        <p class="text-secondary small mb-0 mt-1">#판타지 #액션</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
	<div class="modal fade" id="keyRegisterModal" tabindex="-1" aria-labelledby="keyRegisterModalLabel" aria-hidden="true">
	        <div class="modal-dialog modal-dialog-centered">
	            <div class="modal-content border-0 shadow">
	                <div class="modal-header bg-light border-0">
	                    <h5 class="modal-title fw-bold" id="keyRegisterModalLabel" style="color: #3B4371;">리딤 코드 사용</h5>
	                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	                </div>

	                <!-- 여기 action만 네가 이미 만들어둔 기존 리딤 코드 컨트롤러 경로로 맞춰 -->
	                <form th:action="@{/redeem/use}" method="post">
	                    <div class="modal-body p-4 text-center">
	                        <input type="hidden"
	                               th:name="${_csrf.parameterName}"
	                               th:value="${_csrf.token}">

	                        <i class="bi bi-controller text-muted" style="font-size: 3rem;"></i>
	                        <p class="mt-3 mb-4 text-muted small">
	                            보유하고 계신 리딤 코드를 입력해 주세요.<br>
	                            (예: ABCD-EFGH-IJKL-MNOP)
	                        </p>
	                        <input type="text"
	                               id="productKeyInput"
	                               name="code"
	                               class="form-control form-control-lg text-center font-monospace" 
	                               placeholder="XXXX-XXXX-XXXX-XXXX"
	                               maxlength="19"
	                               required>
	                    </div>
	                    <div class="modal-footer border-0 d-flex justify-content-center pb-4">
	                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
	                        <button type="submit" class="btn text-white px-4" style="background-color: #f05a28;">코드 사용</button>
	                    </div>
	                </form>
	            </div>
	        </div>
	    </div>
		<nav class="mt-5" th:if="${paging != null and !paging.isEmpty()}">
		            <ul class="pagination justify-content-center custom-pagination">
		                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
		                    <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a>
		                </li>
		                <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
		                    th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
		                    th:classappend="${page == paging.number} ? 'active'" class="page-item">
		                    <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
		                </li>
		                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
		                    <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a>
		                </li>
		            </ul>
		        </nav>
	
    <footer class="full-footer">
        <div class="container py-5">
            <div class="row mb-4">
                <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
                    <h6 class="fw-bold mb-3">회사 정보</h6>
                    <ul class="list-unstyled small opacity-75">
                        <li>이용 안내</li>
                        <li>공지사항</li>
                        <li>고객센터</li>
                        <li>도움말</li>
                        <li>광고문의</li>
                    </ul>
                </div>
            </div>
            <hr class="footer-line">
            <div class="row align-items-center">
                <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
                    <span>이용 약관</span>
                    <span>개인 정보 보호 정책</span>
                </div>
                <div class="col-md-4 text-center small opacity-50 mb-3 mb-md-0">
                    © 2026 creatival All rights reserved.
                </div>
                <div class="col-md-4 text-end">
                    <img th:src="@{/images/creatival_logo(White).png}" alt="logo" width="140">
                </div>
            </div>
        </div>
    </footer>

</div>
</html>
