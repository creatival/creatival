<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <style>
        .category-item { transition: all 0.3s ease; text-decoration: none !important; }
        .icon-box {
            width: 80px; height: 80px; background-color: #F8F9FA;
            border-radius: 22px; margin: 0 auto 12px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid #eee; transition: all 0.3s ease;
        }
        .category-icon-img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 18px; transition: transform 0.3s ease;
        }
        .category-item:hover { transform: translateY(-8px); }
        .category-item:hover .category-icon-img { transform: scale(1.1); }
        .category-item .fw-bold { color: #3B4371; font-size: 0.95rem; }
		
		/* 1. 두 번째 칸(일러스트) 강조 스타일 고정 */
				.row > .col-4:nth-child(2) .icon-box {
				    transform: scale(1.1);               /* 항상 커진 상태 */
				    border: 2px solid #ff5e3a !important;  /* 진한 외곽선 */
				    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
				    background-color: #ffffff;
				}

				.row > .col-4:nth-child(2) .category-icon-img {
				    transform: scale(1.1);               /* 이미지도 항상 커진 상태 */
				}

				/* 2. 첫 번째 칸(일러스트)은 호버 효과가 작동하지 않도록 강제 고정 */
				.row > .col-4:nth-child(2) .category-item:hover {
				    transform: none !important;          /* 위로 튕겨 올라가는 효과 제거 */
				}

				.row > .col-4:nth-child(2) .category-item:hover .category-icon-img {
				    transform: scale(1.1) !important;    /* 호버해도 1.1배 크기 유지 (더 커지지 않음) */
				}

				.row > .col-4:nth-child(2) .category-item .fw-bold {
				    color: #3B4371 !important;           /* 글자색 고정 */
				}
		
		
		
		
		
		

        .comic-card-img { height: 300px; object-fit: cover; border-radius: 8px 8px 0 0; }
        .hover-shadow:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }

        #productKeyInput {
            letter-spacing: 2px;
            font-weight: bold;
        }
		
        /* 🔥 푸터 스타일 수정: 화면 전체 너비 확장 */
        .full-footer { 
            background-color: #0b152d !important; 
            color: white !important; 
            margin-top: 150px;
            
            /* 컨테이너 밖으로 배경을 확장시키는 핵심 코드 */
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
			
			padding-top: 100px;
			padding-bottom: 100px;
        }
        .full-footer span, .full-footer h6, .full-footer li { color: #ffffff !important; }
        .footer-line { border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0; }
    </style>
</head>

<div class="container" layout:fragment="content">

    <section class="py-5 bg-white">
        <div class="container">
            <div class="row text-center g-4 g-md-5 justify-content-center">
				<div class="col-4 col-md-2">
				                    <a th:href="@{/content/art/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box">
				                            <img th:src="${artIconUrl != null ? artIconUrl : '/images/paint.png'}" class="category-icon-img" alt="일러스트">
				                        </div>
				                        <div class="fw-bold">일러스트</div>
				                    </a>
				                </div>
				                <div class="col-4 col-md-2">
				                    <a th:href="@{/content/comic/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box">
				                            <img th:src="${comicIconUrl != null ? comicIconUrl : '/images/comic.png'}" class="category-icon-img" alt="만화">
				                        </div>
				                        <div class="fw-bold">만화</div>
				                    </a>
				                </div>
				                <div class="col-4 col-md-2">
				                    <a th:href="@{/content/music/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box"><img th:src="@{/images/sing.png}" class="category-icon-img" alt="음악"></div>
				                        <div class="fw-bold">음악</div>
				                    </a>
				                </div>
				                <div class="col-4 col-md-2">
				                    <a th:href="@{/content/video/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box">
				                            <img th:src="${videoIconUrl != null ? videoIconUrl : '/images/yutu.png'}" class="category-icon-img" alt="비디오">
				                        </div>
				                        <div class="fw-bold">비디오</div>
				                    </a>
				                </div>
				                <div class="col-4 col-md-2">
				                    <a th:href="@{/content/novel/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box"><img th:src="@{/images/git.png}" class="category-icon-img" alt="소설"></div>
				                        <div class="fw-bold">소설</div>
				                    </a>
				                </div>
				                <div class="col-4 col-md-2">
				                    <a th:href="@{/content/file/list}" class="text-dark category-item d-block text-decoration-none">
				                        <div class="icon-box">
				                            <img th:src="${fileIconUrl != null ? fileIconUrl : '/images/folder.png'}" class="category-icon-img" alt="파일">
				                        </div>
				                        <div class="fw-bold">파일</div>
				                    </a>
				                </div>
            </div>
        </div>
    </section>

	<div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
	            
	    <div style="flex: 1;">
	        <a href="/" class="btn btn-link text-decoration-none text-dark p-0 d-flex align-items-center">
	            <i class="bi bi-house-door-fill me-2"></i>
	            <span class="fw-bold">홈으로 가기</span>
	        </a>
	    </div>

        <div class="text-center" style="flex: 2;">
            <h2 class="fw-bold">추천 만화</h2>
            <p class="text-muted mb-0">이번 주 가장 인기 있는 작품들을 만나보세요.</p>
        </div>

        <div class="d-flex gap-2">
			<button type="button"
                    id="redeemCodeBtn"
                    class="btn btn-outline-dark d-flex align-items-center px-3 shadow-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#keyRegisterModal">
                <i class="bi bi-key-fill me-2"></i>
                <span class="fw-bold">코드 등록</span>
            </button>

            <a th:href="@{/content/comic/write}"
               id="comicCreateBtn"
               class="btn btn-dark px-4 shadow-sm">
                작품 등록
            </a>
        </div>
    </div>

    <div class="container pb-5 px-0">
        <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
            <div class="col" th:each="comic : ${paging}">
                <div class="card h-100 shadow-sm border-0 hover-shadow">
                    <a th:href="@{/content/comic/detail/{id}(id=${comic.id})}">
                        <img th:src="${comic.thumbnailUrl}" class="card-img-top comic-card-img">
                    </a>
                    <div class="card-body p-2">
                        <h6 class="fw-bold text-truncate" th:text="${comic.title}"></h6>
                        <div class="text-muted small text-truncate"
                             th:text="|${comic.username}(${comic.displayname})|"></div>
                        <p class="text-secondary small mb-0 mt-1">#판타지 #액션</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
	<div class="modal fade" id="keyRegisterModal" tabindex="-1" aria-labelledby="keyRegisterModalLabel" aria-hidden="true">
	    <div class="modal-dialog modal-dialog-centered">
	        <div class="modal-content border-0 shadow">
	            <div class="modal-header bg-light border-0">
	                <h5 class="modal-title fw-bold" id="keyRegisterModalLabel" style="color: #3B4371;">리딤 코드 사용</h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	            </div>

	            <form th:action="@{/redeem/use}" method="post">
	                <div class="modal-body p-4 text-center">
	                    <input type="hidden"
	                           th:name="${_csrf.parameterName}"
	                           th:value="${_csrf.token}">

	                    <i class="bi bi-controller text-muted" style="font-size: 3rem;"></i>
	                    <p class="mt-3 mb-4 text-muted small">
	                        보유하고 계신 리딤 코드를 입력해 주세요.<br>
	                        (예: ABCD-EFGH-IJKL-MNOP)
	                    </p>
	                    <input type="text"
	                           id="productKeyInput"
	                           name="code"
	                           class="form-control form-control-lg text-center font-monospace" 
	                           placeholder="XXXX-XXXX-XXXX-XXXX"
	                           maxlength="19"
	                           required>
	                </div>
	                <div class="modal-footer border-0 d-flex justify-content-center pb-4">
	                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
	                    <button type="submit" class="btn text-white px-4" style="background-color: #f05a28;">코드 사용</button>
	                </div>
	            </form>
	        </div>
	    </div>
	</div>

	<nav class="mt-5" th:if="${paging != null and !paging.isEmpty()}">
        <ul class="pagination justify-content-center custom-pagination">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a>
            </li>
            <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                th:classappend="${page == paging.number} ? 'active'" class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a>
            </li>
        </ul>
    </nav>
	
	<footer class="full-footer">
		        <div class="container py-5">
		            <div class="row mb-4">
		                <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
							<h6 class="fw-bold mb-3">
							        <a th:href="@{/about_us}" class="text-white text-decoration-none">Creatival</a>
							    </h6>
		                    <ul class="list-unstyled small opacity-75">
		                        <li>이용 안내</li>
		                        <li>공지사항</li>
		                        <li>고객센터</li>
		                        <li>도움말</li>
		                        <li>광고문의</li>
		                    </ul>
		                </div>
		            </div>
		            <hr class="footer-line">
		            <div class="row align-items-center">
		                <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
		                    <span>이용 약관</span>
		                    <span>개인 정보 보호 정책</span>
		                </div>
		                <div class="col-md-4 text-center small opacity-50 mb-3 mb-md-0">
		                    © 2026 creatival All rights reserved.
		                </div>
		                <div class="col-md-4 text-end">
		                    <img th:src="@{/images/creatival_logo(White).png}" alt="logo" width="140">
		                </div>
		            </div>
		        </div>
		    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const keyInput = document.getElementById('productKeyInput');
            const redeemCodeBtn = document.getElementById('redeemCodeBtn');
            const comicCreateBtn = document.getElementById('comicCreateBtn');
            const redeemModal = document.getElementById('keyRegisterModal');

            let hasShownComicCreateGuide = false;
            let hasShownRedeemGuide = false;

            if (keyInput) {
                keyInput.addEventListener('input', function (e) {
                    let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    let result = '';
                    for (let i = 0; i < val.length; i++) {
                        if (i > 0 && i % 4 === 0) result += '-';
                        result += val[i];
                    }
                    e.target.value = result;
                });
            }

            function showComicCreateGuide() {
                Swal.fire({
                    icon: 'info',
                    title: '만화 등록 안내',
                    text: '이 버튼을 누르면 새로운 만화 작품을 등록할 수 있습니다.',
                    confirmButtonText: '확인'
                });
            }

            function showRedeemGuide() {
                if (window.driver && window.driver.js && typeof window.driver.js.driver === 'function') {
                    const guide = window.driver.js.driver({
                        showProgress: false,
                        allowClose: true,
                        overlayClickBehavior: 'close',
                        doneBtnText: '확인',
                        steps: [
                            {
                                element: '#productKeyInput',
                                popover: {
                                    title: '리딤 코드 입력',
                                    description: '리딤 코드를 입력하면 해당하는 유료 작품의 접근 권한을 얻을 수 있습니다.',
                                    side: 'bottom',
                                    align: 'center'
                                }
                            }
                        ]
                    });

                    guide.drive();
                } else {
                    Swal.fire({
                        icon: 'info',
                        title: '리딤 코드 안내',
                        text: '리딤 코드를 입력하면 해당하는 유료 작품의 접근 권한을 얻을 수 있습니다.',
                        confirmButtonText: '확인'
                    }).then(() => {
                        if (keyInput) keyInput.focus();
                    });
                }
            }

            if (comicCreateBtn) {
                comicCreateBtn.addEventListener('mouseenter', function () {
                    if (!hasShownComicCreateGuide) {
                        hasShownComicCreateGuide = true;
                        showComicCreateGuide();
                    }
                }, { once: true });
            }

            if (redeemCodeBtn) {
                redeemCodeBtn.addEventListener('click', function () {
                    hasShownRedeemGuide = false;
                });
            }

            if (redeemModal) {
                redeemModal.addEventListener('shown.bs.modal', function () {
                    if (!hasShownRedeemGuide) {
                        hasShownRedeemGuide = true;
                        setTimeout(() => {
                            showRedeemGuide();
                        }, 150);
                    }
                });
            }
        });
    </script>

</div>
</html>
