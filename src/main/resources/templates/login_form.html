<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
	<div class="container my-5">
	    <div class="row justify-content-center">
	        <div class="col-md-4">
	            <h2 class="text-center mb-4">로그인</h2>

				<div th:if="${param.error}">
				    <p th:text="${param.message}"></p>
				</div>	
				<div th:if="${param.error != null and param.error[0]=='disabled'}">
					<a th:href=@{/user/activeUser}>계정 활성화하러가기</a>
				</div>

	            <form th:action="@{/user/login}" method="post">
	                <div class="mb-3">
	                    <label for="username" class="form-label">사용자 ID</label>
	                    <input type="text" name="username" id="username" class="form-control" required>
	                </div>

	                <div class="mb-3">
	                    <label for="password" class="form-label">비밀번호</label>
	                    <input type="password" name="password" id="password" class="form-control" required>
	                </div>

	                <button type="submit" class="btn btn-primary w-100">로그인</button>
	                
	                <div class="mt-3 text-center">
	                    <small>계정이 없으신가요? <a th:href="@{/user/signUp}">회원가입</a></small>
	                </div>
	            </form>
	        </div>
	    </div>
	</div>
</body>
</html>
