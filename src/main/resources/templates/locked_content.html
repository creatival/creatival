<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-white border-0 pt-5 pb-3 text-center">
                        <div class="mb-3">
                            <i class="bi bi-lock-fill text-warning" style="font-size: 3rem;"></i>
                        </div>
                        <h3 class="fw-bold text-dark" th:text="${content.title}">콘텐츠 제목</h3>
                        <p class="text-muted">이 콘텐츠는 구매 후 바로 열람이 가능합니다.</p>
                    </div>
                    
                    <div class="card-body px-4 pb-5">
                        <div class="bg-light rounded-3 p-4 mb-4 text-center">
                            <span class="text-secondary small d-block mb-1">결제 금액</span>
                            <h2 class="fw-bold text-primary mb-0">
                                <span th:text="${#numbers.formatInteger(content.price, 0, 'COMMA')}">10,000</span>원
                            </h2>
                        </div>

                        <div class="d-grid gap-2">
                            <form th:action="@{/content/{id}/purchase(id=${content.id})}" method="post" id="purchaseForm">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button type="button"
                                        class="btn btn-primary btn-lg w-100 rounded-pill fw-bold"
                                        onclick="confirmPurchase()">
                                    지금 구매하기
                                </button>
                            </form>

                            <button type="button"
                                    class="btn btn-outline-dark btn-lg w-100 rounded-pill fw-bold"
                                    data-bs-toggle="modal"
                                    data-bs-target="#redeemCodeModal">
                                <i class="bi bi-key-fill me-1"></i>
                                리딤 코드 사용
                            </button>

                            <a th:href="@{/}" class="btn btn-link text-decoration-none text-muted">메인으로 돌아가기</a>
                        </div>
                    </div>
                </div>

                <div class="mt-4 px-2">
                    <div class="d-flex gap-2 text-muted small mb-2">
                        <i class="bi bi-info-circle"></i>
                        <span>구매 후에는 영구적으로 소장됩니다.</span>
                    </div>
                    <div class="d-flex gap-2 text-muted small">
                        <i class="bi bi-shield-check"></i>
                        <span>디지털 콘텐츠 특성상 열람 후에는 환불이 어려울 수 있습니다.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="redeemCodeModal" tabindex="-1" aria-labelledby="redeemCodeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold" id="redeemCodeModalLabel" style="color: #3B4371;">리딤 코드 사용</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form th:action="@{/redeem/content/{id}(id=${content.id})}" method="post" id="redeemForm">
                    <div class="modal-body p-4 text-center">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <i class="bi bi-key-fill text-muted" style="font-size: 3rem;"></i>
                        <p class="mt-3 mb-4 text-muted small">
                            보유하고 계신 리딤 코드를 입력해 주세요.<br>
                            (예: ABCD-EFGH-IJKL-MNOP)
                        </p>

                        <input type="text"
                               id="redeemCodeInput"
                               name="code"
                               class="form-control form-control-lg text-center font-monospace"
                               placeholder="XXXX-XXXX-XXXX-XXXX"
                               maxlength="19"
                               required
                               style="letter-spacing: 2px; font-weight: bold;">
                    </div>

                    <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">취소</button>
                        <button type="submit"
                                class="btn text-white px-4"
                                style="background-color: #f05a28;">
                            코드 사용
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        function confirmPurchase() {
            Swal.fire({
                title: '콘텐츠를 구매하시겠습니까?',
                text: [[${content.title}]] + "을(를) 결제합니다.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#fe8e3e',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '결제하기',
                cancelButtonText: '취소'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('purchaseForm').submit();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const codeInput = document.getElementById('redeemCodeInput');

            if (codeInput) {
                codeInput.addEventListener('input', function (e) {
                    let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                    let result = '';

                    for (let i = 0; i < val.length; i++) {
                        if (i > 0 && i % 4 === 0) result += '-';
                        result += val[i];
                    }

                    e.target.value = result;
                });
            }
        });
    </script>
</th:block>
</html>
