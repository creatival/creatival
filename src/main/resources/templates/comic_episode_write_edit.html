<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div layout:fragment="content">
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container d-flex justify-content-center">
            <div class="col-lg-8">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">

                        <div class="mb-4 text-center">
                            <h3 class="fw-bold text-dark">회차 수정하기</h3>
                            <p class="text-muted mb-0">등록된 회차의 정보를 수정합니다</p>
                        </div>

                        <form method="post" enctype="multipart/form-data">
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">회차 제목</label>
                                <input type="text" name="title" class="form-control form-control-lg border-2" 
                                       value="1화. 새로운 시작" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">유료 여부</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" id="is_free_true" 
                                           name="free" value="true" checked>
                                    <label class="btn btn-outline-success py-2" for="is_free_true">
                                        <i class="bi bi-gift me-1"></i> 무료 연재
                                    </label>

                                    <input type="radio" class="btn-check" id="is_free_false" 
                                           name="free" value="false">
                                    <label class="btn btn-outline-danger py-2" for="is_free_false">
                                        <i class="bi bi-coin me-1"></i> 유료 연재
                                    </label>
                                </div>
                                <small class="text-muted mt-2 d-block text-center">유료 연재 시 플랫폼 정책에 따른 정산 절차가 필요합니다.</small>
                            </div> <div class="mb-4">
                                <label class="form-label fw-bold">만화 원고 수정</label>
                                
                                <div class="mb-3 p-3 bg-light rounded border">
                                    <p class="text-muted mb-2 text-center" style="font-size: 0.85rem;">기존 등록된 이미지 (새 파일을 업로드하면 기존 원고가 덮어씌워집니다)</p>
                                    <div class="d-flex flex-wrap gap-2 justify-content-center opacity-75">
                                        <div class="position-relative shadow-sm" style="width: 80px; height: 80px;">
                                            <div class="rounded border bg-secondary bg-opacity-25 w-100 h-100 d-flex align-items-center justify-content-center text-muted" style="font-size: 0.8rem;">Image</div>
                                            <span class="position-absolute top-0 start-0 badge bg-dark m-1 opacity-75" style="font-size: 0.7rem;">1</span>
                                        </div>
                                        <div class="position-relative shadow-sm" style="width: 80px; height: 80px;">
                                            <div class="rounded border bg-secondary bg-opacity-25 w-100 h-100 d-flex align-items-center justify-content-center text-muted" style="font-size: 0.8rem;">Image</div>
                                            <span class="position-absolute top-0 start-0 badge bg-dark m-1 opacity-75" style="font-size: 0.7rem;">2</span>
                                        </div>
                                    </div>
                                </div>

                                <label for="manuscriptFiles" class="p-4 text-center rounded bg-white w-100 d-block" style="border: 2px dashed #dee2e6; cursor: pointer; transition: 0.2s;">
                                    <i class="bi bi-images fs-2 text-muted"></i>
                                    <p class="mt-2 mb-0 fw-bold">클릭하여 교체할 이미지 파일들을 새로 선택하세요</p>
                                    <small class="text-muted">새 파일을 선택하면 위 기존 원고가 대체됩니다.</small>
                                </label>
                                
                                <input type="file" id="manuscriptFiles" name="manuscriptFiles" style="display: none;" multiple accept="image/*" onchange="previewImages(this)">
                                
                                <div id="previewContainer" class="mt-3 d-flex flex-wrap gap-2"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">작가의 말</label>
                                <textarea name="authorNote" class="form-control border-2" rows="5" 
                                          style="font-family: 'Pretendard', sans-serif; line-height: 1.8;"
                                          placeholder="독자들에게 전할 메시지를 입력하세요.">독자님들 안녕하세요. 이번 화는 새로운 시작을 알리는 에피소드입니다. 재미있게 봐주세요!</textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                                <a href="#" class="btn btn-link text-decoration-none text-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> 취소
                                </a>
                                <div>
                                    <button type="submit" class="btn px-5 py-2 fw-bold shadow-sm text-white" 
                                            style="background-color: #2D3278; border-radius: 50px; border: none;">
                                        수정 완료
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 파일 미리보기 자바스크립트는 그대로 유지했습니다.
        function previewImages(input) {
            const container = document.getElementById('previewContainer');
            container.innerHTML = ''; // 파일 재선택 시 기존 미리보기 초기화

            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach((file, index) => {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const imgBox = document.createElement('div');
                        imgBox.className = 'position-relative shadow-sm';
                        imgBox.style.width = '120px';
                        imgBox.style.height = '120px';

                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'rounded border';
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';

                        const badge = document.createElement('span');
                        badge.className = 'position-absolute top-0 start-0 badge bg-dark m-1 opacity-75';
                        badge.textContent = (index + 1);

                        imgBox.appendChild(img);
                        imgBox.appendChild(badge);
                        container.appendChild(imgBox);
                    };
                    
                    reader.readAsDataURL(file);
                });
            }
        }
    </script>
</div>
</html>
