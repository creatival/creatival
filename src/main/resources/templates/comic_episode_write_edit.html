<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<div layout:fragment="content">
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container d-flex justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">

                        <div class="mb-4 text-center">
                            <h3 class="fw-bold text-dark">회차 수정하기</h3>
                            <p class="text-muted mb-0">
                                <span class="fw-bold" style="color: #2D3278;"
                                      th:text="${content != null ? content.title : '만화 제목'}">만화 제목</span> 회차 정보를 수정합니다
                            </p>
                        </div>

                        <form method="post"
                              enctype="multipart/form-data"
                              th:object="${updateComicEpisodeDTO}"
                              id="comicEpisodeEditForm">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <div id="deleteFileIdsContainer"></div>

                            <!-- 회차 제목 -->
                            <div class="mb-4">
                                <label for="title" class="form-label fw-bold">회차 제목</label>
                                <input type="text"
                                       id="title"
                                       th:field="*{title}"
                                       class="form-control form-control-lg border-2"
                                       placeholder="이번 회차의 소제목을 입력하세요">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('title')}"
                                     th:errors="*{title}"></div>
                            </div>

                            <!-- 무료 / 유료 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">유료 여부</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio"
                                           class="btn-check"
                                           id="is_free_true"
                                           th:field="*{free}"
                                           value="true">
                                    <label class="btn btn-outline-success py-2" for="is_free_true">
                                        <i class="bi bi-gift me-1"></i> 무료 연재
                                    </label>

                                    <input type="radio"
                                           class="btn-check"
                                           id="is_free_false"
                                           th:field="*{free}"
                                           value="false">
                                    <label class="btn btn-outline-danger py-2" for="is_free_false">
                                        <i class="bi bi-coin me-1"></i> 유료 연재
                                    </label>
                                </div>
                                <small class="text-muted mt-2 d-block text-center">
                                    유료 연재 시 플랫폼 정책에 따른 정산 절차가 필요합니다.
                                </small>
                            </div>

                            <!-- 기존 이미지 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">기존 원고 이미지</label>

                                <div class="p-3 bg-light rounded border">
                                    <p class="text-muted mb-3 text-center" style="font-size: 0.9rem;">
                                        기존 이미지입니다. 필요한 이미지는 개별 삭제할 수 있습니다.
                                    </p>

                                    <div id="existingImageContainer" class="d-flex flex-wrap gap-3 justify-content-start">
                                        <th:block th:if="${updateComicEpisodeDTO.images != null and !updateComicEpisodeDTO.images.isEmpty()}">
                                            <th:block th:each="image, stat : *{images}">
                                                <div class="existing-image-item position-relative shadow-sm"
                                                     th:attr="data-file-id=${image.id}"
                                                     style="width: 140px;">
                                                    <div class="border rounded overflow-hidden bg-white">
                                                        <div class="position-relative">
                                                            <img th:src="@{${image.fileUrl}}"
                                                                 class="w-100"
                                                                 style="height: 160px; object-fit: cover;"
                                                                 th:alt="${'기존 이미지 ' + (stat.index + 1)}">

                                                            <button type="button"
                                                                    class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
                                                                    onclick="removeExistingImage(this)">
                                                                ✕
                                                            </button>

                                                            <span class="position-absolute bottom-0 start-0 badge bg-dark m-1 opacity-75 existing-order">
                                                                1
                                                            </span>
                                                        </div>

                                                        <div class="small text-muted text-center py-2 border-top bg-light">
                                                            기존 이미지
                                                        </div>
                                                    </div>
                                                </div>
                                            </th:block>
                                        </th:block>

                                        <div id="noExistingImageMessage"
                                             class="text-muted small w-100 text-center py-4"
                                             th:style="${updateComicEpisodeDTO.images != null and !updateComicEpisodeDTO.images.isEmpty()} ? 'display:none;' : 'display:block;'">
                                            현재 등록된 이미지가 없습니다.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 새 이미지 추가 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">새 원고 이미지 추가</label>

                                <label for="imageInput"
                                       class="upload-dropzone p-5 text-center rounded bg-light w-100 d-block">
                                    <i class="bi bi-images fs-1 text-muted"></i>
                                    <p class="mt-2 mb-1 fw-bold">클릭하여 새 이미지 파일들을 선택하세요</p>
                                    <small class="text-muted">
                                        한 장씩 추가하거나 여러 장을 한 번에 올릴 수 있습니다.<br>
                                        PC에서는 드래그로 순서를 바꾸고, 모바일에서는 화살표 버튼으로 이동할 수 있습니다.
                                    </small>
                                </label>

                                <input type="file"
                                       id="imageInput"
                                       th:field="*{fileList}"
                                       style="display:none;"
                                       multiple
                                       accept="image/*">

                                <div id="previewEmptyMessage" class="text-muted small mt-3">
                                    아직 추가된 새 이미지가 없습니다.
                                </div>

                                <div id="previewContainer" class="mt-3 d-flex flex-wrap gap-3"></div>
                            </div>

                            <!-- 작가의 말 -->
                            <div class="mb-4">
                                <label for="note" class="form-label fw-bold">작가의 말</label>
                                <textarea id="note"
                                          th:field="*{note}"
                                          class="form-control border-2"
                                          rows="5"
                                          style="font-family: 'Pretendard', sans-serif; line-height: 1.8;"
                                          placeholder="독자들에게 전할 메시지를 입력하세요."></textarea>
                            </div>

                            <!-- 버튼 -->
                            <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                                <a th:href="${content != null} ? @{/content/comic/episode/{id}(id=${episode.id})} : @{/content/comic}"
                                   class="btn btn-link text-decoration-none text-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> 취소
                                </a>

                                <button type="submit"
                                        class="btn px-5 py-2 fw-bold shadow-sm text-white"
                                        style="background-color: #2D3278; border-radius: 50px; border: none;">
                                    수정 완료
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        .upload-dropzone {
            border: 2px dashed #dee2e6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-dropzone:hover {
            border-color: #2D3278;
            background-color: #f8f9ff !important;
        }

        .preview-item {
            width: 150px;
            user-select: none;
            flex: 0 0 auto;
        }

        .preview-item.dragging {
            opacity: 0.35;
            transform: scale(0.98);
        }

        .preview-card {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        .preview-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .preview-order {
            position: absolute;
            left: 8px;
            bottom: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 2;
        }

        .preview-remove {
            position: absolute;
            right: 8px;
            top: 8px;
            z-index: 3;
        }

        .preview-info {
            font-size: 0.8rem;
            color: #6c757d;
            text-align: center;
            padding: 8px 6px;
            border-top: 1px solid #f1f3f5;
            background: #fafafa;
            min-height: 46px;
        }

        .preview-move-buttons {
            display: none;
            gap: 6px;
            padding: 8px;
            border-top: 1px solid #f1f3f5;
            background: #fff;
        }

        .preview-move-buttons .btn {
            flex: 1;
        }

        .drop-placeholder {
            width: 150px;
            height: 262px;
            border: 2px dashed #2D3278;
            border-radius: 12px;
            background: rgba(45, 50, 120, 0.06);
            flex: 0 0 auto;
        }

        .existing-image-item.removed {
            opacity: 0.35;
        }

        @media (max-width: 767.98px) {
            .preview-item,
            .existing-image-item {
                width: calc(50% - 0.5rem) !important;
            }

            .preview-thumb {
                height: 160px;
            }

            .drop-placeholder {
                width: calc(50% - 0.5rem);
                height: 242px;
            }

            .preview-move-buttons {
                display: flex;
            }
        }

        @media (max-width: 480px) {
            .preview-item,
            .existing-image-item {
                width: 100% !important;
            }

            .drop-placeholder {
                width: 100%;
            }

            .preview-thumb {
                height: 200px;
            }
        }
    </style>

    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewEmptyMessage = document.getElementById('previewEmptyMessage');
        const comicEpisodeEditForm = document.getElementById('comicEpisodeEditForm');
        const deleteFileIdsContainer = document.getElementById('deleteFileIdsContainer');
        const existingImageContainer = document.getElementById('existingImageContainer');
        const noExistingImageMessage = document.getElementById('noExistingImageMessage');

        let selectedFiles = [];
        let fileIdSeq = 0;
        let draggedItem = null;
        let deletedExistingIds = [];

        const placeholder = document.createElement('div');
        placeholder.className = 'drop-placeholder';

        imageInput.addEventListener('change', function () {
            const files = Array.from(this.files);

            files.forEach(file => {
                const wrappedFile = {
                    id: ++fileIdSeq,
                    file: file
                };

                selectedFiles.push(wrappedFile);
                renderPreview(wrappedFile);
            });

            this.value = "";
            updateInputFiles();
            updateOrder();
            togglePreviewEmptyMessage();
        });

        function renderPreview(fileWrapper) {
            const reader = new FileReader();

            reader.onload = function (e) {
                const item = document.createElement('div');
                item.className = 'preview-item position-relative';
                item.draggable = true;
                item.dataset.fileId = fileWrapper.id;

                item.innerHTML = `
                    <div class="preview-card position-relative">
                        <button type="button"
                                class="btn btn-sm btn-danger preview-remove"
                                onclick="removeNewImage(this)">✕</button>

                        <img src="${e.target.result}" class="preview-thumb" alt="미리보기">

                        <span class="preview-order">1</span>

                        <div class="preview-info">새로 추가된 이미지</div>

                        <div class="preview-move-buttons">
                            <button type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                    onclick="moveImageUp(this)">
                                <i class="bi bi-arrow-up"></i>
                            </button>
                            <button type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                    onclick="moveImageDown(this)">
                                <i class="bi bi-arrow-down"></i>
                            </button>
                        </div>
                    </div>
                `;

                bindDragEvents(item);
                previewContainer.appendChild(item);
                updateOrder();
                togglePreviewEmptyMessage();
            };

            reader.readAsDataURL(fileWrapper.file);
        }

        function removeNewImage(button) {
            const item = button.closest('.preview-item');
            const fileId = Number(item.dataset.fileId);

            selectedFiles = selectedFiles.filter(f => f.id !== fileId);
            item.remove();

            if (placeholder.parentNode) {
                placeholder.remove();
            }

            updateInputFiles();
            updateOrder();
            togglePreviewEmptyMessage();
        }

        function removeExistingImage(button) {
            const item = button.closest('.existing-image-item');
            const fileId = Number(item.dataset.fileId);

            if (!deletedExistingIds.includes(fileId)) {
                deletedExistingIds.push(fileId);
                addDeleteFileIdInput(fileId);
            }

            item.remove();
            updateExistingOrder();
            toggleExistingEmptyMessage();
        }

        function addDeleteFileIdInput(fileId) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'deleteFileIds';
            input.value = fileId;
            input.dataset.fileId = fileId;
            deleteFileIdsContainer.appendChild(input);
        }

        function moveImageUp(button) {
            const item = button.closest('.preview-item');
            const prev = item.previousElementSibling;

            if (!prev) return;

            previewContainer.insertBefore(item, prev);
            syncFilesWithDomOrder();
            updateOrder();
        }

        function moveImageDown(button) {
            const item = button.closest('.preview-item');
            const next = item.nextElementSibling;

            if (!next) return;

            previewContainer.insertBefore(next, item);
            syncFilesWithDomOrder();
            updateOrder();
        }

        function updateInputFiles() {
            const dt = new DataTransfer();
            selectedFiles.forEach(wrapper => dt.items.add(wrapper.file));
            imageInput.files = dt.files;
        }

        function updateOrder() {
            const items = previewContainer.querySelectorAll('.preview-item');

            Array.from(items).forEach((item, index) => {
                const badge = item.querySelector('.preview-order');
                if (badge) {
                    badge.textContent = index + 1;
                }

                const upBtn = item.querySelector('.preview-move-buttons button:first-child');
                const downBtn = item.querySelector('.preview-move-buttons button:last-child');

                if (upBtn) upBtn.disabled = index === 0;
                if (downBtn) downBtn.disabled = index === items.length - 1;
            });
        }

        function updateExistingOrder() {
            const items = existingImageContainer.querySelectorAll('.existing-image-item');
            Array.from(items).forEach((item, index) => {
                const badge = item.querySelector('.existing-order');
                if (badge) {
                    badge.textContent = index + 1;
                }
            });
        }

        function togglePreviewEmptyMessage() {
            previewEmptyMessage.style.display = selectedFiles.length === 0 ? 'block' : 'none';
        }

        function toggleExistingEmptyMessage() {
            const remainCount = existingImageContainer.querySelectorAll('.existing-image-item').length;
            noExistingImageMessage.style.display = remainCount === 0 ? 'block' : 'none';
        }

        function bindDragEvents(item) {
            item.addEventListener('dragstart', function () {
                draggedItem = item;
                item.classList.add('dragging');

                setTimeout(() => {
                    if (draggedItem) {
                        draggedItem.style.display = 'none';
                    }
                }, 0);
            });

            item.addEventListener('dragend', function () {
                if (draggedItem) {
                    draggedItem.style.display = '';
                    draggedItem.classList.remove('dragging');
                }

                if (placeholder.parentNode && draggedItem) {
                    previewContainer.insertBefore(draggedItem, placeholder);
                    placeholder.remove();
                }

                draggedItem = null;
                syncFilesWithDomOrder();
                updateOrder();
            });
        }

        previewContainer.addEventListener('dragover', function (e) {
            e.preventDefault();

            if (!draggedItem) return;

            const afterElement = getDragAfterElement(previewContainer, e.clientX, e.clientY);

            if (!placeholder.parentNode) {
                previewContainer.appendChild(placeholder);
            }

            if (afterElement == null) {
                previewContainer.appendChild(placeholder);
            } else {
                previewContainer.insertBefore(placeholder, afterElement);
            }
        });

        previewContainer.addEventListener('drop', function (e) {
            e.preventDefault();

            if (!draggedItem) return;

            if (placeholder.parentNode) {
                previewContainer.insertBefore(draggedItem, placeholder);
                placeholder.remove();
            }

            draggedItem.style.display = '';
            draggedItem.classList.remove('dragging');
            draggedItem = null;

            syncFilesWithDomOrder();
            updateOrder();
        });

        function getDragAfterElement(container, x, y) {
            const items = [...container.querySelectorAll('.preview-item:not(.dragging)')];

            let closest = {
                offset: Number.NEGATIVE_INFINITY,
                element: null
            };

            items.forEach(child => {
                const box = child.getBoundingClientRect();
                const boxCenterX = box.left + box.width / 2;
                const boxCenterY = box.top + box.height / 2;

                let offset;

                if (y >= box.top && y <= box.bottom) {
                    offset = x - boxCenterX;
                } else {
                    offset = y - boxCenterY;
                }

                if (offset < 0 && offset > closest.offset) {
                    closest = {
                        offset: offset,
                        element: child
                    };
                }
            });

            return closest.element;
        }

        function syncFilesWithDomOrder() {
            const domIds = Array.from(previewContainer.querySelectorAll('.preview-item'))
                .map(item => Number(item.dataset.fileId));

            selectedFiles = domIds
                .map(id => selectedFiles.find(file => file.id === id))
                .filter(Boolean);

            updateInputFiles();
        }

        comicEpisodeEditForm.addEventListener('submit', function () {
            updateInputFiles();
        });

        updateOrder();
        updateExistingOrder();
        togglePreviewEmptyMessage();
        toggleExistingEmptyMessage();
    </script>
</div>
</html>
