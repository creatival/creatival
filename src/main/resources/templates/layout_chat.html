<!DOCTYPE html>
<html lang="kr" 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <title>Creatival - 챗봇</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        /* 챗봇 레이아웃 전용 스타일 */
        body {
            height: 100vh;
            overflow: hidden;
            margin: 0;
            background-color: #ffffff;
        }

        /* 사이드바 고정 넓이 및 애니메이션 */
        #sidebar {
            width: 260px;
            background-color: #9aa2c0;
            border-right: 3px solid #ff7a36;
            transition: width 0.3s ease;
            flex-shrink: 0; /* 화면이 줄어도 사이드바 크기 유지 */
        }
        
        #sidebar.collapsed { width: 80px; }
        #sidebar .sidebar-text { transition: opacity 0.2s; }
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .auth-box { opacity: 0; pointer-events: none; display: none; }
        #sidebar.collapsed .sidebar-header { padding-left: 0 !important; padding-right: 0 !important; text-align: center; }
        #sidebar.collapsed .sidebar-header a { justify-content: center; }
        #sidebar.collapsed .sidebar-header i { margin-right: 0 !important; font-size: 1.4rem; }
        
        /* 우측 영역 (헤더 + 컨텐츠) */
        .main-wrapper {
            flex-grow: 1;
            min-width: 0; /* flexbox 자식 요소가 영역을 뚫고 나가는 것 방지 */
        }
        
        /* 네비게이션 바 검색창 중앙 정렬 보정 */
        .search-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            padding: 0 20px;
        }
    </style>
</head>

<body class="d-flex">

    <div id="sidebar" class="d-flex flex-column justify-content-between h-100">
        <div class="sidebar-header p-4 text-white">
            <a th:href="@{/}" class="text-white text-decoration-none d-flex align-items-center mb-4 fw-medium">
                <i class="bi bi-arrow-left me-2"></i> <span class="sidebar-text">돌아가기</span>
            </a>
            <a href="#" onclick="toggleSidebar(event)" class="text-white text-decoration-none d-flex align-items-center fw-medium">
                <i class="bi bi-list me-2"></i> <span id="toggleText" class="sidebar-text">메뉴바 접기</span>
            </a>
        </div>
        
        <div class="auth-box p-4 text-center" sec:authorize="isAnonymous()">
            <p class="text-white small fw-bold mb-3">아직 로그인을 안하셨나요?</p>
            <a th:href="@{/user/login}" class="btn w-100 rounded-pill text-white fw-bold mb-2 py-2" style="background-color: #31366b;">로그인</a>
            <p class="text-white small mb-2 opacity-75">혹은</p>
            <a th:href="@{/user/signUp}" class="btn w-100 rounded-pill fw-bold py-2" style="border: 2px solid #ff7a36; color: #ff7a36; background-color: transparent;">회원가입</a>
        </div>
    </div>

    <div class="main-wrapper d-flex flex-column h-100">
        
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom flex-shrink-0">
            <div class="container-fluid px-4">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/images/creatival_logoV5-Photoroom.png}" alt="Logo" style="width: 180px;">
                </a>
                
                <div class="search-container">
                    <div class="input-group search-bar" style="max-width: 500px;">
                        <input type="text" class="form-control search-input" placeholder="search">
                        <button class="btn search-btn" type="button"><i class="bi bi-search"></i></button>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button class="btn position-relative"><i class="bi bi-bell fs-5"></i></button>
                    <div class="dropdown">
                        <button class="btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${#authentication.principal != 'anonymousUser' and user != null and user.profileImgUrl != null ? user.profileImgUrl : 'https://dummyimage.com/32x32/ced4da/6c757d'}" 
                                 class="rounded-circle" width="32" height="32">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/signUp}">회원가입</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/login}">로그인</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/myPage}">마이페이지</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/logout}">로그아웃</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        
        <main class="flex-grow-1" style="overflow-y: auto;">
            <th:block layout:fragment="content"></th:block>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function toggleSidebar(e) {
            e.preventDefault();
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            
            sidebar.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                toggleText.textContent = '메뉴바 열기';
            } else {
                toggleText.textContent = '메뉴바 접기';
            }
        }
    </script>

    <th:block layout:fragment="script"></th:block>
    
    <script th:inline="javascript">
        const msg = /*[[${message}]]*/ null;
        const icon = /*[[${icon}]]*/ "info";
        const isLogMessage = /*[[${isLogMsg}]]*/ false;

        if(msg){ Swal.fire({ icon: icon, text: msg }); }
        if(isLogMessage) { showLoginAlert(); }

        function showLoginAlert() {
            Swal.fire({
                icon: 'warning',
                title: '로그인이 필요합니다',
                text: '해당 기능은 로그인 후 이용할 수 있습니다.',
                confirmButtonText: '로그인하러 가기',
                showCancelButton: true,
                cancelButtonText: '닫기'
            }).then((result) => {
                if (result.isConfirmed) { window.location.href = "/user/login"; }
            });
        }
    </script>
</body>
</html>
