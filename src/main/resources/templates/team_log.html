<!DOCTYPE html>
<html lang="kr" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"> <th:block layout:fragment="content">
    <section class="py-5">
        <div class="container px-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bolder">Project Updates</h2>
                    <p class="text-muted">프로젝트의 주요 변경 사항과 버전 기록입니다.</p>
                </div>
                <button th:if="${isLeader}" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#logForm">
                    <i class="bi bi-plus-lg"></i> 새 로그 기록
                </button>
            </div>

            <div th:if="${isLeader}" class="collapse mb-5" id="logForm">
                <div class="card card-body border-0 shadow-sm">
                    <form th:action="@{/team/project/{id}/history/create(id=${projectId})}" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">버전 명칭</label>
                                <input type="text" name="versionTag" class="form-control" placeholder="예: v1.0.1" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">업데이트 제목</label>
                                <input type="text" name="updateTitle" class="form-control" placeholder="무엇이 바뀌었나요?" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">상세 수정 내역</label>
                                <textarea name="text" class="form-control" rows="4" placeholder="- 로그인 버그 수정&#10;- 메인 UI 색상 변경" required></textarea>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-dark">기록 저장</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row gx-5">
                <div class="col-lg-12">
                    <div th:if="${#lists.isEmpty(logs)}" class="text-center py-5">
                        <i class="bi bi-journal-x fs-1 text-muted"></i>
                        <p class="mt-3 text-muted">아직 등록된 업데이트 로그가 없습니다.</p>
                    </div>

                    <div th:each="log : ${logs}" class="card mb-4 border-0 shadow-sm overflow-hidden">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="badge tag-badge rounded-pill mb-2" th:text="${log.versionTag}">v1.0.0</span>
                                    <h4 class="card-title fw-bold mb-1" th:text="${log.title}">업데이트 명칭</h4>
                                    <div class="small text-muted mb-3">
                                        <i class="bi bi-calendar3 me-1"></i> 
                                        <span th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-08</span>
                                    </div>
                                </div>
                                <form th:if="${isLeader}" th:action="@{/team/project/{pId}/history/{lId}/delete(pId=${projectId}, lId=${log.id})}" method="post">
                                    <button type="submit" class="btn-action btn-delete" onclick="return confirm('정말 삭제하시겠습니까? 기록이 영구히 제거됩니다.')">
                                        <i class="bi bi-trash3"></i> 삭제
                                    </button>
                                </form>
                            </div>
                            <hr class="my-3 text-muted opacity-25">
                            <div class="card-text text-secondary" style="white-space: pre-wrap;" th:text="${log.text}">
                                수정 내용이 여기에 표시됩니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>

<th:block layout:fragment="script">
    <script>
        // 추가적인 스크립트가 필요하다면 여기에 작성
        // 예: 등록 성공 시 SweetAlert 알림 등
    </script>
</th:block>
</html>
