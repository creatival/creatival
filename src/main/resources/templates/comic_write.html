<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        /* 1. 파일 업로드 및 미리보기 디자인 */
        .preview-wrapper {
            width: 200px; height: 200px; margin: 0 auto 15px;
            border: 2px dashed #a0c4ff; border-radius: 12px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            background-color: #f8f9ff; position: relative;
        }
        #imagePreview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .preview-placeholder { color: #a0c4ff; text-align: center; font-size: 0.85rem; }

        .custom-file-container {
            display: inline-flex; align-items: center; border: 2px solid #a0c4ff;
            border-radius: 12px; padding: 5px; width: 100%; max-width: 500px; background-color: #fff;
        }

        #thumbnailFile { display: none; }

        .btn-file-select {
            background-color: #fff; border: 1px solid #ced4da; border-radius: 8px;
            padding: 8px 20px; cursor: pointer; margin-right: 15px;
        }

        .file-name-display { color: #6c757d; }

        /* 입력 */
        .form-control-custom {
            border: none; border-bottom: 2px solid #eee;
            padding: 15px 0; text-align: center;
        }

        .form-control-custom:focus { border-bottom-color: #2f3e75; }

        .description-box {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
        }

        /* 태그 */
        .tag-badge {
            background-color: #eef2ff;
            color: #3b82f6;
            border: 1px solid #d1dbff;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .tag-badge i {
            cursor: pointer;
            margin-left: 8px;
            color: #ff5e3a;
        }

        /* 설정 */
        .settings-group {
            background: #ffffff;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #ebebeb;
        }

        .settings-label {
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* 버튼 */
        .btn-submit-action {
            background-color: #2f3e75;
            color: white;
            border-radius: 10px;
            padding: 16px 0;
            width: 48%;
            border: none;
        }

        .btn-cancel-action {
            border: 1px solid #ccc;
            padding: 16px 0;
            width: 48%;
            text-align: center;
            text-decoration: none;
            color: #666;
        }
    </style>
</head>

<div class="container" layout:fragment="content">
    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="col-lg-9">

            <div class="text-center mb-5">
                <h2 class="fw-bold">새 만화 등록</h2>
                <p class="text-muted">독자들에게 새로운 즐거움을 선사할 준비가 되셨나요?</p>
            </div>

            <!-- 핵심: DTO 바인딩 -->
            <form th:action="@{/content/comic/write}"
                  method="post"
                  enctype="multipart/form-data"
                  th:object="${createComicDTO}"
                  id="comicForm">

                <!-- 제목 -->
                <div class="mb-5">
                    <input type="text"
                           th:field="*{title}"
                           class="form-control form-control-custom fs-2 fw-bold"
                           placeholder="만화 제목을 입력하세요"
                           required>

                    <div class="text-danger small mt-2 text-center"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <!-- 썸네일 -->
                <div class="mb-5 text-center">
                    <label class="settings-label text-muted">대표 썸네일</label>

                    <div class="preview-wrapper shadow-sm">
                        <div class="preview-placeholder" id="placeholder">
                            이미지 미리보기
                        </div>
                        <img id="imagePreview">
                    </div>

                    <div class="d-flex justify-content-center">
                        <div class="custom-file-container shadow-sm">
                            <input type="file"
                                   th:field="*{thumbnailFile}"
                                   accept="image/*"
                                   onchange="previewImage(this)">
                            <label for="thumbnailFile" class="btn-file-select">파일 선택</label>
                            <span id="fileNameDisplay">선택된 파일 없음</span>
                        </div>
                    </div>
                </div>

                <!-- 설명 -->
                <div class="mb-5 text-center">
                    <label class="settings-label">작품 시놉시스</label>
                    <textarea th:field="*{description}"
                              class="form-control description-box"
                              rows="6"></textarea>
                </div>

                <!-- 태그 -->
                <div class="mb-5 text-center">
                    <label class="settings-label">태그 설정</label>

                    <div id="tagContainer" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>

                    <div class="input-group tag-input-group shadow-sm">
                        <span class="input-group-text">#</span>
                        <input type="text"
                               id="tagInput"
                               class="form-control"
                               onkeypress="handleTagKey(event)">
                        <button class="btn btn-dark" type="button" onclick="addTag()">추가</button>
                    </div>

                    <input type="hidden" th:field="*{tagString}" id="finalTagString">
                </div>

                <!-- 설정 FULL -->
                <div class="settings-group mb-5 shadow-sm">
                    <div class="row g-4">

                        <div class="col-md-4">
                            <span class="settings-label">연재 상태</span>
                            <input type="radio" th:field="*{end}" value="false" checked> 연재 중
                            <input type="radio" th:field="*{end}" value="true"> 완결
                        </div>

                        <div class="col-md-4">
                            <span class="settings-label">공개 설정</span>
                            <select th:field="*{visibility}" class="form-select">
                                <option th:each="v : ${T(com.creatival.content.Enum.Visibility).values()}"
                                        th:value="${v}"
                                        th:text="${v}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <span class="settings-label">작품 유형</span>
                            <select th:field="*{ownerType}" class="form-select">
                                <option th:each="o : ${T(com.creatival.content.Enum.OwnerType).values()}"
                                        th:value="${o}"
                                        th:text="${o}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <span class="settings-label">댓글 허용</span>
                            <input type="checkbox" th:field="*{allowComment}">
                        </div>

                        <div class="col-md-4">
                            <span class="settings-label">프로젝트 태그</span>
                            <input type="text" th:field="*{projectTag}" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <span class="settings-label">2차 창작 여부</span>
                            <input type="checkbox" th:field="*{fanWork}">
                        </div>

                        <div class="col-md-12">
                            <span class="settings-label">원본 작품 ID</span>
                            <input type="number" th:field="*{originalContentId}" class="form-control">
                        </div>

                    </div>
                </div>

                <!-- 버튼 -->
                <div class="d-flex justify-content-between">
                    <a th:href="@{/}" class="btn-cancel-action">취소</a>
                    <button type="submit" class="btn-submit-action">작품 등록 완료</button>
                </div>

            </form>

        </div>
    </div>

    <!-- JS -->
    <script>
        function previewImage(input) {
            const fileDisplay = document.getElementById('fileNameDisplay');
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('placeholder');

            if (input.files && input.files[0]) {
                const file = input.files[0];
                fileDisplay.innerText = file.name;

                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            } else {
                fileDisplay.innerText = "선택된 파일 없음";
                preview.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        let tagArray = [];

        function handleTagKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTag();
            }
        }

        function addTag() {
            const input = document.getElementById('tagInput');
            const value = input.value.trim();

            if (value && !tagArray.includes(value)) {
                tagArray.push(value);
                updateTags();
                input.value = '';
            }
        }

        function removeTag(tag) {
            tagArray = tagArray.filter(t => t !== tag);
            updateTags();
        }

        function updateTags() {
            const container = document.getElementById('tagContainer');
            const hiddenInput = document.getElementById('finalTagString');

            container.innerHTML = tagArray.map(t =>
                `<span class="tag-badge">#${t} <i onclick="removeTag('${t}')">x</i></span>`
            ).join('');

            hiddenInput.value = tagArray.join(',');
        }
    </script>
</div>
</html>
