<!DOCTYPE html>
<html lang="kr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div class="container my-5" layout:fragment="content">

    <style>
        /* =========================================
           [공통 & 팀 페이지 스타일]
           ========================================= */
        .tag-badge { background-color: #f8f9fa; color: #333; border: 1px solid #dee2e6; padding: 6px 12px; }
        .tag-badge a { color: #aaa; transition: 0.2s; }
        .tag-badge a:hover { color: #dc3545; }
        
        /* =========================================
           [팀 의견/채팅 섹션 전용 스타일]
           ========================================= */
        .comment-section { background-color: #fdfdfd; border-radius: 8px; border: 1px solid #dee2e6; }
        .text-indigo { color: #3B4371; } /* Creatival 브랜드 네이비 */
        .chat-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; }
        .chat-input-wrapper textarea { border: 1px solid #dee2e6; resize: none; }
        .chat-input-wrapper textarea:focus { outline: none; box-shadow: none; border-color: #dee2e6; }
        .btn-dark-custom { background-color: #2c3e50; color: white; transition: 0.2s; }
        .btn-dark-custom:hover { background-color: #1a252f; color: white; }

        /* 후원하기 버튼 커스텀 스타일 */
        .btn-support {
            background-color: #3B4371;
            color: white;
            border: none;
            transition: 0.3s;
        }
        .btn-support:hover {
            background-color: #3B4371;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>

    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">
            <span class="badge bg-primary mb-2" th:text="${team.status}">모집 중</span>
            <h1 class="fw-bold display-5" th:text="${team.name}">팀 이름</h1>
            <p class="text-muted mb-0">
                <i class="bi bi-calendar-check"></i>
                설립일: <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
            </p>

            <div class="tag-area">
                <div class="mb-4 d-flex align-items-center flex-wrap gap-2 mt-3">
                    <div th:each="tag : ${tagList}" class="badge rounded-pill tag-badge">
                        <span th:text="'#' + ${tag.tagText}"></span>
                        <a sec:authorize="isAuthenticated()"
                           th:if="${team.leaderUsername == #authentication.name}"
                           th:href="@{/tag/team/deleteTeamTag(tagId=${tag.id},teamId=${team.id})}"
                           onclick="return confirm('삭제하시겠습니까?');">
                            <i class="bi bi-x-circle-fill ms-1"></i>
                        </a>
                    </div>

                    <button type="button"
                            sec:authorize="isAuthenticated()"
                            th:if="${team.leaderUsername == #authentication.name}"
                            class="btn btn-outline-primary btn-sm rounded-circle p-0"
                            style="width:24px;height:24px;"
                            data-bs-toggle="modal"
                            data-bs-target="#tagAddModal">
                        <i class="bi bi-plus"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-outline-secondary me-2"><i class="bi bi-heart"></i> 1.2k</button>
            <a th:href="@{/team/{id}/update(id=${team.id})}" class="btn btn-outline-secondary me-2" th:if="${team.leaderUsername == #authentication.name}">수정하기</a>
            <a th:href="@{/team/{id}/application(id=${team.id})}" class="btn btn-primary px-4">팀 참여 신청</a>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <img th:src="${team.bannerImgUrl != null ? team.bannerImgUrl : '/images/default-banner.png'}"
                 class="img-fluid rounded shadow-sm mb-5" style="width: 100%; height: 400px; object-fit: cover;">

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 소개</h4>
                <div class="lh-lg text-secondary" th:text="${team.description}">팀 소개 내용</div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">프로젝트</h4>
                    <div>
                        <a class="btn btn-outline-secondary me-2" th:href="@{/team/{id}/project/create(id=${team.id})}">프로젝트 등록</a>
                        <a th:href="@{/team/{id}/project/list(id=${team.id})}">전체 보기</a>
                    </div>
                </div>
                
                <div class="list-group list-group-flush shadow-sm rounded border" th:each="project : ${projectList}">
                    <a th:href="@{/team/{tid}/project/{pid}(tid=${team.id}, pid=${project.id})}"
                       class="list-group-item list-group-item-action py-3">
                        <div class="d-flex align-items-center">
                            <img th:src="${project.bannerImgUrl}" class="rounded me-3" style="width: 80px; height: 60px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-1 fw-bold" th:text="${project.title}">임시 프로젝트</h6>
                                <span class="text-muted small" th:text="${#temporals.format(project.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
                            </div>
                            <div class="text-end text-muted small d-none d-md-block">
                                <span><i class="bi bi-heart"></i> 1.2k</span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">팀 의견 나누기</h4>
                </div>
                
                <div class="comment-section p-4">
                    <h6 class="fw-bold mb-4">전체 의견 <span class="text-indigo">2</span></h6>
                    
                    <div class="chat-list mb-4">
                        <div class="d-flex mb-3">
                            <img src="https://dummyimage.com/40x40/adb5bd/495057" class="rounded-circle me-3" width="40" height="40">
                            <div class="w-100">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold small">홍시 (팀원)</span>
                                    <span class="text-muted small" style="font-size: 0.75rem;">2026.03.21 21:30</span>
                                </div>
                                <div class="p-3 chat-box text-dark small">오코바보</div>
                            </div>
                        </div>

                        <div class="d-flex mb-3">
                            <img src="https://dummyimage.com/40x40/ced4da/6c757d" class="rounded-circle me-3" width="40" height="40">
                            <div class="w-100">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold small text-primary" th:text="${#authentication.name}">나의 닉네임 (팀장)</span>
                                    <span class="text-muted small" style="font-size: 0.75rem;">2026.03.21 21:35</span>
                                </div>
                                <div class="p-3 chat-box text-dark small">
                                    좋습니다! 오렌지색으로 포인트를 줘도 예쁠 것 같아요.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-wrapper mt-4 shadow-sm border">
                        <textarea class="form-control border-bottom-0 rounded-0" rows="3" placeholder="팀원들과 자유롭게 의견을 나누어 보세요."></textarea>
                        <div class="d-flex justify-content-end border-top p-2 bg-light">
                            <button class="btn btn-dark-custom rounded-0 px-4 btn-sm">등록</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">팀 정보</h5>
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.profileImgUrl != null ? team.profileImgUrl : '/images/default-profile.png'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <h6 class="mb-0 fw-bold" th:text="${team.name}">Team Creatival</h6>
                            <small class="text-muted">설립일: <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2025.10.01</span></small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <a th:href="@{/team/{id}/teamApplicationManage(id=${team.id})}" th:if="${team.leaderUsername == #authentication.name}" class="btn btn-outline-secondary me-2">신청 현황</a>
                <a th:href="@{/team/{id}/teamMemberManage(id=${team.id})}" class="btn btn-outline-secondary">멤버 보기</a>
            </div>
            
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">참여중인 팀원</h5>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 border-0 d-flex align-items-center" th:each="member : ${memberList}">
                            <img th:src="${member.profileImgUrl != null} ? ${member.profileImgUrl} : 'https://dummyimage.com/40x40/adb5bd/495057'"
                                 class="rounded-circle me-3" width="40" height="40">
                            <div>
                                <p class="mb-0 fw-bold small"><span th:text="${member.username}">홍길동</span></p>
                                <small class="text-muted" th:text="${member.position}">포지션</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button class="btn btn-light border py-3 text-start px-3 shadow-sm">
                    <i class="bi bi-share me-2"></i> 프로젝트 공유하기
                </button>
                
				<a th:href="@{/team_boost}" class="btn btn-support py-3 text-start px-3 shadow-sm fw-bold">
				    <i class="bi bi-heart-fill me-2"></i> 팀 구독하기
				</a>
            </div>
        </div>
    </div>

    <div sec:authorize="isAuthenticated()" class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/team/createTeamTag/{id}(id=${team.id})}" method="post">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(function() {
            const msg = /*[[${message}]]*/ null;
            const status = /*[[${status}]]*/ 'success';

            if (msg) {
                Swal.fire({
                    icon: status, 
                    title: status === 'error' ? '접근 거부' : '완료',
                    text: msg,
                    confirmButtonColor: status === 'error' ? '#d33' : '#3085d6'
                });
            }
        });
    </script>
</div>
</html>
