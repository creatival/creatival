<!DOCTYPE html>
<html lang="kr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div class="container my-5" layout:fragment="content">

    <!-- 상단 헤더 -->
    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">

            <!-- 팀 상태 -->
            <span class="badge bg-primary mb-2"
                  th:text="${team.status}">
                모집 중
            </span>

            <!-- 팀 이름 -->
            <h1 class="fw-bold display-5"
                th:text="${team.name}">
                팀 이름
            </h1>

            <!-- 생성일 -->
            <p class="text-muted mb-0">
                <i class="bi bi-calendar-check"></i>
                설립일:
                <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">
                    2026.02.12
                </span>
            </p>

            <!-- 태그 (tagList 사용) -->
            <div class="mt-2">
                <span class="badge bg-light text-dark me-1"
                      th:each="tag : ${tagList}"
                      th:text="'#' + ${tag.tagText}">
                    #게임
                </span>
            </div>

        </div>

        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <!-- 임시 데이터 유지 -->
            <button class="btn btn-outline-secondary me-2">
                <i class="bi bi-heart"></i> 1.2k
            </button>
            
            <a th:href="@{/team/{id}/delete(id=${team.id})}" class="btn btn-outline-danger me-2" th:if="${team.leaderUsername == #authentication.name}" onclick="return confirm('정말 팀을 해체하시겠습니까?');">팀 해체</a>
            <a th:href="@{/team/{id}/update(id=${team.id})}" class="btn btn-outline-secondary me-2" th:if="${team.leaderUsername == #authentication.name}">수정하기</a>
            <a th:href="@{/team/{id}/application(id=${team.id})}" class="btn btn-primary px-4">팀 참여 신청</a>
        </div>
    </div>


    <div class="row">

        <!-- 왼쪽 영역 -->
        <div class="col-lg-8">

            <!-- 배너 이미지 -->
            <img th:src="${team.bannerImgUrl != null ? team.bannerImgUrl : '/images/default-banner.png'}"
                 class="img-fluid rounded shadow-sm mb-5"
                 style="width: 100%; height: 400px; object-fit: cover;">

            <!-- 팀 소개 -->
            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 소개</h4>
                <div class="lh-lg text-secondary"
                     th:text="${team.description}">
                    팀 소개 내용
                </div>
            </section>

            <!-- 프로젝트 영역 (임시 유지) -->
            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">프로젝트</h4>
					<div>
						<a class="btn btn-outline-secondary me-2" th:href="@{/team/{id}/project/create(id=${team.id})}">프로젝트 등록</a>
	                    <a th:href="@{/team_project_list}">전체 보기</a>
					</div>
                </div>

                <div class="list-group list-group-flush shadow-sm rounded border">
                    <a th:href="@{/team_project_detail}"
                       class="list-group-item list-group-item-action py-3">
                        <div class="d-flex align-items-center">
                            <img src="/images/pic.png"
                                 class="rounded me-3"
                                 style="width: 80px; height: 60px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-1 fw-bold">임시 프로젝트</h6>
                                <span class="text-muted small">2026.02.12</span>
                            </div>
                            <div class="text-end text-muted small d-none d-md-block">
                                <span><i class="bi bi-heart"></i> 1.2k</span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>

        </div>


        <!-- 오른쪽 영역 -->
        <div class="col-lg-4">

            <!-- 팀 정보 카드 -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">팀 정보</h5>

                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.profileImgUrl != null ? team.profileImgUrl : '/images/default-profile.png'}"
                             class="rounded-circle me-3"
                             style="width: 40px; height: 40px; object-fit: cover;">

                        <div>
                            <h6 class="mb-0 fw-bold"
                                th:text="${team.name}">
                                Team Creatival
                            </h6>
                            <small class="text-muted">
                                설립일:
                                <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">
                                    2025.10.01
                                </span>
                            </small>
                        </div>
                    </div>

                    <!-- 리더 정보 -->
                    <div class="d-flex align-items-center">
                        <img th:src="${team.leaderProfileImgUrl != null ? team.leaderProfileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}"
                             class="rounded-circle me-3"
                             style="width: 40px; height: 40px; object-fit: cover;">

                        <div>
                            <p class="mb-0 fw-bold small"
                               th:text="${team.leaderUsername}">
                                팀장 이름
                            </p>
                            <small class="text-muted">팀 리더</small>
                        </div>
                    </div>

                </div>
            </div>

			<a th:href="@{/team/{id}/teamApplicationManage(id=${team.id})}" class="btn btn-outline-secondary me-2">신청  현황</a>
            <!-- 팀원 영역 (임시 유지) -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">참여중인 팀원</h5>

					<div class="list-group list-group-flush">

					    <div class="list-group-item px-0 border-0 d-flex align-items-center"
					         th:each="member : ${memberList}">

					        <!-- 프로필 이미지 -->
					        <img th:src="${member.profileImgUrl != null} ? ${member.profileImgUrl} 
					                     : 'https://dummyimage.com/40x40/adb5bd/495057'"
					             class="rounded-circle me-3"
					             width="40" height="40">

					        <div>
					            <!-- 이름 + 역할 -->
					            <p class="mb-0 fw-bold small">
					                <span th:text="${member.username}">홍길동</span>
					                <span th:if="${member.role.name() == 'LEADER'}">
					                    (팀장)
					                </span>
					            </p>

					            <!-- 포지션 -->
					            <small class="text-muted"
					                   th:text="${member.position}">
					                포지션
					            </small>
					        </div>

					    </div>

					</div>
                </div>
            </div>
			


            <!-- 공유 버튼 -->
            <div class="d-grid gap-2">
                <button class="btn btn-light border py-3 text-start px-3">
                    <i class="bi bi-share me-2"></i> 프로젝트 공유하기
                </button>
            </div>

        </div>
    </div>
	
	<script th:inline="javascript">
	    $(function() {
	        const msg = /*[[${message}]]*/ null;
	        const status = /*[[${status}]]*/ 'success'; // 기본값은 success

	        if (msg) {
	            Swal.fire({
	                icon: status, // 'error'가 넘어오면 X 아이콘, 'success'면 체크 아이콘
	                title: status === 'error' ? '접근 거부' : '완료',
	                text: msg,
	                confirmButtonColor: status === 'error' ? '#d33' : '#3085d6'
	            });
	        }
	    });
	</script>
</div>
</html>
