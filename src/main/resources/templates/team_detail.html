<!DOCTYPE html>


<html lang="kr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
	  
	  <head>
	  				<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
	  				<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
	  		</head>

<div class="container my-5" layout:fragment="content">
    <style>
        /* 카드형 액션 버튼 스타일 */
        .action-buttons-group { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-action {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 70px; height: 75px; background-color: #ffffff; border: 1px solid #dee2e6;
            border-radius: 12px; text-decoration: none !important; transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 8px; color: #333;
            cursor: pointer;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.1); border-color: #adb5bd; }
        .btn-action i { font-size: 1.5rem; margin-bottom: 3px; line-height: 1; }
        .btn-action span { font-size: 0.75rem; font-weight: 700; }
        .btn-like i { color: #ff4757; }
        .btn-follow i { color: #ffc107; }
        .btn-bookmark i { color: #2D3278; }
        
        /* 배지 및 태그 */
        .badge-status { padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .tag-badge { 
            background-color: #f8f9fa; border: 1px solid #dee2e6; color: #333;
            padding: 5px 12px; border-radius: 20px; font-size: 0.85rem;
            display: inline-flex; align-items: center; margin-right: 5px;
        }
        .tag-badge i { cursor: pointer; color: #aaa; transition: 0.2s; margin-left: 5px; }
        .tag-badge i:hover { color: #dc3545; }

        /* 채팅/의견 섹션 */
        .comment-section { background-color: #fdfdfd; border-radius: 8px; border: 1px solid #dee2e6; }
        .chat-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; }
        .btn-support { background-color: #3B4371; color: white; border: none; transition: 0.3s; }
        .btn-support:hover { background-color: #2a3152; color: white; transform: translateY(-2px); }
    </style>

    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">
            <span class="badge bg-primary mb-2 badge-status" th:text="${team.status}">모집 중</span>
            <h1 class="fw-bold display-5" th:text="${team.name}">팀 이름</h1>
            <p class="text-muted mb-3 small">
                <i class="bi bi-calendar-check me-1"></i>설립일:
                <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
            </p>

            <div class="tag-area d-flex align-items-center flex-wrap gap-1">
                <div th:each="tag : ${tagList}" class="tag-badge">
                    <span th:text="'#' + ${tag.tagText}"></span>
                    <a sec:authorize="isAuthenticated()" th:if="${team.leaderUsername == #authentication.name}"
                       th:href="@{/tag/team/deleteTeamTag(tagId=${tag.id},teamId=${team.id})}"
                       onclick="return confirm('삭제하시겠습니까?');">
                        <i class="bi bi-x-circle-fill"></i>
                    </a>
                </div>
                <button type="button" sec:authorize="isAuthenticated()" th:if="${team.leaderUsername == #authentication.name}"
                        class="btn btn-outline-primary btn-sm rounded-circle p-0" style="width:24px;height:24px;"
                        data-bs-toggle="modal" data-bs-target="#tagAddModal">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
        </div>

        <div class="col-md-5 mt-4 mt-md-0">
            <div class="action-buttons-group mb-3">
                <button id="likeBtn" class="btn-action btn-like" th:onclick="|toggleLikeHeart(${team.id},'TEAM')|" th:classappend="${like.liked ? ' active' : ''}">
                    <i id="likeIcon" class="bi" th:classappend="${like.liked ? ' bi-heart-fill' : ' bi-heart'}"></i>
                    <span>좋아요</span>
                </button>
                <button th:onclick="|toggleBookmark(${team.id}, 'TEAM')|" id="bookmarkBtn"  class="btn-action btn-bookmark">
                    <i id="bookmarkIcon" class="bi" th:classappend="${bookmark.bookmarked ? ' bi-bookmark-check-fill' : ' bi-bookmark-check'}"></i>
                    <span>북마크</span>
                </button>
                <button class="btn-action btn-share"><i class="bi bi-share-fill"></i><span>공유</span></button>
            </div>
            <div class="text-md-end">
                <th:block th:if="${team.leaderUsername == #authentication.name}">
                    <a th:href="@{/team/{id}/update(id=${team.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil-square"></i> 수정하기</a>
                </th:block>
				<a th:onclick="|return requireLoginAction(() => location.href='/team/${team.id}/application')|" 
				   class="btn btn-primary px-4 fw-bold shadow-sm">
				   팀 참여 신청
				</a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <img th:src="${team.bannerImgUrl != null ? team.bannerImgUrl : '/images/default-banner.png'}"
                 class="img-fluid rounded shadow-sm mb-5" style="width: 100%; height: 400px; object-fit: cover;">

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 소개</h4>
                <div class="lh-lg text-secondary" th:text="${team.description}">팀 소개 내용</div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">진행 중인 프로젝트</h4>
                    <div>
                        <a sec:authorize="isAuthenticated()" th:if="${team.leaderUsername == #authentication.name}"
                           th:href="@{/team/{id}/project/create(id=${team.id})}" class="btn btn-sm btn-outline-primary me-2">프로젝트 등록</a>
                        <a th:href="@{/team/{id}/project/list(id=${team.id})}" class="text-decoration-none small text-muted">전체 보기 ></a>
                    </div>
                </div>
                <div class="list-group list-group-flush shadow-sm rounded border">
                    <div th:if="${#lists.isEmpty(projectList)}" class="list-group-item py-4 text-center text-muted">진행 중인 프로젝트가 없습니다.</div>
                    <a th:each="project : ${projectList}" th:href="@{/team/{tid}/project/{pid}(tid=${team.id}, pid=${project.id})}"
                       class="list-group-item list-group-item-action py-3">
                        <div class="d-flex align-items-center">
                            <img th:src="${project.bannerImgUrl != null ? project.bannerImgUrl : '/images/pic.png'}"
                                 class="rounded me-3" style="width: 80px; height: 60px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-1 fw-bold" th:text="${project.title}">프로젝트 제목</h6>
                                <span class="text-muted small" th:text="${#temporals.format(project.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
                            </div>
                            <div class="text-end text-muted small d-none d-md-block">
                                <span class="d-flex align-items-center"><i class="bi bi-heart-fill text-danger me-1"></i> <span th:text="${project.likeCount}">0</span></span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 의견 나누기</h4>
                <div class="comment-section p-4">
                    <div class="chat-list mb-4">
                        <div class="d-flex mb-3" th:each="comment : ${comments}">
                            <img src="https://dummyimage.com/40x40/adb5bd/495057" class="rounded-circle me-3" width="40" height="40">
                            <div class="w-100">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold small" th:text="${comment.username}">사용자</span>
                                    <span class="text-muted small" style="font-size: 0.75rem;" th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd HH:mm')}">시간</span>
                                </div>
                                <div class="p-3 chat-box text-dark small" th:text="${comment.text}">의견 내용</div>
                            </div>
                        </div>
                    </div>
                    <form th:action="@{/comment/team/write/{id}(id=${team.id})}" method="post" sec:authorize="isAuthenticated()">
                        <div class="chat-input-wrapper shadow-sm border">
                            <textarea name="text" class="form-control border-0 rounded-0" rows="3" placeholder="팀원들과 자유롭게 의견을 나누어 보세요."></textarea>
                            <div class="d-flex justify-content-end border-top p-2 bg-light">
                                <button type="submit" class="btn btn-dark btn-sm px-4">의견 등록</button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">팀 정보</h5>
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.profileImgUrl != null ? team.profileImgUrl : '/images/default-profile.png'}"
                             class="rounded-circle me-3" style="width: 45px; height: 45px; object-fit: cover;">
                        <div>
                            <h6 class="mb-0 fw-bold" th:text="${team.name}">Team Name</h6>
                            <small class="text-muted">설립일: <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}"></span></small>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.leaderProfileImgUrl != null ? team.leaderProfileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <p class="mb-0 fw-bold small" th:text="${team.leaderUsername}">리더명</p>
                            <small class="text-muted">팀 리더</small>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <div>
                            <p class="mb-0 mt-2 fw-bold small">좋아요 현황</p>
                            <i class="bi text-danger" th:classappend="${like.liked ? ' bi-heart-fill' : ' bi-heart'}"></i> 
                            <small class="text-danger fw-bold" th:text="${like.count}" id="likeCount">0</small><small class="text-danger">개</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mb-4" th:if="${team.leaderUsername == #authentication.name}">
                <a th:href="@{/team/{id}/teamApplicationManage(id=${team.id})}" class="btn btn-outline-dark py-2 fw-bold"><i class="bi bi-people-fill me-2"></i>신청 현황 관리</a>
                <a th:href="@{/team/{id}/teamMemberManage(id=${team.id})}" class="btn btn-outline-secondary py-2 fw-bold"><i class="bi bi-person-gear me-2"></i>멤버 관리</a>
				<a th:href="@{/team_membership_mange}" class="btn btn-outline-secondary py-2 fw-bold"><i class="bi bi-person-gear me-2"></i>회원 관리</a>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">참여 중인 팀원</h5>
                    <div class="list-group list-group-flush">
                        <div th:each="member : ${memberList}" class="list-group-item px-0 border-0 d-flex align-items-center">
                            <img th:src="${member.profileImgUrl != null} ? ${member.profileImgUrl} : 'https://dummyimage.com/40x40/adb5bd/495057'"
                                 class="rounded-circle me-3" width="35" height="35">
                            <div>
                                <p class="mb-0 fw-bold small" th:text="${member.username}">이름</p>
                                <small class="text-muted" th:text="${member.position}">포지션</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <a th:href="@{/team_board}" class="btn btn-light border py-3 text-start px-3 shadow-sm"><i class="bi bi-megaphone me-2"></i> 팀 게시판 이동</a>
                <a th:href="@{/team_boost}" class="btn btn-support py-3 text-start px-3 shadow-sm fw-bold"><i class="bi bi-heart-fill me-2"></i> 팀 구독/후원하기</a>
            </div>
        </div>
    </div>

    <div sec:authorize="isAuthenticated()" class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/team/createTeamTag/{id}(id=${team.id})}" method="post">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" placeholder="태그 입력" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(function() {
            const msg = /*[[${message}]]*/ null;
            const status = /*[[${status}]]*/ 'success';
            if (msg) {
                Swal.fire({
                    icon: status,
                    title: status === 'error' ? '알림' : '완료',
                    text: msg,
                    confirmButtonColor: '#3B4371'
                });
            }
        });
    </script>
</div>
</html>
