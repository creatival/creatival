<!DOCTYPE html>
<html lang="kr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<div class="container my-5" layout:fragment="content">
    <style>
        /* ===== 카드형 액션 버튼 스타일 (HEAD 디자인 유지) ===== */
        .action-buttons-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 75px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            text-decoration: none !important;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 8px;
            color: #333;
        }
        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
            border-color: #adb5bd;
            color: #111;
        }
        .btn-action i {
            font-size: 1.5rem;
            margin-bottom: 3px;
            line-height: 1;
        }
        .btn-action span {
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        .btn-like i { color: #ff4757; }
        .btn-follow i { color: #ffc107; }
        .btn-bookmark i { color: #2D3278; }
        .btn-share i { color: #333; }

        /* 상태 배지 및 태그 스타일 */
        .badge-status { padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .tag-badge { 
            background-color: #f8f9fa; border: 1px solid #dee2e6; 
            padding: 5px 12px; border-radius: 20px; font-size: 0.85rem;
            display: inline-flex; align-items: center; margin-right: 5px;
        }
        .tag-badge i { cursor: pointer; color: #ff4757; margin-left: 5px; }
    </style>

    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">
            <span class="badge bg-primary mb-2 badge-status" th:text="${team.status}">모집 중</span>
            <h1 class="fw-bold display-5" th:text="${team.name}">팀 이름</h1>
            <p class="text-muted mb-3 small">
                <i class="bi bi-calendar-check me-1"></i>설립일:
                <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
            </p>

            <div class="tag-area mb-2">
                <div th:each="tag : ${tagList}" class="tag-badge">
                    <span th:text="'#' + ${tag.tagText}"></span>
                    <a sec:authorize="isAuthenticated()"
                       th:if="${team.leaderUsername == #authentication.name}"
                       th:href="@{/tag/team/deleteTeamTag(tagId=${tag.id},teamId=${team.id})}"
                       onclick="return confirm('삭제하시겠습니까?');">
                        <i class="bi bi-x-circle-fill"></i>
                    </a>
                </div>

                <button type="button"
                        sec:authorize="isAuthenticated()"
                        th:if="${team.leaderUsername == #authentication.name}"
                        class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-1"
                        style="width:24px;height:24px; vertical-align: middle;"
                        data-bs-toggle="modal"
                        data-bs-target="#tagAddModal">
                    <i class="bi bi-plus"></i>
                </button>
            </div>
        </div>

        <div class="col-md-5 mt-4 mt-md-0">
            <div class="action-buttons-group mb-3">
                <a href="#" class="btn-action btn-like">
                    <i class="bi bi-heart-fill"></i>
                    <span>1.2k</span>
                </a>
                <a href="#" class="btn-action btn-follow">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>팔로우</span>
                </a>
                <a href="#" class="btn-action btn-bookmark">
                    <i class="bi bi-bookmark-fill"></i>
                    <span>북마크</span>
                </a>
                <a href="#" class="btn-action btn-share">
                    <i class="bi bi-share-fill"></i>
                    <span>공유</span>
                </a>
            </div>

            <div class="text-md-end">
                <th:block th:if="${team.leaderUsername == #authentication.name}">
                    <a th:href="@{/team/{id}/update(id=${team.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil-square me-1"></i> 수정하기</a>
                </th:block>
                <a th:href="@{/team/{id}/application(id=${team.id})}" class="btn btn-primary px-4 fw-bold shadow-sm">팀 참여 신청</a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <img th:src="${team.bannerImgUrl != null ? team.bannerImgUrl : '/images/default-banner.png'}"
                 class="img-fluid rounded shadow-sm mb-5"
                 style="width: 100%; height: 400px; object-fit: cover;">

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 소개</h4>
                <div class="lh-lg text-secondary" th:text="${team.description}">팀 소개 내용</div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">프로젝트</h4>
                    <div>
                        <a sec:authorize="isAuthenticated()" th:if="${team.leaderUsername == #authentication.name}"
                           th:href="@{/team/{id}/project/create(id=${team.id})}" class="btn btn-sm btn-outline-primary me-2">프로젝트 등록</a>
                        <a th:href="@{/team/{id}/project/list(id=${team.id})}" class="text-decoration-none small">전체 보기 ></a>
                    </div>
                </div>
                
                <div class="list-group list-group-flush shadow-sm rounded border">
                    <div th:if="${#lists.isEmpty(projectList)}" class="list-group-item py-4 text-center text-muted">
                        진행 중인 프로젝트가 없습니다.
                    </div>
                    <a th:each="project : ${projectList}" 
                       th:href="@{/team/{tid}/project/{pid}(tid=${team.id}, pid=${project.id})}"
                       class="list-group-item list-group-item-action py-3">
                        <div class="d-flex align-items-center">
                            <img th:src="${project.bannerImgUrl != null ? project.bannerImgUrl : '/images/pic.png'}"
                                 class="rounded me-3" style="width: 80px; height: 60px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-1 fw-bold" th:text="${project.title}">프로젝트 제목</h6>
                                <span class="text-muted small" th:text="${#temporals.format(project.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
                            </div>
                            <div class="text-end text-muted small d-none d-md-block">
                                <span><i class="bi bi-heart"></i> 1.2k</span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">팀 정보</h5>
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.profileImgUrl != null ? team.profileImgUrl : '/images/default-profile.png'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <h6 class="mb-0 fw-bold" th:text="${team.name}">Team Name</h6>
                            <small class="text-muted">설립일: <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2025.10.01</span></small>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <img th:src="${team.leaderProfileImgUrl != null ? team.leaderProfileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <p class="mb-0 fw-bold small" th:text="${team.leaderUsername}">리더명</p>
                            <small class="text-muted">팀 리더</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mb-4" th:if="${team.leaderUsername == #authentication.name}">
                <a th:href="@{/team/{id}/teamApplicationManage(id=${team.id})}" class="btn btn-outline-dark py-2 fw-bold shadow-sm">
                   <i class="bi bi-people-fill me-2"></i>신청 현황 관리
                </a>
                <a th:href="@{/team/{id}/teamMemberManage(id=${team.id})}" class="btn btn-outline-secondary py-2 fw-bold shadow-sm">
                    <i class="bi bi-person-gear me-2"></i>멤버 관리
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">참여중인 팀원</h5>
                    <div class="list-group list-group-flush">
                        <div th:if="${#lists.isEmpty(memberList)}" class="py-3 text-center text-muted small">
                            참여 중인 멤버가 없습니다.
                        </div>
                        <div class="list-group-item px-0 border-0 d-flex align-items-center" th:each="member : ${memberList}">
                            <img th:src="${member.profileImgUrl != null} ? ${member.profileImgUrl} : 'https://dummyimage.com/40x40/adb5bd/495057'"
                                 class="rounded-circle me-3" width="40" height="40">
                            <div>
                                <p class="mb-0 fw-bold small">
                                    <span th:text="${member.username}">이름</span>
                                    <span th:if="${member.role.name() == 'LEADER'}" class="text-primary">(팀장)</span>
                                </p>
                                <small class="text-muted" th:text="${member.position}">포지션</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

			<!-- 팀 의견 (우측 미리보기) -->
			<div class="card shadow-sm border-0 mb-4">
			    <div class="card-body">
			        <div class="d-flex justify-content-between align-items-center mb-3">
			            <h6 class="fw-bold mb-0">팀 의견</h6>
			            <a th:href="@{/team/{id}/comments(id=${team.id})}"
			               class="small text-decoration-none">더보기</a>
			        </div>

			        <!-- 댓글 리스트 -->
			        <div>

			            <div class="mb-3 pb-2 border-bottom"
			                 th:each="comment : ${comments}">

			                <!-- 작성자 + 시간 -->
			                <div class="small text-muted mb-1">
			                    <span class="fw-bold text-dark"
			                          th:text="${comment.username}">유저</span>
			                    ·
			                    <span th:text="${#temporals.format(comment.createdAt, 'MM.dd')}">
			                        04.01
			                    </span>
			                </div>

			                <!-- 내용 -->
			                <div class="small text-secondary"
			                     style="line-height:1.4; max-height: 2.8em; overflow: hidden;">
			                    <span th:text="${comment.text}">
			                        댓글 내용
			                    </span>
			                </div>
			            </div>

			            <!-- 댓글 없을 때 -->
			            <p class="text-muted small mb-0"
			               th:if="${#lists.isEmpty(comments)}">
			                아직 의견이 없습니다.
			            </p>

			        </div>

			        <!-- 간단 입력 -->
			        <form th:action="@{/comment/team/write/{id}(id=${team.id})}"
			              method="post"
			              class="mt-3"
			              sec:authorize="isAuthenticated()">

			            <div class="input-group input-group-sm">
			                <input type="text"
			                       name="text"
			                       class="form-control"
			                       placeholder="한 줄 의견..."
			                       required>
			                <button class="btn btn-primary">작성</button>
			            </div>

			        </form>

			    </div>
			</div>

            <div class="d-grid gap-2">
                <button class="btn btn-light border py-3 text-start px-3 shadow-sm">
                    <i class="bi bi-megaphone me-2"></i> 팀 홍보하기
                </button>
            </div>
        </div>
		
    </div>

    <div sec:authorize="isAuthenticated()" class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/team/createTeamTag/{id}(id=${team.id})}" method="post">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(function() {
            const msg = /*[[${message}]]*/ null;
            const status = /*[[${status}]]*/ 'success';
            if (msg) {
                Swal.fire({
                    icon: status,
                    title: status === 'error' ? '알림' : '완료',
                    text: msg,
                    confirmButtonColor: status === 'error' ? '#d33' : '#3085d6'
                });
            }
        });
    </script>
</div>
</html>
