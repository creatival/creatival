<!DOCTYPE html>
<html lang="kr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div class="container my-5" layout:fragment="content">
    <style>
        /* ===== 카드형 액션 버튼 스타일 (아까처럼) ===== */
        .action-buttons-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 75px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            text-decoration: none !important;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 8px;
            color: #333;
        }
        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
            border-color: #adb5bd;
            color: #111;
        }
        .btn-action i {
            font-size: 1.5rem;
            margin-bottom: 3px;
            line-height: 1;
        }
        .btn-action span {
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        /* 아이콘 개별 색상 */
		.btn-like i { color: #ff4757; }
		        .btn-follow i { color: #ffc107; }
		        .btn-bookmark i { color: #2D3278; }
		        .btn-share i { color: #333; }

        /* 상태 배지 스타일 보정 */
        .badge-status { padding: 6px 12px; border-radius: 20px; font-weight: 600; }
    </style>

    <div class="row mb-5 pb-4 border-bottom align-items-end">
        <div class="col-md-7">
            <span class="badge bg-primary mb-2 badge-status" th:text="${team.status}">모집 중</span>
            <h1 class="fw-bold display-5" th:text="${team.name}">팀 이름</h1>
            <p class="text-muted mb-0 small">
                <i class="bi bi-calendar-check me-1"></i>설립일:
                <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2026.02.12</span>
            </p>
            <div class="mt-2">
                <span class="badge bg-light text-dark border me-1 fw-normal" th:each="tag : ${tagList}" th:text="'#' + ${tag.tagText}">#게임</span>
            </div>
        </div>

        <div class="col-md-5 mt-4 mt-md-0">
            <div class="action-buttons-group mb-3">
                <a href="#" class="btn-action btn-like">
                    <i class="bi bi-heart-fill"></i>
                    <span>1.2k</span>
                </a>
                <a href="#" class="btn-action btn-follow">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>팔로우</span>
                </a>
                <a href="#" class="btn-action btn-bookmark">
                    <i class="bi bi-bookmark-fill"></i>
                    <span>북마크</span>
                </a>
                <a href="#" class="btn-action btn-share">
                    <i class="bi bi-share-fill"></i>
                    <span>공유</span>
                </a>
            </div>

            <div class="text-md-end">
                <a th:href="@{/team/{id}/delete(id=${team.id})}" class="btn btn-outline-danger btn-sm me-1" th:if="${team.leaderUsername == #authentication.name}" onclick="return confirm('정말 팀을 해체하시겠습니까?');">팀 해체</a>
                <a th:href="@{/team/{id}/update(id=${team.id})}" class="btn btn-outline-secondary btn-sm me-1" th:if="${team.leaderUsername == #authentication.name}">수정하기</a>
                <a th:href="@{/team/{id}/application(id=${team.id})}" class="btn btn-primary px-4 fw-bold">팀 참여 신청</a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <img th:src="${team.bannerImgUrl != null ? team.bannerImgUrl : '/images/default-banner.png'}"
                 class="img-fluid rounded shadow-sm mb-5"
                 style="width: 100%; height: 400px; object-fit: cover;">

            <section class="mb-5">
                <h4 class="fw-bold mb-4 border-bottom pb-2">팀 소개</h4>
                <div class="lh-lg text-secondary" th:text="${team.description}">팀 소개 내용</div>
            </section>

            <section class="mb-5">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
                    <h4 class="fw-bold mb-0">프로젝트</h4>
                    <a th:href="@{/team_project_list}" class="text-decoration-none small">전체 보기 ></a>
                </div>
                <div class="list-group list-group-flush shadow-sm rounded border">
                    <a th:href="@{/team_project_detail}" class="list-group-item list-group-item-action py-3">
                        <div class="d-flex align-items-center">
                            <img src="/images/pic.png" class="rounded me-3" style="width: 80px; height: 60px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="mb-1 fw-bold">임시 프로젝트</h6>
                                <span class="text-muted small">2026.02.12</span>
                            </div>
                            <div class="text-end text-muted small d-none d-md-block">
                                <span><i class="bi bi-heart"></i> 1.2k</span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">팀 정보</h5>
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="${team.profileImgUrl != null ? team.profileImgUrl : '/images/default-profile.png'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <h6 class="mb-0 fw-bold" th:text="${team.name}">Team Creatival</h6>
                            <small class="text-muted">설립일: <span th:text="${#temporals.format(team.createdAt, 'yyyy.MM.dd')}">2025.10.01</span></small>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <img th:src="${team.leaderProfileImgUrl != null ? team.leaderProfileImgUrl : 'https://dummyimage.com/40x40/ced4da/6c757d'}"
                             class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
                        <div>
                            <p class="mb-0 fw-bold small" th:text="${team.leaderUsername}">팀장 이름</p>
                            <small class="text-muted">팀 리더</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid mb-4">
                <a th:href="@{/team/{id}/teamApplicationManage(id=${team.id})}" class="btn btn-outline-dark py-2 fw-bold shadow-sm">
                   <i class="bi bi-people-fill me-2"></i>신청 현황 관리
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">참여중인 팀원</h5>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 border-0 d-flex align-items-center" th:each="member : ${memberList}">
                            <img th:src="${member.profileImgUrl != null} ? ${member.profileImgUrl} : 'https://dummyimage.com/40x40/adb5bd/495057'"
                                 class="rounded-circle me-3" width="40" height="40">
                            <div>
                                <p class="mb-0 fw-bold small">
                                    <span th:text="${member.username}">홍길동</span>
                                    <span th:if="${member.role.name() == 'LEADER'}" class="text-primary">(팀장)</span>
                                </p>
                                <small class="text-muted" th:text="${member.position}">포지션</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-light border py-3 text-start px-3 shadow-sm">
                    <i class="bi bi-megaphone me-2"></i> 팀 홍보하기
                </button>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        $(function() {
            const msg = /*[[${message}]]*/ null;
            const status = /*[[${status}]]*/ 'success';
            if (msg) {
                Swal.fire({
                    icon: status,
                    title: status === 'error' ? '접근 거부' : '완료',
                    text: msg,
                    confirmButtonColor: status === 'error' ? '#d33' : '#3085d6'
                });
            }
        });
    </script>
</div>
</html>
