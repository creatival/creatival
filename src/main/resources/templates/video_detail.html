<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" >

<div class="container my-5" layout:fragment="content">
	<style>
		.btn-boost{
			background-color: #f05a28 !important;
			border-color: #f05a28 !important;
			color: #ffffff !important;
		}
		
		
	</style>

    <div class="row g-4" th:if="${video != null}">
		
        <div class="col-12 col-lg-8">
			
            <div class="ratio ratio-16x9 bg-dark rounded-3 overflow-hidden shadow-sm mb-3">
                <video controls class="object-fit-cover">
                    <source th:src="${video.video?.fileUrl}" type="video/mp4">
                    브라우저가 비디오 태그를 지원하지 않습니다.
                </video>
            </div>

            <h4 class="fw-bold mb-3" th:text="${video.title}">비디오 제목</h4>

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center border-bottom pb-3 mb-4 gap-3">
                <div class="d-flex align-items-center" th:onclick="|location.href='@{/user/myPage/{id}(id=${video.userId})}'|" style="cursor: pointer;">
                    <img th:src="${video.profileImgUrl != null ? video.profileImgUrl : 'https://dummyimage.com/48x48/ced4da/6c757d'}" 
                         class="rounded-circle me-3" alt="채널 로고" style="width: 48px; height: 48px; object-fit: cover;">
                    <div>
                        <h6 class="fw-bold mb-0" th:text="${video.displayname}">디스플레이네임</h6>
                        <span class="text-muted small" th:text="'@' + ${video.username}">@username</span>
                    </div>
                </div>

				<button th:onclick="|toggleFollow(${video.userId}, 'USER')|" 
                        id="followBtn" 
                        type="button" 
                        class="btn btn-dark btn-sm rounded-pill px-3 fw-bold">
                    <i id="followIcon" class="bi me-1" th:classappend="${follow.followed ? ' bi-person-check' : ' bi-person-add'}"></i>
                    <span th:text="${follow.followed ? '팔로잉' : '팔로우'}">팔로우</span>
                </button>

				<button class="btn btn-boost shadow-sm" th:onclick="|location.href='@{/user/{id}/boost(id=${video.userId})}'|">후원하기</button>

                <div class="d-flex gap-2">
                    <div class="btn-group shadow-sm" role="group">
                        <button th:onclick="|toggleLike(${video.id}, 'CONTENT')|" id="likeBtn" type="button" class="btn btn-light border-secondary-subtle d-flex align-items-center">
                            <i id="likeIcon" class="bi me-2" th:classappend="${like.liked ? ' bi-hand-thumbs-up-fill' : ' bi-hand-thumbs-up'}"></i>
                            <span id="likeCount" th:text="${like.count}">0</span>
                        </button>
                        <button th:onclick="|toggleBookmark(${video.id}, 'CONTENT')|" id="bookmarkBtn" type="button" class="btn btn-light border-secondary-subtle d-flex align-items-center">
                            <i id="bookmarkIcon" class="bi me-2" th:classappend="${bookmark.bookmarked ? ' bi-bookmark-check-fill' : ' bi-bookmark-check'}"></i>
                            <span>북마크</span>
                        </button>
                    </div>

                    <button class="btn btn-light border-secondary-subtle shadow-sm d-flex align-items-center rounded-pill px-3">
                        <i class="bi bi-share me-2"></i>공유
                    </button>

                    <div class="ms-2 d-flex gap-2" th:if="${video.username == #authentication.name}">
                        <a th:href="@{/content/video/edit/{id}(id=${video.id})}" 
                           class="btn btn-outline-secondary rounded-pill px-3">
                           <i class="bi bi-pencil-square me-1"></i> 수정
                        </a>
                        <button type="button" class="btn btn-outline-danger rounded-pill px-3" 
                                th:onclick="|confirmDelete(${video.id})|">
                            <i class="bi bi-trash3 me-1"></i> 삭제
                        </button>
                    </div>

                    <form id="deleteForm" method="post" style="display:none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </form>
                </div>
            </div>

            <div class="bg-light p-3 rounded-3 mb-5 shadow-sm">
                <p class="fw-bold small mb-2">
                    조회수 <span th:text="${video.viewCount != null ? #numbers.formatInteger(video.viewCount, 0, 'COMMA') : '0'}">0</span>회 • 
                    <span th:text="${#temporals.format(video.createdAt, 'yyyy년 MM월 dd일')}">2026년 01월 01일</span>
                </p>
                <p class="mb-3 text-break text-muted" style="white-space: pre-wrap;" th:text="${video.description}">
                    영상 설명이 들어가는 곳입니다.
                </p>

				<form th:if="${video.username == #authentication.name and video.paid}"
				      th:action="@{/redeem/create/content/{id}(id=${video.id})}"
				      method="post"
				      class="d-flex justify-content-end mb-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				    <button type="submit" class="btn btn-outline-dark rounded-pill fw-bold px-3">
                        <i class="bi bi-key-fill me-1"></i> 리딤 코드 발급
                    </button>
				</form>
				
				<div th:if="${video.paid}">
					<div th:if="${hasAccess}">
						<span class="badge bg-success">구매 완료</span>
					</div>

					<div th:if="${!hasAccess}">
						<p class="fw-bold"
						   th:text="${#numbers.formatInteger(video.price, 3, 'COMMA') + '원'}">10,000원</p>

						<form th:action="@{/content/{id}/purchase(id=${video.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
							<button type="submit" class="btn btn-primary">구매하기</button>
						</form>
					</div>
				</div>

				<div th:if="${!video.paid}">
					<span class="badge bg-secondary">무료 콘텐츠</span>
				</div>

                <div class="tag-area mt-4">
                    <div th:each="tag : ${tagList}" class="badge rounded-pill bg-white text-dark border me-1 mb-1 shadow-sm">
                        <span th:text="'#' + ${tag.tagText}">#태그</span>
                        <a sec:authorize="isAuthenticated()"
                           th:if="${video.username == #authentication.name}"
                           th:href="@{/tag/video/deleteContentTag(tagId=${tag.id},contentId=${video.id})}"
                           class="text-danger"
                           onclick="return confirm('삭제하시겠습니까?');">
                            <i class="bi bi-x-circle-fill ms-1"></i>
                        </a>
                    </div>
					
                    <button type="button" sec:authorize="isAuthenticated()" th:if="${video.username == #authentication.name}"
                            class="btn btn-outline-primary btn-sm rounded-circle p-0 ms-2" style="width:24px;height:24px;"
                            data-bs-toggle="modal" data-bs-target="#tagAddModal">
                        <i class="bi bi-plus"></i>
                    </button>
					
                </div>
				
            </div>

            <div th:if="${video.isAllowComment}">
                <h5 class="fw-bold mb-4" th:text="${'댓글 ' + commentCount + '개'}"></h5>
                
                <div class="d-flex align-items-start mb-4">
                    <img src="https://dummyimage.com/40x40/adb5bd/fff" class="rounded-circle me-3 mt-1" alt="내 프로필" style="width: 40px; height: 40px;">
                    <form th:action="@{/comment/content/write/{id}(id=${video.id})}" method="post" class="w-100">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-flex gap-2">
                            <input type="text" name="text" class="form-control border-0 border-bottom rounded-0 px-0" placeholder="댓글을 입력하세요..." required>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">작성</button>
                        </div>
                    </form>
                </div>

                <div class="comment-list">
                    <th:block th:each="comment : ${comments}">
                        <div th:replace="~{comment-line :: commentItem(comment=${comment}, depth=0, category='content', targetId=${video.id})}"></div>
                    </th:block>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <h6 class="fw-bold mb-3">원본 콘텐츠</h6>
            <div class="d-flex flex-column gap-3">
                <a th:if="${parentContent != null}"
                   th:href="@{/content/{type}/detail/{id}(type=${#strings.toLowerCase(parentContent.type)},id=${parentContent.id})}"
                   class="text-decoration-none text-dark">
                    <div class="d-flex gap-2 align-items-start">
                        <div class="position-relative bg-dark rounded-2 overflow-hidden flex-shrink-0" style="width: 160px; height: 90px;">
                            <img th:src="${parentContent.thumbnailUrl}" class="object-fit-cover w-100 h-100" alt="원본 콘텐츠">
                        </div>
                        <div class="overflow-hidden">
                            <h6 class="fw-bold text-truncate mb-1" style="font-size: 0.95rem;" th:text="${parentContent.title}">원본 제목</h6>
                            <p class="text-muted small mb-0 text-truncate" th:text="${parentContent.username}">작성자</p>
                        </div>
                    </div>
                </a>

                <div th:if="${parentContent == null}" class="text-muted small">
                    원본 컨텐츠입니다.
                </div>
            </div>

            <br>

			<h6 class="fw-bold mb-3">연관 콘텐츠</h6>
			<div class="d-flex flex-column gap-3">
                <a th:each="childContent : ${childContents}"
                   th:href="@{/content/{type}/detail/{id}(type=${#strings.toLowerCase(childContent.type)},id=${childContent.id})}"
                   class="text-decoration-none text-dark">
                    <div class="d-flex gap-2 align-items-start">
                        <div class="position-relative bg-dark rounded-2 overflow-hidden flex-shrink-0" style="width: 160px; height: 90px;">
                            <img th:src="${childContent.thumbnailUrl}" class="object-fit-cover w-100 h-100" alt="연관 콘텐츠">
                        </div>
                        <div class="overflow-hidden">
                            <h6 class="fw-bold text-truncate mb-1" style="font-size: 0.95rem;" th:text="${childContent.title}">연관 제목</h6>
                            <p class="text-muted small mb-0 text-truncate" th:text="${childContent.username}">작성자</p>
                        </div>
                    </div>
                </a>

                <div th:if="${#lists.isEmpty(childContents)}" class="text-muted small">
                    연관 작품이 없습니다.
                </div>
			</div>
        </div>
    </div>

    <div sec:authorize="isAuthenticated()" class="modal fade" id="tagAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <form th:action="@{/tag/createContentVideoTag/{id}(id=${video.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <h6 class="fw-bold mb-3">새 태그 추가</h6>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="text" name="tagName" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary btn-sm w-100">추가</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

	
</div>
</html>
