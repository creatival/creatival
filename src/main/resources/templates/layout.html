<!DOCTYPE html>
<html lang="kr" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-5">
                <a class="navbar-brand" th:href="@{/}"><img th:src="@{/images/creatival_logoV5-Photoroom.png}" alt="" style="width: 200px;"></a>
                <div class="container mt-4">
                    <div class="input-group search-bar">
                        <input type="text" class="form-control search-input" placeholder="search">
                        <button class="btn search-btn" type="button"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn position-relative"><i class="bi bi-bell fs-5"></i></button>
                    <div class="dropdown">
                        <button class="btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${#authentication.principal != 'anonymousUser' and user != null and user.profileImgUrl != null ? user.profileImgUrl : 'https://dummyimage.com/32x32/ced4da/6c757d'}" class="rounded-circle" width="32" height="32">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/signUp}">회원가입</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/login}">로그인</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/myPage}">마이페이지</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/logout}">로그아웃</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        
        <th:block layout:fragment="content"></th:block>
    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const imageInput = document.getElementById('profileImageInput');
        const imagePreview = document.getElementById('imagePreview');
        if(imageInput) {
            imageInput.onchange = () => {
                const [file] = imageInput.files;
                if (file) { imagePreview.src = URL.createObjectURL(file); }
            }
        }
		const profileForm = document.querySelector('#imageUpdateModal form');
		profileForm.onsubmit = function() {
		    const submitBtn = this.querySelector('button[type="submit"]');
		    
		    // 버튼 중복 클릭 방지 및 로딩 표시
		    submitBtn.disabled = true;
		    submitBtn.innerHTML = `
		        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
		        업로드 중...
		    `;
		};
    </script>
</body>
</html>
