<!DOCTYPE html>
<html lang="kr" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
	<meta name="_csrf" th:content="${_csrf.token}"/>
	    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
		
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
	<style>
		.tag-badge {
		    font-size: 0.75rem;
		    padding: 5px 12px;
			background-color:#fe8e3e; 
		}
		/* 댓글 전체 아이템 */
				.comment-item {
				    margin-bottom: 1rem;
				    position: relative;
				}

				/* 대댓글을 감싸는 컨테이너: 왼쪽 실선 */
				.reply-wrapper {
				    margin-left: 12px; /* 들여쓰기 */
				    border-left: 2px solid #edeff1; /* 레딧 특유의 연회색 선 */
				    padding-left: 20px; /* 선과 내용 사이 간격 */
				    margin-top: 5px;
				}
		.comment-section {
				            background-color: #f8f9fa;
				            border-radius: 15px;
				            padding: 40px 20px;
				        }

				        .comment-input {
				            border: none !important;
				            border-bottom: 1px solid #dee2e6 !important;
				            background-color: transparent !important;
				            border-radius: 0 !important;
				            box-shadow: none !important;
				        }

				        .comment-input:focus {
				            border-bottom: 2px solid #2D3278 !important;
				        }
						.btn-action {
								    background: none;
								    border: none;
								    padding: 0;
								    font-size: 0.8rem;
								    font-weight: 700;
								    color: #878a8c;
								    cursor: pointer;
								}

								.btn-action:hover {
								    text-decoration: underline;
								    color: #1a1a1b;
								}

								.btn-delete {
								    color: #ff585b;
								}
	</style>
</head>
<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-5">
                <a class="navbar-brand" th:href="@{/}"><img th:src="@{/images/creatival_logoV5-Photoroom.png}" alt="" style="width: 200px;"></a>
                <div class="container">
                    <div class="input-group search-bar">
                        <input type="text" class="form-control search-input" placeholder="search">
                        <button class="btn search-btn" type="button"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn position-relative"><i class="bi bi-bell fs-5"></i></button>
                    <div class="dropdown">
                        <button class="btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${#authentication.principal != 'anonymousUser' and user != null and user.profileImgUrl != null ? user.profileImgUrl : 'https://dummyimage.com/32x32/ced4da/6c757d'}" class="rounded-circle" width="32" height="32">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/signUp}">회원가입</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/login}">로그인</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/myPage}">마이페이지</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/logout}">로그아웃</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        
        <th:block layout:fragment="content"></th:block>
    </main>

    
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<th:block layout:fragment="script"></th:block>
	<script th:inline="javascript">
		const msg = /*[[${message}]]*/ null;
		const icon = /*[[${icon}]]*/ "info";

		if(msg){
		    Swal.fire({
		        icon: icon,
		        text: msg
		    });
		}
		
		function requireLoginAction(actionCallback) {
			const isLoggedIn = [[${#authentication.principal != 'anonymousUser'}]];
			if (!isLoggedIn) {
			        Swal.fire({
			            icon: 'warning',
			            title: '로그인이 필요합니다',
			            text: '좋아요 기능은 로그인 후 이용할 수 있습니다.',
			            confirmButtonText: '로그인하러 가기',
			            showCancelButton: true,
			            cancelButtonText: '닫기'
			        }).then((result) => {
			            if (result.isConfirmed) {
			                window.location.href = "/user/login";
			            }
			        });
			        return;
			    }

		    actionCallback();yu
		}
		function toggleLike(targetId, type) {
			const token = document.querySelector('meta[name="_csrf"]').content;
			const header = document.querySelector('meta[name="_csrf_header"]').content;
			requireLoginAction(() => {
				fetch('/like/toggle', {	
			        method: 'POST',
			        headers: { 'Content-Type': 'application/json', [header]: token },
			        body: JSON.stringify({ targetId, type })
			    })
				.then(res => res.json())
						    .then(data => {
						        document.getElementById('likeCount').innerText = data.count;
								if(data.liked==true) {
									document.getElementById('likeIcon').classList.add('bi-hand-thumbs-up-fill');
									document.getElementById('likeIcon').classList.remove('bi-hand-thumbs-up');
								} else {
									document.getElementById('likeIcon').classList.remove('bi-hand-thumbs-up-fill');
									document.getElementById('likeIcon').classList.add('bi-hand-thumbs-up');
								}	
						        
					
						        const btn = document.getElementById('likeBtn');
						        if (data.liked) {
						            btn.classList.add('active');
						        } else {
						            btn.classList.remove('active');
						        }
						    });
			})
		}
		function toggleBookmark(targetId, type) {
			const token = document.querySelector('meta[name="_csrf"]').content;
						const header = document.querySelector('meta[name="_csrf_header"]').content;
		    requireLoginAction(() => {
		        fetch("/bookmark/toggle", {
		            method: "POST",
		            body: JSON.stringify({ targetId, type }),
		            headers: { "Content-Type": "application/json", [header]: token }
		        })
				.then(res => res.json())
				    .then(data => {
						if(data.bookmarked==true) {
							document.getElementById('bookmarkIcon').classList.add('bi-bookmark-check-fill');
							document.getElementById('bookmarkIcon').classList.remove('bi-bookmark-check');
						} else {
							document.getElementById('bookmarkIcon').classList.remove('bi-bookmark-check-fill');
							document.getElementById('bookmarkIcon').classList.add('bi-bookmark-check');
						}
				    });
		    });
		}
		function toggleFollow(targetId, type) {
			const token = document.querySelector('meta[name="_csrf"]').content;
						const header = document.querySelector('meta[name="_csrf_header"]').content;
		    requireLoginAction(() => {
		        fetch("/follow/toggle", {
		            method: "POST",
		            body: JSON.stringify({ targetId, type }),
		            headers: { "Content-Type": "application/json", [header]: token }
		        })
		    });
		}
	</script>
    
</body>
</html>
