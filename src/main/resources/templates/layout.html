<!DOCTYPE html >
<html lang="kr" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Creatival</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light  bg-light ">
            <div class="container px-5">
                <a class="navbar-brand" th:href="@{/}"><img src="images/creatival_logoV5-Photoroom.png" alt=""
                        style="width: 200px;"></a>
                <div class="container mt-4">
                    <div class="input-group search-bar">
                        <input type="text" class="form-control search-input" placeholder="search">
                        <button class="btn search-btn" type="button">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">

                    <!-- 알림 아이콘 -->
                    <button class="btn position-relative">
                        <i class="bi bi-bell fs-5"></i>
                    </button>

                    <!-- 프로필 드롭다운 -->
                   
					<div class="dropdown">
					    <button class="btn d-flex align-items-center gap-2 dropdown-toggle"
					            data-bs-toggle="dropdown"
					            aria-expanded="false">
					        <img src="https://dummyimage.com/32x32/ced4da/6c757d"
					             class="rounded-circle"
					             width="32"
					             height="32">
					    </button>

					    <ul class="dropdown-menu dropdown-menu-end">
					        <li sec:authorize="isAnonymous()">
					            <a class="dropdown-item" th:href="@{/user/signUp}">회원가입</a>
					        </li>
					        <li sec:authorize="isAnonymous()">
					            <a class="dropdown-item" th:href="@{/user/login}">로그인</a>
					        </li>
					        <li sec:authorize="isAuthenticated()">
					            <a class="dropdown-item" th:href="@{/user/myPage}">마이페이지</a>
					        </li>
					        <li sec:authorize="isAuthenticated()">
					            <a class="dropdown-item" th:href="@{/user/logout}">로그아웃</a>
					        </li>
					    </ul>
					</div>

                </div>

            </div>
        </nav>
        
		<th:block layout:fragment="content"></th:block>
		<!-- Bootstrap core JS-->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

		   <!-- Core theme JS-->
		   <script src="js/scripts.js"></script>
</html>
