<!DOCTYPE html>
<html lang="kr" 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <title>Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
    
    <style>
        .tag-badge {
            font-size: 0.75rem;
            padding: 5px 12px;
            background-color:#fe8e3e; 
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-5">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/images/creatival_logoV5-Photoroom.png}" alt="Logo" style="width: 200px;">
                </a>
                <div class="container">
                    <div class="input-group search-bar">
                        <input type="text" class="form-control search-input" placeholder="search">
                        <button class="btn search-btn" type="button"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn position-relative"><i class="bi bi-bell fs-5"></i></button>
                    <div class="dropdown">
                        <button class="btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${#authentication.principal != 'anonymousUser' and user != null and user.profileImgUrl != null ? user.profileImgUrl : 'https://dummyimage.com/32x32/ced4da/6c757d'}" 
                                 class="rounded-circle" width="32" height="32">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/signUp}">회원가입</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/user/login}">로그인</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/myPage}">마이페이지</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/user/logout}">로그아웃</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        
        <th:block layout:fragment="content"></th:block>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <th:block layout:fragment="script"></th:block>
    
    <script th:inline="javascript">
        /* 서버 메시지 처리 */
        const msg = /*[[${message}]]*/ null;
        const icon = /*[[${icon}]]*/ "info";
        const isLogMessage = /*[[${isLogMessage}]]*/ false; // 로그인 권장 알림 여부

        if(msg){
            Swal.fire({ icon: icon, text: msg });
        }

        if(isLogMessage) {
            showLoginAlert();
        }

        /* 공통 로그인 권장 알림창 */
        function showLoginAlert() {
            Swal.fire({
                icon: 'warning',
                title: '로그인이 필요합니다',
                text: '해당 기능은 로그인 후 이용할 수 있습니다.',
                confirmButtonText: '로그인하러 가기',
                showCancelButton: true,
                cancelButtonText: '닫기'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "/user/login";
                }
            });
        }

        /* 로그인 체크 및 액션 실행 함수 */
        function requireLoginAction(actionCallback) {
            const isLoggedIn = [[${#authentication.principal != 'anonymousUser'}]];
            if (!isLoggedIn) {
                showLoginAlert();
                return false;
            }
            if (actionCallback) actionCallback();
            return true;
        }

        /* 좋아요 토글 (엄지척) */
        function toggleLike(targetId, type) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            requireLoginAction(() => {
                fetch('/like/toggle', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [header]: token },
                    body: JSON.stringify({ targetId, type })
                })
                .then(res => res.json())
                .then(data => {
                    const countElem = document.getElementById('likeCount');
                    const iconElem = document.getElementById('likeIcon');
                    if(countElem) countElem.innerText = data.count;
                    if(iconElem) {
                        iconElem.classList.toggle('bi-hand-thumbs-up-fill', data.liked);
                        iconElem.classList.toggle('bi-hand-thumbs-up', !data.liked);
                    }
                });
            });
        }

        /* 좋아요 토글 (하트) */
        function toggleLikeHeart(targetId, type) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            requireLoginAction(() => {
                fetch('/like/toggle', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [header]: token },
                    body: JSON.stringify({ targetId, type })
                })
                .then(res => res.json())
                .then(data => {
                    const countElem = document.getElementById('likeCount');
                    const iconElem = document.getElementById('likeIcon');
                    if(countElem) countElem.innerText = data.count;
                    if(iconElem) {
                        iconElem.classList.toggle('bi-heart-fill', data.liked);
                        iconElem.classList.toggle('bi-heart', !data.liked);
                    }
                });
            });
        }

        /* 북마크 토글 */
        function toggleBookmark(targetId, type) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            requireLoginAction(() => {
                fetch("/bookmark/toggle", {
                    method: "POST",
                    body: JSON.stringify({ targetId, type }),
                    headers: { "Content-Type": "application/json", [header]: token }
                })
                .then(res => res.json())
                .then(data => {
                    const iconElem = document.getElementById('bookmarkIcon');
                    if(iconElem) {
                        iconElem.classList.toggle('bi-bookmark-check-fill', data.bookmarked);
                        iconElem.classList.toggle('bi-bookmark-check', !data.bookmarked);
                    }
                });
            });
        }

        /* 팔로우 토글 */
        function toggleFollow(targetId, type) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            requireLoginAction(() => {
                fetch("/follow/toggle", {
                    method: "POST",
                    body: JSON.stringify({ targetId, type }),
                    headers: { "Content-Type": "application/json", [header]: token }
                })
                .then(res => res.json())
                .then(data => {
                    const btn = document.getElementById('followBtn');
                    if(btn) {
                        btn.classList.toggle('following', data.followed);
                        btn.innerText = data.followed ? '팔로우 중' : '팔로우';
                    }
                });
            });
        }
    </script>
</body>
</html>
