<html layout:decorate="~{layout}">
<div layout:fragment="content">

<div class="container py-5" style="max-width: 1000px;">

    <h3 class="fw-bold mb-4">팀 가입 신청 관리</h3>

    <!-- 신청이 없을 경우 -->
    <div th:if="${#lists.isEmpty(applicationList)}" class="alert alert-secondary">
        현재 대기 중인 신청이 없습니다.
    </div>

    <!-- 신청 목록 -->
    <div th:if="${!#lists.isEmpty(applicationList)}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>신청자</th>
                    <th>포지션</th>
                    <th>메시지</th>
                    <th>신청일</th>
                    <th class="text-center">처리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${applicationList}">
                    
                    <!-- 신청자 이름 -->
                    <td th:text="${app.username}">username</td>

                    <!-- 포지션 -->
                    <td th:text="${app.position}">position</td>

                    <!-- 메시지 -->
                    <td>
                        <div style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                             th:text="${app.message}">
                        </div>
                    </td>

                    <!-- 신청일 -->
                    <td th:text="${#temporals.format(app.appliedAt, 'yyyy-MM-dd HH:mm')}">
                        2026-03-03
                    </td>

                    <!-- 승인 / 거절 -->
                    <td class="text-center">
                        <form th:action="@{/team/application/{id}/approve(id=${app.id})}" 
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-success">
                                승인
                            </button>
                        </form>

                        <form th:action="@{/team/application/{id}/reject(id=${app.id})}" 
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">
                                거절
                            </button>
                        </form>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

</div>

</div>
</html>
