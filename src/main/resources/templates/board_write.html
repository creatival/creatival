<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div class="container" layout:fragment="content">

    <div class="text-center my-5">
        <h1 class="fw-bold" style="font-size: 2.5rem;">게시글 작성</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="border-top border-dark border-2 pt-4">
                <form>
                    <div class="mb-4 row">
                        <label class="col-sm-2 col-form-label fw-bold">카테고리</label>
                        <div class="col-sm-4">
                            <select class="form-select shadow-none border-secondary-subtle">
                                <option selected>유저 게시판</option>
                                <option>창작자 게시판</option>
                                <option>질문/답변</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4 row">
                        <label class="col-sm-2 col-form-label fw-bold">제목</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control shadow-none border-secondary-subtle" placeholder="제목을 입력해주세요.">
                        </div>
                    </div>

                    <div class="mb-4 row">
                        <label class="col-sm-2 col-form-label fw-bold">작성자</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control-plaintext ps-2 fw-bold text-muted" value="현재 로그인한 사용자명" readonly>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">내용</label>
                        <textarea class="form-control shadow-none border-secondary-subtle" rows="12" placeholder="내용을 입력해주세요." style="resize: none;"></textarea>
                    </div>

                    <div class="mb-5 row">
                        <label class="col-sm-2 col-form-label fw-bold">파일 첨부</label>
                        <div class="col-sm-10">
                            <input class="form-control shadow-none border-secondary-subtle" type="file">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center border-top pt-5 mb-5" style="gap: 15px;">
                        <button type="button" class="btn btn-outline-secondary rounded-0 px-5 py-2 fw-bold">취소</button>
                        <button type="submit" class="btn btn-dark rounded-0 px-5 py-2 fw-bold" style="background-color: #3f51b5; border: none;">등록하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</html>
