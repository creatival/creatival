<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<head>
	

		<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
		<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
		
    <style>
        /* 1. 파일 업로드 및 미리보기 */
        .preview-wrapper {
            width: 180px; height: 240px; margin: 0 auto 15px;
            border: 2px dashed #a0c4ff; border-radius: 12px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            background-color: #f8f9ff; position: relative;
        }
        #imagePreview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .preview-placeholder { color: #a0c4ff; text-align: center; font-size: 0.85rem; }

        .custom-file-container {
            display: inline-flex; align-items: center; border: 2px solid #a0c4ff;
            border-radius: 12px; padding: 5px; width: 100%; max-width: 500px; background-color: #fff;
        }
        #thumbnailFile { display: none; }
        .btn-file-select {
            background-color: #fff; border: 1px solid #ced4da; border-radius: 8px;
            padding: 8px 20px; font-size: 0.95rem; cursor: pointer; margin-right: 15px;
        }
        .file-name-display { color: #6c757d; font-size: 0.95rem; flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }

        /* 2. 입력창 및 설명 박스 */
        .form-control-custom {
            border: none; border-bottom: 1px solid #ced4da; border-radius: 0;
            padding: 10px 0; box-shadow: none !important; text-align: center;
        }
        .description-box { background-color: #f2f2f2; border: none; border-radius: 15px; padding: 20px; resize: none; }

        /* 3. 태그 UI 스타일 */
        .tag-badge {
            background-color: #eef2ff; color: #3b82f6; border: 1px solid #d1dbff;
            padding: 5px 12px; border-radius: 20px; font-size: 0.9rem;
            display: inline-flex; align-items: center; transition: 0.2s;
        }
        .tag-badge i { cursor: pointer; margin-left: 6px; font-size: 12px; color: #ff5e3a; }
        .tag-badge:hover { background-color: #d1dbff; }
        .tag-input-group { max-width: 400px; margin: 0 auto; }

        /* 4. 하단 버튼 */
        .btn-submit-action {
            background-color: #2f3e75; color: white; border-radius: 8px;
            padding: 15px 0; font-weight: bold; width: 48%; border: none;
        }
        .btn-cancel-action {
            background-color: white; color: #f05a28; border: 2px solid #f05a28;
            border-radius: 8px; padding: 15px 0; font-weight: bold; width: 48%;
            text-decoration: none; display: inline-block; text-align: center;
        }
        
        .settings-label { font-size: 0.85rem; color: #6c757d; font-weight: 600; margin-bottom: 8px; display: block; }
        .settings-group { background: #fcfcfc; border-radius: 10px; padding: 20px; border: 1px solid #eee; }
    </style>
</head>

<div class="container" layout:fragment="content">
    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="col-lg-8">

            <form th:action="@{/content/novel_write}" method="post" enctype="multipart/form-data" th:object="${createNovelDTO}" id="novelForm">
                
                <div class="mb-5">
                    <input type="text" th:field="*{title}" class="form-control form-control-custom fs-3 fw-bold" placeholder="작품 제목을 입력하세요" required>
                </div>
				<div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
				                               <div th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 문구</div>
				                           </div>

                <div class="mb-5 text-center">
                    <label class="settings-label">커버 업로드</label>
                    <div class="preview-wrapper shadow-sm">
                        <div class="preview-placeholder" id="placeholder"><i class="bi bi-image fs-1"></i><br>미리보기</div>
                        <img id="imagePreview">
                    </div>
                    <div class="d-flex justify-content-center">
                        <div class="custom-file-container shadow-sm">
                            <input type="file" th:field="*{thumbnailFile}" accept="image/*" onchange="previewImage(this)">
                            <label for="thumbnailFile" class="btn-file-select mb-0">파일 선택</label>
                            <span class="file-name-display" id="fileNameDisplay">선택된 파일 없음</span>
                        </div>
                    </div>
                </div>

                <div class="mb-5 text-center">
                    <label class="settings-label"><i class="bi bi-pencil-fill"></i> 작품 설명</label>
                    <textarea th:field="*{description}" class="form-control description-box" rows="5" placeholder="코멘트 입력"></textarea>
                </div>

                <div class="mb-5 text-center">
                    <label class="settings-label"><i class="bi bi-hash"></i> 태그 설정</label>
                    
                    <div id="tagContainer" class="d-flex justify-content-center flex-wrap gap-2 mb-3">
                        </div>

                    <div class="input-group tag-input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-muted">#</span>
                        <input type="text" id="tagInput" class="form-control border-start-0" placeholder="태그를 입력하고 엔터를 누르세요" onkeypress="handleTagKey(event)">
                        <button class="btn btn-outline-primary" type="button" onclick="addTag()">추가</button>
                    </div>
                    
                    <input type="hidden" name="tagString" id="finalTagString">
                </div>

                <div class="settings-group mb-5">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">연재 상태</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{end}" value="false" checked id="status-ing">
                                <label class="form-check-label" for="status-ing">연재 중</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{end}" value="true" id="status-end">
                                <label class="form-check-label" for="status-end">완결</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">공개 범위</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{visibility}" value="PUBLIC" checked id="vis-public">
                                <label class="form-check-label" for="vis-public">공개</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{visibility}" value="PRIVATE" id="vis-private">
                                <label class="form-check-label" for="vis-private">비공개</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <span class="settings-label">댓글 설정</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{allowComment}" value="true" checked id="comment-ok">
                                <label class="form-check-label" for="comment-ok">허용</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{allowComment}" value="false" id="comment-no">
                                <label class="form-check-label" for="comment-no">금지</label>
                            </div>
                        </div>
						<div class="col-md-6"></div>
                        <div class="col-md-6">
                            <span class="settings-label">프로젝트 연결 (선택)</span>
                            <input type="text" th:field="*{projectTag}" class="form-control form-control-sm" placeholder="projectTag 입력">
                        </div>
                        <div class="col-md-6">
                            <span class="settings-label">원본 작품 ID (선택)</span>
                            <input type="number" th:field="*{originalContentId}" class="form-control form-control-sm" placeholder="ID 입력">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                    <button type="submit" class="btn-submit-action shadow-sm">업로드</button>
                    <a th:href="@{/}" class="btn-cancel-action shadow-sm">취소</a>
                </div>
            </form>
            
        </div>
    </div>

	<script th:inline="javascript">
	    // 1. 이미지 미리보기 스크립트
	    function previewImage(input) {
	        const fileDisplay = document.getElementById('fileNameDisplay');
	        const preview = document.getElementById('imagePreview');
	        const placeholder = document.getElementById('placeholder');

	        if (input.files && input.files[0]) {
	            const reader = new FileReader();
	            fileDisplay.innerText = input.files[0].name;
	            reader.onload = (e) => {
	                preview.src = e.target.result;
	                preview.style.display = 'block';
	                placeholder.style.display = 'none';
	            }
	            reader.readAsDataURL(input.files[0]);
	        }
	    }

	    // 2. 태그 관리 스크립트
	    let tagArray = [];

	    function handleTagKey(e) {
	        if (e.key === 'Enter') {
	            e.preventDefault();
	            addTag();
	        }
	    }

	    function addTag() {
	        const input = document.getElementById('tagInput');
	        const value = input.value.trim().replace(/#/g, '');

	        if (value && !tagArray.includes(value)) {
	            if (tagArray.length >= 10) {
	                alert("태그는 최대 10개까지 등록 가능합니다.");
	                return;
	            }
	            tagArray.push(value);
	            updateTags();
	            input.value = '';
	        }
	    }

	    function removeTag(tag) {
	        tagArray = tagArray.filter(t => t !== tag);
	        updateTags();
	    }

	    function updateTags() {
	        const container = document.getElementById('tagContainer');
	        const hiddenInput = document.getElementById('finalTagString');

	        container.innerHTML = tagArray.map(t => `
	            <span class="tag-badge shadow-sm">
	                #${t} <i class="bi bi-x-circle-fill" onclick="removeTag('${t}')"></i>
	            </span>
	        `).join('');

	        hiddenInput.value = tagArray.join(',');
	    }

	    // 3. projectTag / originalContentId 동시 입력 방지
	    document.getElementById("novelForm").addEventListener("submit", function(e) {

	        const projectTag = document.querySelector("input[name='projectTag']").value.trim();
	        const originalContentId = document.querySelector("input[name='originalContentId']").value.trim();

	        if (projectTag !== "" && originalContentId !== "") {
	            alert("프로젝트 연결과 원본 작품 ID는 동시에 입력할 수 없습니다.");
	            e.preventDefault(); // submit 차단
	        }
	    });
	</script>
</div>
</html>
