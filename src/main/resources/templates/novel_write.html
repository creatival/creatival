<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        /* 1. 커스텀 파일 업로드 (image_8ddd65.png 반영) */
        .custom-file-container {
            display: inline-flex;
            align-items: center;
            border: 2px solid #a0c4ff; /* 하늘색 테두리 */
            border-radius: 12px;
            padding: 5px;
            width: 100%;
            max-width: 500px;
            background-color: #fff;
        }
        #thumbnailFile { display: none; }
        .btn-file-select {
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-right: 15px;
        }
        .file-name-display { color: #6c757d; font-size: 0.95rem; flex-grow: 1; text-align: left; }

        /* 2. 기존 입력창 스타일링 */
        .form-control-custom {
            border: none;
            border-bottom: 1px solid #ced4da;
            border-radius: 0;
            padding: 10px 0;
            box-shadow: none !important;
            text-align: center;
        }
        .description-box {
            background-color: #e9ecef; /* 회색 코멘트 영역 */
            border: none;
            border-radius: 15px;
            padding: 20px;
            resize: none;
        }

        /* 3. 하단 버튼 (image_8de220.png 반영) */
        .btn-submit-action {
            background-color: #3b447a; color: white; border-radius: 8px;
            padding: 15px 0; font-weight: bold; width: 48%; border: none;
        }
        .btn-cancel-action {
            background-color: white; color: #f05a28; border: 2px solid #f05a28;
            border-radius: 8px; padding: 15px 0; font-weight: bold; width: 48%;
            text-decoration: none; display: inline-block; text-align: center;
        }
        
        /* 설정 레이아웃 */
        .settings-label { font-size: 0.85rem; color: #6c757d; font-weight: 600; margin-bottom: 8px; display: block; }
        .settings-group { background: #fcfcfc; border-radius: 10px; padding: 20px; border: 1px solid #eee; }
    </style>
</head>

<div class="container" layout:fragment="content">
    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="col-lg-8">


            <form th:action="@{/content/novel_write}" method="post" enctype="multipart/form-data" th:object="${createNovelDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                    <div th:each="err : ${#fields.allErrors()}">[[${err}]]</div>
                </div>

                <div class="mb-5">
                    <input type="text" th:field="*{title}" class="form-control form-control-custom fs-3 fw-bold" placeholder="작품 제목을 입력하세요" required>
                </div>

                <div class="mb-5 text-center">
                    <label class="settings-label">커버 업로드</label>
                    <div class="d-flex justify-content-center">
                        <div class="custom-file-container shadow-sm">
                            <input type="file" th:field="*{thumbnailFile}" id="thumbnailFile" accept="image/*" onchange="updateFileName(this)">
                            <label for="thumbnailFile" class="btn-file-select mb-0">파일 선택</label>
                            <span class="file-name-display" id="fileName">선택된 파일 없음</span>
                        </div>
                    </div>
                </div>

                <div class="mb-5 text-center">
                    <label class="settings-label"><i class="bi bi-pencil-fill"></i> 글 작성하기</label>
                    <textarea th:field="*{description}" class="form-control description-box" rows="5" placeholder="코멘트 입력"></textarea>
                    <div class="mt-2 text-primary small opacity-75">#태그 - #태그 - #태그 - <i class="bi bi-plus-circle"></i></div>
                </div>

                <div class="settings-group mb-5">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">연재 상태</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{end}" value="false" id="status-ing">
                                <label class="form-check-label" for="status-ing">연재 중</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{end}" value="true" id="status-end">
                                <label class="form-check-label" for="status-end">완결</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">공개 범위</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{visibility}" value="PUBLIC" id="vis-public">
                                <label class="form-check-label" for="vis-public">공개</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{visibility}" value="PRIVATE" id="vis-private">
                                <label class="form-check-label" for="vis-private">비공개</label>
                            </div>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">팬 창작물</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{fanWork}" value="true" id="fan-yes">
                                <label class="form-check-label" for="fan-yes">예</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{fanWork}" value="false" id="fan-no">
                                <label class="form-check-label" for="fan-no">아니요</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <span class="settings-label">소유 주체</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{ownerType}" value="USER" id="owner-user">
                                <label class="form-check-label" for="owner-user">개인</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{ownerType}" value="TEAM" id="owner-team">
                                <label class="form-check-label" for="owner-team">팀</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <span class="settings-label">댓글 설정</span>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{allowComment}" value="true" id="comment-ok">
                                <label class="form-check-label" for="comment-ok">허용</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{allowComment}" value="false" id="comment-no">
                                <label class="form-check-label" for="comment-no">금지</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <span class="settings-label">원본 작품 ID (선택)</span>
                            <input type="number" th:field="*{originalContentId}" class="form-control form-control-sm" placeholder="ID 입력">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                    <button type="submit" class="btn-submit-action shadow-sm">업로드</button>
                    <a th:href="@{/}" class="btn-cancel-action shadow-sm">취소</a>
                </div>
            </form>
            
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const fileNameDisplay = document.getElementById('fileName');
            if (input.files && input.files.length > 0) {
                fileNameDisplay.innerText = input.files[0].name;
                fileNameDisplay.style.color = "#333";
            } else {
                fileNameDisplay.innerText = "선택된 파일 없음";
                fileNameDisplay.style.color = "#6c757d";
            }
        }
    </script>
</div>
</html>
