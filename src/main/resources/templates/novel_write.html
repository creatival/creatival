<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
    <link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">

    <style>
        .novel-create-page {
            padding-top: 3rem;
            padding-bottom: 4rem;
        }

        .page-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-hero h2 {
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #1f2a44;
        }

        .page-hero p {
            color: #6c757d;
            margin-bottom: 0;
        }

        .editor-card {
            background: #ffffff;
            border: 1px solid #eceff4;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        .editor-card + .editor-card {
            margin-top: 1.5rem;
        }

        .editor-card-body {
            padding: 1.75rem;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #24304f;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            font-size: 0.92rem;
            color: #7a8494;
            margin-bottom: 1rem;
        }

        .preview-wrapper {
            width: 100%;
            max-width: 220px;
            height: 300px;
            margin: 0 auto 15px;
            border: 2px dashed #bdd2ff;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f8fbff 0%, #f4f7ff 100%);
            position: relative;
        }

        #imagePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            color: #7fa6f8;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .custom-file-container {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #dde4f0;
            border-radius: 16px;
            padding: 10px 12px;
            width: 100%;
            background-color: #fff;
        }

        #thumbnailFile {
            display: none;
        }

        .btn-file-select {
            background-color: #2f3e75;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.95rem;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .btn-file-select:hover {
            background-color: #26335f;
        }

        .file-name-display {
            color: #6c757d;
            font-size: 0.95rem;
            flex-grow: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-label-custom,
        .settings-label {
            display: block;
            font-weight: 700;
            color: #2a3554;
            margin-bottom: 0.65rem;
        }

        .form-control-clean {
            border: 1px solid #dde4f0;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            box-shadow: none !important;
            background-color: #fff;
        }

        .form-control-clean:focus,
        .form-select-clean:focus {
            border-color: #8aa6e8;
        }

        .title-input {
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .description-box {
            background-color: #fbfcfe;
            border: 1px solid #dde4f0;
            border-radius: 18px;
            padding: 1rem 1.1rem;
            min-height: 200px;
            resize: none;
            box-shadow: none !important;
        }

        .description-box:focus {
            border-color: #8aa6e8;
            background-color: #fff;
        }

        .tag-panel {
            background: #f8faff;
            border: 1px solid #e3eaf8;
            border-radius: 20px;
            padding: 1.25rem;
        }

        .tag-badge {
            background-color: #eef2ff;
            color: #3b82f6;
            border: 1px solid #d1dbff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            transition: 0.2s;
            font-weight: 600;
        }

        .tag-badge i {
            cursor: pointer;
            margin-left: 6px;
            font-size: 12px;
            color: #ff5e3a;
        }

        .tag-badge:hover {
            background-color: #dbe6ff;
        }

        .tag-input-group {
            max-width: 500px;
            margin: 0 auto;
        }

        .settings-group {
            background: #fbfcff;
            border-radius: 22px;
            padding: 1.5rem;
            border: 1px solid #e6ebf4;
        }

        .inline-check-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            min-height: 48px;
        }

        .inline-check-group label {
            color: #4f5d75;
            font-weight: 500;
            margin-bottom: 0;
        }

        .switch-line {
            display: flex;
            align-items: center;
            min-height: 48px;
        }

        .hint-box {
            background: #f6f8fc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 1rem 1.1rem;
        }

        .hint-box .small {
            color: #6c757d;
        }

        .btn-submit-action {
            background-color: #2f3e75;
            color: white;
            border-radius: 14px;
            padding: 14px 0;
            font-weight: bold;
            width: 48%;
            border: none;
        }

        .btn-submit-action:hover {
            background-color: #26335f;
        }

        .btn-cancel-action {
            background-color: white;
            color: #f05a28;
            border: 2px solid #f05a28;
            border-radius: 14px;
            padding: 14px 0;
            font-weight: bold;
            width: 48%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-cancel-action:hover {
            background-color: #fff6f2;
            color: #df4f21;
        }

        .submit-bar {
            background: #ffffff;
            border: 1px solid #eceff4;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
            padding: 1rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 767.98px) {
            .novel-create-page {
                padding-top: 2rem;
                padding-bottom: 3rem;
            }

            .editor-card-body,
            .settings-group {
                padding: 1.2rem;
            }

            .btn-submit-action,
            .btn-cancel-action {
                width: 100%;
            }

            .submit-actions {
                flex-direction: column-reverse;
                gap: 0.8rem !important;
            }

            .title-input {
                font-size: 1.3rem;
            }

            .preview-wrapper {
                max-width: 180px;
                height: 250px;
            }
        }
    </style>
</head>

<div class="container novel-create-page" layout:fragment="content">
    <div class="container d-flex justify-content-center">
        <div class="col-lg-10 col-xl-9">

            <div class="page-hero">
                <h2>새 소설 등록</h2>
                <p>당신의 세계관과 이야기를 독자들에게 들려주세요.</p>
            </div>

            <form th:action="@{/content/novel/write}"
                  method="post"
                  enctype="multipart/form-data"
                  th:object="${createNovelDTO}"
                  id="novelForm">

                <div class="editor-card">
                    <div class="editor-card-body">
                        <div class="section-title">기본 정보</div>

                        <div class="mb-4">
                            <label class="form-label-custom">작품 제목</label>
                            <input type="text"
                                   th:field="*{title}"
                                   class="form-control form-control-clean title-input"
                                   placeholder="작품 제목을 입력하세요"
                                   required>
                        </div>

                        <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
                            <div th:each="err : ${#fields.allErrors()}" th:text="${err}">에러 문구</div>
                        </div>

                        <div class="row g-4 align-items-start">
                            <div class="col-lg-5">
                                <label class="form-label-custom text-center w-100">커버 업로드</label>

                                <div class="preview-wrapper shadow-sm">
                                    <div class="preview-placeholder" id="placeholder">
                                        <i class="bi bi-image fs-1"></i><br>미리보기
                                    </div>
                                    <img id="imagePreview">
                                </div>

                                <div class="custom-file-container shadow-sm">
                                    <input type="file"
                                           th:field="*{thumbnailFile}"
                                           accept="image/*"
                                           onchange="previewImage(this)">
                                    <label for="thumbnailFile" class="btn-file-select">파일 선택</label>
                                    <span class="file-name-display" id="fileNameDisplay">선택된 파일 없음</span>
                                </div>
                            </div>

                            <div class="col-lg-7">
                                <label class="form-label-custom"><i class="bi bi-pencil-fill"></i> 작품 설명</label>
                                <textarea th:field="*{description}"
                                          class="form-control description-box"
                                          rows="8"
                                          placeholder="작품 소개나 코멘트를 입력하세요"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="editor-card">
                    <div class="editor-card-body">
                        <div class="section-title">태그 설정</div>
                        <div class="section-subtitle">장르, 분위기, 키워드를 태그로 정리해 보세요.</div>

                        <div class="tag-panel text-center">
                            <div id="tagContainer" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>

                            <div class="input-group tag-input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0 text-muted">#</span>
                                <input type="text"
                                       id="tagInput"
                                       class="form-control border-start-0"
                                       placeholder="태그를 입력하고 엔터를 누르세요"
                                       onkeypress="handleTagKey(event)">
                                <button class="btn btn-outline-primary" type="button" onclick="addTag()">추가</button>
                            </div>

                            <input type="hidden" name="tagString" id="finalTagString">
                        </div>
                    </div>
                </div>

                <div class="editor-card">
                    <div class="editor-card-body">
                        <div class="section-title">상세 설정</div>
                        <div class="section-subtitle">공개 범위와 연결 정보를 설정하세요.</div>

                        <div class="settings-group">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <span class="settings-label">연재 상태</span>
                                    <div class="inline-check-group">
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{end}" value="false" checked id="status-ing">
                                            연재 중
                                        </label>
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{end}" value="true" id="status-end">
                                            완결
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <span class="settings-label">공개 범위</span>
                                    <div class="inline-check-group">
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{visibility}" value="PUBLIC" checked id="vis-public">
                                            공개
                                        </label>
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{visibility}" value="PRIVATE" id="vis-private">
                                            비공개
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <span class="settings-label">댓글 설정</span>
                                    <div class="inline-check-group">
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{allowComment}" value="true" checked id="comment-ok">
                                            허용
                                        </label>
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{allowComment}" value="false" id="comment-no">
                                            금지
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <span class="settings-label">소유 유형</span>
                                    <div class="inline-check-group">
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{ownerType}" value="USER" checked id="user">
                                            본인
                                        </label>
                                        <label>
                                            <input class="form-check-input" type="radio" th:field="*{ownerType}" value="TEAM" id="team">
                                            팀
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="switch-line">
                                        <label class="mb-0 fw-bold">
                                            <input class="form-check-input me-2" type="checkbox" th:field="*{fanWork}" id="fanWorkCheck">
                                            2차 창작물(팬워크)인 경우 체크
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <span class="settings-label">프로젝트 연결 (선택)</span>
                                    <input type="text"
                                           th:field="*{projectTag}"
                                           class="form-control form-control-clean"
                                           id="projectTagInput"
                                           placeholder="projectTag 입력">
                                </div>

                                <div class="col-md-6" id="originalContentWrapper">
                                    <span class="settings-label">원본 작품 ID (선택)</span>
                                    <input type="number"
                                           th:field="*{originalContentId}"
                                           class="form-control form-control-clean"
                                           id="originalContentIdInput"
                                           placeholder="ID 입력">
                                </div>

                                <div class="col-12">
                                    <div class="hint-box">
                                        <div class="small">
                                            프로젝트 연결과 원본 작품 ID는 동시에 입력할 수 없습니다.  
                                            프로젝트 태그를 사용하는 경우 소유 유형은 팀(TEAM)으로 맞춰 주세요.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="submit-bar">
                    <div class="d-flex justify-content-between gap-3 submit-actions">
                        <button type="submit" class="btn-submit-action shadow-sm">업로드</button>
                        <a th:href="@{/}" class="btn-cancel-action shadow-sm">취소</a>
                    </div>
                </div>
            </form>

        </div>
    </div>

    <script th:inline="javascript">
        let tagArray = [];
        let hasShownProjectTagGuide = false;
        let hasShownFanWorkGuide = false;

        const novelForm = document.getElementById("novelForm");
        const projectTagInput = document.getElementById("projectTagInput");
        const originalContentIdInput = document.getElementById("originalContentIdInput");
        const fanWorkCheck = document.getElementById("fanWorkCheck");
        const originalContentWrapper = document.getElementById("originalContentWrapper");

        function getSelectedOwnerType() {
            const checked = document.querySelector("input[name='ownerType']:checked");
            return checked ? checked.value : "";
        }

        // 1. 이미지 미리보기
        function previewImage(input) {
            const fileDisplay = document.getElementById('fileNameDisplay');
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('placeholder');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                fileDisplay.innerText = input.files[0].name;
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                fileDisplay.innerText = '선택된 파일 없음';
                preview.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        // 2. 태그 관리
        function handleTagKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTag();
            }
        }

        function addTag() {
            const input = document.getElementById('tagInput');
            const value = input.value.trim().replace(/#/g, '');

            if (value && !tagArray.includes(value)) {
                if (tagArray.length >= 10) {
                    alert("태그는 최대 10개까지 등록 가능합니다.");
                    return;
                }
                tagArray.push(value);
                updateTags();
                input.value = '';
            }
        }

        function removeTag(tag) {
            tagArray = tagArray.filter(t => t !== tag);
            updateTags();
        }

        function updateTags() {
            const container = document.getElementById('tagContainer');
            const hiddenInput = document.getElementById('finalTagString');

            container.innerHTML = tagArray.map(t => `
                <span class="tag-badge shadow-sm">
                    #${t} <i class="bi bi-x-circle-fill" onclick="removeTag('${t}')"></i>
                </span>
            `).join('');

            hiddenInput.value = tagArray.join(',');
        }

        // 3. 프로젝트 태그 안내
        function showProjectTagGuide() {
            Swal.fire({
                icon: 'info',
                title: '프로젝트 태그 안내',
                text: '연결하려는 프로젝트가 있다면 해당 프로젝트의 프로젝트 태그를 입력해 프로젝트와 연결하세요.',
                confirmButtonText: '확인'
            });
        }

        // 4. 원본 작품 ID 안내
        function showOriginalContentGuide() {
            if (!originalContentWrapper) return;

            if (window.driver && window.driver.js && typeof window.driver.js.driver === 'function') {
                const guide = window.driver.js.driver({
                    showProgress: false,
                    allowClose: true,
                    overlayClickBehavior: 'close',
                    doneBtnText: '확인',
                    steps: [
                        {
                            element: '#originalContentWrapper',
                            popover: {
                                title: '원본 작품 ID',
                                description: '2차 창작인 경우 원본이 되는 콘텐츠의 ID를 입력해 연결하세요.',
                                side: 'bottom',
                                align: 'start'
                            }
                        }
                    ]
                });

                guide.drive();
            } else {
                Swal.fire({
                    icon: 'info',
                    title: '원본 작품 ID 안내',
                    text: '2차 창작인 경우 원본이 되는 콘텐츠의 ID를 입력해 연결하세요.',
                    confirmButtonText: '확인'
                }).then(() => {
                    if (originalContentIdInput) {
                        originalContentIdInput.focus();
                    }
                });
            }
        }

        if (projectTagInput) {
            projectTagInput.addEventListener("focus", function () {
                if (!hasShownProjectTagGuide) {
                    hasShownProjectTagGuide = true;
                    showProjectTagGuide();
                }
            });
        }

        if (fanWorkCheck) {
            fanWorkCheck.addEventListener("change", function () {
                if (this.checked && !hasShownFanWorkGuide) {
                    hasShownFanWorkGuide = true;
                    setTimeout(() => {
                        showOriginalContentGuide();
                    }, 150);
                }
            });
        }

        // 5. 유효성 검사
        if (novelForm) {
            novelForm.addEventListener("submit", function(e) {
                const projectTag = projectTagInput ? projectTagInput.value.trim() : "";
                const originalContentId = originalContentIdInput ? originalContentIdInput.value.trim() : "";
                const ownerType = getSelectedOwnerType();

                if (projectTag !== "" && originalContentId !== "") {
                    alert("프로젝트 연결과 원본 작품 ID는 동시에 입력할 수 없습니다.");
                    e.preventDefault();
                    return;
                }

                if (projectTag !== "" && ownerType !== "TEAM") {
                    alert("프로젝트 태그가 있는 콘텐츠는 소유 유형을 'TEAM'으로 선택해야 합니다.");
                    e.preventDefault();
                }
            });
        }
    </script>
</div>
</html>
