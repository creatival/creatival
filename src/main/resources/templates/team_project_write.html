<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	

				<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
				<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
	<style>
		.upload-zone {
			border: 2px dashed #dee2e6;
			border-radius: 15px;
			padding: 40px;
			text-align: center;
			background-color: #f8f9fa;
			transition: all .3s;
			cursor: pointer;
		}

		.upload-zone:hover {
			border-color: #000;
			background-color: #f1f3f5;
		}

		.upload-icon {
			font-size: 3rem;
			color: #adb5bd;
		}

		.tag-input-wrapper {
			border: 1px solid #ced4da;
			border-radius: .25rem;
			padding: 5px;
			display: flex;
			flex-wrap: wrap;
			gap: 5px;
		}

		.tag-badge {
			background-color: #e9ecef;
			padding: 2px 10px;
			border-radius: 15px;
			font-size: .9rem;
			display: flex;
			align-items: center;
		}

		.tag-badge .btn-close {
			font-size: .6rem;
			margin-left: 5px;
		}
	</style>
</head>

<body>

	<div layout:fragment="content">

		<div class="container mt-5 mb-5 d-flex justify-content-center">
			<div class="col-lg-8">

				<div class="card shadow-sm border-0">
					<div class="card-body p-4 p-lg-5">

						<div class="mb-4 text-center">
							<h3 class="fw-bold">표지</h3>
						</div>

						<form th:action="@{/team/{id}/project/create(id=${teamId})}" method="post" enctype="multipart/form-data">

							<!-- 이미지 업로드 -->

							<div class="mb-4">

								<label class="form-label fw-semibold">표지 업로드</label>

								<div class="upload-zone" id="dropZone">

									<input type="file" class="d-none" id="illustFile" name="bannerImg" accept="image/*">

									<div id="uploadPlaceholder">

										<i class="bi bi-cloud-arrow-up upload-icon"></i>

										<p class="mt-2 mb-1 fw-bold">
											클릭하거나 파일을 여기로 끌어다 놓으세요
										</p>

										<p class="text-muted small">
											PNG, JPG, GIF (최대 20MB)
										</p>

									</div>

									<div id="imagePreview" class="d-none">

										<img src="" alt="Preview" class="img-fluid rounded shadow-sm"
											style="max-height:400px;">

										<p class="mt-3 small text-primary text-decoration-underline">
											이미지 교체하기
										</p>

									</div>

								</div>

							</div>


							<!-- 제목 -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									프로젝트 이름
								</label>

								<input type="text" name="title" class="form-control" placeholder="프로젝트의 이름을 지어주세요." required>

							</div>


							<!-- 설명 -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									프로젝트 설명
								</label>

								<textarea name="description" class="form-control" rows="3"
									placeholder="프로젝트에 대한 설명을 적어주세요."></textarea>

							</div>
							<!-- 프로젝트 태그 -->
							<div class="mb-4">
								<label class="form-label fw-semibold">프로젝트 태그</label>
	
							        <input type="text"
							               class="form-control"
							               id="projectTagInput"
										   name="projectTag"
							               placeholder="프로젝트 태그를 입력해주세요, 프로젝트와 Content를 연결하는 역할이니 신중하게 선택해주세요." required>
							</div>

							<!-- 태그 -->
							<div class="mb-4">
							    <label class="form-label fw-semibold">태그</label>

							    <div class="border rounded p-3" id="tagContainer">
							        <div class="d-flex flex-wrap gap-2 mb-2" id="tagList"></div>

							        <input type="text"
							               class="form-control"
							               id="tagInput"
							               placeholder="태그를 입력하고 Enter를 누르세요">
							    </div>

							    <!-- 실제 전송용 hidden input 영역 -->
							    <div id="hiddenTagInputs"></div>
							</div>
							
							<div class="row mb-4">

							    <!-- 프로젝트 마감일 -->
							    <div class="col-md-6">
							        <label class="form-label fw-semibold">
							            프로젝트 마감일
							        </label>

							        <input type="datetime-local"
							               name="endDate"
							               class="form-control">

							        <small class="text-muted">
							            선택하지 않으면 마감일 없이 진행됩니다.
							        </small>
							    </div>

							    <!-- 공개 여부 -->
							    <div class="col-md-6">
							        <label class="form-label fw-semibold">
							            공개 여부
							        </label>

							        <select name="visibility" class="form-select">
							            <option value="PUBLIC" selected>공개</option>
							            <option value="PRIVATE">비공개</option>
							        </select>
							    </div>

							</div>

							<!-- 버튼 -->

							<div class="d-flex justify-content-between mt-5">

								<a href="/" class="btn btn-outline-secondary px-4">
									취소
								</a>

								<button type="submit" class="btn btn-primary px-5 text-white fw-bold">
									제작하기
								</button>

							</div>

						</form>

					</div>
				</div>

			</div>
		</div>

	</div>


	<!-- script fragment -->

	<th:block layout:fragment="script">

		<script>

			const dropZone = document.getElementById('dropZone');
			const fileInput = document.getElementById('illustFile');
			const preview = document.getElementById('imagePreview');
			const placeholder = document.getElementById('uploadPlaceholder');
			const previewImg = preview.querySelector('img');

			dropZone.addEventListener('click', () => fileInput.click());

			fileInput.addEventListener('change', function () {
				handleFiles(this.files);
			});

			dropZone.addEventListener('dragover', (e) => {
				e.preventDefault();
				dropZone.style.borderColor = "#000";
			});

			dropZone.addEventListener('dragleave', () => {
				dropZone.style.borderColor = "#dee2e6";
			});

			dropZone.addEventListener('drop', (e) => {
				e.preventDefault();
				dropZone.style.borderColor = "#dee2e6";
				handleFiles(e.dataTransfer.files);
			});

			function handleFiles(files) {

				if (files.length > 0) {

					const file = files[0];

					if (file.type.startsWith('image/')) {

						const reader = new FileReader();

						reader.onload = function (e) {

							previewImg.src = e.target.result;
							placeholder.classList.add('d-none');
							preview.classList.remove('d-none');

						}

						reader.readAsDataURL(file);

					} else {

						alert("이미지 파일만 업로드 가능합니다.");

					}

				}

			}

		</script>
		<script>
			    const tagInput = document.getElementById("tagInput");
			    const tagList = document.getElementById("tagList");
			    const hiddenTagInputs = document.getElementById("hiddenTagInputs");

			    tagInput.addEventListener("keydown", function (e) {
			        if (e.key === "Enter") {
			            e.preventDefault();

			            const tagValue = tagInput.value.trim();
			            if (!tagValue) return;

			            // 중복 방지
			            const existingTags = document.querySelectorAll("input[name='tags']");
			            for (let tag of existingTags) {
			                if (tag.value === tagValue) {
			                    tagInput.value = "";
			                    return;
			                }
			            }

			            // 화면 태그 생성
			            const badge = document.createElement("span");
			            badge.className = "badge bg-primary";
			            badge.textContent = tagValue + " ×";
			            badge.style.cursor = "pointer";

			            // 클릭 시 제거
			            badge.addEventListener("click", function () {
			                badge.remove();
			                hiddenInput.remove();
			            });

			            tagList.appendChild(badge);

			            // 실제 전송용 hidden input 생성
			            const hiddenInput = document.createElement("input");
			            hiddenInput.type = "hidden";
			            hiddenInput.name = "tags";
			            hiddenInput.value = tagValue;
			            hiddenTagInputs.appendChild(hiddenInput);

			            tagInput.value = "";
			        }
			    });
			</script>
	</th:block>

</body>

</html>
