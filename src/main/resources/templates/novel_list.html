<html layout:decorate="~{layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Creatival - 추천 소설</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />

    <style>
        /* 1. 상단 카테고리 아이콘 */
        .category-icon {
            width: 70px; height: 70px;
            background-color: #f1f3f5;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; margin: 0 auto;
        }
        .category-icon:hover { background-color: #e9ecef; transform: translateY(-3px); }
        .category-icon img { width: 40px; height: auto; }

        /* 2. 썸네일 카드 (3:4 비율) */
        .novel-card { transition: transform 0.2s; border: none; background: none; }
        .novel-card:hover { transform: translateY(-5px); }
        .thumbnail-wrapper {
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 8px;
            background-color: #eee;
            position: relative;
        }

        /* 3. 시안과 동일한 빨간 밑줄 페이지네이션 */
        .custom-pagination .page-link {
            border: none; color: #333; font-weight: 700;
            background: none; padding: 2px 10px;
            font-size: 1.1rem;
        }
        .custom-pagination .page-item.active .page-link {
            background: none; color: #333; /* 글자는 검정 */
            border-bottom: 3px solid #f05a28; /* 주황-빨강 계열 밑줄 */
            border-radius: 0;
        }
        .custom-pagination .page-item.disabled .page-link { color: #ccc; }
        .custom-pagination .page-link:hover { color: #f05a28; }

        /* 4. 가로로 꽉 차는 딥 블루 푸터 */
        .full-footer {
            background-color: #0b152d; /* 시안의 짙은 남색 */
            color: white;
            width: 100%;
            margin-top: 80px;
        }
        .footer-line { border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0; }
        .tag-text { color: #4dabf7; font-size: 0.8rem; }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <div layout:fragment="content">
        
        <section class="py-5">
            <div class="container">
                <div class="row text-center g-3 justify-content-center">
                    <div class="col-4 col-md-2">
                        <a th:href="@{/Illustration_list}" class="text-decoration-none text-dark">
                            <div class="category-icon mb-2"><img th:src="@{/images/paint.png}" alt="일러스트"></div>
                            <div class="small fw-bold">일러스트</div>
                        </a>
                    </div>
                    <div class="col-4 col-md-2">
                        <a th:href="@{/comic_list}" class="text-decoration-none text-dark">
                            <div class="category-icon mb-2"><img th:src="@{/images/comic.png}" alt="만화"></div>
                            <div class="small fw-bold">만화</div>
                        </a>
                    </div>
                    <div class="col-4 col-md-2">
                        <a th:href="@{/music_list}" class="text-decoration-none text-dark">
                            <div class="category-icon mb-2"><img th:src="@{/images/sing.png}" alt="음원"></div>
                            <div class="small fw-bold">음악</div>
                        </a>
                    </div>
                    <div class="col-4 col-md-2">
                        <a th:href="@{/video_list}" class="text-decoration-none text-dark">
                            <div class="category-icon mb-2"><img th:src="@{/images/yutu.png}" alt="비디오"></div>
                            <div class="small fw-bold">비디오</div>
                        </a>
                    </div>

                    <div class="col-4 col-md-2">
                        <a th:href="@{/file_list}" class="text-decoration-none text-dark">
                            <div class="category-icon mb-2"><img th:src="@{/images/folder.png}" alt="파일"></div>
                            <div class="small fw-bold">파일</div>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <div class="container text-center mb-5">
			<div class="mb-2">
			  <a th:href="@{/content/novel_write}" class="btn-register">소설 등록하기</a>
			</div>
            <h3 class="fw-bold mb-4">추천 소설</h3>
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a href="javascript:history.back()" class="text-muted text-decoration-none small">소설 페이지로 돌아가기</a>
                
                <nav th:if="${!paging.isEmpty()}">
                    <ul class="pagination custom-pagination mb-0">
                        <li class="page-item"><a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="container pb-5">
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
                <div class="col" th:each="novel : ${paging}">
                    <div class="card novel-card h-100">
                        <a th:href="@{|/content/novel_detail/${novel.id}|}" class="text-decoration-none text-dark">
                            <div class="thumbnail-wrapper mb-2 shadow-sm">
                                <img th:src="${novel.thumbnailUrl != null ? novel.thumbnailUrl : '/images/pic.png'}" 
                                     class="w-100 h-100" style="object-fit: cover;">
                            </div>
                            <div class="px-1 text-start">
                                <h6 class="fw-bold mb-1 text-truncate" th:text="${novel.title}">웹툰명</h6>
                                <p class="text-muted small mb-0" th:text="${novel.displayname}">작가이름</p>
                                <p class="tag-text mb-0 mt-1">#태그 #태그</p>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <nav class="mt-5" th:if="${!paging.isEmpty()}">
                <ul class="pagination justify-content-center custom-pagination">
                    <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                        <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">&lt;</a>
                    </li>
                    <li th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                        th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                        th:classappend="${page == paging.number} ? 'active'" class="page-item">
                        <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
                    </li>
                    <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                        <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">&gt;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <footer class="full-footer">
            <div class="container py-5">
                <div class="row mb-4">
                    <div class="col-md" th:each="i : ${#numbers.sequence(1, 5)}">
                        <h6 class="fw-bold mb-3">footer 내용</h6>
                        <ul class="list-unstyled small opacity-75">
                            <li>footer 내용</li>
                            <li>footer 내용</li>
                            <li>footer 내용</li>
                            <li>footer 내용</li>
                            <li>footer 내용</li>
                        </ul>
                    </div>
                </div>
                <hr class="footer-line">
                <div class="row align-items-center">
                    <div class="col-md-4 d-flex gap-4 small mb-3 mb-md-0">
                        <span>이용 약관</span>
                        <span>개인 정보 보호 정책</span>
                    </div>
                    <div class="col-md-4 text-center small opacity-50 mb-3 mb-md-0">
                        © 2026 creatival All rights reserved.
                    </div>
                    <div class="col-md-4 text-end">
                        <img th:src="@{/images/creatival-Photoroom.png}" alt="logo" width="140">
                    </div>
                </div>
            </div>
        </footer>

    </div>
</body>
</html>
