<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<div class="container py-5" layout:fragment="content">

    <style>
        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --bg-light: #F8F9FA;
            --border-color: #E9ECEF;
            --danger: #dc3545;
        }

        body { background-color: var(--bg-light); color: #333; font-family: 'Pretendard', sans-serif; }

        /* 타이틀 섹션 */
        .board-top-title { text-align: center; margin-bottom: 2.5rem; }
        .board-top-title h1 { color: var(--brand-navy); font-weight: 800; margin-bottom: 0.5rem; }
        .board-top-title p { color: #888; font-size: 0.95rem; }

        /* 메뉴바 */
        .board-menu-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border-color); margin-bottom: 30px;
            padding-bottom: 14px; flex-wrap: wrap; gap: 15px;
        }
        .board-menu-title { font-size: 1.15rem; font-weight: 800; color: var(--brand-navy); margin: 0; }
        .board-menu-subtitle { font-size: 0.9rem; color: #888; margin: 0; }

        /* 버튼 스타일 */
        .btn-write {
            background-color: var(--brand-navy); color: white; border-radius: 8px;
            padding: 8px 20px; font-weight: 600; text-decoration: none; transition: 0.2s;
        }
        .btn-write:hover { background-color: #2c3359; color: white; transform: translateY(-2px); }

        /* 게시글 컨테이너 */
        .post-container {
            background: #fff; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.05);
            overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 30px;
            scroll-margin-top: 100px;
        }
        .post-container:target { border: 2px solid var(--brand-orange); box-shadow: 0 0 0 4px rgba(255,127,80,0.12); }

        /* 헤더 영역 */
        .post-header-area { padding: 2rem; border-bottom: 1px solid var(--border-color); background-color: #ffffff; }
        .notice-header { background-color: #FFF9F7; }

        /* 태그 */
        .tag-row { display: flex; gap: 8px; margin-bottom: 1rem; }
        .tag-common { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: white; }
        .team-tag { background-color: var(--brand-navy); }
        .project-tag { background-color: #5A67D8; }
        .notice-tag { background-color: var(--brand-orange); }
        .normal-tag { background-color: #6c757d; }

        /* 제목 및 관리 버튼 */
        .post-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 1.5rem; }
        .post-title { font-size: 1.5rem; font-weight: 800; color: #212529; margin: 0; word-break: keep-all; }
        .post-action-group { display: flex; gap: 6px; }
        .btn-post-action {
            border: 1px solid var(--border-color); background: #fff; color: #495057;
            border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600;
            text-decoration: none; transition: 0.2s;
        }
        .btn-post-action:hover { background: #f8f9fa; color: #212529; }
        .btn-post-delete { color: var(--danger); border-color: #f1c4cb; }
        .btn-post-delete:hover { background: #fff5f6; }

        /* 작성자 정보 */
        .author-img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border-color); }
        .meta-line { font-size: 0.88rem; color: #777; }

        /* 본문 */
        .post-content { padding: 2rem; line-height: 1.8; font-size: 1rem; white-space: pre-wrap; }
        .post-image { max-width: 100%; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border-color); }

        .empty-box { background: #fff; border-radius: 16px; padding: 4rem; text-align: center; color: #999; border: 1px solid var(--border-color); }
    </style>

    <div class="board-top-title">
        <h1>팀 공간</h1>
        <p>팀과 프로젝트의 소식을 한곳에서 확인하세요.</p>
    </div>

    <div class="board-menu-wrapper">
        <div class="board-menu-left">
            <p class="board-menu-title">게시글 목록</p>
            <p class="board-menu-subtitle">최신 공지와 업데이트가 제공됩니다.</p>
        </div>

        <div class="board-menu-right">
            <a th:if="${canWrite}"
               th:href="${teamId != null} ? @{/team/{teamId}/teamBoard/create(teamId=${teamId})} : @{/team/project/{projectId}/teamBoard/create(projectId=${projectId})}"
               class="btn btn-write">
                <i class="bi bi-pencil-square me-1"></i> 
                <span th:text="${teamId != null} ? '팀 글 쓰기' : '프로젝트 글 쓰기'">글 쓰기</span>
            </a>
        </div>
    </div>

    <th:block th:if="${teamBoardList != null and !#lists.isEmpty(teamBoardList)}">
        <div class="post-container" th:each="board : ${teamBoardList}" th:id="|board-${board.id}|">
            
            <div class="post-header-area" th:classappend="${board.notice} ? ' notice-header' : ''">
                <div class="tag-row">
                    <span class="tag-common" th:classappend="${board.notice} ? ' notice-tag' : ' normal-tag'"
                          th:text="${board.notice} ? 'Notice' : 'Update'">Type</span>
                    
                    <span class="tag-common team-tag" th:if="${board.teamId != null}" th:text="|${board.teamName}팀|">Team</span>
                    <span class="tag-common project-tag" th:if="${board.projectId != null}" th:text="${board.projectName}">Project</span>
                </div>

                <div class="post-title-row">
                    <div class="post-title" th:text="${board.title}">게시글 제목</div>
                    
                    <div class="post-action-group" th:if="${canWrite}">
                        <a th:href="${board.teamId != null} ? 
                                   @{/team/{teamId}/teamBoard/{boardId}/update(teamId=${board.teamId}, boardId=${board.id})} : 
                                   @{/team/project/{projectId}/teamBoard/{boardId}/update(projectId=${board.projectId}, boardId=${board.id})}" 
                           class="btn-post-action">수정</a>
                        
                        <form th:action="${board.teamId != null} ? 
                                         @{/team/{teamId}/teamBoard/{boardId}/delete(teamId=${board.teamId}, boardId=${board.id})} : 
                                         @{/team/project/{projectId}/teamBoard/{boardId}/delete(projectId=${board.projectId}, boardId=${board.id})}" 
                              method="post" class="d-inline" onsubmit="return confirm('삭제하시겠습니까?');">
                            <button type="submit" class="btn-post-action btn-post-delete">삭제</button>
                        </form>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <div class="d-flex align-items-center">
                        <img th:src="${board.profileImgUrl != null ? board.profileImgUrl : '/images/default-profile.png'}" 
                             class="author-img me-3" alt="프로필">
                        <div>
                            <div class="fw-bold" th:text="${board.displayname}">작성자명</div>
                            <div class="meta-line">
                                <span th:text="${board.username}">@username</span> · 
                                <span th:text="${#temporals.format(board.createdAt, 'yyyy. MM. dd HH:mm')}">2026. 04. 16</span>
                            </div>
                        </div>
                    </div>
                    <div th:if="${board.notice}" class="badge bg-white text-dark border py-2 px-3 mt-2 mt-md-0">
                        <i class="bi bi-megaphone-fill text-warning me-1"></i> 중요 공지
                    </div>
                </div>
            </div>

            <div class="post-content">
                <div th:text="${board.text}">게시글 내용이 여기에 표시됩니다.</div>
                <div th:if="${board.imgUrl != null}" class="text-center">
                    <img th:src="${board.imgUrl}" class="post-image" alt="게시글 이미지">
                </div>
            </div>
        </div>
    </th:block>

    <div class="empty-box" th:if="${teamBoardList == null or #lists.isEmpty(teamBoardList)}">
        <i class="bi bi-chat-dots fs-1 d-block mb-3" style="color: #dee2e6;"></i>
        아직 등록된 게시글이 없습니다.
    </div>

</div>
</html>
