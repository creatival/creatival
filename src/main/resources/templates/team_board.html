<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<div class="container py-5" layout:fragment="content">

    <style>
        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --bg-light: #F8F9FA;
            --border-color: #E9ECEF;
            --danger: #dc3545;
        }

        html { scrollbar-gutter: stable; }
        body { background-color: var(--bg-light); color: #333; font-family: 'Pretendard', sans-serif; }

        .board-top-title {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .board-top-title h1 {
            color: var(--brand-navy);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .board-top-title p {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .board-menu-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            padding-bottom: 14px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .board-menu-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .board-menu-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--brand-navy);
            margin: 0;
        }

        .board-menu-subtitle {
            font-size: 0.9rem;
            color: #888;
            margin: 0;
        }

        .btn-write {
            background-color: var(--brand-navy);
            color: white;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 600;
            transition: 0.2s;
            text-decoration: none;
            white-space: nowrap;
            border: none;
        }

        .btn-write:hover {
            background-color: #2c3359;
            color: white;
            transform: translateY(-2px);
        }

        .post-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
			scroll-margin-top: 100px;
        }
		.post-container:target {
		    border: 2px solid #FF7F50;
		    box-shadow: 0 0 0 4px rgba(255,127,80,0.12);
		    transition: 0.3s;
		}
        .post-header-area {
            background-color: #F8F9FF;
            padding: 2rem 2.2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .notice-header {
            background-color: #FFF9F7;
        }

        .tag-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tag-common {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            color: white;
        }

        .team-tag { background-color: var(--brand-navy); }
        .project-tag { background-color: #5A67D8; }
        .notice-tag { background-color: var(--brand-orange); }
        .normal-tag { background-color: #6c757d; }

        .post-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .post-title-link {
            color: inherit;
            text-decoration: none;
            flex: 1;
            min-width: 0;
        }

        .post-title-link:hover {
            color: inherit;
            text-decoration: none;
        }

        .post-title {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 0;
            word-break: keep-all;
        }

        .post-action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-post-action {
            border: 1px solid var(--border-color);
            background: #fff;
            color: #495057;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
            line-height: 1;
        }

        .btn-post-action:hover {
            background: #f3f5f7;
            color: #212529;
        }

        .btn-post-delete {
            border-color: #f1c4cb;
            color: var(--danger);
            background: #fff5f6;
        }

        .btn-post-delete:hover {
            background: #ffe8eb;
            color: #bb2d3b;
        }

        .post-delete-form {
            margin: 0;
        }

        .post-content {
            padding: 2.2rem;
            line-height: 1.8;
            font-size: 1.02rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .author-img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #e9ecef;
        }

        .meta-line {
            color: #888;
            font-size: 0.9rem;
        }

        .empty-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 5rem 2rem;
            text-align: center;
            color: #888;
            box-shadow: 0 4px 25px rgba(0,0,0,0.04);
        }

        .post-image-wrapper {
            margin-top: 2rem;
            text-align: center;
        }

        .post-image {
            max-width: 100%;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        @media (max-width: 768px) {
            .post-header-area,
            .post-content {
                padding: 1.4rem;
            }

            .post-title {
                font-size: 1.3rem;
            }

            .board-menu-wrapper {
                align-items: stretch;
            }

            .post-title-row {
                flex-direction: column;
                align-items: stretch;
            }

            .post-action-group {
                width: 100%;
            }

            .btn-post-action,
            .post-delete-form button {
                width: 100%;
                text-align: center;
            }
        }
    </style>

    <div class="board-top-title">
        <h1>팀 공간</h1>
        <p>팀과 프로젝트의 공지사항, 업데이트, 소식을 한곳에서 확인하세요.</p>
    </div>

    <div class="board-menu-wrapper">
        <div class="board-menu-left">
            <p class="board-menu-title">게시글 목록</p>
            <p class="board-menu-subtitle">공지와 업데이트가 최신순으로 정리됩니다.</p>
        </div>

        <div class="d-flex gap-2 flex-wrap">
            <a th:if="${canWrite and teamId != null}"
               th:href="@{/team/{teamId}/teamBoard/create(teamId=${teamId})}"
               class="btn btn-write">
                <i class="bi bi-pencil-square me-2"></i>글 작성
            </a>

            <a th:if="${canWrite and projectId != null}"
               th:href="@{/team/project/{projectId}/teamBoard/create(projectId=${projectId})}"
               class="btn btn-write">
                <i class="bi bi-pencil-square me-2"></i>글 작성
            </a>
        </div>
    </div>

    <th:block th:if="${teamBoardList != null and !#lists.isEmpty(teamBoardList)}">
		<div class="post-container"
		     th:each="board : ${teamBoardList}"
		     th:id="|board-${board.id}|">

            <div class="post-header-area" th:classappend="${board.notice} ? ' notice-header' : ''">
                <div class="tag-row">
                    <span class="tag-common"
                          th:classappend="${board.notice} ? ' notice-tag' : ' normal-tag'"
                          th:text="${board.notice} ? 'Notice' : 'Update'">
                        Type
                    </span>

                    <span class="tag-common team-tag"
                          th:if="${board.teamId != null}"
                          th:text="|${board.teamName}팀|">
                        Team
                    </span>

                    <span class="tag-common project-tag"
                          th:if="${board.projectId != null}"
                          th:text="${board.projectName}">
                        Project
                    </span>
                </div>

                <div class="post-title-row">
                    <a class="post-title-link"
                       th:href="${board.teamId != null} ?
                                @{/team/{teamId}/board/{boardId}(teamId=${board.teamId}, boardId=${board.id})} :
                                @{/project/{projectId}/board/{boardId}(projectId=${board.projectId}, boardId=${board.id})}">
                        <div class="post-title" th:text="${board.title}">게시글 제목</div>
                    </a>

                    <div class="post-action-group" th:if="${canWrite}">
                        <a th:if="${board.teamId != null}"
                           th:href="@{/team/{teamId}/teamBoard/{boardId}/update(teamId=${board.teamId}, boardId=${board.id})}"
                           class="btn-post-action">
                            수정
                        </a>

                        <a th:if="${board.projectId != null}"
                           th:href="@{/team/project/{projectId}/teamBoard/{boardId}/update(projectId=${board.projectId}, boardId=${board.id})}"
                           class="btn-post-action">
                            수정
                        </a>

                        <form th:if="${board.teamId != null}"
                              th:action="@{/team/{teamId}/teamBoard/{boardId}/delete(teamId=${board.teamId}, boardId=${board.id})}"
                              method="post"
                              class="post-delete-form"
                              onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');">
                            <button type="submit" class="btn-post-action btn-post-delete">삭제</button>
                        </form>

                        <form th:if="${board.projectId != null}"
                              th:action="@{/team/project/{projectId}/teamBoard/{boardId}/delete(projectId=${board.projectId}, boardId=${board.id})}"
                              method="post"
                              class="post-delete-form"
                              onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');">
                            <button type="submit" class="btn-post-action btn-post-delete">삭제</button>
                        </form>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div class="d-flex align-items-center">
                        <img th:src="${board.profileImgUrl != null ? board.profileImgUrl : '/images/default-profile.png'}"
                             class="author-img me-3"
                             alt="작성자 프로필">
                        <div>
                            <div class="fw-bold text-dark" th:text="${board.displayname}">작성자명</div>
                            <div class="meta-line">
                                <span th:text="${board.username}">@username</span>
                                <span class="mx-2">·</span>
                                <span th:text="${#temporals.format(board.createdAt, 'yyyy. MM. dd HH:mm')}">2026. 04. 16 14:00</span>
                            </div>
                        </div>
                    </div>

                    <div th:if="${board.notice}" class="badge bg-white text-dark border py-2 px-3">
                        <i class="bi bi-megaphone-fill text-warning me-1"></i> 필독
                    </div>

                    <div class="text-muted small" th:if="${!board.notice and board.updatedAt != null and !board.updatedAt.equals(board.createdAt)}">
                        수정됨:
                        <span th:text="${#temporals.format(board.updatedAt, 'yyyy. MM. dd HH:mm')}">2026. 04. 16 16:00</span>
                    </div>
                </div>
            </div>

            <div class="post-content">
                <div th:text="${board.text}">게시글 내용</div>

                <div class="post-image-wrapper" th:if="${board.imgUrl != null}">
                    <img th:src="${board.imgUrl}" class="post-image" alt="게시글 이미지">
                </div>
            </div>

        </div>
    </th:block>

    <div class="empty-box" th:if="${teamBoardList == null or #lists.isEmpty(teamBoardList)}">
        아직 등록된 게시글이 없습니다.
    </div>

</div>
</html>
