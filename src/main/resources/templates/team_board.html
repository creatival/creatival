<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 게시판 | Creatival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	
	<link rel="icon" type="image/png" th:href="@{/images/favicon.ico}">
	<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
    
    <style>
        :root {
            --brand-navy: #3B4371;
            --brand-orange: #FF7F50;
            --bg-light: #F8F9FA;
            --border-color: #E9ECEF;
        }

        body { background-color: var(--bg-light); color: #333; }

        /* 탭 및 버튼 상단 레이아웃 */
        .board-menu-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            position: relative;
        }

        .nav-tabs-board {
            display: flex;
            gap: 40px;
            margin-bottom: -2px; /* 보더 겹치기 */
        }

        .board-tab {
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: #aaa;
            padding: 0 10px 15px 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .board-tab.active {
            color: var(--brand-navy);
            border-bottom: 3px solid var(--brand-navy);
        }

        /* 글 작성 버튼 */
        .btn-write {
            background-color: var(--brand-navy);
            color: white;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-write:hover { background-color: #2c3359; color: white; transform: translateY(-2px); }

        /* 섹션 숨김 처리 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 기존 스타일 유지 */
        .post-container { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid var(--border-color); }
        .post-header-area { background-color: #F8F9FF; padding: 2.5rem; border-bottom: 1px solid var(--border-color); }
        .team-tag { background-color: var(--brand-navy); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .post-content { padding: 2.5rem; line-height: 1.8; font-size: 1.05rem; }
        .shared-resource-card { border: 1px solid var(--border-color); border-radius: 12px; transition: transform 0.2s; background: white; max-width: 350px; }
        .shared-resource-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .resource-label { display: inline-block; background: var(--brand-orange); color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 10px; border-radius: 4px; margin-bottom: 8px; }
        .comment-box { background: #F8F9FA; border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border-color); }
        .btn-brand { background-color: var(--brand-navy); color: white; border-radius: 8px; font-weight: 600; }
        .btn-brand:hover { background-color: #2c3359; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold" style="color: var(--brand-navy);">팀 공간</h1>
        <p class="text-muted small">우리 팀의 아이디어와 공지사항을 확인하세요.</p>
    </div>

    <div class="board-menu-wrapper">
        <div class="nav-tabs-board">
            <button class="board-tab active" data-tab="team-board">팀 게시판</button>
            <button class="board-tab" data-tab="notice-board">공지사항</button>
        </div>
        <a th:href="@{/team_board_write}" class="btn btn-write"><i class="bi bi-pencil-square me-2"></i>글 작성</a>
    </div>

    <div id="team-board" class="tab-content active">
        <div class="post-container">
            <div class="post-header-area">
                <div class="mb-3"><span class="team-tag">Project Update</span></div>
                <h2 class="fw-bold mb-4">이번 주 브랜드 로고 시안 공유 및 피드백 요청 건</h2>
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <img src="https://dummyimage.com/40x40/3B4371/fff&text=D" class="rounded-circle me-3">
                        <div>
                            <div class="fw-bold text-dark">Dongmin (Hongsi)</div>
                            <div class="text-muted small">2026. 04. 13 · 조회수 128</div>
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-light text-dark border me-2"><i class="bi bi-heart-fill text-danger"></i> 12</span>
                        <span class="badge bg-light text-dark border"><i class="bi bi-chat-dots-fill"></i> 5</span>
                    </div>
                </div>
            </div>
            <div class="post-content">
                <p>로고 시안 공유드립니다. 확인 후 자유롭게 의견 주세요!</p>
                <div class="my-5 text-center">
                    <img src="https://dummyimage.com/800x400/3B4371/FF7F50&text=Creatival+Logo+Concept" class="img-fluid rounded-3 border">
                </div>
            </div>
            <div class="px-4 py-3 bg-light d-flex justify-content-between border-top">
                <div><button class="btn btn-outline-secondary btn-sm me-2">수정</button><button class="btn btn-outline-danger btn-sm">삭제</button></div>
                <button class="btn btn-brand btn-sm px-4">목록으로</button>
            </div>
        </div>
        </div>

    <div id="notice-board" class="tab-content">
        <div class="post-container p-5 text-center">
            <i class="bi bi-megaphone display-4 text-muted mb-3"></i>
            <h4 class="fw-bold">공지사항이 없습니다.</h4>
            <p class="text-muted">중요한 팀 일정이 생기면 여기에 표시됩니다.</p>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.board-tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // 1. 모든 탭 비활성화
                tabs.forEach(t => t.classList.remove('active'));
                // 2. 클릭한 탭 활성화
                this.classList.add('active');

                // 3. 모든 컨텐츠 숨기기
                contents.forEach(content => content.classList.remove('active'));
                // 4. 대상 컨텐츠 보여주기
                const targetId = this.getAttribute('data-tab');
                document.getElementById(targetId).classList.add('active');
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
