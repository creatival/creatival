<html layout:decorate="~{layout}">
<div layout:fragment="content">

<div class="container py-5" style="max-width: 800px;">

    <!-- 팀 정보 -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h4 class="fw-bold mb-2" th:text="${team.name}">팀 이름</h4>
            <p class="text-muted mb-0" th:text="${team.description}">
                팀 설명이 들어갑니다.
            </p>
        </div>
    </div>

    <!-- 신청 폼 -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-4">팀 가입 신청</h5>

            <form th:action="@{/team/{teamId}/application(teamId=${team.id})}"
                  th:object="${createTeamApplicationDTO}"
                  method="post">
				  <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}" th:fragment="formErrorsFragment">
				  					<div th:each="err : ${#fields.allErrors()}">[[${err}]]</div>
				  			</div>

                <!-- 지원 메시지 -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">지원 메시지</label>
                    <textarea class="form-control"
                              th:field="*{message}"
                              rows="6"
                              placeholder="팀에 지원하는 이유와 본인의 역할을 작성해주세요."></textarea>

                    <!-- 에러 메시지 -->
                    <div class="text-danger mt-1"
                         th:if="${#fields.hasErrors('message')}"
                         th:errors="*{message}">
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/team/{id}(id=${team.id})}"
                       class="btn btn-outline-secondary">
                        취소
                    </a>

                    <button type="submit" class="btn btn-primary">
                        신청하기
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

</div>
</html>
